<!-- Пример плагина «Дерево». Удалите блок, если не нужен. -->
<script>
City.register({
  key:'trees', label:'Дерево',            // имя коллекции в данных и подпись в карточке
  group:'Природа', leaf:'Дерево', color:'#4f9d4a',   // где в меню: раздел/подраздел и цвет значка
  tool:'tree', hint:'Нажмите на карту, чтобы посадить дерево.',
  click(p){ City.add('trees',{x:p[0],y:p[1],n:''}); },            // клик по карте при выбранном инструменте
  layer:'under',                                                 // 'under' — под дорогами, 'over' — поверх всего
  draw(ctx){ City.S.trees.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,7,0,7);ctx.fillStyle='#4f9d4a';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#2f6b2c';ctx.stroke()}); },
  hit(p,r){ return City.S.trees.find(t=>Math.hypot(t.x-p[0],t.y-p[1])<r+6); }   // нужен для «Выбрать» и «Ластика»
});
</script>
<script>
/* Плагин: маршруты идут по дорогам */
(function(){
  let G=null,Sref=null;const cache=new Map();
  City.on('change',()=>{G=null;cache.clear()});
  const K=p=>(Math.round(p[0]*10)/10)+','+(Math.round(p[1]*10)/10);
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  function proj(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=t<=0?a:t>=1?b:lerp(a,b,t);return{t,q,d:Math.hypot(p[0]-q[0],p[1]-q[1])}}
  function build(){
    const S=City.S,segs=[],links=[];
    S.roads.forEach((R,ri)=>{for(let i=1;i<R.pts.length;i++){const a=R.pts[i-1],b=R.pts[i];segs.push({a,b,ri,sp:[{t:0,p:a},{t:1,p:b}]})/* ri -> S.roads[ri] */}});
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=lerp(s.a,s.b,Math.max(0,Math.min(1,t)));
      s.sp.push({t,p});u.sp.push({t:v,p});
    }
    S.roads.forEach((R,ri)=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
      let best=null;
      segs.forEach(s=>{if(s.ri===ri)return;const r=proj(e,s.a,s.b);if(r.d<8&&(!best||r.d<best.r.d))best={s,r}});
      if(best&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});links.push([e,best.r.q])}
    }));
    const sn={};
    S.stops.forEach(st=>{
      let best=null;segs.forEach(s=>{const r=proj([st.x,st.y],s.a,s.b);if(!best||r.d<best.r.d)best={s,r}});
      if(best&&best.r.d<=50){best.s.sp.push({t:best.r.t,p:best.r.q});sn[st.id]=K(best.r.q)}
    });
    const idx=new Map(),pts=[],adj=[];
    const node=p=>{const k=K(p);if(!idx.has(k)){idx.set(k,pts.length);pts.push(p);adj.push([])}return idx.get(k)};
    const edge=(p,q,one)=>{const a=node(p),b=node(q);if(a===b)return;const w=Math.hypot(p[0]-q[0],p[1]-q[1]);adj[a].push([b,w]);if(!one)adj[b].push([a,w])};
    /* на односторонних дорогах рёбра графа направленные */
    segs.forEach(s=>{s.sp.sort((x,y)=>x.t-y.t);const R=S.roads[s.ri];for(let i=1;i<s.sp.length;i++){const A=s.sp[i-1].p,B=s.sp[i].p;if(R.ow)R.rev?edge(B,A,true):edge(A,B,true);else edge(A,B)}});
    links.forEach(l=>edge(l[0],l[1]));
    return{idx,pts,adj,sn};
  }
  function dij(g,s,t){
    const n=g.pts.length,d=new Array(n).fill(Infinity),pr=new Array(n).fill(-1),done=new Array(n).fill(false);d[s]=0;
    for(;;){
      let u=-1;for(let i=0;i<n;i++)if(!done[i]&&d[i]<Infinity&&(u<0||d[i]<d[u]))u=i;
      if(u<0||u===t)break;done[u]=true;
      g.adj[u].forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}});
    }
    if(d[t]===Infinity)return null;
    const out=[];for(let u=t;u>=0;u=pr[u])out.push(g.pts[u]);return out.reverse();
  }
  City.path=(R,base)=>{
    const S=City.S,ids=R.s;if(ids.length<2)return base(R);
    if(!G||Sref!==S){G=build();Sref=S;cache.clear()}
    const key=ids.join()+(R.loop?'L':'');if(cache.has(key))return cache.get(key);
    const list=R.loop?ids.concat(ids[0]):ids,out=[],st=id=>S.stops.find(s=>s.id===id);
    const put=p=>{const l=out[out.length-1];if(!l||Math.hypot(l[0]-p[0],l[1]-p[1])>.01)out.push(p)};
    list.forEach((id,i)=>{
      const B=st(id);if(!B)return;
      if(i===0){put([B.x,B.y]);return}
      const A=st(list[i-1]);if(!A)return;
      const a=G.idx.get(G.sn[A.id]),b=G.idx.get(G.sn[B.id]),p=(a!=null&&b!=null)?dij(G,a,b):null;
      if(p){p.forEach(put);if(i===list.length-1)put([B.x,B.y])}else put([B.x,B.y]);
    });
    cache.set(key,out);return out;
  };
})();
</script>
<script>
/* Плагин: точки на концах дорог, перекрёстки и притягивание дорог друг к другу */
(function(){
  let J=null,Sref=null,tgt=null;
  City.on('change',()=>{J=null});
  const K=p=>Math.round(p[0])+','+Math.round(p[1]);
  const proj=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=[a[0]+dx*t,a[1]+dy*t];return{q,d:Math.hypot(p[0]-q[0],p[1]-q[1])}};
  function calc(){
    const S=City.S,segs=[],jm=new Map(),ends=[];
    S.roads.forEach((R,ri)=>{R.pts.slice(1).forEach((b,i)=>segs.push({a:R.pts[i],b,ri}));if(R.pts.length>1)ends.push(R.pts[0],R.pts[R.pts.length-1])});
    /* где дороги пересекаются */
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];jm.set(K(p),p);
    }
    /* где точка одной дороги лежит на другой (примыкание, слияние) */
    S.roads.forEach((R,ri)=>R.pts.forEach(p=>{if(segs.some(s=>s.ri!==ri&&proj(p,s.a,s.b).d<4))jm.set(K(p),p)}));
    return{j:[...jm.values()],e:ends.filter(p=>!jm.has(K(p)))};
  }
  const get=()=>{if(!J||Sref!==City.S){J=calc();Sref=City.S}return J};

  /* притягивание точек новой дороги к существующим: сначала к точкам и концам, потом к линии */
  City.snap=(q,r)=>{
    tgt=null;if(City.tool!=='road'&&City.tool!=='ext')return q;
    const roads=City.S.roads,k=City.view.k;let best=null;
    roads.forEach(R=>R.pts.forEach(p=>{const d=Math.hypot(p[0]-r[0],p[1]-r[1]);if(d<16/k&&(!best||d<best.d))best={d,p}}));
    if(!best)roads.forEach(R=>R.pts.slice(1).forEach((b,i)=>{const x=proj(r,R.pts[i],b);if(x.d<10/k&&(!best||x.d<best.d))best={d:x.d,p:x.q}}));
    if(best){tgt=best.p;return best.p.slice()}
    return q;
  };

  City.layers.over.push((ctx,P)=>{
    const g=get();
    g.e.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fillStyle=P.wh;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.ink;ctx.stroke()});
    g.j.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,7);ctx.fillStyle='#0c8a86';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.wh;ctx.stroke()});
    if(tgt&&(City.tool==='road'||City.tool==='ext')){ctx.beginPath();ctx.arc(tgt[0],tgt[1],12,0,7);ctx.lineWidth=2.5;ctx.strokeStyle='#0c8a86';ctx.stroke()}
  });
})();
</script>
<script>
/* Плагин: масштаб, линейка, координаты, компас, граница города, население, автобусы */
(function(){
  const mpu=()=>((City.S.scale||50)/50);                       /* метров в одной единице карты */
  const fm=u=>{const m=Math.abs(u*mpu()),g=u<0?'−':'';return g+(m<1000?Math.round(m)+' м':(m/1000).toFixed(2).replace('.',',')+' км')};
  const len=a=>a.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-a[i][0],p[1]-a[i][1]),0);
  const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
  const n0=v=>Math.round(v).toLocaleString('ru-RU');
  const pp=(ctx,a)=>{ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))};
  const dseg=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
  const F='Manrope,system-ui,sans-serif';
  let M=[0,0],ruler=[],bd=null,showXY=true,run=true,clock=0,last=performance.now(),bpos=[];

  /* ---------- панель и окно автобуса ---------- */
  document.head.insertAdjacentHTML('beforeend','<style>#p2{left:10px;top:56px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;max-width:340px;font-size:13px}#p2 input{width:60px;margin:0 3px}#pop{left:10px;top:130px;width:250px;padding:12px}#pop img{width:100%;border-radius:8px;display:block;margin:8px 0}</style>');
  $('#wrap').insertAdjacentHTML('beforeend','<div id="p2" class="fl"><span>1 клетка =<input id="sc" type="number" min="1">м</span><button id="rr" class="b">Сбросить линейку</button><button id="xy" class="b on">Координаты</button><button id="bs" class="b on">Автобусы</button><span id="mx" style="color:var(--mut)"></span><b id="tot"></b></div><div id="pop" class="fl" hidden></div>');
  $('#sc').onchange=e=>{const v=+e.target.value;if(v>0){City.push();City.S.scale=v;City.changed()}};
  $('#rr').onclick=()=>{ruler=[];bd=null;City.redraw()};
  $('#xy').onclick=e=>{showXY=!showXY;e.currentTarget.classList.toggle('on',showXY);City.redraw()};
  $('#bs').onclick=e=>{run=!run;e.currentTarget.classList.toggle('on',run)};
  cv.addEventListener('pointermove',e=>{const V=City.view;M=[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k];$('#mx').textContent='X '+fm(M[0])+', Y '+fm(-M[1])});

  /* ---------- линейка ---------- */
  City.HINT.ruler='Нажимайте точки на карте: длина покажется в метрах и километрах.';
  City.tools.ruler=p=>{ruler.push(p)};
  City.addLeaf('Измерения',['Линейка','ruler','','#e9c46a']);
  City.insp.roads=o=>`<div style="font-size:13px;color:var(--mut)">Длина: <b style="color:var(--ink)">${fm(len(o.pts))}</b></div>`;

  /* ---------- граница города ---------- */
  City.HINT.bound='Обведите город точками. Нажмите на первую точку или дважды на последнюю — готово.';
  const endB=()=>{if(bd&&bd.length>2)City.add('bounds',{pts:bd,n:'Граница города'});bd=null};
  City.tools.bound=p=>{
    if(!bd){bd=[p];return}
    const k=City.view.k,f=bd[0],l=bd[bd.length-1];
    if(bd.length>2&&(Math.hypot(f[0]-p[0],f[1]-p[1])<14/k||Math.hypot(l[0]-p[0],l[1]-p[1])<6/k))endB();else bd.push(p);
  };
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'&&City.tool==='bound')endB();if(e.key==='Escape')bd=null});
  City.register({key:'bounds',label:'Граница города',
    hit(p,r){return City.S.bounds.find(b=>b.pts.some((q,i)=>dseg(p,q,b.pts[(i+1)%b.pts.length])<r+3))}});
  City.addLeaf('Районы',['Граница города','bound','','#c0392b']);

  /* ---------- население районов ---------- */
  City.insp.dists=o=>`<label>Население, чел.<input type="number" min="0" data-f="pop" value="${City.esc(o.pop||'')}"></label><div style="font-size:13px;color:var(--mut)">Площадь: <b style="color:var(--ink)">${(area(o.pts)*mpu()*mpu()/1e6).toFixed(2).replace('.',',')} км²</b></div>`;

  /* ---------- автобусы ---------- */
  /* Добавляйте модели сюда: 'Название':{img:'файл.png', l:длина в метрах} */
  /* Виды сверху. Цвет автобуса = цвет крыши; кондиционер всегда светлый. Перед автобуса — справа */
  const roof=(ctx,L,W,col)=>{
    ctx.lineWidth=1;ctx.strokeStyle='#0008';
    rr(ctx,-L/2,-W/2,L,W,W*.14);ctx.fillStyle=col;ctx.fill();ctx.stroke();
    ctx.fillStyle='#14232b';ctx.fillRect(-L/2+W*.1,-W/2+1,L-W*.2,W*.08);ctx.fillRect(-L/2+W*.1,W/2-1-W*.08,L-W*.2,W*.08);
    ctx.fillStyle='#bfe3f2';ctx.fillRect(L*.465,-W*.36,L*.03,W*.72);                        /* лобовое стекло */
  };
  const hatch=(ctx,x,y,w,h,r)=>{rr(ctx,x,y,w,h,r);ctx.fillStyle='#ffffff59';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#0006';ctx.stroke()};
  /* Yutong ZK6890HGQ: люк, блок из 5 баллонов, большой люк-кондиционер */
  const yutong=(ctx,L,W,col)=>{
    const X=f=>f*L,Y=f=>f*W;
    roof(ctx,L,W,col);
    hatch(ctx,X(-.4),Y(-.14),X(.1),Y(.28),W*.04);
    ctx.fillStyle='#c0392b';[-.07,.07].forEach(y=>{ctx.beginPath();ctx.arc(X(-.385),Y(y),Math.max(W*.02,.4),0,7);ctx.fill()});
    hatch(ctx,X(-.21),Y(-.33),X(.265),Y(.66),W*.08);                                        /* блок баллонов */
    rr(ctx,X(-.185),Y(-.13),X(.2),Y(.26),W*.02);ctx.fillStyle='#9fb3a8';ctx.fill();
    ctx.fillStyle='#1f3a33';const cr=Math.min(W*.1,L*.017);
    for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(X(-.165+i*.038),0,cr,0,7);ctx.fill()}
    rr(ctx,X(.09),Y(-.34),X(.31),Y(.68),W*.1);ctx.fillStyle='#fafbfb';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#0008';ctx.stroke();  /* кондиционер */
  };
  /* MAZ 206.063: два люка и кондиционер с тремя вентиляторами посередине */
  const maz063=(ctx,L,W,col)=>{
    const X=f=>f*L,Y=f=>f*W;
    roof(ctx,L,W,col);
    hatch(ctx,X(-.284),Y(-.13),X(.13),Y(.26),W*.05);
    hatch(ctx,X(.12),Y(-.13),X(.13),Y(.26),W*.05);
    rr(ctx,X(-.1),Y(-.33),X(.2),Y(.66),W*.05);ctx.fillStyle='#f2f4f5';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#0008';ctx.stroke();  /* кондиционер */
    ctx.fillStyle='#8a97a3';ctx.fillRect(X(-.098),Y(-.33),X(.006),Y(.66));ctx.fillRect(X(.092),Y(-.33),X(.006),Y(.66));
    ctx.fillStyle='#1c2226';const cr=Math.min(W*.14,L*.026);
    [-.045,0,.045].forEach(f=>{ctx.beginPath();ctx.arc(X(f),0,cr,0,7);ctx.fill()});
  };
  const MODELS={'MAZ 206.948':{img:'maz206_948.png',l:12},'MAZ 206.063':{img:'maz206_063.webp',l:12,top:maz063},'Yutong ZK6890HGQ':{img:'yutong_zk6890hgq.png',l:9,top:yutong}};
  const BC=['#d7263d','#1b998b','#f46036','#2e86ab','#8e44ad','#c79a00'];
  const pathOf=R=>{const b=R=>{const a=R.s.map(i=>City.S.stops.find(s=>s.id===i)).filter(Boolean).map(s=>[s.x,s.y]);if(R.loop&&a.length)a.push(a[0]);return a};return City.path?City.path(R,b):b(R)};
  const CI=new WeakMap();
  const info=pts=>{let m=CI.get(pts);if(!m){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));m={c,L:c[c.length-1]};CI.set(pts,m)}return m};
  function at(pts,d,loop){
    const m=info(pts);if(pts.length<2||!m.L)return null;
    const P2=m.L*(loop?1:2);let s=((d%P2)+P2)%P2,rev=false;if(!loop&&s>m.L){s=P2-s;rev=true}
    let i=1;while(i<m.c.length-1&&m.c[i]<s)i++;
    const a=pts[i-1],b=pts[i],t=(s-m.c[i-1])/((m.c[i]-m.c[i-1])||1);
    return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,an:Math.atan2(b[1]-a[1],b[0]-a[0])+(rev?Math.PI:0)};
  }
  const rr=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};
  function drawBus(ctx,b,lm,col,top){
    const L=Math.max(lm/mpu(),22),W=L*.34;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.an);
    if(top){top(ctx,L,W,col);ctx.restore();return}
    ctx.lineWidth=1;ctx.strokeStyle='#0008';
    rr(ctx,-L/2,-W/2,L,W,W*.2);ctx.fillStyle=col;ctx.fill();ctx.stroke();
    ctx.fillStyle='#bfe3f2';ctx.fillRect(L*.38,-W*.38,L*.08,W*.76);                       /* лобовое стекло */
    ctx.fillStyle='#8d979e';ctx.fillRect(-L*.44,-W*.4,L*.32,W*.8);                         /* метановый отсек */
    ctx.fillStyle='#e9edf0';for(let i=0;i<3;i++){rr(ctx,-L*.42+i*L*.1,-W*.3,L*.07,W*.6,W*.12);ctx.fill();ctx.stroke()}  /* баллоны */
    rr(ctx,-L*.02,-W*.3,L*.2,W*.6,W*.1);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();      /* кондиционер */
    ctx.restore();
  }
  function showBus(h){
    const m=MODELS[h.b.m]||{},E=City.esc;
    $('#pop').innerHTML=`<b>${E(h.b.m)}</b><div style="color:var(--mut)">${E(h.R.n)}</div>`+(m.img?`<img src="${E(m.img)}" alt="${E(h.b.m)}" onerror="this.outerHTML='<small>Нет файла ${E(m.img)} рядом с index.html</small>'">`:'')+'<div class="row"><button id="pc" class="b">Закрыть</button></div>';
    $('#pop').hidden=false;$('#pc').onclick=()=>$('#pop').hidden=true;
  }
  let dn=null;
  cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
  cv.addEventListener('pointerup',e=>{
    if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
    const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,h=bpos.find(b=>Math.hypot(b.x-x,b.y-y)<Math.max(b.L/2,10));
    if(h)showBus(h);else $('#pop').hidden=true;
  });
  City.insp.routes=o=>{
    const bs=o.buses||[];
    return `<div style="font-size:13px;color:var(--mut)">Длина: <b style="color:var(--ink)">${fm(len(pathOf(o)))}</b></div><label>Автобусы на маршруте</label>`
    +bs.map((b,i)=>`<div class="row" style="justify-content:flex-start;align-items:center;flex-wrap:nowrap"><select data-bi="${i}" data-bf="m" style="flex:1;margin:0">${Object.keys(MODELS).map(k=>`<option ${k===b.m?'selected':''}>${k}</option>`).join('')}</select><input type="color" data-bi="${i}" data-bf="c" value="${b.c}" style="width:44px;margin:0;padding:2px"><button class="b danger" data-bdel="${i}" aria-label="Убрать">✕</button></div>`).join('')
    +'<button class="b" data-badd="1">+ Добавить автобус</button>';
  };
  $('#insp').addEventListener('click',e=>{
    const b=e.target.closest('button'),o=City.sel&&City.sel.o;if(!b||!o)return;
    if(b.dataset.badd){City.push();o.buses=o.buses||[];o.buses.push({m:Object.keys(MODELS)[0],c:BC[o.buses.length%6]});City.changed();City.updateUI()}
    if(b.dataset.bdel&&o.buses){City.push();o.buses.splice(+b.dataset.bdel,1);City.changed();City.updateUI()}
  });
  $('#insp').addEventListener('change',e=>{const t=e.target,o=City.sel&&City.sel.o;if(t.dataset.bi!=null&&o&&o.buses){o.buses[+t.dataset.bi][t.dataset.bf]=t.value;City.changed()}});
  (function loop(){const n=performance.now();if(run)clock+=(n-last)/1000;last=n;if(run&&City.S.routes.some(R=>R.buses&&R.buses.length))City.redraw();requestAnimationFrame(loop)})();

  /* ---------- общий слой рисования ---------- */
  City.layers.over.push((ctx,P)=>{
    const S=City.S,V=City.view,k=V.k,d=devicePixelRatio||1,W=cv.width/d,H=cv.height/d;
    const sc=$('#sc');if(document.activeElement!==sc)sc.value=S.scale||50;
    /* граница: затемняем всё снаружи */
    (S.bounds||[]).forEach(b=>{ctx.beginPath();ctx.rect(-1e5,-1e5,2e5,2e5);b.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='#14232b22';ctx.fill('evenodd')});
    ctx.lineJoin='round';
    (S.bounds||[]).forEach(b=>{pp(ctx,b.pts.concat([b.pts[0]]));ctx.lineWidth=3;ctx.strokeStyle='#c0392b';ctx.setLineDash([14,8]);ctx.stroke();ctx.setLineDash([])});
    if(bd){pp(ctx,bd.concat([M]));ctx.lineWidth=2.5;ctx.strokeStyle='#c0392b';ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([])}
    /* население */
    let tot=0;
    S.dists.forEach(D=>{const pop=+D.pop;if(!pop)return;tot+=pop;
      const cx=D.pts.reduce((s,p)=>s+p[0],0)/D.pts.length,cy=D.pts.reduce((s,p)=>s+p[1],0)/D.pts.length,km=area(D.pts)*mpu()*mpu()/1e6;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5;ctx.strokeStyle=P.bg;
      [[n0(pop)+' чел.','700 13px '+F,26],[km?n0(pop/km)+' чел/км²':'','600 11px '+F,42]].forEach(([t,f,dy])=>{if(!t)return;ctx.font=f;ctx.strokeText(t,cx,cy+dy);ctx.fillStyle=P.ink;ctx.fillText(t,cx,cy+dy)});
    });
    $('#tot').textContent=tot?'Население: '+n0(tot):'';
    /* линейка */
    const rp=City.tool==='ruler'&&ruler.length?ruler.concat([M]):ruler;
    if(rp.length){
      pp(ctx,rp);ctx.lineWidth=5/k;ctx.strokeStyle='#14232b';ctx.stroke();ctx.lineWidth=3/k;ctx.strokeStyle='#e9c46a';ctx.stroke();
      ctx.font='700 '+(12/k)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5/k;ctx.strokeStyle=P.bg;
      rp.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],4/k,0,7);ctx.fillStyle='#e9c46a';ctx.fill();ctx.lineWidth=1.5/k;ctx.strokeStyle='#14232b';ctx.stroke();
        if(i){const q=rp[i-1],t=fm(Math.hypot(p[0]-q[0],p[1]-q[1])),x=(p[0]+q[0])/2,y=(p[1]+q[1])/2-10/k;ctx.lineWidth=3.5/k;ctx.strokeStyle=P.bg;ctx.strokeText(t,x,y);ctx.fillStyle=P.ink;ctx.fillText(t,x,y)}});
      const L=len(rp),e=rp[rp.length-1];if(rp.length>1){const t='Всего: '+fm(L);ctx.textAlign='left';ctx.lineWidth=3.5/k;ctx.strokeStyle=P.bg;ctx.strokeText(t,e[0]+8/k,e[1]+14/k);ctx.fillStyle=P.ink;ctx.fillText(t,e[0]+8/k,e[1]+14/k)}
    }
    /* автобусы */
    bpos=[];
    S.routes.forEach(R=>{const bs=R.buses;if(!bs||!bs.length)return;const pts=pathOf(R),m=info(pts),per=m.L*(R.loop?1:2),v=(30/3.6)*4/mpu();
      bs.forEach((b,i)=>{const q=at(pts,clock*v+i*per/bs.length,R.loop);if(!q)return;const lm=(MODELS[b.m]||{l:12}).l;drawBus(ctx,q,lm,b.c,(MODELS[b.m]||{}).top);bpos.push({x:q.x,y:q.y,L:Math.max(lm/mpu(),22),b,R})});
    });
    /* экранные слои: координатная сетка и компас */
    ctx.save();ctx.setTransform(d,0,0,d,0,0);
    if(showXY){let s=50;while(s*k<80)s*=2;ctx.font='600 10px '+F;ctx.lineWidth=3;ctx.strokeStyle=P.bg;ctx.fillStyle=P.lab;ctx.textAlign='center';ctx.textBaseline='bottom';
      for(let wx=Math.ceil(-V.x/k/s)*s;wx*k+V.x<W;wx+=s){const x=wx*k+V.x;if(Math.abs(x-W/2)<150)continue;const t=fm(wx);ctx.strokeText(t,x,H-6);ctx.fillText(t,x,H-6)}
      ctx.textAlign='left';ctx.textBaseline='middle';
      for(let wy=Math.ceil(-V.y/k/s)*s;wy*k+V.y<H;wy+=s){const y=wy*k+V.y;if(y<190||y>H-60)continue;const t=fm(-wy);ctx.strokeText(t,6,y);ctx.fillText(t,6,y)}}
    const cx=W-50,cy=H-64;
    ctx.beginPath();ctx.arc(cx,cy,34,0,7);ctx.fillStyle=P.bg+'e6';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=P.lab;ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-18);ctx.lineTo(cx-6,cy);ctx.lineTo(cx+6,cy);ctx.closePath();ctx.fillStyle='#d7263d';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy+18);ctx.lineTo(cx-6,cy);ctx.lineTo(cx+6,cy);ctx.closePath();ctx.fillStyle=P.lab;ctx.fill();
    ctx.fillStyle=P.ink;ctx.font='800 11px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
    [['С',0,-26],['Ю',0,26],['В',26,0],['З',-26,0]].forEach(([t,x,y])=>ctx.fillText(t,cx+x,cy+y));
    ctx.restore();
  });
})();
</script>
<script>
/* Плагин: одинаковые тип и название + общая конечная точка = одна улица (автопродление) */
(function(){
  const same=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<1;
  function merge(){
    const s=City.sel;if(!s||s.k!=='roads')return;
    const o=s.o,S=City.S;if(!o.n||!o.n.trim())return;
    for(const R of S.roads){
      if(R===o||R.t!==o.t||R.n!==o.n||!!R.ow!==!!o.ow)continue;
      const a=R.pts,b=o.pts,A0=a[0],A1=a[a.length-1],B0=b[0],B1=b[b.length-1];
      /* у односторонних направления должны совпадать */
      const eq=(!!R.rev===!!o.rev),ok=need=>!R.ow||eq===need;
      let pts=null;
      if(same(A1,B0)&&ok(true))pts=a.concat(b.slice(1));
      else if(same(A1,B1)&&ok(false))pts=a.concat(b.slice().reverse().slice(1));
      else if(same(A0,B1)&&ok(true))pts=b.concat(a.slice(1));
      else if(same(A0,B0)&&ok(false))pts=b.slice().reverse().concat(a.slice(1));
      if(!pts)continue;
      R.pts=pts;S.roads=S.roads.filter(x=>x!==o);
      City.select('roads',R);City.changed();City.updateUI();
      return;
    }
  }
  $('#insp').addEventListener('change',e=>{if(e.target.id==='f-n'||e.target.id==='f-t')merge()});
})();
</script>
<script>
/* Плагин: светофоры на перекрёстках (там, где сходятся 3 и более дорог) */
(function(){
  let J=null,Sref=null;
  City.on('change',()=>{J=null});
  const K=p=>Math.round(p[0]/2)+','+Math.round(p[1]/2);
  const dseg=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
  function calc(){
    const S=City.S,cand=new Map(),segs=[];
    S.roads.forEach((R,ri)=>R.pts.slice(1).forEach((b,i)=>segs.push({a:R.pts[i],b,ri})));
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];cand.set(K(p),p);
    }
    S.roads.forEach((R,ri)=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{if(segs.some(s=>s.ri!==ri&&dseg(e,s.a,s.b)<4))cand.set(K(e),e)}));
    const out=[];
    cand.forEach(p=>{
      let arms=0;
      S.roads.forEach((R,ri)=>{
        const n=R.pts.length;let v=-1;
        for(let i=0;i<n;i++)if(Math.hypot(R.pts[i][0]-p[0],R.pts[i][1]-p[1])<4){v=i;break}
        if(v>=0)arms+=(v===0||v===n-1)?1:2;
        else if(segs.some(s=>s.ri===ri&&dseg(p,s.a,s.b)<2))arms+=2;
      });
      if(arms>=3)out.push(p);
    });
    return out;
  }
  const jn=()=>{if(!J||Sref!==City.S){J=calc();Sref=City.S}return J};
  const live=()=>City.S.lights.filter(l=>jn().some(p=>Math.hypot(p[0]-l.x,p[1]-l.y)<6));
  City.register({
    key:'lights',label:'Светофор',
    group:'Дороги',leaf:'Светофор',color:'#e4572e',
    tool:'light',hint:'Нажмите на перекрёсток (где сходятся 3+ дороги), чтобы поставить светофор. Повторный клик или «Ластик» — убрать.',
    click(p,r){
      const k=City.view.k;let best=null;
      jn().forEach(j=>{const d=Math.hypot(j[0]-r[0],j[1]-r[1]);if(d<26/k&&(!best||d<best.d))best={d,j}});
      if(!best)return;
      const ex=City.S.lights.find(l=>Math.hypot(l.x-best.j[0],l.y-best.j[1])<6);
      if(ex)City.del('lights',ex);else City.add('lights',{x:best.j[0],y:best.j[1],n:'Светофор'});
    },
    layer:'over',
    draw(ctx,P){
      if(City.tool==='light'){jn().forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],14,0,7);ctx.lineWidth=2;ctx.strokeStyle='#0c8a86';ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([])})}
      live().forEach(l=>{
        const x=l.x+12,y=l.y-12;
        ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(x,y);ctx.lineWidth=1.5;ctx.strokeStyle='#14232b';ctx.stroke();
        ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x-4.5,y-11,9,22,3);ctx.fillStyle='#1c2226';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.stroke();
        const ph=City.lightPhase?City.lightPhase(0):'*';   /* сигнал для горизонтальных дорог */
        [['#e63946',-6.5,'r'],['#f4c430',0,'y'],['#2ecc71',6.5,'g']].forEach(([c,dy,k])=>{ctx.globalAlpha=(ph==='*'||ph===k)?1:.25;ctx.beginPath();ctx.arc(x,y+dy,2.4,0,7);ctx.fillStyle=c;ctx.fill()});
        ctx.globalAlpha=1;
      });
    },
    hit(p,r){return live().find(l=>Math.hypot(l.x+12-p[0],l.y-12-p[1])<r+10||Math.hypot(l.x-p[0],l.y-p[1])<r+6)}
  });
})();
</script>
<script>
/* Плагин: машины в трафике (правостороннее движение, повороты на перекрёстках, светофоры) */
(function(){
  const mpu=()=>((City.S.scale||50)/50);
  const KM=[25,35,45,55];                                   /* скорость по типу дороги, км/ч */
  /* Модели: img — файл рядом с index.html, l — длина в метрах, ws/rw — лобовое и заднее стекло (доли длины) */
  const CARS=[
    {n:'Toyota Corolla Fielder',img:'tcf.WEBP',l:4.4,ws:[.08,.24],rw:[-.43,-.38]},
    {n:'Mercedes CLA AMG 45 AMG I (C117, X117)',img:'mercedes_claamg45.WEBP',l:4.7,ws:[.06,.2],rw:[-.3,-.14]},
    {n:'Lexus RX V 350',img:'lexusrxv350.WEPB',l:4.9,ws:[.1,.25],rw:[-.44,-.38]},
    {n:'Lexus LC500',img:'lexuslc500.WEPB',l:4.8,ws:[.04,.2],rw:[-.3,-.16]}
  ];
  const COL=['#ffffff','#1c1f24','#9aa3a8','#b5121b','#1e4fa8','#d9d9d9','#2c3e50','#6b4f3a'];
  let cars=[],nodes=null,Sref=null,T=0,on=true,last=performance.now(),dn=null,cpos=[];
  const E=City.esc;
  const rr=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};
  const cLen=c=>Math.max(c.m.l*1.8/mpu(),8);

  /* длины вдоль дороги */
  const IN=new WeakMap();
  function inf(R){let m=IN.get(R.pts);if(!m){const c=[0];for(let i=1;i<R.pts.length;i++)c.push(c[i-1]+Math.hypot(R.pts[i][0]-R.pts[i-1][0],R.pts[i][1]-R.pts[i-1][1]));m={c,L:c[c.length-1]};IN.set(R.pts,m)}return m}
  function loc(R,s){
    const m=inf(R),P=R.pts;s=Math.max(0,Math.min(m.L,s));
    let i=1;while(i<P.length-1&&m.c[i]<s)i++;
    const a=P[i-1],b=P[i],l=(m.c[i]-m.c[i-1])||1,t=(s-m.c[i-1])/l;
    return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,tx:(b[0]-a[0])/l,ty:(b[1]-a[1])/l};
  }
  const nl=R=>R.ow?LN[R.t]:Math.max(1,LN[R.t]/2);              /* полос в одну сторону */
  const dOf=(R,c)=>{const w=RW[R.t],lw=w/(R.ow?LN[R.t]:Math.max(2,LN[R.t]));
    if(R.ow)return -w/2+(c.li+.5)*lw;
    return (c.dir>0?1:-1)*(c.li+.5)*lw};                       /* вперёд — по правую руку */
  function pos(c){const h=loc(c.R,c.s),d=dOf(c.R,c);return[h.x-h.ty*d,h.y+h.tx*d,h]}
  const auto=R=>Math.min(40,Math.round(inf(R).L/90));
  const carsOf=R=>(R.cars===undefined||R.cars==='')?auto(R):Math.max(0,Math.min(60,Math.round(+R.cars)||0));

  /* светофор: 20 с цикл, оси чередуются */
  const phase=axis=>{const t=(T+(axis?10:0))%20;return t<8?'g':t<10?'y':'r'};
  City.lightPhase=phase;

  /* узлы: места пересечения дорог */
  function buildNodes(){
    const S=City.S,rs=S.roads,out=new Map(),sg=[],lights=S.lights||[];
    rs.forEach(R=>out.set(R,[]));
    rs.forEach(R=>{const m=inf(R);R.pts.slice(1).forEach((b,i)=>sg.push({R,a:R.pts[i],b,c0:m.c[i],l:m.c[i+1]-m.c[i]}))});
    for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++){
      const s=sg[i],u=sg[j];if(s.R===u.R)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-4;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const x=s.a[0]+r[0]*t,y=s.a[1]+r[1]*t,ss=s.c0+Math.max(0,Math.min(1,t))*s.l,su=u.c0+Math.max(0,Math.min(1,v))*u.l;
      const light=lights.some(l=>Math.hypot(l.x-x,l.y-y)<8);
      out.get(s.R).push({s:ss,R2:u.R,s2:su,light});out.get(u.R).push({s:su,R2:s.R,s2:ss,light});
    }
    out.forEach((a,R)=>{a.sort((p,q)=>p.s-q.s);out.set(R,a.filter((n,i)=>!a.slice(0,i).some(o=>o.R2===n.R2&&Math.abs(o.s-n.s)<3)))});
    return out;
  }
  function spawn(R){
    const L=inf(R).L;
    return{R,s:Math.random()*L,dir:R.ow?(R.rev?-1:1):(Math.random()<.5?1:-1),li:Math.floor(Math.random()*nl(R)),v:0,
      m:CARS[Math.floor(Math.random()*CARS.length)],col:COL[Math.floor(Math.random()*COL.length)],vf:.85+Math.random()*.3,cool:0,ox:0,oy:0};
  }
  function sync(){
    const rs=City.S.roads;
    cars=cars.filter(c=>rs.includes(c.R));
    rs.forEach(R=>{
      if(inf(R).L<30)return;
      const want=carsOf(R),mine=cars.filter(c=>c.R===R);
      for(let i=mine.length;i<want;i++)cars.push(spawn(R));
      mine.slice(want).forEach(c=>cars.splice(cars.indexOf(c),1));
    });
  }
  function ensure(){
    if(Sref!==City.S){Sref=City.S;cars=[];nodes=null}
    if(!nodes){nodes=buildNodes();sync()}
  }
  City.on('change',()=>{nodes=null});

  /* поворот на другую дорогу в узле (или несколько узлов у конца дороги) */
  function turn(c,list){
    const opts=[];
    list.forEach(n=>{const L2=inf(n.R2).L;
      [1,-1].forEach(d2=>{
        if(n.R2.ow&&(n.R2.rev?-1:1)!==d2)return;
        if(d2>0&&n.s2>L2-4)return;if(d2<0&&n.s2<4)return;
        opts.push({n,d2});
      });
    });
    if(!opts.length)return false;
    const o=opts[Math.floor(Math.random()*opts.length)],p0=pos(c);
    c.R=o.n.R2;c.s=o.n.s2;c.dir=o.d2;c.li=Math.floor(Math.random()*nl(c.R));c.cool=14;
    const p1=pos(c);c.ox=p0[0]-p1[0];c.oy=p0[1]-p1[1];
    return true;
  }

  function step(c,dt){
    const R=c.R,Lr=inf(R).L;if(!Lr)return;
    if(R.ow)c.dir=R.rev?-1:1;
    c.li=Math.min(c.li,nl(R)-1);
    const nds=nodes.get(R)||[],cl=cLen(c),vmax=(KM[R.t]*c.vf/3.6)*4/mpu();
    const h0=loc(R,c.s),axis=Math.abs(h0.tx)>Math.abs(h0.ty)?0:1,stopD=10+cl/2;
    let tv=vmax,lim=Infinity;
    /* красный свет впереди */
    for(const n of nds){
      if(!n.light)continue;const d=(n.s-c.s)*c.dir;
      if(d<stopD-1||d>40)continue;
      const ph=phase(axis);
      if(ph==='g'||(ph==='y'&&d<stopD+10))continue;
      tv=Math.min(tv,vmax*Math.min(1,(d-stopD)/24));lim=Math.min(lim,Math.max(0,d-stopD));
    }
    /* машина впереди */
    for(const o of cars){
      if(o===c||o.R!==R||o.dir!==c.dir||o.li!==c.li)continue;
      const g=(o.s-c.s)*c.dir;if(g<=0)continue;
      const gap=g-(cl+cLen(o))/2;
      if(gap<cl*2)tv=Math.min(tv,vmax*Math.max(0,gap/(cl*2)));
      lim=Math.min(lim,Math.max(0,gap-.6));
    }
    c.v+=(tv-c.v)*Math.min(1,dt*2.5);
    const ds=Math.min(lim,Math.max(0,c.v)*dt),old=c.s,ns=old+c.dir*ds;
    c.cool=Math.max(0,c.cool-ds);
    let moved=false;
    if(!c.cool){
      for(const n of nds){
        if(n.s<4||n.s>Lr-4)continue;
        if((n.s-old)*c.dir>0&&(n.s-ns)*c.dir<=0&&Math.random()<.3){c.s=n.s;if(turn(c,[n])){moved=true;break}c.s=old}
      }
    }
    if(!moved){
      if(ns<0||ns>Lr){
        const endS=ns<0?0:Lr,en=nds.filter(n=>Math.abs(n.s-endS)<4);
        c.s=endS;
        if(!turn(c,en)){
          if(!R.ow)c.dir=-c.dir;                            /* тупик: разворот */
          else{c.s=c.dir>0?0:Lr;c.ox=c.oy=0}                /* конец односторонней: появляется в начале */
        }
      }else c.s=ns;
    }
    const p=pos(c),h=p[2],k=Math.exp(-dt*5);
    c.ox*=k;c.oy*=k;c.x=p[0]+c.ox;c.y=p[1]+c.oy;
    const ta=Math.atan2(h.ty,h.tx)+(c.dir<0?Math.PI:0);
    if(c.an===undefined)c.an=ta;
    let da=ta-c.an;da=Math.atan2(Math.sin(da),Math.cos(da));c.an+=da*Math.min(1,dt*8);
  }

  /* вид сверху */
  function cdraw(ctx,L,W,col,m){
    ctx.lineWidth=.7;ctx.strokeStyle='#000b';
    rr(ctx,-L/2,-W/2,L,W,W*.3);ctx.fillStyle=col;ctx.fill();ctx.stroke();
    const g=(a,b,wa,wb)=>{ctx.beginPath();ctx.moveTo(L*a,-W*wa);ctx.lineTo(L*b,-W*wb);ctx.lineTo(L*b,W*wb);ctx.lineTo(L*a,W*wa);ctx.closePath();ctx.fill()};
    ctx.fillStyle='#16222b';g(m.ws[0],m.ws[1],.3,.38);g(m.rw[0],m.rw[1],.36,.3);
    ctx.fillStyle='#ffffff2a';ctx.fillRect(L*m.rw[1],-W*.3,L*(m.ws[0]-m.rw[1]),W*.6);
    ctx.fillStyle='#fff6c8';ctx.fillRect(L*.47,-W*.4,L*.03,W*.16);ctx.fillRect(L*.47,W*.24,L*.03,W*.16);
    ctx.fillStyle='#d33';ctx.fillRect(-L*.5,-W*.4,L*.025,W*.16);ctx.fillRect(-L*.5,W*.24,L*.025,W*.16);
  }
  City.layers.over.push(ctx=>{
    if(!on)return;ensure();cpos=[];
    cars.forEach(c=>{
      if(c.x===undefined)return;
      const L=cLen(c),W=L*.4;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.an||0);cdraw(ctx,L,W,c.col,c.m);ctx.restore();
      cpos.push({x:c.x,y:c.y,r:Math.max(L/2,8),c});
    });
  });

  /* кнопка, поле «Машин на дороге», окно с фото */
  $('#p2').insertAdjacentHTML('beforeend','<button id="cs" class="b on">Машины</button>');
  $('#cs').onclick=e=>{on=!on;e.currentTarget.classList.toggle('on',on);City.redraw()};
  const prev=City.insp.roads;
  City.insp.roads=o=>prev(o)+`<label>Машин на дороге<input type="number" min="0" max="60" data-f="cars" placeholder="авто (${auto(o)})" value="${o.cars===undefined?'':E(o.cars)}"></label>`;
  cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
  cv.addEventListener('pointerup',e=>{
    if(!on||!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
    const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,h=cpos.find(q=>Math.hypot(q.x-x,q.y-y)<q.r);
    if(!h)return;
    const m=h.c.m;
    $('#pop').innerHTML=`<b>${E(m.n)}</b><div style="color:var(--mut)">${E(h.c.R.n)}</div><img src="${E(m.img)}" alt="${E(m.n)}" onerror="this.outerHTML='<small>Нет файла ${E(m.img)} рядом с index.html</small>'"><div class="row"><button id="pc2" class="b">Закрыть</button></div>`;
    $('#pop').hidden=false;$('#pc2').onclick=()=>$('#pop').hidden=true;
  });
  (function loop(){
    const n=performance.now(),dt=Math.min(.1,(n-last)/1000);last=n;
    if(on){ensure();T+=dt;cars.forEach(c=>step(c,dt));if(cars.length||(City.S.lights&&City.S.lights.length))City.redraw()}
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
/* Плагин: аэропорты (территория, ВПП, РД, стоянки, здания, забор) и самолёты на маршрутах */
(function(){
  const D=()=>City.S,mpu=()=>((D().scale||50)/50),E=City.esc;
  const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const K=p=>(Math.round(p[0]*10)/10)+','+(Math.round(p[1]*10)/10);

  /* ===== Модели самолётов. Добавляйте авиакомпании/модели сюда: img — файл рядом с index.html, l/sp — длина и размах крыла в метрах ===== */
  const PLANES={
    'Boeing 737':{l:39.5,sp:35.8,al:{
      'S7 Airlines':{img:'b737s7.png',fus:'#b6e51c',tail:'#b6e51c',eng:'#3fae3a',wing:'#dfe5e8'},
      'Без ливреи':{img:null,fus:'#f4f6f7',tail:'#f4f6f7',eng:'#d5dadd',wing:'#dfe5e8'}}},
    'Airbus A321':{l:44.5,sp:35.8,al:{
      'VietJet':{img:'vja321.png',fus:'#f6f7f7',rear:'#d9232d',tail:'#d9232d',eng:'#d9232d',wing:'#e3e7ea',tip:true},
      'Без ливреи':{img:null,fus:'#f4f6f7',tail:'#f4f6f7',eng:'#d5dadd',wing:'#dfe5e8'}}}
  };
  const MK=Object.keys(PLANES);
  const specOf=pl=>{const m=PLANES[pl.m]||PLANES[MK[0]];return m.al[pl.al]||m.al[Object.keys(m.al)[0]]};

  /* здания аэропорта — обычные здания с новыми типами */
  BLD.terminal=['Терминал','#cdd6df',120];BLD.hangar=['Ангар','#b9c0c7',90];BLD.tower=['Диспетчерская вышка','#e3d9c6',24];

  const cen=a=>[a.pts.reduce((s,p)=>s+p[0],0)/a.pts.length,a.pts.reduce((s,p)=>s+p[1],0)/a.pts.length];
  const aptOf=id=>D().airports.find(a=>a.id===id);
  const rwysOf=a=>D().rwys.filter(r=>inPoly(r.pts[0],a.pts)||inPoly(r.pts[r.pts.length-1],a.pts));
  const standsOf=a=>D().stands.filter(s=>inPoly([s.x,s.y],a.pts));
  const plen=a=>a.slice(1).reduce((s,p,i)=>s+dst(p,a[i]),0);
  const near=(p,pts,r)=>pts.slice(1).some((q,i)=>dseg(p,pts[i],q)<r);
  let dr=null,ar=null,M=[0,0],G=null,fl=[],Sref=null,need=true,T0=performance.now(),dn=null,fpos=[];
  City.on('change',()=>{G=null;need=true});
  cv.addEventListener('pointermove',e=>{const V=City.view;M=[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k]});

  /* ---------- панель «Готово» для рисования ---------- */
  $('#wrap').insertAdjacentHTML('beforeend','<div id="apb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:8px 14px;display:flex;gap:8px;align-items:center"><span id="apn"></span><button id="apok" class="b p">Готово</button><button id="apno" class="b">Отмена</button></div>');
  const ui=()=>{
    if(dr&&dr.t!==City.tool)dr=null;if(ar&&City.tool!=='aroute')ar=null;
    const act=!!(dr||ar);$('#apb').hidden=!act;
    if(act)$('#apn').textContent=dr?'Точек: '+dr.pts.length:'Аэропортов: '+ar.s.length;
  };
  $('#apok').onclick=()=>{endDraw();endRoute();City.redraw()};
  $('#apno').onclick=()=>{dr=ar=null;City.redraw()};
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){endDraw();endRoute()}if(e.key==='Escape')dr=ar=null;City.redraw()});

  /* ---------- рисование линий и территорий ---------- */
  function stroke(kind,p){
    const k=City.view.k;
    if(!dr||dr.t!==kind){dr={t:kind,pts:[p]};return}
    const l=dr.pts[dr.pts.length-1],f=dr.pts[0];
    if(dst(l,p)<6/k||(kind==='apt'&&dr.pts.length>2&&dst(f,p)<14/k)){endDraw();return}
    dr.pts.push(p);
  }
  function endDraw(){
    if(!dr)return;const d=dr,S=D();dr=null;
    if(d.t==='apt'&&d.pts.length>2)City.add('airports',{id:S.id++,pts:d.pts,n:'Аэропорт '+(S.airports.length+1)});
    else if(d.t==='rwy'&&d.pts.length>1)City.add('rwys',{pts:d.pts,n:'ВПП '+(S.rwys.length+1),w:30});
    else if(d.t==='taxi'&&d.pts.length>1)City.add('taxis',{pts:d.pts,n:'РД '+(S.taxis.length+1),w:14});
    else if(d.t==='fence'&&d.pts.length>1)City.add('fences',{pts:d.pts,n:'Забор'});
  }
  function endRoute(){
    if(!ar)return;const a=ar,S=D();ar=null;
    if(a.s.length>1)City.add('aroutes',{n:'Рейс '+(S.aroutes.length+1),c:RC[S.aroutes.length%6],s:a.s,loop:!!a.loop,planes:[{m:MK[0],al:Object.keys(PLANES[MK[0]].al)[0]}]});
  }

  /* ---------- регистрация инструментов ---------- */
  const G0='Транспорт/Аэропорт';
  const lenI=o=>`<div style="font-size:13px;color:var(--mut)">Длина: <b style="color:var(--ink)">${Math.round(plen(o.pts)*mpu()).toLocaleString('ru-RU')} м</b></div>`;
  const widI=d=>o=>`<label>Ширина<input type="number" min="4" data-f="w" value="${E(o.w||d)}"></label>`+lenI(o);
  City.register({key:'airports',label:'Аэропорт',group:G0,leaf:'Территория аэропорта',color:'#8ea1ad',tool:'apt',
    hint:'Обведите территорию аэропорта точками. Клик по первой точке, двойной клик или «Готово» — закончить. Выбрать территорию — нажать на её границу.',click:p=>stroke('apt',p)});
  City.register({key:'rwys',label:'Взлётная полоса',group:G0,leaf:'Взлётная полоса',color:'#4a5258',tool:'rwy',
    hint:'Ставьте точки полосы. Двойной клик или «Готово» — закончить.',click:p=>stroke('rwy',p),
    hit:(p,r)=>D().rwys.find(R=>near(p,R.pts,(+R.w||30)/2+r)),inspector:widI(30)});
  City.register({key:'taxis',label:'Рулёжная дорожка',group:G0,leaf:'Рулёжная дорожка',color:'#7a838a',tool:'taxi',
    hint:'Ставьте точки рулёжной дорожки. Двойной клик или «Готово» — закончить.',click:p=>stroke('taxi',p),
    hit:(p,r)=>D().taxis.find(R=>near(p,R.pts,(+R.w||14)/2+r)),inspector:widI(14)});
  City.register({key:'stands',label:'Стоянка самолёта',group:G0,leaf:'Стоянка самолётов',color:'#e0b400',tool:'stand',
    hint:'Нажмите на карту, чтобы поставить стоянку. Угол носа задаётся в карточке.',
    click:p=>City.add('stands',{x:p[0],y:p[1],a:0,n:'Стоянка '+(D().stands.length+1)}),
    hit:(p,r)=>D().stands.find(s=>dst([s.x,s.y],p)<r+18),
    inspector:o=>`<label>Угол носа, °<input type="number" data-f="a" value="${E(o.a||0)}"></label>`});
  City.addLeaf(G0,['Терминал','bld','terminal','#cdd6df']);
  City.addLeaf(G0,['Ангар','bld','hangar','#b9c0c7']);
  City.addLeaf(G0,['Диспетчерская вышка','bld','tower','#e3d9c6']);
  City.register({key:'fences',label:'Забор',group:G0,leaf:'Забор',color:'#59636b',tool:'fence',
    hint:'Ставьте точки забора. Двойной клик или «Готово» — закончить.',click:p=>stroke('fence',p),
    hit:(p,r)=>D().fences.find(F=>near(p,F.pts,r+3)),inspector:lenI});
  const rpts=R=>{const q=R.s.map(aptOf).filter(Boolean).map(cen);if(R.loop&&q.length)q.push(q[0]);return q};
  City.register({key:'aroutes',label:'Маршрут самолётов',group:G0,leaf:'Маршрут самолётов',color:'#2e86ab',tool:'aroute',
    hint:'Нажимайте на территории аэропортов по порядку. Первый аэропорт ещё раз — замкнуть кольцо. «Готово» — закончить.',
    click(p,r){
      const a=D().airports.find(a=>inPoly(r,a.pts));if(!a)return;
      if(!ar)ar={s:[a.id],loop:false};
      else if(a.id===ar.s[0]&&ar.s.length>2){ar.loop=true;endRoute()}
      else if(a.id!==ar.s[ar.s.length-1])ar.s.push(a.id);
    },
    hit:(p,r)=>D().aroutes.find(R=>near(p,rpts(R),r+2)),
    inspector:o=>{
      const ps=o.planes||[];
      return `<div style="font-size:13px;color:var(--mut)">Аэропортов: <b style="color:var(--ink)">${o.s.length}</b>${o.loop?', кольцо':''}</div><label>Самолёты на маршруте</label>`
      +ps.map((p,i)=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="justify-content:flex-start;flex-wrap:nowrap"><select data-pi="${i}" data-pf="m" style="margin:0;flex:1">${MK.map(k=>`<option ${k===p.m?'selected':''}>${k}</option>`).join('')}</select><button class="b danger" data-pdel="${i}" aria-label="Убрать">✕</button></div><select data-pi="${i}" data-pf="al" style="margin:0">${Object.keys((PLANES[p.m]||PLANES[MK[0]]).al).map(k=>`<option ${k===p.al?'selected':''}>${k}</option>`).join('')}</select></div>`).join('')
      +'<button class="b" data-padd="1">+ Добавить самолёт</button>';
    }});
  /* территорию выбираем по границе и проверяем последней, чтобы она не перекрывала остальное */
  City.hits.push({key:'airports',fn:(p,r)=>D().airports.find(a=>near(p,a.pts.concat([a.pts[0]]),r+3)||false)});

  $('#insp').addEventListener('click',e=>{
    const b=e.target.closest('button'),s=City.sel;if(!b||!s||s.k!=='aroutes')return;const o=s.o;
    if(b.dataset.padd){City.push();o.planes=o.planes||[];o.planes.push({m:MK[0],al:Object.keys(PLANES[MK[0]].al)[0]});City.changed();City.updateUI()}
    if(b.dataset.pdel&&o.planes){City.push();o.planes.splice(+b.dataset.pdel,1);City.changed();City.updateUI()}
  });
  $('#insp').addEventListener('change',e=>{
    const t=e.target,s=City.sel;if(t.dataset.pi==null||!s||s.k!=='aroutes'||!s.o.planes)return;
    const p=s.o.planes[+t.dataset.pi];if(!p)return;p[t.dataset.pf]=t.value;
    if(t.dataset.pf==='m'){p.al=Object.keys(PLANES[p.m].al)[0];City.updateUI()}
    City.changed();
  });

  /* ---------- граф рулёжных дорожек ---------- */
  function proj(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=[a[0]+dx*t,a[1]+dy*t];return{t,q,d:dst(p,q)}}
  function buildG(){
    const S=D(),P=S.rwys.concat(S.taxis),sg=[],lk=[];
    P.forEach((R,ri)=>{for(let i=1;i<R.pts.length;i++)sg.push({a:R.pts[i-1],b:R.pts[i],ri,sp:[{t:0,p:R.pts[i-1]},{t:1,p:R.pts[i]}]})});
    for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++){
      const s=sg[i],u=sg[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];s.sp.push({t,p});u.sp.push({t:v,p});
    }
    const attach=(e,maxD)=>{let best=null;sg.forEach(s=>{const r=proj(e,s.a,s.b);if(!best||r.d<best.r.d)best={s,r}});
      if(best&&best.r.d<maxD&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});lk.push([e,best.r.q])}};
    P.forEach(R=>{[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
      let best=null;sg.forEach(s=>{if(P[s.ri]===R)return;const r=proj(e,s.a,s.b);if(r.d<12&&(!best||r.d<best.r.d))best={s,r}});
      if(best&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});lk.push([e,best.r.q])}})});
    S.stands.forEach(st=>attach([st.x,st.y],500));
    const idx=new Map(),pts=[],adj=[];
    const node=p=>{const k=K(p);if(!idx.has(k)){idx.set(k,pts.length);pts.push(p);adj.push([])}return idx.get(k)};
    const edge=(p,q)=>{const a=node(p),b=node(q);if(a===b)return;const w=dst(p,q);adj[a].push([b,w]);adj[b].push([a,w])};
    sg.forEach(s=>{s.sp.sort((x,y)=>x.t-y.t);for(let i=1;i<s.sp.length;i++)edge(s.sp[i-1].p,s.sp[i].p)});
    lk.forEach(l=>edge(l[0],l[1]));
    return{idx,pts,adj};
  }
  function gpath(a,b){
    if(!G)G=buildG();
    const s=G.idx.get(K(a)),t=G.idx.get(K(b));if(s==null||t==null)return null;
    const n=G.pts.length,d=new Array(n).fill(Infinity),pr=new Array(n).fill(-1),done=new Array(n).fill(false);d[s]=0;
    for(;;){
      let u=-1;for(let i=0;i<n;i++)if(!done[i]&&d[i]<Infinity&&(u<0||d[i]<d[u]))u=i;
      if(u<0||u===t)break;done[u]=true;
      G.adj[u].forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}});
    }
    if(d[t]===Infinity)return null;
    const out=[];for(let u=t;u>=0;u=pr[u])out.push(G.pts[u]);return out.reverse();
  }

  /* ---------- самолёты: стоянка -> рулёжка -> разбег -> полёт -> посадка -> рулёжка -> стоянка ---------- */
  const peek=f=>{const n=f.R.s.length;if(f.R.loop)return{i:(f.i+1)%n,dir:1};let d=f.dir;if(f.i+d>=n||f.i+d<0)d=-d;return{i:f.i+d,dir:d}};
  function pickStand(a,me){
    const ss=standsOf(a),free=ss.filter(s=>!fl.some(o=>o!==me&&o.st===s)),arr=free.length?free:ss;
    return arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
  }
  function mk(f,pts){
    const q=[];pts.forEach(p=>{const l=q[q.length-1];if(!l||dst(l,p)>.05)q.push(p)});
    if(q.length<2)q.push([q[0][0]+.1,q[0][1]]);
    const c=[0];for(let i=1;i<q.length;i++)c.push(c[i-1]+dst(q[i],q[i-1]));
    f.path=q;f.cum=c;f.PL=c[c.length-1];f.d=0;
  }
  function at(f){
    const c=f.cum,d=Math.max(0,Math.min(f.PL,f.d));let i=1;while(i<c.length-1&&c[i]<d)i++;
    const a=f.path[i-1],b=f.path[i],l=(c[i]-c[i-1])||1,t=(d-c[i-1])/l;
    return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2(b[1]-a[1],b[0]-a[0])];
  }
  const orient=(pts,dir)=>{const a=pts[0],b=pts[pts.length-1];return(b[0]-a[0])*dir[0]+(b[1]-a[1])*dir[1]<0?pts.slice().reverse():pts};
  function arrive(f){
    f.i=f.nx.i;f.dir=f.nx.dir;f.ph='park';f.t=5+Math.random()*4;f.alt=0;f.v=0;f.path=null;
    if(f.st){f.x=f.st.x;f.y=f.st.y;f.ta=(+f.st.a||0)*Math.PI/180}
  }
  function depart(f){
    const R=f.R,cur=aptOf(R.s[f.i]),nx=peek(f),dest=aptOf(R.s[nx.i]);
    if(!cur||!dest||dest===cur){f.t=3;return}
    f.nx=nx;f.dest=dest;
    const rws=rwysOf(cur),cc=cen(cur),dc=cen(dest);
    if(!rws.length){f.st=null;startFly(f);return}
    f.roll=orient(rws[0].pts,[dc[0]-cc[0],dc[1]-cc[1]]);
    if(f.st){
      const sp=[f.st.x,f.st.y],tp=gpath(sp,f.roll[0]);
      mk(f,[sp].concat(tp||[]).concat([f.roll[0]]));f.ph='taxiout';
    }else{mk(f,f.roll);f.ph='roll';f.v=0}
  }
  function startFly(f){
    const dest=f.dest,p0=[f.x,f.y],dc=cen(dest),rws=rwysOf(dest);
    f.st=null;f.fp=p0;
    if(rws.length){f.land=orient(rws[0].pts,[dc[0]-p0[0],dc[1]-p0[1]]);f.T=f.land[0]}else{f.land=null;f.T=dc}
    f.FL=Math.max(1,dst(p0,f.T));f.d=0;f.ph='fly';f.v=Math.max(f.v,80);
  }
  function step(f,dt){
    switch(f.ph){
      case 'park':f.t-=dt;if(f.t<=0)depart(f);break;
      case 'taxiout':f.d+=14*dt;if(f.d>=f.PL){mk(f,f.roll);f.ph='roll';f.v=0}break;
      case 'roll':{
        f.v+=22*dt;f.d+=f.v*dt;f.alt=Math.max(0,Math.min(.4,(f.v-60)/40));
        if(f.v>=80||f.d>=f.PL){f.d=Math.min(f.d,f.PL);const a=at(f);f.x=a[0];f.y=a[1];startFly(f)}
        break}
      case 'fly':{
        const rem=f.FL-f.d;f.v+=((rem<250?70:115)-f.v)*Math.min(1,dt);f.d+=f.v*dt;
        f.alt=Math.max(0,Math.min(1,.4+f.d/150,rem/150));
        if(f.d>=f.FL){
          if(f.land){mk(f,f.land);f.ph='land';f.v=Math.max(f.v*.6,55);f.alt=0}
          else{f.st=pickStand(f.dest,f);arrive(f)}
        }
        break}
      case 'land':{
        f.v=Math.max(12,f.v-16*dt);f.d+=f.v*dt;f.alt=0;
        if(f.d>=f.PL){
          const end=f.path[f.path.length-1],st=pickStand(f.dest,f);f.st=st;
          if(st){const tp=gpath(end,[st.x,st.y]);mk(f,[end].concat(tp||[]).concat([[st.x,st.y]]));f.ph='taxiin'}
          else arrive(f);
        }
        break}
      case 'taxiin':f.d+=14*dt;if(f.d>=f.PL)arrive(f);break;
    }
    if(f.ph==='fly'){const t=Math.min(1,f.d/f.FL);f.x=f.fp[0]+(f.T[0]-f.fp[0])*t;f.y=f.fp[1]+(f.T[1]-f.fp[1])*t;f.ta=Math.atan2(f.T[1]-f.fp[1],f.T[0]-f.fp[0])}
    else if(f.ph!=='park'&&f.path){const a=at(f);f.x=a[0];f.y=a[1];f.ta=a[2]}
    if(f.an===undefined)f.an=f.ta;
    let da=f.ta-f.an;da=Math.atan2(Math.sin(da),Math.cos(da));f.an+=da*Math.min(1,dt*(f.ph==='park'?2:5));
  }
  function syncF(){
    const S=D();
    fl=fl.filter(f=>S.aroutes.includes(f.R)&&(f.R.planes||[]).includes(f.pl)&&f.R.s.every(aptOf));
    S.aroutes.forEach(R=>{
      if(R.s.length<2||!R.s.every(aptOf))return;
      (R.planes||[]).forEach((pl,k)=>{
        if(fl.some(f=>f.pl===pl))return;
        const a=aptOf(R.s[k%R.s.length]),f={pl,R,i:k%R.s.length,dir:1,ph:'park',t:Math.random()*8+k*3,alt:0,v:0};
        f.st=pickStand(a,f);const c=f.st?[f.st.x,f.st.y]:cen(a);
        f.x=c[0];f.y=c[1];f.ta=f.an=f.st?(+f.st.a||0)*Math.PI/180:0;fl.push(f);
      });
    });
  }
  function ensure(){
    if(Sref!==City.S){Sref=City.S;fl=[];need=true;G=null}
    if(need){syncF();need=false}
  }

  /* ---------- рисование ---------- */
  const ln=(ctx,pts,w,c,dash)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineWidth=w;ctx.strokeStyle=c;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([])};
  const rrect=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};
  function drawPlane(ctx,L,sp,a,sh){
    const W=L*.095,HS=sp/2,c=x=>sh?'#0000003d':x;
    ctx.lineJoin='round';ctx.lineWidth=.6;ctx.strokeStyle='#0007';
    const poly=(pts,fill)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=c(fill);ctx.fill();if(!sh)ctx.stroke()};
    [1,-1].forEach(s=>{
      poly([[.1*L,s*W*.4],[-.09*L,s*HS],[-.16*L,s*HS],[-.1*L,s*W*.4]],a.wing);
      poly([[-.4*L,s*W*.3],[-.46*L,s*L*.16],[-.49*L,s*L*.16],[-.47*L,s*W*.3]],a.wing);
      if(a.tip)poly([[-.1*L,s*HS],[-.14*L,s*(HS+W*.45)],[-.17*L,s*(HS+W*.45)],[-.16*L,s*HS]],a.tail);
      rrect(ctx,.03*L,s*HS*.33-W*.25,.09*L,W*.5,W*.2);ctx.fillStyle=c(a.eng);ctx.fill();if(!sh)ctx.stroke();
    });
    const fus=()=>{ctx.beginPath();ctx.moveTo(.5*L,0);ctx.bezierCurveTo(.5*L,W*.35,.44*L,W/2,.36*L,W/2);ctx.lineTo(-.3*L,W/2);ctx.lineTo(-.5*L,W*.12);ctx.lineTo(-.5*L,-W*.12);ctx.lineTo(-.3*L,-W/2);ctx.lineTo(.36*L,-W/2);ctx.bezierCurveTo(.44*L,-W/2,.5*L,-W*.35,.5*L,0);ctx.closePath()};
    fus();ctx.fillStyle=c(a.fus);ctx.fill();
    if(a.rear&&!sh){ctx.save();fus();ctx.clip();ctx.fillStyle=a.rear;ctx.fillRect(-L,-W,L*.9,2*W);ctx.restore()}
    fus();if(!sh)ctx.stroke();
    if(!sh){ctx.fillStyle=a.tail;ctx.fillRect(-.5*L,-W*.07,.18*L,W*.14);ctx.fillStyle='#16222b';ctx.fillRect(.4*L,-W*.3,.03*L,W*.6)}
  }

  /* под дорогами: территория, рулёжки, полосы, стоянки */
  City.layers.under.push((ctx,P)=>{
    const S=D();
    S.airports.forEach(a=>{
      ctx.beginPath();a.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
      ctx.fillStyle='#8ea1ad30';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#5b6b77';ctx.setLineDash([12,8]);ctx.stroke();ctx.setLineDash([]);
    });
    S.airports.forEach(a=>{
      if(!a.n)return;const c=cen(a);
      ctx.font='800 24px Manrope,system-ui,sans-serif';if('letterSpacing' in ctx)ctx.letterSpacing='3px';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#5b6b77cc';ctx.fillText(a.n,c[0],c[1]);if('letterSpacing' in ctx)ctx.letterSpacing='0px';
    });
    S.taxis.forEach(R=>{const w=+R.w||14;ln(ctx,R.pts,w+3,'#2f373c');ln(ctx,R.pts,w,'#6b747a');ln(ctx,R.pts,1.4,'#e0b400',[10,8])});
    S.rwys.forEach(R=>{
      const w=+R.w||30;ln(ctx,R.pts,w+4,'#2b3338');ln(ctx,R.pts,w,'#4a5258');ln(ctx,R.pts,2,'#fff',[18,14]);
      [[R.pts[0],R.pts[1]],[R.pts[R.pts.length-1],R.pts[R.pts.length-2]]].forEach(([e,n])=>{
        const l=dst(e,n)||1,ux=(n[0]-e[0])/l,uy=(n[1]-e[1])/l,bx=e[0]+ux*8,by=e[1]+uy*8;
        ctx.beginPath();ctx.moveTo(bx-uy*w*.36,by+ux*w*.36);ctx.lineTo(bx+uy*w*.36,by-ux*w*.36);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
      });
    });
    S.stands.forEach(s=>{
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate((+s.a||0)*Math.PI/180);
      rrect(ctx,-28,-23,56,46,6);ctx.lineWidth=1.5;ctx.strokeStyle='#e0b400';ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.lineTo(15,-5);ctx.moveTo(22,0);ctx.lineTo(15,5);ctx.stroke();
      ctx.restore();
      if(City.view.k>.5&&s.n){ctx.font='700 10px Manrope,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=P.lab;ctx.fillText(s.n,s.x,s.y+30)}
    });
  });

  /* поверх: забор, маршруты, выделение, самолёты */
  City.layers.over.push((ctx,P)=>{
    ensure();ui();
    const S=D(),k=City.view.k;
    ctx.beginPath();
    S.fences.forEach(F=>{
      F.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      F.pts.slice(1).forEach((b,i)=>{const a=F.pts[i],l=dst(a,b),n=Math.floor(l/12);if(!l)return;const ux=(b[0]-a[0])/l,uy=(b[1]-a[1])/l;
        for(let j=0;j<=n;j++){const x=a[0]+ux*j*12,y=a[1]+uy*j*12;ctx.moveTo(x-uy*4,y+ux*4);ctx.lineTo(x+uy*4,y-ux*4)}});
    });
    ctx.lineWidth=1.6;ctx.strokeStyle='#59636b';ctx.stroke();
    S.aroutes.forEach(R=>{
      const q=rpts(R);if(q.length<2)return;ln(ctx,q,2.5,R.c,[12,9]);
      q.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.fillStyle=R.c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.wh;ctx.stroke()});
    });
    const s=City.sel;
    if(s&&['rwys','taxis','fences'].includes(s.k))ln(ctx,s.o.pts,(+s.o.w||6)+10,'#0c8a8670');
    else if(s&&s.k==='aroutes')ln(ctx,rpts(s.o),10,'#0c8a8670');
    else if(s&&s.k==='stands'){ctx.beginPath();ctx.arc(s.o.x,s.o.y,34,0,7);ctx.fillStyle='#0c8a8670';ctx.fill()}
    else if(s&&s.k==='airports'){ctx.beginPath();s.o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.lineWidth=4;ctx.strokeStyle='#0c8a86';ctx.stroke()}
    if(dr&&dr.t===City.tool){const q=dr.pts.concat([M]);ln(ctx,dr.t==='apt'?q.concat([dr.pts[0]]):q,2.5,'#0c8a86',[8,6])}
    if(ar&&City.tool==='aroute')ln(ctx,ar.s.map(aptOf).filter(Boolean).map(cen).concat([M]),3,'#0c8a86',[8,6]);
    fpos=[];
    fl.slice().sort((a,b)=>a.alt-b.alt).forEach(f=>{
      const m=PLANES[f.pl.m]||PLANES[MK[0]],sp=specOf(f.pl),L=m.l/mpu(),sc=1+(f.alt||0)*.22;
      if(f.alt>.02){ctx.save();ctx.translate(f.x+f.alt*14,f.y+f.alt*20);ctx.rotate(f.an);ctx.scale(sc,sc);drawPlane(ctx,L,m.sp*L/m.l,sp,true);ctx.restore()}
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.an);ctx.scale(sc,sc);drawPlane(ctx,L,m.sp*L/m.l,sp,false);ctx.restore();
      fpos.push({x:f.x,y:f.y,r:Math.max(L/2,12),f});
    });
  });

  /* окно с фото самолёта */
  cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
  cv.addEventListener('pointerup',e=>{
    if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
    const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,h=[...fpos].reverse().find(q=>Math.hypot(q.x-x,q.y-y)<q.r);
    if(!h)return;
    const pl=h.f.pl,sp=specOf(pl),name=pl.m+' ('+pl.al+')';
    $('#pop').innerHTML=`<b>${E(name)}</b><div style="color:var(--mut)">${E(h.f.R.n)}</div>`+(sp.img?`<img src="${E(sp.img)}" alt="${E(name)}" onerror="this.outerHTML='<small>Нет файла ${E(sp.img)} рядом с index.html</small>'">`:'')+'<div class="row"><button id="pc3" class="b">Закрыть</button></div>';
    $('#pop').hidden=false;$('#pc3').onclick=()=>$('#pop').hidden=true;
  });
  (function loop(){
    const n=performance.now(),dt=Math.min(.1,(n-T0)/1000);T0=n;
    ensure();fl.forEach(f=>step(f,dt));if(fl.length)City.redraw();
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
/* ===== Плагин: поворот карты, дальний зум, население/дата/скорость, слежение за транспортом,
   микросетка зон у дорог, кисть ландшафта (всё под дорогами), названия воды, мосты ===== */
(function(){
const TC=10,CS=32,CW=CS*TC,DAYSEC=20,GROW=6,ZB=36,F='Manrope,system-ui,sans-serif';
const realNow=performance.now.bind(performance);
const mpu=()=>((S.scale||50)/50);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY=(i,j)=>(i+32768)*65536+(j+32768);
const G0={l:LIGHT.grid,d:DARK.grid};LIGHT.grid=DARK.grid='#0000';   /* старую сетку гасим, рисуем свою */

/* ---------- стили и разметка ---------- */
document.head.insertAdjacentHTML('beforeend',`<style>

#pop .eye.on{background:var(--acc);color:var(--accink)}
</style>`);
const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ROT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
$('#cname').insertAdjacentHTML('afterend',`<div id="hud"><div class="hr"><span>Население</span><b id="h-pop">0</b></div><div class="hr"><span>Дата</span><b id="h-date"></b></div><div id="hsp"><button class="b" data-sp="0" aria-label="Пауза">❚❚</button><button class="b on" data-sp="1">1×</button><button class="b" data-sp="2">2×</button><button class="b" data-sp="3">3×</button></div></div>`);
$('#wrap').insertAdjacentHTML('beforeend',`<div id="vw" class="fl"><button id="rotL" class="b" aria-label="Повернуть влево">${ROT}</button><button id="rotR" class="b" aria-label="Повернуть вправо"><span style="display:flex;transform:scaleX(-1)">${ROT}</span></button></div>
<div id="bp" class="fl" hidden><label><span id="bpn"></span><input id="bpr" type="range" min="1" max="40" value="4"></label></div>
<div id="fol" class="fl" hidden>${EYE}<span id="fol-n"></span><button id="fol-x" class="b" aria-label="Перестать следить">✕</button></div>`);
City.HINT.select='Нажмите на объект, чтобы изменить. Тяните карту, чтобы двигать. Повернуть: правая кнопка / Q и E / два пальца.';
City.HINT.brush='Рисуйте кистью: ландшафт ложится под дороги. Размер — в панели ниже. Чтобы назвать водоём, выберите его инструментом «Выбрать».';
City.HINT.zone='Закрашивайте клетки вдоль дорог. «Очистить зону» убирает зону.';

/* ---------- состояние ---------- */
let rot=0,rotT=null,dn=null,painting=null,follow=null,lastPick=null,vis=[],lastVis=[],lastTerr,tv=0,mw=[0,0];
let szT=4,szZ=1,gt=0,gk=null,speed=1,prevSp=1,alw=null;

/* ---------- время игры: ускорение ведёт все плагины через performance.now ---------- */
let virt=realNow(),lastR=virt;
try{performance.now=function(){const r=realNow();virt+=(r-lastR)*speed;lastR=r;return virt}}catch(e){}
let lastV=performance.now();
function setSpeed(s){performance.now();if(s)prevSp=s;speed=s;document.querySelectorAll('#hsp [data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===s))}
$('#hsp').onclick=e=>{const b=e.target.closest('[data-sp]');if(b)setSpeed(+b.dataset.sp)};
const sT=()=>{if(gk)try{localStorage.setItem(gk,String(gt))}catch(e){}};
const fmtDate=g=>{const d=new Date(2025,0,1+Math.floor(g)),h=Math.floor((g%1)*24);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).replace(' г.','')+', '+String(h).padStart(2,'0')+':00'};
addEventListener('pagehide',sT);document.addEventListener('visibilitychange',()=>{if(document.hidden)sT()});

/* ---------- ландшафт и зоны: хранение кусками 32×32 клетки ---------- */
const tget=(i,j)=>{const s=S.terr&&S.terr[(i>>5)+','+(j>>5)];return s?s.charAt(((j&31)<<5)|(i&31)):' '};
const isW=(i,j)=>{const c=tget(i,j);return c==='w'||c==='s'};
const isLand=(i,j)=>{const c=tget(i,j);return c!=='w'&&c!=='s'&&c!=='m'};
const hasT=()=>{if(!S.terr)return false;for(const k in S.terr)return true;return false};
function setT(cells,code){
  const st=S.terr,g=new Map();
  for(let q=0;q<cells.length;q+=2){const i=cells[q],j=cells[q+1],key=(i>>5)+','+(j>>5);let a=g.get(key);
    if(!a){const s=st[key];a=s?s.split(''):new Array(1024).fill(' ');g.set(key,a)}a[((j&31)<<5)|(i&31)]=code}
  g.forEach((a,key)=>{const s=a.join('');if(/^ +$/.test(s))delete st[key];else st[key]=s});
}
function setZ(cells,code){
  const st=S.zones,g=new Map(),dch=String.fromCharCode(256+Math.min(54000,Math.floor(gt)));
  for(let q=0;q<cells.length;q+=2){const i=cells[q],j=cells[q+1],key=(i>>5)+','+(j>>5),n=((j&31)<<5)|(i&31);let a=g.get(key);
    if(!a){const z=st[key];a=z?{t:z.t.split(''),d:z.d.split('')}:{t:new Array(1024).fill(' '),d:new Array(1024).fill(' ')};g.set(key,a)}
    if(code===' '){a.t[n]=' ';a.d[n]=' '}else if(a.t[n]!==code){a.t[n]=code;a.d[n]=dch}}
  g.forEach((a,key)=>{const t=a.t.join('');if(/^ +$/.test(t))delete st[key];else st[key]={t,d:a.d.join('')}});
}
/* клетки микросетки: рядом с дорогой, но не под ней, и только на суше */
City.on('change',()=>{alw=null});
function allowed(){
  if(alw)return alw;
  const cand=new Set(),blk=new Set();
  S.roads.forEach(R=>{const lo=RW[R.t]/2+2,hi=lo+ZB;
    for(let s=1;s<R.pts.length;s++){const a=R.pts[s-1],b=R.pts[s],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5));
      for(let q=0;q<=n;q++){const px=a[0]+(b[0]-a[0])*q/n,py=a[1]+(b[1]-a[1])*q/n;
        const i0=Math.floor((px-hi)/TC),i1=Math.floor((px+hi)/TC),j0=Math.floor((py-hi)/TC),j1=Math.floor((py+hi)/TC);
        for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const d=Math.hypot((i+.5)*TC-px,(j+.5)*TC-py);if(d<lo)blk.add(KEY(i,j));else if(d<=hi)cand.add(KEY(i,j))}}}});
  const a=[],set=new Set();let n=0;
  cand.forEach(kk=>{if(blk.has(kk))return;const i=Math.floor(kk/65536)-32768,j=kk%65536-32768;if(isLand(i,j)){set.add(kk);a[n++]=i;a[n++]=j}});
  return alw={set,a,n:n/2};
}

/* ---------- кисть ---------- */
function stamp(kind,wx,wy){
  const code=tt,size=kind==='t'?szT:szZ,rad=size/2,R=Math.ceil(rad),ci=Math.floor(wx/TC),cj=Math.floor(wy/TC),cells=[];
  const A=kind==='z'&&code!=='x'?allowed():null;
  for(let dj=-R;dj<=R;dj++)for(let di=-R;di<=R;di++){
    if(di*di+dj*dj>rad*rad)continue;
    const i=ci+di,j=cj+dj;if(A&&!A.set.has(KEY(i,j)))continue;cells.push(i,j);
  }
  if(!cells.length)return;
  if(kind==='t'){const c=code==='e'?' ':code;setT(cells,c);if('wsm'.indexOf(c)>=0&&S.zones)setZ(cells,' ')}
  else setZ(cells,code==='x'?' ':code);
  dirty=true;
}
function startPaint(kind,w,e){City.push();if(!S.terr)S.terr={};if(!S.zones)S.zones={};painting={kind,id:e.pointerId,last:w};stamp(kind,w[0],w[1])}
function strokeTo(w){const a=painting.last,n=Math.max(1,Math.ceil(Math.hypot(w[0]-a[0],w[1]-a[1])/(TC*.5)));
  for(let q=1;q<=n;q++)stamp(painting.kind,a[0]+(w[0]-a[0])*q/n,a[1]+(w[1]-a[1])*q/n);painting.last=w}
function endPaint(e){if(!painting||(e&&e.pointerId!==painting.id))return;painting=null;tv++;City.changed()}
City.tools.brush=(p,r,e)=>startPaint('t',r,e);
City.tools.zone=(p,r,e)=>startPaint('z',r,e);
[['Море','w','#3b8fd1'],['Мелководье','s','#6ebae2'],['Пляж','b','#f0e2a8'],['Земля','g','#b0cb86'],['Лес','f','#6ca064'],['Горы','m','#96968e'],['Стереть ландшафт','e','#c0392b']].forEach(a=>City.addLeaf('Ландшафт',[a[0],'brush',a[1],a[2]]));
[['Жилая зона','r','#58b868'],['Коммерческая зона','c','#4a90e2'],['Офисная зона','o','#8a6ee0'],['Индустриальная зона','i','#e2be3c'],['Очистить зону','x','#c0392b']].forEach(a=>City.addLeaf('Зоны',[a[0],'zone',a[1],a[2]]));

/* ---------- вода: названия, площадь ---------- */
function flood(i0,j0,lim){
  if(!isW(i0,j0))return null;
  const set=new Set([KEY(i0,j0)]),q=[i0,j0],D=[1,0,-1,0,0,1,0,-1];let qi=0,sx=0,sy=0;

$('#rotL').onclick=()=>rotBy(-1);$('#rotR').onclick=()=>rotBy(1);
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='q'||k==='й')rotBy(-1);else if(k==='e'||k==='у')rotBy(1);
  else if(k==='1'||k==='2'||k==='3')setSpeed(+k);
  else if(k===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setSpeed(speed?0:prevSp)}
});
$('#bpr').oninput=e=>{const v=+e.target.value;if(City.tool==='zone')szZ=v;else szT=v;bpLabel()};
function bpLabel(){const z=City.tool==='zone',v=z?szZ:szT;$('#bpn').textContent=(z?'Кисть зоны: ':'Размер кисти: ')+v+' кл. (≈'+Math.round(v*TC*mpu())+' м)'}
function bpShow(){const t=City.tool,z=t==='zone',show=t==='brush'||z;$('#bp').hidden=!show;if(!show)return;const r=$('#bpr');r.max=z?10:40;r.value=z?szZ:szT;bpLabel()}

/* ---------- слой поверх: курсор кисти и компас ---------- */
City.layers.over.push((ctx,P)=>{
  const t=City.tool,k=V.k;
  if((t==='brush'||t==='zone')&&mw){
    const size=t==='zone'?szZ:szT,rad=Math.max(size/2*TC,TC*.5);
    ctx.beginPath();ctx.arc((Math.floor(mw[0]/TC)+.5)*TC,(Math.floor(mw[1]/TC)+.5)*TC,rad,0,7);
    ctx.lineWidth=2/k;ctx.strokeStyle='#0c8a86';ctx.setLineDash([6/k,4/k]);ctx.stroke();ctx.setLineDash([]);
  }
  const d=devicePixelRatio||1,r=cv.getBoundingClientRect(),cx=r.width-50,cy=r.height-64,c=Math.cos(rot),s=Math.sin(rot);
  ctx.save();ctx.setTransform(d,0,0,d,0,0);
  ctx.beginPath();ctx.arc(cx,cy,36,0,7);ctx.fillStyle=P.bg;ctx.fill();            /* закрываем старый компас */
  ctx.beginPath();ctx.arc(cx,cy,34,0,7);ctx.lineWidth=1.5;ctx.strokeStyle=P.lab;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.closePath();ctx.fillStyle='#d7263d';ctx.fill();
  ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.closePath();ctx.fillStyle=P.lab;ctx.fill();
  ctx.restore();
  ctx.fillStyle=P.ink;ctx.font='800 11px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
  [['С',0,-26],['Ю',0,26],['В',26,0],['З',-26,0]].forEach(([tx,x,y])=>ctx.fillText(tx,cx+c*x-s*y,cy+s*x+c*y));
  ctx.restore();
});

/* ---------- главный цикл плагина: время, поворот, панели ---------- */
let lastTool=null,hudAt=0,xyWas=false,saveAt=realNow();
function popTotal(){
  let n=0;(S.dists||[]).forEach(D=>{n+=+D.pop||0});
  const Z=S.zones;if(Z)for(const key in Z){const z=Z[key];for(let q=0;q<1024;q++)if(z.t.charAt(q)==='r')n+=4*clamp((gt-(z.d.charCodeAt(q)-256))/GROW,0,1)}
  return Math.round(n);
}
(function frame(){
  const v=performance.now();gt+=(v-lastV)/1000/DAYSEC;lastV=v;
  const key='citymap:t:'+idx.cur;
  if(key!==gk){sT();gk=key;try{const t=localStorage.getItem(key);gt=t?(+t||0):0}catch(e){gt=0}}
  const rn=realNow();
  if(rn-saveAt>5000){saveAt=rn;sT()}
  if(rotT!==null){const dl=rotT-rot;if(Math.abs(dl)<.002){rot=rotT;rotT=null;if(Math.abs(rot)<.003)rot=0}else rot+=dl*.25;dirty=true}
  const xy=$('#xy');
  if(Math.abs(rot)>.003){if(xy.classList.contains('on')){xyWas=true;xy.click()}}
  else if(xyWas){xyWas=false;if(!xy.classList.contains('on'))xy.click()}
  if(City.tool!==lastTool){lastTool=City.tool;bpShow()}
  if(rn-hudAt>250){hudAt=rn;$('#h-date').textContent=fmtDate(gt);$('#h-pop').textContent=popTotal().toLocaleString('ru-RU')}
  requestAnimationFrame(frame);
})();
City.game={get day(){return gt},get speed(){return speed},setSpeed};
City.vis=()=>lastVis;
City.pick=()=>lastPick;
City.follow=()=>follow;
dirty=true;
})();
</script>
<script>
/* ===== Плагин 2: жители домов и районов, пассажиры (остановки и автобусы),
   кнопка «Маршрут» при слежении, подтверждение удаления важных зданий.
   Вставлять ПОСЛЕ плагина city-plugin (поворот/слежение). ===== */
(function(){
const TC=10,GROW=6,F='Manrope,system-ui,sans-serif';
const CAP={'MAZ 206.948':68,'MAZ 206.063':40,'Yutong ZK6890HGQ':75};     /* вместимость автобусов */
const IMP=new Set(['terminal','hangar','tower','industry','office']);      /* «важные» здания: спросим «Вы уверены?» */
const PH={park:'Стоянка',taxiout:'Руление на взлёт',roll:'Разбег',fly:'Полёт',land:'Посадка',taxiin:'Руление на стоянку'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mpu=()=>((S.scale||50)/50);
const n0=v=>Math.round(v).toLocaleString('ru-RU');
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;

/* ---------- жители домов ---------- */
const auto=b=>Math.max(1,Math.round(b.w*b.h*mpu()*mpu()/25));
const hp=b=>b.t!=='house'?0:(b.pop===undefined||b.pop===''?auto(b):Math.max(0,+b.pop||0));
City.insp.blds=o=>o.t==='house'?`<label>Жителей<input type="number" min="0" data-f="pop" placeholder="авто (${auto(o)})" value="${o.pop===undefined?'':City.esc(o.pop)}"></label>`:'';
function zcells(fn){
  const Z=S.zones,g=City.game?City.game.day:0;if(!Z)return;
  for(const key in Z){const z=Z[key],p=key.split(','),i0=+p[0]*32,j0=+p[1]*32;
    for(let n=0;n<1024;n++){if(z.t.charAt(n)!=='r')continue;
      fn((i0+(n&31)+.5)*TC,(j0+(n>>5)+.5)*TC,4*clamp((g-(z.d.charCodeAt(n)-256))/GROW,0,1))}}
}
let total=0;
function recalc(){
  const D=S.dists||[];let t=0;D.forEach(d=>{d.pop=0});
  S.blds.forEach(b=>{const v=hp(b);if(!v)return;t+=v;const c=[b.x+b.w/2,b.y+b.h/2];D.forEach(d=>{if(inPoly(c,d.pts))d.pop+=v})});
  zcells((x,y,p)=>{t+=p;if(D.length){const c=[x,y];D.forEach(d=>{if(inPoly(c,d.pts))d.pop+=p})}});
  D.forEach(d=>{d.pop=Math.round(d.pop)});total=Math.round(t);
}
City.totalPop=()=>total;
City.insp.dists=o=>`<div style="font-size:13px;color:var(--mut)">Население: <b style="color:var(--ink)">${n0(o.pop||0)} чел.</b><br>считается по жителям домов в районе</div><div style="font-size:13px;color:var(--mut)">Площадь: <b style="color:var(--ink)">${(area(o.pts)*mpu()*mpu()/1e6).toFixed(2).replace('.',',')} км²</b></div>`;

/* ---------- остановки и автобусы ---------- */
const bst=new WeakMap(),nearC=new WeakMap();let ver=0,lastDay=null;
City.on('change',()=>ver++);
function near(s){
  let c=nearC.get(s);if(c&&c.v===ver)return c.val;
  let v=0;S.blds.forEach(b=>{if(b.t==='house'&&Math.hypot(b.x+b.w/2-s.x,b.y+b.h/2-s.y)<160)v+=hp(b)});
  zcells((x,y,p)=>{if(Math.hypot(x-s.x,y-s.y)<160)v+=p});
  nearC.set(s,{v:ver,val:v});return v;
}
const capOf=b=>CAP[b.m]||40;
function nextIdx(st,R){
  const n=R.s.length;if(st.idx<0)return -1;
  if(R.loop)return (st.idx+1)%n;
  let ni=st.idx+st.dir;if(ni<0||ni>=n)ni=st.idx-st.dir;return ni;
}
function serve(q){
  const b=q.ref,R=q.R,ids=R.s,thr=26;let st=bst.get(b);
  if(!st){st={load:0,at:null,idx:-1,dir:1};bst.set(b,st)}
  if(st.at){if(Math.hypot(st.at.x-q.x,st.at.y-q.y)>thr+8)st.at=null;else return}
  let hit=null;
  for(const id of ids){const s=S.stops.find(x=>x.id===id);if(s&&Math.hypot(s.x-q.x,s.y-q.y)<thr){hit=s;break}}
  if(!hit)return;
  st.at=hit;
  const cand=[];ids.forEach((id,i)=>{if(id===hit.id)cand.push(i)});
  if(cand.length){
    let c=cand[0];
    if(st.idx>=0){const ex=R.loop?(st.idx+1)%ids.length:st.idx+st.dir;c=cand.reduce((a,x)=>Math.abs(x-ex)<Math.abs(a-ex)?x:a,cand[0]);
      if(!R.loop){if(c>st.idx)st.dir=1;else if(c<st.idx)st.dir=-1}}
    else st.dir=1;
    st.idx=c;
  }
  st.load-=Math.round(st.load*(.25+Math.random()*.3));
  const board=Math.min(Math.floor(hit.w||0),capOf(b)-st.load);
  if(board>0){hit.w-=board;st.load+=board}
}
function sim(){
  const day=City.game.day;if(lastDay===null)lastDay=day;
  const dm=Math.max(0,(day-lastDay)*1440);lastDay=day;
  if(dm>0)S.stops.forEach(s=>{s.w=Math.min(150,(s.w||0)+(4+near(s)*.08)/60*dm)});
  City.vis().forEach(q=>{if(q.k==='bus'&&q.R)serve(q)});
}
City.insp.stops=o=>`<div id="st-w" style="font-size:13px;color:var(--mut)">Ожидают: <b style="color:var(--ink)">${Math.floor(o.w||0)}</b> чел.</div><div style="font-size:12px;color:var(--mut)">Жителей рядом: ≈${n0(near(o))}</div>`;
cv.addEventListener('pointerup',()=>{
  const pk=City.pick&&City.pick(),pop=$('#pop');
  if(pk&&pk.k==='bus'&&!pop.hidden&&!$('#pp-load')){const r=pop.querySelector('.row');if(r)r.insertAdjacentHTML('beforebegin','<div id="pp-load" style="font-weight:700"></div>')}
});
function liveUI(){
  const pk=City.pick&&City.pick(),el=$('#pp-load');
  if(el&&pk&&pk.k==='bus'){const st=bst.get(pk.ref);el.textContent='В автобусе: '+(st?st.load:0)+' / '+capOf(pk.ref)}
  const s=City.sel;if(s&&s.k==='stops'){const b=$('#st-w b');if(b)b.textContent=Math.floor(s.o.w||0)}
}

/* ---------- кнопка «Маршрут» ---------- */
let showRoute=false;
$('#fol-x').insertAdjacentHTML('beforebegin','<button id="fol-r" class="b">Маршрут</button>');
$('#fol-r').onclick=e=>{showRoute=!showRoute;e.currentTarget.classList.toggle('on',showRoute);City.redraw()};
function chev(ctx,pts,sp,sz,col){
  ctx.fillStyle=col;let acc=0,nx=sp/2;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!L)continue;const an=Math.atan2(b[1]-a[1],b[0]-a[0]);
    while(nx-acc<=L){const t=(nx-acc)/L;ctx.save();ctx.translate(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);ctx.rotate(an);
      ctx.beginPath();ctx.moveTo(sz,0);ctx.lineTo(-sz,-sz*.8);ctx.lineTo(-sz*.3,0);ctx.lineTo(-sz,sz*.8);ctx.closePath();ctx.fill();ctx.restore();nx+=sp}
    acc+=L}
}
const cen=a=>[a.pts.reduce((s,p)=>s+p[0],0)/a.pts.length,a.pts.reduce((s,p)=>s+p[1],0)/a.pts.length];
function overlay(ctx,P,k){
  const f=City.follow();if(!f||!showRoute)return;
  const q=City.vis().find(v=>v.ref===f.ref);if(!q)return;const u=1/k;
  const txt=(t,x,y)=>{ctx.font='700 '+(12*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5*u;ctx.lineJoin='round';ctx.strokeStyle=P.bg;ctx.strokeText(t,x,y);ctx.fillStyle=P.ink;ctx.fillText(t,x,y)};
  if(f.k==='bus'&&q.R){
    const R=q.R,pts=stopPts(R),st=bst.get(q.ref),w=Math.max(16,10*u);
    if(pts.length>1){line(pts,w,R.c+'55');chev(ctx,pts,60*u,6*u,'#fff')}
    const ni=st?nextIdx(st,R):-1;
    R.s.forEach((id,i)=>{const s=S.stops.find(x=>x.id===id);if(!s)return;
      ctx.beginPath();ctx.arc(s.x,s.y,9*u,0,7);ctx.fillStyle=R.c;ctx.fill();ctx.lineWidth=2*u;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.font='800 '+(10*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(i+1,s.x,s.y+.5*u);
      if(i===ni){ctx.beginPath();ctx.arc(s.x,s.y,15*u,0,7);ctx.lineWidth=3*u;ctx.strokeStyle='#0c8a86';ctx.stroke()}});
    const nx=ni>=0?S.stops.find(x=>x.id===R.s[ni]):null;
    txt((q.ref.m)+' · '+(st?st.load:0)+'/'+capOf(q.ref)+' чел.'+(nx?' · дальше: '+nx.n:''),q.x,q.y-q.r-14*u);
  }else if(f.k==='car'){
    const c=f.ref,Rd=c.R;if(!Rd)return;
    line(Rd.pts,RW[Rd.t]+10,'#0c8a8666');chev(ctx,c.dir>0?Rd.pts:Rd.pts.slice().reverse(),60*u,6*u,'#0c8a86');
    txt('Едет по: '+(Rd.n||'дорога'),q.x,q.y-q.r-14*u);
  }else if(f.k==='air'){
    const a=f.ref,R=a.R;if(!R)return;
    const cs=R.s.map(id=>S.airports.find(x=>x.id===id)).filter(Boolean).map(cen);if(R.loop&&cs.length)cs.push(cs[0]);
    if(cs.length>1)line(cs,4*u,R.c,[12*u,9*u]);
    if(a.dest){poly(a.dest.pts);ctx.lineWidth=4*u;ctx.strokeStyle='#0c8a86';ctx.stroke();line([[q.x,q.y],cen(a.dest)],3*u,'#0c8a86',[8*u,6*u])}
    txt((PH[a.ph]||'')+(a.dest?' → '+a.dest.n:''),q.x,q.y-q.r-14*u);
  }
}
City.layers.over.push((ctx,P)=>{
  const k=City.view.k,u=1/k;
  if(k>.45)S.stops.forEach(s=>{
    const n=Math.floor(s.w||0);if(!n)return;
    ctx.font='700 '+(10*u)+'px '+F;const w=ctx.measureText(n).width+8*u,x=s.x+8*u,y=s.y-20*u;
    ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,14*u,7*u);ctx.fillStyle='#0c8a86';ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x+w/2,y+7.5*u);
  });
  if(k>1.2)City.vis().forEach(q=>{
    if(q.k!=='bus')return;const st=bst.get(q.ref);
    ctx.font='700 '+(10*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3*u;ctx.lineJoin='round';ctx.strokeStyle=P.bg;
    const t=(st?st.load:0)+'/'+capOf(q.ref);ctx.strokeText(t,q.x,q.y-q.r-4*u);ctx.fillStyle=P.ink;ctx.fillText(t,q.x,q.y-q.r-4*u);
  });
  overlay(ctx,P,k);
});

/* ---------- ластик: «Вы уверены?» для важных зданий ---------- */
$('#wrap').addEventListener('pointerdown',e=>{
  if(e.target!==cv||e.cancelBubble||e.button!==0||City.tool!=='erase')return;
  const h=pick([(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k],true);if(!h)return;
  const o=h.o,nm=o.n?' «'+o.n+'»':'';let name=null;
  if(h.k==='blds'&&IMP.has(o.t))name=(BLD[o.t]?BLD[o.t][0]:'Здание')+nm;
  else if(h.k==='depots')name='АТП'+nm;
  else if(h.k==='airports')name='Территория аэропорта'+nm;
  if(!name)return;
  e.stopPropagation();e.preventDefault();
  if(confirm('Удалить: '+name+'?\nВы уверены?'))del(h.k,h.o);
},{capture:true});

/* ---------- цикл ---------- */
let at=0;recalc();
(function frame(){
  const n=Date.now();if(n-at>500){at=n;recalc()}
  sim();liveUI();
  if(!City.follow()&&showRoute){showRoute=false;$('#fol-r').classList.remove('on')}
  requestAnimationFrame(frame);
})();
})();
</script>
</body>

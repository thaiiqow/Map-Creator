    const bx=-.15*L,ex=bx-7.2*bb,g=.55*bb;
    [-1,1].forEach(sg=>{c.beginPath();c.moveTo(bx,sg*.1*2.55*bb);c.lineTo(ex,sg*g);c.stroke()});
    c.restore();
  }else{
    const N=nSec(R),ls=[];for(let j=0;j<N;j++)ls.push((j===0||j===N-1?9.6:8.4)*bb);
    const jg=.5*bb,W=2.5*bb,Lt=ls.reduce((a,x)=>a+x,0)+(N-1)*jg;let s=st.d+Lt/2;
    for(let j=0;j<N;j++){
      const l=ls[j],q=at(st.tr,s-l/2);
      c.save();c.translate(q.x,q.y);c.rotate(q.an+(j===N-1?Math.PI:0));tramSec(c,l,W,j===0||j===N-1,col);c.restore();
      s-=l;
      if(j<N-1){const q2=at(st.tr,s-jg/2);c.save();c.translate(q2.x,q2.y);c.rotate(q2.an);c.fillStyle='#2a2f33';c.fillRect(-jg/2,-W*.42,jg,W*.84);c.restore();s-=jg}
    }
  }
  c.restore();
  const r=Math.max(lenOf(R)/2,12);hits.push({x:st.x+ox,y:st.y+oy,r,b,R,st});
  if(k>.9){
    const num=parse(R,0).num;
    if(num){const u=1/k,tc=/^#[0-9a-f]{6}$/i.test(b.tc)?b.tc:(City.tabloColor||'#ffb21a');
      c.font='800 '+(10*u)+'px '+F;const w=c.measureText(num).width+8*u,x=st.x+ox-w/2,y=st.y+oy-r-16*u;
      rrc(c,x,y,w,13*u,4*u);c.fillStyle='#14171a';c.fill();c.fillStyle=tc;c.textAlign='center';c.textBaseline='middle';c.fillText(num,x+w/2,y+7*u)}
  }
}
City.layers.over.push((c,P)=>{
  const S=City.S,k=City.view.k,u=1/k,sl=City.sel;hits=[];
  if(rl&&(City.tool!=='proute'||String(tt)!==rl.sys))rl=null;
  if(pv&&City.tool!=='pvar'&&!pvd.open)pv=pv;
  const showBar=!!rl||(City.tool==='pvar'&&!!pv);
  $('#vrb').hidden=!showBar;
  if(rl)$('#vrn').textContent='Остановок: '+rl.s.length;else if(pv)$('#vrn').textContent='Остановок: '+pv.d.length;
  vrs().forEach(R=>{
    const T=tripsFor(R,{});
    if(T&&T.F&&((sl&&sl.o===R)||City.tool==='proute')){if(sl&&sl.o===R)line(T.F.pts,10,'#0c8a8670');line(T.F.pts,2,R.c+'cc',[8,6])}
    if(sl&&sl.o===R)(R.vars||[]).forEach(v=>{const t=tripsFor(R,{v:R.vars.indexOf(v)});if(t&&t.F)line(t.F.pts,5,R.c+'99',[10,8])});
  });
  if(rl){const q=rl.s.map(stopOf).filter(Boolean).map(s=>[s.x,s.y]);if(q.length)line(q.concat([mouse]),3,'#0c8a86',[8,6])}
  if(pv&&City.tool==='pvar'){
    const q=pv.d.map(stopOf).filter(Boolean).map(s=>[s.x,s.y]);if(q.length)line(q.concat([mouse]),4,'#0c8a86',[8,6]);
    stops().forEach(z=>{if(z.sys!==pv.sys)return;c.beginPath();c.arc(z.x,z.y,14,0,7);c.lineWidth=2*u;c.strokeStyle='#0c8a86';c.stroke()});
  }
  S.vroutes&&S.vroutes.forEach(R=>(R.veh||[]).forEach(b=>{const st=VS.get(b);if(st&&st.run&&st.tr)drawVeh(c,R,b,st,k,P)}));
  if(k>1.2)hits.forEach(h=>{const t=h.st.load+'/'+capOf(h.R);c.font='700 '+(10*u)+'px '+F;c.textAlign='center';c.textBaseline='middle';c.lineWidth=3*u;c.lineJoin='round';c.strokeStyle=P.bg;c.strokeText(t,h.x,h.y+h.r+8*u);c.fillStyle=P.ink;c.fillText(t,h.x,h.y+h.r+8*u)});
});
let dn=null;
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{
  if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  const V0=City.view,x=(e.offsetX-V0.x)/V0.k,y=(e.offsetY-V0.y)/V0.k,h=[...hits].reverse().find(q=>Math.hypot(q.x-x,q.y-y)<q.r);
  if(!h)return;
  const it=catalog(h.R.sys).find(z=>z.m===h.b.m)||catalog(h.R.sys)[0];sel=null;City.updateUI();
  $('#pop').innerHTML='<b>'+E(h.b.m)+'</b><div style="color:var(--mut)">'+E(h.R.n)+'</div><div style="color:var(--mut)">В салоне: '+h.st.load+' / '+capOf(h.R)+'</div><img src="'+E(it.img)+'" alt="" onerror="this.outerHTML=\'<small>Нет файла '+E(it.img)+' рядом с index.html</small>\'"><div class="row"><button id="pc8" class="b">Закрыть</button></div>';
  $('#pop').hidden=false;$('#pc8').onclick=()=>$('#pop').hidden=true;
});

/* ----- создание маршрута ----- */
let rl=null,pv=null,pvR=null;
$('#wrap').insertAdjacentHTML('beforeend','<div id="vrb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:6"><span id="vrn"></span><button id="vrok" class="b p">Готово</button><button id="vrno" class="b">Отмена</button></div>');
function nearStop(sys,r){const k=City.view.k;let best=null;stops().forEach(s=>{if(s.sys!==sys)return;const d=dst([s.x,s.y],r);if(d<22/k&&(!best||d<best.d))best={d,s}});return best&&best.s}
City.tools.proute=(p,r)=>{
  const sys=String(tt);if(!SYS[sys])return;
  if(rl&&rl.sys!==sys)rl=null;
  const s=nearStop(sys,r);if(!s)return;const id=s.id;
  if(!rl){rl={sys,s:[id],loop:false};return}
  if(id===rl.s[0]&&rl.s.length>2){rl.loop=true;endRoute();return}
  if(id!==rl.s[rl.s.length-1])rl.s.push(id);
};
function endRoute(){
  if(!rl)return;const a=rl;rl=null;
  if(a.s.length>1){
    const n=vrs().filter(R=>R.sys===a.sys).length+1,d0=depots().find(x=>kindOf(x)===a.sys);
    City.add('vroutes',{n:SYS[a.sys].n+' '+n,c:RC[vrs().length%6],sys:a.sys,s:a.s,loop:!!a.loop,d:d0?d0.id:null,cars:3,vars:[],veh:[]});
  }
  City.redraw();
}
City.HINT.pvar='Нажимайте остановки варианта по порядку. Первая остановка ещё раз — замкнуть кольцо. «Готово» — закончить.';
City.tools.pvar=(p,r)=>{
  if(!pv)return;const s=nearStop(pv.sys,r);if(!s)return;const id=s.id;
  if(pv.d.length>2&&id===pv.d[0]){pv.loop=true;pvdone();return}
  if(id!==pv.d[pv.d.length-1])pv.d.push(id);
};
function pvdone(){
  if(!pv)return;const R=pv.R,i=pv.i,ids=pv.d,lp=pv.loop;pv=null;
  if(ids.length>1){City.push();R.vars=R.vars||[];if(i>=0&&R.vars[i]){R.vars[i].s=ids;R.vars[i].loop=lp}else R.vars.push({n:'Вариант '+(R.vars.length+1),s:ids,loop:lp});City.changed()}
  setTool('select');City.select('vroutes',R);City.updateUI();City.redraw();pvR=R;vdRender();pvd.showModal();
}
$('#vrok').onclick=()=>{if(City.tool==='pvar')pvdone();else endRoute()};
$('#vrno').onclick=()=>{
  if(City.tool==='pvar'){const R=pv&&pv.R;pv=null;setTool('select');if(R){City.select('vroutes',R);City.updateUI()}}
  else{rl=null;City.redraw()}
};
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='Enter'){if(City.tool==='proute')endRoute();else if(City.tool==='pvar')pvdone()}
  if(e.key==='Escape'){rl=null}
});

/* ----- вариации маршрута ----- */
document.body.insertAdjacentHTML('beforeend','<dialog id="pvd"></dialog>');
const pvd=$('#pvd');
const names=ids=>ids.map(stopOf).filter(Boolean).map(s=>E(s.n)).join(' → ')||'—';
function vdRender(){
  const R=pvR,vs=R.vars||[];
  pvd.innerHTML='<h2>Вариации маршрута</h2><p>'+E(R.n)+'. Создайте варианты (короткий рейс, другой путь) и назначьте их машинам в карточке маршрута.</p><ul id="vl"><li><b>Основной</b><small>'+names(R.s)+'</small></li>'
  +vs.map((v,i)=>'<li><div class="row" style="flex-wrap:nowrap;justify-content:flex-start"><input data-vn="'+i+'" value="'+E(v.n)+'" style="margin:0"><button class="b danger" data-vdel2="'+i+'" aria-label="Удалить">✕</button></div><small>'+names(v.s)+(v.loop?' ↻':'')+'</small><button class="b" data-ved="'+i+'">Изменить остановки</button></li>').join('')
  +'</ul><div class="row"><button id="pvadd" class="b p">+ Новый вариант</button><button id="pvx" class="b">Закрыть</button></div>';
}
pvd.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!pvR)return;
  if(b.id==='pvx')pvd.close();
  else if(b.id==='pvadd'||b.dataset.ved!==undefined){pv={R:pvR,i:b.id==='pvadd'?-1:+b.dataset.ved,d:[],loop:false,sys:pvR.sys};pvd.close();setTool('pvar')}
  else if(b.dataset.vdel2!==undefined){
    const i=+b.dataset.vdel2;City.push();pvR.vars.splice(i,1);
    (pvR.veh||[]).forEach(x=>{const v=(x.v===undefined||x.v==='')?-1:+x.v;if(v===i)x.v='';else if(v>i)x.v=String(v-1)});
    City.changed();vdRender();
  }
});
pvd.addEventListener('change',e=>{const i=e.target.dataset.vn;if(i!==undefined&&pvR&&pvR.vars[+i]){City.push();pvR.vars[+i].n=e.target.value;City.changed()}});

/* ----- карточка маршрута ----- */
const stopList=(ids,c,loop)=>{
  const a=ids.map(stopOf).filter(Boolean);if(!a.length)return'<div class="mu">Нет остановок</div>';
  return '<div class="sl" style="--c:'+E(c)+'">'+a.map(s=>'<div class="si" data-pgs="'+s.id+'">'+E(s.n)+'</div>').join('')+(loop?'<div class="si lp" data-pgs="'+a[0].id+'">'+E(a[0].n)+' ↻</div>':'')+'</div>';
};
const fmtLen=m=>m<1000?Math.round(m)+' м':(m/1000).toFixed(2).replace('.',',')+' км';
City.register({key:'vroutes',label:'Маршрут',
  hit:(p,r)=>vrs().find(R=>{const T=tripsFor(R,{});return T&&T.F&&T.F.pts.slice(1).some((q,i)=>dseg(p,T.F.pts[i],q)<r+3)}),
  inspector:o=>{
    const k=o.sys,S0=SYS[k],d=dep(o.d),cat=catalog(k),vs=o.vars||[],T0=tripsFor(o,{});
    const dl=depots().filter(x=>kindOf(x)===k);
    let h='<div style="font-size:13px;color:var(--mut)">'+S0.n+'<br>Длина: <b style="color:var(--ink)">'+fmtLen(T0&&T0.F?T0.F.L*mpu():0)+'</b>'+(o.loop?', кольцо':'')+'</div>';
    if(!(T0&&T0.F))h+='<div class="wn">Нет пути: остановки должны стоять у '+S0.tl+', а дороги — быть соединены (учтите направление на односторонних).</div>';
    h+='<label>'+KD[k].n+'<select id="f-dp"><option value="">Не выбран</option>'+dl.map(x=>'<option value="'+x.id+'"'+(o.d===x.id?' selected':'')+'>'+E(x.n)+'</option>').join('')+'</select></label>';
    if(!dl.length)h+='<div class="wn">Постройте '+KD[k].n+' (раздел «Транспорт»).</div>';
    h+='<label>Цвет линии'+sw(RC,o.c)+'</label><label>Остановки</label>'+stopList(o.s,o.c,o.loop);
    h+=vs.map(v=>'<details><summary>'+E(v.n)+'</summary>'+stopList(v.s,o.c,v.loop)+'</details>').join('');
    h+='<button class="b" data-vopen="1">Вариации маршрута'+(vs.length?' ('+vs.length+')':'')+'</button>';
    if(k==='tram')h+='<label>Секций в составе (3–6)<input type="number" min="3" max="6" data-f="cars" value="'+nSec(o)+'"></label>';
    h+='<label>Транспорт на маршруте</label>';
    (o.veh||[]).forEach((b,i)=>{
      const ms=cat.filter(x=>x.m===b.m||(d&&owned(d,x.m)>0));
      h+='<div style="display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)"><div class="row" style="justify-content:flex-start;align-items:center;flex-wrap:nowrap"><select data-vi="'+i+'" data-vf="m" style="flex:1;margin:0">'+ms.map(x=>'<option value="'+E(x.m)+'"'+(x.m===b.m?' selected':'')+'>'+E(x.m)+(d?' · свободно '+Math.max(0,free(d,x.m,b)):'')+'</option>').join('')+'</select>'
      +'<input type="color" data-vi="'+i+'" data-vf="c" value="'+(b.c||S0.dc)+'" style="width:44px;margin:0;padding:2px"><button class="b danger" data-vdel="'+i+'" aria-label="Убрать">✕</button></div>'
      +'<label style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)">Цвет табло<input type="color" data-vi="'+i+'" data-vf="tc" value="'+(b.tc||City.tabloColor||'#ffb21a')+'" style="width:44px;margin:0;padding:2px"></label>'
      +(vs.length?'<select data-vi="'+i+'" data-vf="v" style="margin:0"><option value="">Основной маршрут</option>'+vs.map((v,j)=>'<option value="'+j+'"'+(vidx(o,b)===j?' selected':'')+'>'+E(v.n)+'</option>').join('')+'</select>':'')
      +'<input data-vi="'+i+'" data-vf="dep" value="'+E(b.dep||'')+'" placeholder="Выезд: 07:00, 07:30 (пусто — ездит постоянно)" style="margin:0"></div>';
    });
    if(!d)h+='<div class="wn">Выберите '+KD[k].n+' для маршрута</div>';
    else{
      cat.forEach(x=>{if(used(d,x.m)>owned(d,x.m))h+='<div class="wn">У вас отсутствует транспорт в '+KD[k].n+': '+E(x.m)+'</div>'});
      if(!cat.some(x=>free(d,x.m)>0))h+=(h.indexOf('отсутствует транспорт')<0?'<div class="wn">У вас отсутствует транспорт в '+KD[k].n+'</div>':'')+'<button class="b p" data-buy="'+d.id+'">Закупить</button>';
      else h+='<button class="b" data-vadd="1">+ Добавить '+(k==='tram'?'трамвай':'троллейбус')+'</button>';
    }
    return h;
  }});
function addVeh(R){
  const d=dep(R.d);if(!d){say('Выберите '+KD[R.sys].n+' для маршрута');return}
  const it=catalog(R.sys).find(x=>free(d,x.m)>0);
  if(!it){say('У вас отсутствует транспорт в '+KD[R.sys].n);City.updateUI();return}
  City.push();R.veh=R.veh||[];R.veh.push({m:it.m,c:SYS[R.sys].dc,tc:'',dep:'',v:''});City.changed();City.updateUI();
}

/* ----- уборка после удаления остановок и АТП ----- */
let cleaning=false;
City.on('change',()=>{
  if(cleaning)return;const S=City.S;if(!S.vroutes)return;
  const ids=new Set((S.pstops||[]).map(s=>s.id));let ch=false;
  S.vroutes.forEach(R=>{
    const n=R.s.filter(id=>ids.has(id));if(n.length!==R.s.length){R.s=n;ch=true}
    (R.vars||[]).forEach(v=>{const m=v.s.filter(id=>ids.has(id));if(m.length!==v.s.length){v.s=m;ch=true}});
    if(R.d!==null&&R.d!==undefined&&!dep(R.d)){R.d=null;ch=true}
  });
  const keep=S.vroutes.filter(R=>R.s.length>1);if(keep.length!==S.vroutes.length){S.vroutes=keep;ch=true}
  if(ch){if(sel&&sel.k==='vroutes'&&!S.vroutes.includes(sel.o)){sel=null;City.updateUI()}cleaning=true;City.changed();cleaning=false}
});
uiMoney();City.redraw();

<script>
(function(){
const E=City.esc;
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const mpu=()=>((City.S.scale||50)/50);
const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a);
const cen=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
const slug=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_+|_+$/g,'');
const p2=n=>String(Math.floor(n)).padStart(2,'0');
const fmt=g=>{const d=new Date(Date.UTC(2025,0,1)+g*60000);
  return d.toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}).replace(' г.','')+' в '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};

/* ================= ЖИТЕЛИ ================= */
const M1=['Антон','Дмитрий','Иван','Сергей','Алексей','Михаил','Николай','Артём','Павел','Георгий','Тимур','Роман'];
const MS=['Чехов','Петров','Смирнов','Кузнецов','Волков','Орлов','Морозов','Соколов','Лебедев','Ким','Новиков','Фёдоров'];
const F1=['Алиса','Марина','Ольга','Анна','Екатерина','Дарья','Ирина','Софья','Полина','Елена','Наталья','Вера'];
const FS=['Петрова','Ким','Смирнова','Кузнецова','Волкова','Орлова','Морозова','Соколова','Лебедева','Новикова','Фёдорова','Чехова'];
function author(){
  const f=Math.random()<.5,n=f?pick(F1)+' '+pick(FS):pick(M1)+' '+pick(MS);
  let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;
  return{a:n,c:'hsl('+(h%360)+',52%,46%)'};
}

/* ================= ДАННЫЕ ГОРОДА ================= */
const houses=()=>City.S.blds.filter(b=>b.t==='house').map(b=>({b,x:b.x+b.w/2,y:b.y+b.h/2}));
const allStops=()=>(City.S.stops||[]).concat(City.S.pstops||[]);
const routeNum=n=>{const m=/^(\d+[A-Za-zА-Яа-я]?)/.exec(String(n||'').trim());return m?m[1].toLowerCase():''};
const SV={
 fire:[['В нашем районе нет пожарной части — страшно жить.','В случае пожара до нас никто не доедет: рядом нет пожарной части.'],['пожарные','безопасность']],
 police:[['По ночам во дворе шумят, а полиции поблизости нет.','Нужен полицейский участок рядом с нашими домами.'],['полиция','безопасность']],
 amb:[['Скорая будет ехать к нам вечность — рядом нет станции скорой помощи.','Бабушке стало плохо, а скорой поблизости нет...'],['скорая','помощь']],
 garbage:[['Мусор во дворе не вывозят, контейнеры переполнены.','У нас возле дома горы мусора. Где вывоз?'],['мусор','двор']],
 morgue:[['В районе не хватает службы вывоза тел, это тяжело.','Нужна служба вывоза тел рядом с жилыми кварталами.'],['служба','город']],
 gas:[['Газовой службы рядом нет — если что, никто не придёт.','Пахнет газом, а аварийной службы поблизости нет.'],['газ','безопасность']]
};
const RS=260;

/* ================= ГЕНЕРАТОРЫ СООБЩЕНИЙ ================= */
function gDist(){
  const D=(City.S.dists||[]).filter(d=>d.n&&d.pts);if(!D.length)return null;
  const d=pick(D),c=cen(d.pts),n=d.n;
  return{t:pick(['Наш район «'+n+'» — самый лучший!','В районе «'+n+'» живётся отлично, никуда не уеду.','Район «'+n+'» — лучшее, что случалось со мной!','Вечером в районе «'+n+'» так уютно!']),
    tg:['район',slug(n),pick(['ура','люблю_свой_район','лучшие_соседи'])],x:c[0],y:c[1]};
}
function gBus(){
  const S=City.S,st=S.stops||[];if(st.length<2)return null;
  const used=new Set((S.routes||[]).map(r=>routeNum(r.n)));
  let a,b,ok=false;
  for(let i=0;i<30&&!ok;i++){
    a=pick(st);b=pick(st);if(a===b)continue;
    if(dst([a.x,a.y],[b.x,b.y])<120)continue;
    if((S.routes||[]).some(R=>R.s.includes(a.id)&&R.s.includes(b.id)))continue;
    ok=true;
  }
  if(!ok)return null;
  let num='';
  for(let i=0;i<20;i++){num=String(1+Math.floor(Math.random()*99))+(Math.random()<.25?pick(['а','б','в']):'');if(!used.has(num))break}
  return{t:pick(['Предлагаю','Хочу предложить','Прошу рассмотреть'])+' сделать автобусный маршрут №'+num+', начальная остановка: '+a.n+', конечная остановка: '+b.n+'.',
    tg:['автобус','маршрут',num],x:a.x,y:a.y};
}
function gTraffic(){
  const KM=window.KMX||[25,35,45,55],agg=new Map();
  (City.vis?City.vis():[]).forEach(q=>{
    if(q.k!=='car')return;const c=q.ref,R=c.R;if(!R||!R.n)return;
    let a=agg.get(R);if(!a){a={n:0,s:0,x:q.x,y:q.y};agg.set(R,a)}
    a.n++;const vm=KM[R.t]*(c.vf||1)/3.6*4/mpu();if(c.v<vm*.3){a.s++;a.x=q.x;a.y=q.y}
  });
  const bad=[...agg.entries()].filter(([R,a])=>a.n>=3&&a.s/a.n>=.5);if(!bad.length)return null;
  const[R,a]=pick(bad);
  return{t:pick(['Невыносимо стоять в пробках на улице «'+R.n+'»','Опять пробка на «'+R.n+'». Когда это закончится?','Утро на «'+R.n+'» — сплошная стоянка.']),
    tg:['трафик',pick(['опять_красный','пробки','час_пик']),'решите'],x:a.x,y:a.y};
}
function gSvc(){
  const hs=houses(),sv=City.S.svc||[];if(!hs.length)return null;
  const unc=t=>hs.filter(h=>!sv.some(s=>s.t===t&&dst([s.x,s.y],[h.x,h.y])<RS));
  const miss=Object.keys(SV).filter(t=>unc(t).length);if(!miss.length)return null;
  const t=pick(miss),h=pick(unc(t));
  let tx=pick(SV[t][0]);
  if(t==='garbage'&&h.b.nd&&h.b.nd.garbage>100)tx='Мусор у нашего дома вывозить некому, уже выше крыльца!';
  return{t:tx,tg:SV[t][1].slice(),x:h.x,y:h.y};
}
function gEdu(){
  const S=City.S,hs=houses();if(!hs.length)return null;const h=pick(hs),has=t=>S.blds.some(b=>b.t===t);
  if(!has('school'))return{t:pick(['Куда отдавать детей в школу? В городе нет ни одной школы.','Нужна школа рядом с домом, детям далеко ходить.']),tg:['школа','дети'],x:h.x,y:h.y};
  if(!has('kinder'))return{t:'Хочется детский сад поближе — в городе их нет.',tg:['детский_сад','дети'],x:h.x,y:h.y};
  return null;
}
function gCrowd(){
  const L=allStops().filter(s=>(s.w||0)>=25);if(!L.length)return null;const s=pick(L);
  return{t:'На остановке «'+s.n+'» уже '+Math.floor(s.w)+' человек, а транспорта всё нет.',tg:['остановка','транспорт','долго_ждать'],x:s.x,y:s.y};
}
function gNoStop(){
  const hs=houses();if(!hs.length)return null;const st=allStops(),h=pick(hs);
  if(!st.length)return{t:'В городе нет ни одной остановки! Как добираться на работу?',tg:['остановка','транспорт','помогите'],x:h.x,y:h.y};
  const d=Math.min(...st.map(s=>dst([s.x,s.y],[h.x,h.y])));
  if(d<350)return null;
  return{t:'От моего дома до ближайшей остановки идти больше '+Math.round(d*mpu()/10)*10+' м. Сделайте остановку ближе!',tg:['остановка','далеко','решите'],x:h.x,y:h.y};
}
function gGood(){
  const S=City.S,o=[];
  S.blds.filter(b=>b.t==='park').forEach(b=>{const c=b.pts?cen(b.pts):[b.x+b.w/2,b.y+b.h/2];o.push({t:'Прогулялись по парку'+(b.n?' «'+b.n+'»':'')+' — красота!',tg:['парк','отдых'],x:c[0],y:c[1]})});
  (S.lms||[]).forEach(l=>o.push({t:'Сводил детей в «'+l.n+'» — впечатления отличные!',tg:['достопримечательность',slug(l.n)],x:l.x,y:l.y}));
  (S.rstops||[]).forEach(s=>o.push({t:s.sys==='metro'?'Метро — это удобно! Спасибо за станцию «'+s.n+'».':'На поезде от «'+s.n+'» ехать одно удовольствие.',tg:[s.sys==='metro'?'метро':'поезд','спасибо'],x:s.x,y:s.y}));
  (S.airports||[]).forEach(a=>{if(a.pts&&a.n){const c=cen(a.pts);o.push({t:'Из аэропорта «'+a.n+'» вылетели вовремя, молодцы!',tg:['аэропорт','путешествия'],x:c[0],y:c[1]})}});
  (S.ports||[]).forEach(p=>o.push({t:'Порт «'+p.n+'» оживил город — вокруг столько работы!',tg:['порт','работа'],x:p.x,y:p.y}));
  (S.routes||[]).forEach(R=>{const n=routeNum(R.n);if(n&&(R.buses||[]).length){const s=(S.stops||[]).find(x=>x.id===R.s[0]);o.push({t:'Автобус №'+n+' сегодня приехал вовремя. Спасибо!',tg:['автобус','спасибо',n],x:s?s.x:undefined,y:s?s.y:undefined})}});
  return o.length?pick(o):null;
}
function gTax(){
  const t=City.S.tax;
  if(typeof t!=='number')return null;
  if(t>=18)return{t:'Налог '+t+'% — это слишком много, людям нечем платить!',tg:['налоги','дорого']};
  if(t<=4)return{t:'Налог всего '+t+'% — отличный город для бизнеса, открываю своё дело!',tg:['налоги','бизнес']};
  return null;
}
function gWx(){
  const w=City.S.wx&&City.S.wx.t,M={rain:['Опять дождь, зонт не спасает.',['погода','дождь']],snow:['Снег пошёл — красота, но дороги бы почистить.',['погода','снег']],
    hail:['Град бьёт по крышам и машинам! Укрыться негде.',['погода','град']],blizz:['Метель — на улицу не выйти.',['погода','метель']],fog:['Туман такой, что дороги не видно.',['погода','туман']],storm:['Гроза гремит так, что окна дрожат.',['погода','гроза']]};
  return M[w]?{t:M[w][0],tg:M[w][1]}:null;
}
function gWar(){
  const W=City.S.wars||[],C=City.S.countries||[];if(!W.length)return null;
  const w=pick(W),A=C.find(c=>c.id===w.a),B=C.find(c=>c.id===w.b);if(!A||!B)return null;
  return{t:w.civil?'В «'+A.n+'» идёт гражданская война. Страшно...':'Говорят, «'+A.n+'» воюет с «'+B.n+'». Тревожно...',tg:['война','тревожно']};
}
const GEN=[[3,gDist],[2,gBus],[3,gTraffic],[3,gSvc],[1.5,gEdu],[2,gCrowd],[1,gNoStop],[2.5,gGood],[1,gTax],[1,gWx],[.8,gWar]];
function make(){
  const chat=City.S.chat||[],recent=chat.slice(-14).map(m=>m.t),tot=GEN.reduce((s,g)=>s+g[0],0);
  for(let i=0;i<14;i++){
    let r=Math.random()*tot,f=GEN[0][1];for(const g of GEN){r-=g[0];if(r<=0){f=g[1];break}}
    let m=null;try{m=f()}catch(e){console.error(e)}
    if(m&&!recent.includes(m.t))return m;
  }
  return null;
}
function post(m){
  const S=City.S;S.chat=S.chat||[];S.chatN=(S.chatN||0)+1;
  const a=author();
  S.chat.push({id:S.chatN,a:a.a,c:a.c,g:City.gm?City.gm():0,t:m.t,tg:m.tg||[],x:m.x,y:m.y});
  while(S.chat.length>100)S.chat.shift();
  dirtyS=true;
}

/* ================= ИНТЕРФЕЙС ================= */
$('#wrap').insertAdjacentHTML('beforeend','<div id="chb" class="fl"><button class="b" id="chb-b" aria-label="Чат жителей">💬</button><span id="chn" hidden></span></div>'
 +'<div id="chp" class="fl" hidden><div class="ch-h"><b>Жители города</b><span id="ch-c"></span><button class="b" id="ch-x" aria-label="Закрыть">✕</button></div><div id="ch-l"></div></div>');
let open=false,sig='',sigS=null,dirtyS=false,nextAt=null,pulse=null;
const lastId=S=>(S.chat&&S.chat.length)?S.chat[S.chat.length-1].id:0;
function render(force){
  const S=City.S,L=S.chat||[],s=L.length+':'+lastId(S);
  if(!force&&s===sig&&sigS===S)return;sig=s;sigS=S;
  const el=$('#ch-l'),near=force||el.scrollHeight-el.scrollTop-el.clientHeight<90;
  $('#ch-c').textContent=L.length?'сообщений: '+L.length:'';
  el.innerHTML=L.length?L.map(m=>'<div class="cm" data-id="'+m.id+'"><div class="cav" style="background:'+E(m.c)+'">'+E(m.a.charAt(0))+'</div><div><div class="cn">'+E(m.a)+'<span class="cd">, '+fmt(m.g)+'</span></div><div class="cb">'+E(m.t)
    +(m.tg&&m.tg.length?'<span class="ct">'+m.tg.map(t=>'#'+E(t)).join(', ')+'</span>':'')+'</div></div></div>').join('')
    :'<div class="cmt">Пока тихо. Жители скоро заговорят…</div>';
  if(near)el.scrollTop=el.scrollHeight;
}
function badge(){
  const S=City.S,n=open?0:(S.chat||[]).filter(m=>m.id>(S.chatSeen||0)).length,b=$('#chn');
  b.hidden=!n;b.textContent=n>99?'99+':n;
}
function setOpen(v){
  open=v;$('#chp').hidden=!v;$('#chb-b').classList.toggle('on',v);
  if(v){City.S.chatSeen=lastId(City.S);render(true)}
  badge();
}
$('#chb-b').onclick=()=>setOpen(!open);
$('#ch-x').onclick=()=>setOpen(false);
$('#ch-l').addEventListener('click',e=>{
  const el=e.target.closest('[data-id]');if(!el)return;
  const m=(City.S.chat||[]).find(x=>x.id===+el.dataset.id);if(!m||m.x===undefined)return;
  if(City.follow&&City.follow()){const fx=$('#fol-x');if(fx)fx.click()}
  V.k=Math.max(V.k,.8);V.x=cv.clientWidth/2-V.k*m.x;V.y=cv.clientHeight/2-V.k*m.y;
  pulse={x:m.x,y:m.y,until:Date.now()+3500};dirty=true;
  if(matchMedia('(max-width:760px)').matches)setOpen(false);
});
City.layers.over.push(c=>{
  if(!pulse)return;const t=Date.now();if(t>pulse.until){pulse=null;return}
  const k=City.view.k,a=(pulse.until-t)/3500;
  c.beginPath();c.arc(pulse.x,pulse.y,(18+(1-a)*34)/k,0,7);c.lineWidth=3/k;c.strokeStyle='rgba(215,38,61,'+(.3+.7*a)+')';c.stroke();
  c.beginPath();c.arc(pulse.x,pulse.y,5/k,0,7);c.fillStyle='#d7263d';c.fill();
});

/* ================= ЦИКЛ: новые сообщения по игровому времени ================= */
setInterval(()=>{
  try{
    if(!City.gm)return;
    const S=City.S,gm=City.gm();
    if(typeof S.chatSeen!=='number')S.chatSeen=lastId(S);
    if(nextAt===null||Math.abs(gm-nextAt)>120)nextAt=gm+rnd(1.5,4);
    if(gm>=nextAt&&City.totalPop&&City.totalPop()>0){
      nextAt=gm+rnd(3,8);
      const m=make();if(m)post(m);
    }
    if(open){if(lastId(S)>S.chatSeen)S.chatSeen=lastId(S);render()}
    badge();
    if(pulse)City.redraw();
  }catch(e){console.error(e)}
},1000);
setInterval(()=>{if(dirtyS){dirtyS=false;try{save()}catch(e){}}},10000);
addEventListener('pagehide',()=>{if(dirtyS){try{save()}catch(e){}}});
render(true);badge();
})();
</script>
<script>
/* Плагин: номер маршрута, начальная и конечная остановка — отдельные поля.
   Внутри название по-прежнему хранится строкой «1а Начальная — Конечная» (табло, легенда и 3D работают как раньше). */
(function(){
const E=City.esc;
const split=o=>{
  if(o.num!==undefined||o.from!==undefined||o.to!==undefined)return{num:o.num||'',from:o.from||'',to:o.to||''};
  const s=String(o.n||'').replace(/\s*\(кольцо\)\s*$/,'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s+(.*)$/.exec(s)||/^(\d+[A-Za-zА-Яа-я]?)$/.exec(s);
  const num=m?m[1]:'',rest=m?(m[2]||''):s,p=rest.split(/\s*[—–]\s*/);
  return{num,from:p[0]||'',to:p[1]||''};
};
const comp=x=>[x.num,x.from].filter(Boolean).join(' ')+(x.to?' — '+x.to:'');
function form(o,k){
  const S=City.S,x=split(o);
  const list=k==='vroutes'?(S.pstops||[]).filter(s=>s.sys===o.sys):(S.stops||[]);
  const ids=o.s||[],sb=id=>list.find(s=>s.id===id),f=sb(ids[0]),l=sb(ids[ids.length-1]);
  const inp=(key,lab,ph,dl)=>'<label>'+lab+'<input data-rn="'+key+'" value="'+E(x[key])+'" placeholder="'+E(ph)+'"'+(dl?' list="rn-dl"':'')+' autocomplete="off"></label>';
  return '<style>#insp label:has(#f-n){display:none}</style><datalist id="rn-dl">'+list.map(s=>'<option value="'+E(s.n)+'">').join('')+'</datalist>'
    +inp('num','Номер маршрута','например 1а',0)
    +inp('from','Начальная остановка',f?f.n:'Начальная остановка',1)
    +inp('to','Конечная остановка',l?l.n:'Конечная остановка',1);
}
['routes','vroutes'].forEach(k=>{
  const prev=City.insp[k];
  City.insp[k]=o=>form(o,k)+(prev?prev(o):'');
});
const I=$('#insp');
I.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.rn)City.push()});
I.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.rn,s=City.sel;
  if(!f||!s||(s.k!=='routes'&&s.k!=='vroutes'))return;
  const o=s.o,x=split(o);x[f]=e.target.value;
  o.num=x.num;o.from=x.from;o.to=x.to;o.n=comp(x);City.changed();
});
I.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.rn)e.stopImmediatePropagation()},true);
})();
</script>

<script>
(function(){
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const S=()=>City.S;

/* ---------- линии трамвайных и троллейбусных маршрутов по чипам ---------- */
let rs=new Set();
setInterval(()=>{try{rs=new Set(JSON.parse(LS('ui:routes')||'[]'))}catch(e){}},300);
City.layers.over.unshift(()=>{
  if(!City.vTrips)return;
  (S().vroutes||[]).forEach(R=>{
    if(!rs.has(R.sys))return;const T=City.vTrips(R);if(!T||!T.F)return;
    line(T.F.pts,9,City.P().wh);line(T.F.pts,5.5,R.c);
  });
});

/* ---------- проверки шагов ---------- */
const rn=/^(Дорога|Улица|Аллея|Проспект|Шоссе) \d+$/;
function joined(){
  const R=S().roads,sg=[];
  R.forEach((r,i)=>{for(let k=1;k<r.pts.length;k++)sg.push([r.pts[k-1],r.pts[k],i])});
  for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++){
    const a=sg[i],b=sg[j];if(a[2]===b[2])continue;
    const r=[a[1][0]-a[0][0],a[1][1]-a[0][1]],q=[b[1][0]-b[0][0],b[1][1]-b[0][1]],den=r[0]*q[1]-r[1]*q[0];
    if(Math.abs(den)<1e-9)continue;
    const w=[b[0][0]-a[0][0],b[0][1]-a[0][1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den;
    if(t>=-1e-6&&t<=1+1e-6&&v>=-1e-6&&v<=1+1e-6)return true;
  }
  return R.some((r,i)=>[r.pts[0],r.pts[r.pts.length-1]].some(e=>sg.some(s=>s[2]!==i&&dseg(e,s[0],s[1])<4)));
}
const busDep=d=>!d.k||d.k==='bus';
const ST=[

<script>
/* Плагин: «Рекомендуемый маршрут» (автобус, трамвай, троллейбус).
   Нажмите начальную и конечную остановку — маршрут пройдёт по дорогам и захватит все остановки по пути. */
(function(){
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const say=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>e.hidden=true,3200)};
const THR=28;                       /* насколько далеко от пути может стоять остановка, чтобы войти в маршрут */
const stopsOf=sys=>sys==='bus'?City.S.stops:(City.S.pstops||[]).filter(s=>s.sys===sys);
let rc=null;

/* положение точки вдоль ломаной */
function along(pts,p){
  let acc=0,best={d:0,off:1e18};
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy,L=Math.sqrt(l2);
    let t=l2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2:0;t=Math.max(0,Math.min(1,t));
    const off=Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);
    if(off<best.off)best={d:acc+t*L,off};
    acc+=L;
  }
  return{d:best.d,off:best.off,L:acc};
}
/* путь по дорогам (или по путям трамвая/троллейбуса) между двумя остановками */
function roadPath(sys,a,b){
  if(sys==='bus'){
    const base=R=>R.s.map(i=>City.S.stops.find(s=>s.id===i)).filter(Boolean).map(s=>[s.x,s.y]);
    return City.path?City.path({s:[a.id,b.id],loop:false},base):null;
  }
  const T=City.vTrips&&City.vTrips({sys,s:[a.id,b.id],loop:false});
  return T&&T.F?T.F.pts:null;
}
/* список остановок: начальная → все по пути (по порядку) → конечная */
function build(sys,a,b){
  const pts=roadPath(sys,a,b);
  if(!pts||pts.length<(sys==='bus'?3:2))return null;
  const mid=[];
  stopsOf(sys).forEach(s=>{
    if(s===a||s===b)return;
    const r=along(pts,[s.x,s.y]);
    if(r.off<=THR&&r.d>4&&r.d<r.L-4)mid.push({id:s.id,d:r.d});
  });
  mid.sort((x,y)=>x.d-y.d);
  return [a.id].concat(mid.map(m=>m.id),[b.id]);
}
function create(sys,ids){
  const S=City.S,nm=id=>(stopsOf(sys).find(s=>s.id===id)||{}).n||'';
  const f=nm(ids[0]),l=nm(ids[ids.length-1]);
  if(sys==='bus'){
    const d=S.depots.find(x=>!x.k||x.k==='bus');
    City.add('routes',{n:(S.routes.length+1)+' '+f+' — '+l,c:RC[S.routes.length%6],s:ids,loop:false,d:d?d.id:null});
  }else{
    S.vroutes=S.vroutes||[];
    const n=S.vroutes.filter(R=>R.sys===sys).length+1,d=S.depots.find(x=>x.k===sys);
    City.add('vroutes',{n:n+' '+f+' — '+l,c:RC[S.vroutes.length%6],sys,s:ids,loop:false,d:d?d.id:null,cars:3,vars:[],veh:[]});
  }
  say('Маршрут создан. Остановок: '+ids.length);
}

/* инструмент */
City.HINT.rec='Нажмите начальную остановку, затем конечную — маршрут составится сам и захватит все остановки по пути.';
City.tools.rec=(p,r)=>{
  const sys=String(tt),k=City.view.k;let best=null;
  stopsOf(sys).forEach(s=>{const d=dst([s.x,s.y],r);if(d<22/k&&(!best||d<best.d))best={d,s}});
  if(!best){say('Нажмите на остановку');return}
  if(!rc||rc.sys!==sys){rc={sys,a:best.s};return}
  if(best.s===rc.a)return;
  const a=rc.a;rc=null;
  const ids=build(sys,a,best.s);
  if(!ids)say(sys==='bus'?'Между остановками нет пути по дорогам':'Между остановками нет пути: проверьте линию и направление');
  else create(sys,ids);
};
City.addLeaf('Транспорт/Автобусный транспорт',['Рекомендуемый маршрут','rec','bus','#f5a623']);
City.addLeaf('Транспорт/Трамвай',['Рекомендуемый маршрут','rec','tram','#f5a623']);
City.addLeaf('Транспорт/Троллейбус',['Рекомендуемый маршрут','rec','trol','#f5a623']);

/* панель и подсветка */
$('#wrap').insertAdjacentHTML('beforeend','<div id="rcb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:6"><span id="rct"></span><button id="rcx" class="b">Отмена</button></div>');

City.layers.over.push((c,P)=>{
  const on=City.tool==='rec',k=City.view.k,u=1/k;
  $('#rcb').hidden=!on;
  if(!on){rc=null;return}
  const sys=String(tt);
  if(rc&&rc.sys!==sys)rc=null;
  $('#rct').textContent=rc?'Начальная: '+rc.a.n+'. Выберите конечную остановку':'Выберите начальную остановку';
  stopsOf(sys).forEach(s=>{c.beginPath();c.arc(s.x,s.y,14*Math.max(1,.55/k),0,7);c.lineWidth=2*u;c.strokeStyle='#f5a623';c.setLineDash([5*u,4*u]);c.stroke();c.setLineDash([])});
  if(rc){
    c.beginPath();c.arc(rc.a.x,rc.a.y,18*Math.max(1,.55/k),0,7);c.lineWidth=4*u;c.strokeStyle='#0c8a86';c.stroke();
    line([[rc.a.x,rc.a.y],mouse],3,'#0c8a86',[8,6]);
  }
});
})();
</script>

     Вставить В САМЫЙ КОНЕЦ, перед </body>. Нужны 3 правки основного кода (см. сообщение). ===== -->

<script>
(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mpu=()=>((City.S.scale||50)/50);
const E=City.esc;

/* ================= ВРЕМЯ СУТОК ================= */
const LV=['Очень мало','Средний','Очень много'];
const CARM=[.15,1,1.8];            /* множитель числа машин: ночь / средне / час пик */
const STOPM=[.08,.85,1.7];         /* множитель потока людей на остановках */
function level(){
  const m=(((City.gm?City.gm():360)%1440)+1440)%1440;
  if(m>=1405||m<420)return 0;      /* 23:25 – 7:00 */
  if(m<445)return 1;               /* 7:00 – 7:25 */
  if(m<600)return 2;               /* 7:25 – 10:00 */
  if(m<800)return 1;               /* 10:00 – 13:20 */
  if(m<1200)return 2;              /* 13:20 – 20:00 */
  return 1;                        /* 20:00 – 23:25 */
}
window.TRAF={level,mult:()=>CARM[level()]};

/* при смене уровня просим машины пересчитаться */
let lastL=null;
function panel(){
  const sec=[...document.querySelectorAll('#info .sec')].find(d=>d.firstElementChild&&d.firstElementChild.textContent.trim()==='Трафик');
  if(!sec)return;
  let el=document.getElementById('tf-now');
  if(!el){el=document.createElement('div');el.id='tf-now';sec.querySelector('.sb').appendChild(el)}
  const l=level(),m=Math.floor((City.gm?City.gm():0)%1440);
  const h=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const t='Сейчас '+h+': <b>'+LV[l]+'</b> поток';
  if(el._t!==t){el._t=t;el.innerHTML=t}
}
setInterval(()=>{try{
  const l=level();
  if(l!==lastL){lastL=l;City.emit('change')}
  panel();
}catch(e){console.error(e)}},1000);

/* ================= СПРОС НА ОСТАНОВКАХ ================= */
/* вес объекта = человек в час (в обычное время) при нулевом расстоянии */
const WT={shop:60,office:50,industry:45,terminal:150,kinder:18,school:35,college:55,univ:90,park:25};
const AREAS={shop:1,office:1,industry:1,terminal:1,park:1};   /* вес растёт с площадью */
const RK={station:70,end:80,vokzal:130,halt:30};
const ZW={c:2.5,o:3,i:2};          /* вес клетки зоны (жилая считается как жители) */
const TC=10;
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
const bA=b=>b.pts?area(b.pts):b.w*b.h;
const hw=b=>(b.pop===undefined||b.pop==='')?Math.max(1,Math.round(bA(b)*mpu()*mpu()/25)):Math.max(0,+b.pop||0);
const cenP=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
const AC=new WeakMap();let ver=0;City.on('change',()=>ver++);
function attr(s){
  const c=AC.get(s),now=performance.now();
  if(c&&c.v===ver&&now-c.t<2500)return c.val;
  const S=City.S,R=clamp(250/mpu(),60,450);let sum=0,res=0;
  S.blds.forEach(b=>{
    const dx=Math.max(b.x-s.x,0,s.x-(b.x+b.w)),dy=Math.max(b.y-s.y,0,s.y-(b.y+b.h)),d=Math.hypot(dx,dy);
    if(d>=R)return;const f=1-d/R;
    if(b.t==='house'){res+=hw(b)*f;return}
    const w=WT[b.t];if(!w)return;
    const sc=AREAS[b.t]?clamp(Math.sqrt(bA(b)*mpu()*mpu()/3000),.6,3):1;
    sum+=w*sc*f;
  });
  const Z=S.zones,gt=City.game?City.game.day:0;
  if(Z){
    const rc=Math.ceil(R/TC),ci=Math.floor(s.x/TC),cj=Math.floor(s.y/TC);
    for(let j=cj-rc;j<=cj+rc;j++)for(let i=ci-rc;i<=ci+rc;i++){
      const d=Math.hypot((i+.5)*TC-s.x,(j+.5)*TC-s.y);if(d>=R)continue;
      const z=Z[(i>>5)+','+(j>>5)];if(!z)continue;
      const n=((j&31)<<5)|(i&31),t=z.t.charAt(n);if(t===' ')continue;
      const f=clamp((gt-(z.d.charCodeAt(n)-256))/6,0,1)*(1-d/R);
      if(t==='r')res+=4*f;else if(ZW[t])sum+=ZW[t]*f;
    }
  }
  (S.lms||[]).forEach(l=>{const d=Math.hypot(l.x-s.x,l.y-s.y);if(d<R)sum+=120*(1-d/R)});
  (S.ports||[]).forEach(p=>{const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<R)sum+=60*(1-d/R)});
  (S.rstops||[]).forEach(p=>{const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<R)sum+=(RK[p.k]||50)*(1-d/R)});
  (S.airports||[]).forEach(a=>{if(!a.pts)return;const c=cenP(a.pts),d=Math.hypot(c[0]-s.x,c[1]-s.y);if(d<R*1.5)sum+=100*(1-d/(R*1.5))});
  let fd=1;
  (S.dists||[]).forEach(d=>{if(d.pts&&inPoly([s.x,s.y],d.pts))fd=clamp(.7+Math.sqrt((d.pop||0)/4000)*.6,.7,1.8)});
  const val=(res*.06+sum)*fd;
  AC.set(s,{v:ver,t:now,val});return val;
}

function route(a,b){

}
function forceRoad(){

const OFF={police:[16,-12],amb:[-16,12],fire:[2,24]};
function stationFor(t,inc){
  const L=(City.S.svc||[]).filter(s=>s.t===t);if(!L.length)return'none';
  L.sort((a,b)=>dst([a.x,a.y],[inc.x,inc.y])-dst([b.x,b.y],[inc.x,inc.y]));
  return L.find(s=>(busy.get(s)||0)<CFG.STN_CAP)||'busy';
}
function launch(inc,j,stn){
  busy.set(stn,(busy.get(stn)||0)+1);
  const o=OFF[j.t],k=j.idx||0,tg=[inc.x+o[0]+k*12,inc.y+o[1]+k*8],pts=route([stn.x,stn.y],tg),cum=cumOf(pts);
  const un={inc,j,t:j.t,stn,pts,cum,L:cum[cum.length-1],d:0,phase:'go',x:stn.x,y:stn.y,an:0};
  j.unit=un;j.st='go';UN.push(un);
}
function unitStep(un,dt,g){
  const spd=CFG.SPEED[un.t]/3.6*4/mpu();
  if(un.phase==='go'){
    un.d=Math.min(un.L,un.d+spd*dt);const q=alongP(un.pts,un.cum,un.d);un.x=q.x;un.y=q.y;un.an=q.an;
    if(un.d>=un.L){const j=un.j,r=(WT[un.inc.kind]||WT.road)[un.t];un.phase='work';j.st='work';j.wEnd=g+rnd(r[0],r[1]);onArrive(un.inc,j,g)}
  }else if(un.phase==='back'){
    un.d=Math.max(0,un.d-spd*dt);const q=alongP(un.pts,un.cum,un.d);un.x=q.x;un.y=q.y;un.an=q.an+Math.PI;
    if(un.d<=0){busy.set(un.stn,Math.max(0,(busy.get(un.stn)||1)-1));un.dead=true}
  }
}
function jobStep(inc,j,g){
  if(j.st==='wait'||j.st==='none'){
    if(g<j.callG)return;
    const s=stationFor(j.t,inc);
    if(s==='none'){j.st='none';return}
    if(s==='busy'){j.st='wait';return}
    launch(inc,j,s);
  }else if(j.st==='work'&&g>=j.wEnd){j.st='done';j.done=true;if(j.unit)j.unit.phase='back'}
}

  inc.jobs.forEach(j=>{
    if(j.st==='work'||j.st==='done')return;
    const w=g-j.callG,th=LATE[j.t];
    if(j.lp<th.length&&w>=th[j.lp]){j.lp++;const m=lateMsg(inc,j,w);if(m)post(m,inc)}

}

function fallStep(inc,dt,n){

  p.tt-=dt;if(p.tt<=0){p.tt=.05;p.tr.push([p.x,p.y]);if(p.tr.length>40)p.tr.shift()}

function damage(x,y,r,p){

    const c=b.pts?[b.pts.reduce((s,q)=>s+q[0],0)/b.pts.length,b.pts.reduce((s,q)=>s+q[1],0)/b.pts.length]:[b.x+b.w/2,b.y+b.h/2];

      if(sel&&sel.o===b)sel=null;return false}
    return true});

    if(z&&z.t[q]!==' '){if(z.t[q]==='r')pop+=3;z.t=z.t.slice(0,q)+' '+z.t.slice(q+1);z.d=z.d.slice(0,q)+' '+z.d.slice(q+1);if(/^ +$/.test(z.t))delete Z[key]}
  }

}

function incsTick(dt,g){

    for(let q=inc.q.length-1;q>=0;q--){const it=inc.q[q];if(g>=it.g){inc.q.splice(q,1);let m=null;try{m=it.f()}catch(e){}if(m)post(m,inc)}}
    if(inc.phase==='fall'){fallStep(inc,dt,n);continue}
    if(inc.kind==='road'&&!inc.veh.length){finish(inc,true);continue}
    inc.jobs.forEach(j=>jobStep(inc,j,g));late(inc,g);
    const fj=inc.jobs.filter(j=>j.t==='fire');if(fj.length&&fj.every(j=>j.done))inc.burn=false;
    const pending=inc.jobs.some(j=>!j.done&&j.st!=='none');
    if(!pending){
      if(inc.clearG===undefined)inc.clearG=g+(inc.jobs.some(j=>j.st==='none')?rnd(120,240):inc.kind==='air'?rnd(8,20):rnd(2,6));
      if(g>=inc.clearG)finish(inc,false);
    }
    if(g-inc.g0>600)finish(inc,false);
  }
  for(let k=UN.length-1;k>=0;k--){unitStep(UN[k],dt,g);if(UN[k].dead)UN.splice(k,1)}
}
let rAcc=0,rLast=now();
function risk(dg){
  rAcc+=dg;const n=now();if(n-rLast<.6)return;rLast=n;const a=rAcc;rAcc=0;
  if(!cfg.on||!a)return;
  const m=cfg.f*(night()?1.3:1)*(rush()?1.2:1);
  if(INCS.filter(i=>i.kind==='road').length<CFG.MAX_ROAD){
    const vs=allVeh(),mv=vs.filter(v=>v.mv);
    if(mv.length&&Math.random()<a*mv.length/CFG.BASE_VEH*m*(WXM[wxn()]||1)){const p=pick(mv);startRoad(p,Math.random()<.75?findPartner(p,vs):null)}
  }
  if(!INCS.some(i=>i.kind==='air')){
    const ps=airborne();
    if(ps.length&&Math.random()<a*ps.length/CFG.BASE_AIR*m*(WXA[wxn()]||1))startAir(pick(ps));
  }
}
let last=now(),lastG=null;
(function loop(){
  const n=now(),dt=Math.min(.1,Math.max(0,n-last));last=n;

})();

function label(c,t,x,y,sc,P){c.font='700 '+(11*sc)+'px '+F;c.textAlign='center';c.textBaseline='middle';c.lineWidth=3.5*sc;c.lineJoin='round';c.strokeStyle=P.bg;c.strokeText(t,x,y);c.fillStyle=P.ink;c.fillText(t,x,y)}
function flame(c,x,y,r,t,s){for(let j=0;j<5;j++){const a=t*9+j*2.1+s,rr=r*(.55+.45*Math.sin(a)),ox=Math.cos(j*1.9+s)*r*.8,oy=Math.sin(j*2.7+s)*r*.8-Math.abs(Math.sin(a))*r*.5;
  c.beginPath();c.arc(x+ox,y+oy,rr*.7,0,7);c.fillStyle=j%2?'rgba(255,170,40,.85)':'rgba(255,90,20,.8)';c.fill();
  c.beginPath();c.arc(x+ox,y+oy,rr*.35,0,7);c.fillStyle='rgba(255,235,150,.9)';c.fill()}}
function smoke(c,x,y,t,n,sz,seed){for(let j=0;j<n;j++){const p=((t*.3+j/n+seed)%1);c.beginPath();c.arc(x+Math.sin(t*.8+j*2+seed)*sz*.3*p+p*sz*.3,y-p*sz*2.2,sz*(.25+p*.7),0,7);c.fillStyle='rgba(60,62,68,'+((1-p)*.42).toFixed(3)+')';c.fill()}}
function planeShape(c,L,sp,col){
  const Wd=L*.095,H=sp/2;c.lineJoin='round';c.lineWidth=.6;c.strokeStyle='#0007';
  const pg=(pts,f)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=f;c.fill();c.stroke()};
  [1,-1].forEach(s=>{pg([[.1*L,s*Wd*.4],[-.09*L,s*H],[-.16*L,s*H],[-.1*L,s*Wd*.4]],col==='#000'?col:'#dfe5e8');pg([[-.4*L,s*Wd*.3],[-.46*L,s*L*.16],[-.49*L,s*L*.16],[-.47*L,s*Wd*.3]],col==='#000'?col:'#dfe5e8')});
  c.beginPath();c.moveTo(.5*L,0);c.bezierCurveTo(.5*L,Wd*.35,.44*L,Wd/2,.36*L,Wd/2);c.lineTo(-.3*L,Wd/2);c.lineTo(-.5*L,Wd*.12);c.lineTo(-.5*L,-Wd*.12);c.lineTo(-.3*L,-Wd/2);c.lineTo(.36*L,-Wd/2);c.bezierCurveTo(.44*L,-Wd/2,.5*L,-Wd*.35,.5*L,0);c.closePath();c.fillStyle=col;c.fill();c.stroke();
}
function statusOf(inc){
  const T={police:'полиция',amb:'скорая',fire:'пожарные'},base=inc.kind==='air'?'Авиакатастрофа':'ДТП';
  if(inc.phase==='fall')return base;
  const w=[...new Set(inc.jobs.filter(j=>!j.done&&j.st!=='work'&&j.st!=='none').map(j=>T[j.t]))];
  if(w.length)return base+' · ждём: '+w.join(', ');
  if(inc.jobs.some(j=>j.st==='work'))return base+' · работают службы';
  if(inc.jobs.some(j=>j.st==='none'))return base+' · служб нет в городе';
  return base+(inc.kind==='air'?' · последствия':' · уборка');
}
const ep=e=>e.t==='car'?e.pose:{x:e.st.x,y:e.st.y,an:e.st.an||0};
function marker(c,inc,k,t,P,ic){
  const sc=Math.max(1,.55/k);
  c.save();c.translate(inc.x,inc.y-30*sc);c.scale(sc,sc);
  const pr=(t*1.4)%1;c.beginPath();c.arc(0,0,12+pr*10,0,7);c.strokeStyle='rgba(215,38,61,'+(.5*(1-pr)).toFixed(2)+')';c.lineWidth=2;c.stroke();
  c.beginPath();c.arc(0,0,12,0,7);c.fillStyle=(inc.sev>2||inc.kind==='air')?'#8e1b2b':'#d7263d';c.fill();c.lineWidth=2.5;c.strokeStyle='#fff';c.stroke();
  c.fillStyle='#fff';c.font='800 14px '+F;c.textAlign='center';c.textBaseline='middle';c.fillText(ic,0,1);c.restore();
  if(k>.4)label(c,statusOf(inc),inc.x,inc.y-50*sc,sc,P);
}
function drawRoad(c,inc,k,t,P){
  inc.deb.forEach(d=>{c.save();c.translate(inc.x+d[0],inc.y+d[1]);c.rotate(d[4]);c.fillStyle=d[5];c.fillRect(-d[2]/2,-d[3]/2,d[2],d[3]);c.restore()});
  const bl=Math.floor(t*2.6)%2;
  inc.veh.forEach(e=>{
    const p=ep(e);
    if(e.t==='car'||e.t==='bus'){
      const L=e.r*2,Wd=e.t==='car'?L*.4:2.6*bu();
      c.strokeStyle='rgba(15,15,15,.3)';c.lineWidth=1.3;c.beginPath();c.moveTo(p.x-Math.cos(p.an)*L*1.5,p.y-Math.sin(p.an)*L*1.5);c.lineTo(p.x,p.y);c.stroke();
      c.save();c.translate(p.x,p.y);c.rotate(p.an);
      if(e.wreck){c.fillStyle='rgba(20,15,10,.55)';rrc(c,-L/2,-Wd/2,L,Wd,Wd*.25);c.fill()}
      if(bl){c.fillStyle='#ffb21a';[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(q=>{c.beginPath();c.arc(q[0]*L*.48,q[1]*Wd*.5,Math.max(.9,Wd*.08),0,7);c.fill()})}
      c.restore();
    }else if(bl){c.beginPath();c.arc(p.x,p.y,5,0,7);c.fillStyle='#ffb21a';c.fill()}
  });
  if(inc.sev>1||inc.burn)smoke(c,inc.x,inc.y,t,inc.burn?5:3,inc.burn?22:14,inc.seed);
  if(inc.burn)flame(c,inc.x,inc.y,9,t,inc.seed);

}
function drawAir(c,inc,k,t,P){
  if(inc.phase==='fall'){
    const p=inc.fall,tt=clamp((now()-p.t0)/p.dur,0,1),h=1-tt;
    for(let i=0;i<p.tr.length;i++){const q=p.tr[i],a=i/p.tr.length;c.beginPath();c.arc(q[0],q[1],3+a*7,0,7);c.fillStyle=a>.75?'rgba(255,140,30,'+(a*.5).toFixed(2)+')':'rgba(70,70,75,'+(a*.5).toFixed(2)+')';c.fill()}
    c.save();c.translate(p.x+h*34,p.y+h*48);c.rotate(p.an);c.globalAlpha=.25;planeShape(c,inc.L,inc.sp,'#000');c.restore();
    c.save();c.translate(p.x,p.y);c.rotate(p.an);c.scale(1+h*.25,1+h*.25);planeShape(c,inc.L,inc.sp,'#f4f6f7');
    flame(c,inc.L*.02,inc.sp*.17,inc.L*.1,t,1);flame(c,inc.L*.02,-inc.sp*.17,inc.L*.1,t,3);flame(c,-inc.L*.4,0,inc.L*.08,t,5);c.restore();
    return;
  }
  const bt=now()-inc.boomT;
  if(inc.water){for(let j=0;j<3;j++){const p=((bt*.5+j/3)%1);c.beginPath();c.arc(inc.x,inc.y,p*inc.L*1.3+4,0,7);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,'+(.6*(1-p)).toFixed(2)+')';c.stroke()}}
  else inc.deb.forEach(d=>{c.save();c.translate(inc.x+d[0],inc.y+d[1]);c.rotate(d[4]);c.fillStyle=d[5];c.fillRect(-d[2]/2,-d[3]/2,d[2],d[3]);c.restore()});
  if(bt<1.6){const a=bt/1.6;c.globalAlpha=1-a;c.beginPath();c.arc(inc.x,inc.y,inc.L*(.3+a*1.1),0,7);c.fillStyle='#ff8c1a';c.fill();c.beginPath();c.arc(inc.x,inc.y,inc.L*(.15+a*.5),0,7);c.fillStyle='#ffe08a';c.fill();
    c.beginPath();c.arc(inc.x,inc.y,inc.L*2.2*a+4,0,7);c.lineWidth=5;c.strokeStyle='rgba(255,255,255,'+(.7*(1-a)).toFixed(2)+')';c.stroke();c.globalAlpha=1}
  smoke(c,inc.x,inc.y,t,inc.burn?7:3,inc.burn?inc.L*.5:inc.L*.3,inc.seed);
  if(inc.burn&&!inc.water)for(let j=0;j<4;j++)flame(c,inc.x+inc.deb[j*3][0]*.6,inc.y+inc.deb[j*3][1]*.6,inc.L*.14,t,j*1.7);
  marker(c,inc,k,t,P,'✈');
}
function drawUnit(c,un,k,t){
  const b=bu(),L=(un.t==='fire'?9:un.t==='amb'?6:5.2)*b,Wd=(un.t==='fire'?2.6:2.1)*b,ph=Math.floor(t*6)%2;

  c.fillStyle=un.t==='police'?'#2a6bff':un.t==='amb'?'#d7263d':'#fff';c.fillRect(-L*.45,-Wd*.12,L*.9,Wd*.24);
  c.fillStyle='#bfe3f2';c.fillRect(L*.2,-Wd*.38,L*.12,Wd*.76);

  c.restore();

}

/* ---------- дороги: разметка, аллея, трамвай, троллейбус ---------- */
function roads3d(){
  const sc=API.scene,P=[],C=[],col=new TH.Color(),RD=S().roads;
  const quad=(a,b,w,y,k)=>{let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz);if(!l)return;dx/=l;dz/=l;const nx=-dz*w/2,nz=dx*w/2;
    const A=[a[0]+nx,y,a[1]+nz],B=[a[0]-nx,y,a[1]-nz],Q=[b[0]+nx,y,b[1]+nz],D=[b[0]-nx,y,b[1]-nz];
    [A,B,Q,B,D,Q].forEach(p=>P.push(...p));col.set(k);for(let i=0;i<6;i++)C.push(col.r,col.g,col.b)};
  const solid=(p,w,y,k)=>{for(let i=1;i<p.length;i++)quad(p[i-1],p[i],w,y,k)};
  const dash=(p,w,y,k,on,off)=>{let draw=true,rem=on;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);let t=0;
    while(t<L-1e-6){const s=Math.min(rem,L-t);if(draw)quad([a[0]+(b[0]-a[0])*t/L,a[1]+(b[1]-a[1])*t/L],[a[0]+(b[0]-a[0])*(t+s)/L,a[1]+(b[1]-a[1])*(t+s)/L],w,y,k);
      t+=s;rem-=s;if(rem<=1e-6){draw=!draw;rem=draw?on:off}}}};
  const near_=(p,R)=>RD.some(o=>o!==R&&o.pts.some((q,i)=>i&&dseg(p,o.pts[i-1],q)<RW[o.t]/2+3));
  const samp=(R,st,chk)=>{const o=[],Q=R.pts;for(let i=1;i<Q.length;i++){const a=Q[i-1],b=Q[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(L/st)),an=Math.atan2(b[1]-a[1],b[0]-a[0]);
    for(let q=0;q<n;q++){const p=[a[0]+(b[0]-a[0])*q/n,a[1]+(b[1]-a[1])*q/n];o.push({p,an,ok:!chk||!near_(p,R)})}}
    const e=Q[Q.length-1];o.push({p:e,an:o.length?o[o.length-1].an:0,ok:!chk||!near_(e,R)});return o};
  const inst=(g,m,list,fn)=>{if(!list.length)return;const im=new TH.InstancedMesh(g,m,list.length),d=new TH.Object3D();
    list.forEach((o,i)=>{d.position.set(0,0,0);d.rotation.set(0,0,0);d.scale.set(1,1,1);fn(o,d);d.updateMatrix();im.setMatrixAt(i,d.matrix)});sc.add(im)};
  const bx=new TH.BoxGeometry(1,1,1);bx.translate(0,.5,0);
  const cy=new TH.CylinderGeometry(1,1,1,6);cy.translate(0,.5,0),cn=new TH.ConeGeometry(1,1,7);cn.translate(0,.5,0);
  const lf=new TH.BoxGeometry(1,.2,1);lf.translate(.5,0,0);const sp=new TH.SphereGeometry(1,9,7);
  const L=m=>new TH.MeshLambertMaterial({color:m}),bars=[],posts=[],trees={tree:[],palm:[],sakura:[]},poles=[];
  RD.forEach(R=>{
    const t=R.t,W=RW[t],n=LN[t],al=RN[t]==='Аллея',ro=ROAD[t]||'',Y=.5,o=d=>offs(R.pts,d);
    solid(o(W/2-.9),.5,Y,'#f4f4f0');solid(o(-W/2+.9),.5,Y,'#f4f4f0');
    if(al){
      const lw=(W-4)/n,sm=samp(R,6,true);let run=[];const flush=()=>{if(run.length>1){solid(run,4.7,.3,'#9a9a94');solid(run,4,.36,'#7fb86a')}run=[]};
      sm.forEach(s=>{if(s.ok)run.push(s.p);else flush()});flush();
      for(let q=1;q<n/2;q++)[1,-1].forEach(g=>dash(o(g*(2+q*lw)),.4,Y,'#f4f4f0',5,7));
      sm.forEach((s,i)=>{
        if(!s.ok)return;const nx=-Math.sin(s.an),nz=Math.cos(s.an);
        [1.9,-1.9].forEach(d=>{posts.push([s.p[0]+nx*d,s.p[1]+nz*d]);const q=sm[i+1];if(q&&q.ok){const a=[s.p[0]+nx*d,s.p[1]+nz*d],qx=-Math.sin(q.an),qz=Math.cos(q.an),b=[q.p[0]+qx*d,q.p[1]+qz*d];bars.push([a,b])}});
        if(i%2===0)trees[R.pl==='palm'?'palm':R.pl==='sakura'?'sakura':'tree'].push([s.p[0],s.p[1],((i*37)%10)/10]);
      });
    }else for(let k=1;k<n;k++){const d=-W/2+k*W/n;
      if(!R.ow&&k===n/2){solid(o(d-.35),.35,Y,'#d2a800');solid(o(d+.35),.35,Y,'#d2a800')}else dash(o(d),.4,Y,'#f4f4f0',5,7)}
    if(/трамвайн/.test(ro)){const ee=al?4.2:1.7;(R.ow?[0]:[-ee,ee]).forEach(e=>{solid(o(e+.75),.35,.55,'#b9bec2');solid(o(e-.75),.35,.55,'#b9bec2')})}
    if(/троллейб/.test(ro)){
      const le=al?W/2-(4+4/n)/2:(W-W/n)/2,dr=(R.rev?-1:1)*(R.rw==='against'?-1:1);
      (R.ow?[dr*le]:[le,-le]).forEach(e=>{solid(o(e+.55),.2,8,'#222');solid(o(e-.55),.2,8,'#222')});
      samp(R,60,false).forEach(s=>poles.push([s.p[0]-Math.sin(s.an)*(W/2+2),s.p[1]+Math.cos(s.an)*(W/2+2)]));
    }
  });
  const gm=new TH.BufferGeometry();gm.setAttribute('position',new TH.Float32BufferAttribute(P,3));gm.setAttribute('color',new TH.Float32BufferAttribute(C,3));
  sc.add(new TH.Mesh(gm,new TH.MeshBasicMaterial({vertexColors:true,side:TH.DoubleSide})));
  inst(bx,L('#3b4248'),posts,(p,d)=>{d.position.set(p[0],.36,p[1]);d.scale.set(.3,2,.3)});
  [.9,1.7].forEach(h=>inst(bx,L('#c9ced2'),bars,(b,d)=>{const dx=b[1][0]-b[0][0],dz=b[1][1]-b[0][1];d.position.set((b[0][0]+b[1][0])/2,h,(b[0][1]+b[1][1])/2);d.rotation.y=-Math.atan2(dz,dx);d.scale.set(Math.hypot(dx,dz),.22,.22)}));
  inst(cy,L('#333'),poles,(p,d)=>{d.position.set(p[0],0,p[1]);d.scale.set(.4,9,.4)});
  /* деревья (три вида) */
  inst(cy,L('#6b4f3a'),trees.tree,(p,d)=>{d.position.set(p[0],.36,p[1]);d.scale.set(.7,5,.7)});
  inst(cn,L('#4c8a47'),trees.tree,(p,d)=>{d.position.set(p[0],4.5,p[1]);d.scale.set(4.5+p[2],11,4.5+p[2])});
  inst(cy,L('#7a5a3a'),trees.palm,(p,d)=>{d.position.set(p[0],.36,p[1]);d.scale.set(.7,14,.7)});
  const pl=[];trees.palm.forEach(p=>{for(let k=0;k<7;k++)pl.push([p[0],p[1],k*Math.PI*2/7+p[2]])});
  inst(lf,L('#2f9440'),pl,(p,d)=>{d.position.set(p[0],14.2,p[1]);d.rotation.set(0,p[2],-.4);d.scale.set(7,1,1.6)});
  inst(cy,L('#5b4636'),trees.sakura,(p,d)=>{d.position.set(p[0],.36,p[1]);d.scale.set(.7,4,.7)});
  inst(sp,L('#f2a2c0'),trees.sakura,(p,d)=>{d.position.set(p[0],6,p[1]);d.scale.set(4.2,3.6,4.2)});
}

/* ---------- своя машина ---------- */
function mkCar(it){
  const k=U(),L=4.6*k,W=1.85*k,H=.55*k,g=new TH.Group();
  const b=new TH.Mesh(new TH.BoxGeometry(L,H,W),new TH.MeshLambertMaterial({color:it.col}));b.position.y=.35*k+H/2;g.add(b);
  const c=new TH.Mesh(new TH.BoxGeometry(L*.5,.5*k,W*.9),new TH.MeshLambertMaterial({color:'#1d2a33'}));c.position.set(-L*.05,.35*k+H+.25*k,0);g.add(c);
  const wg=new TH.CylinderGeometry(.32*k,.32*k,.25*k,12);wg.rotateX(Math.PI/2),wm=new TH.MeshLambertMaterial({color:'#17191b'});
  [[.3,1],[.3,-1],[-.3,1],[-.3,-1]].forEach(q=>{const w=new TH.Mesh(wg,wm);w.position.set(q[0]*L,.32*k,q[1]*W/2);g.add(w)});
  return g;
}
function garage(){(S().garage||[]).forEach(it=>{const g=mkCar(it);API.scene.add(g);gr.set(it,g)})}
function toggle(){
  if(!API)return;
  if(drv){leave();return}
  if(near){drv=near;drv.v=0;API.pos(drv.x,drv.y);API.setYaw(-drv.a-Math.PI/2)}
}
function leave(){
  const c=drv;drv=null;if(!c)return;c.v=0;
  if(API){const a=c.a+Math.PI/2,x=c.x+Math.cos(a)*4*U(),y=c.y+Math.sin(a)*4*U();if(!API.blk(x,y))API.pos(x,y)}
  try{save()}catch(e){}
}
function drive(f,r,dt,run){
  const k=U(),c=drv,yaw0=API.get().yaw;
  c.v+=f*(f>0?16:20)*k*dt;c.v*=Math.exp(-(f?.25:1.2)*dt);c.v=clamp(c.v,-8*k,(run?34:24)*k);
  const yaw=yaw0-r*1.7*dt*clamp(c.v/(5*k),-1,1);API.setYaw(yaw);c.a=-yaw-Math.PI/2;
  const nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
  if(!API.blk(nx,c.y))c.x=nx;else c.v*=-.3;
  if(!API.blk(c.x,ny))c.y=ny;else c.v*=-.3;
  API.pos(c.x,c.y);return true;
}

/* ---------- ДТП и авиакатастрофы в 3D ---------- */
const M=(c,o)=>new TH.MeshBasicMaterial(Object.assign({color:c},o||{}));
function incGroup(inc){
  const g=new TH.Group(),k=U(),air=inc.kind==='air',sz=air?inc.L:7*k;g.userData={sz,air,sm:[],fr:[]};
  const sm=M('#3c3e44',{transparent:true,opacity:.45,depthWrite:false});
  for(let i=0;i<5;i++){const s=new TH.Mesh(new TH.SphereGeometry(1,8,6),sm);g.add(s);g.userData.sm.push(s)}
  for(let i=0;i<3;i++){const f=new TH.Mesh(new TH.ConeGeometry(1,2,6),M(i%2?'#ffb62a':'#ff5a1a'));g.add(f);g.userData.fr.push(f)}
  (inc.deb||[]).forEach(d=>{const m=new TH.Mesh(new TH.BoxGeometry(1,1,1),new TH.MeshLambertMaterial({color:d[5]}));m.position.set(d[0],.5,d[1]);m.rotation.y=d[4];m.scale.set(d[2],.8,d[3]);g.add(m)});
  if(air){
    const pl=new TH.Group(),L=inc.L,body=new TH.Mesh(new TH.BoxGeometry(L,L*.1,L*.1),M('#f4f6f7')),w=new TH.Mesh(new TH.BoxGeometry(L*.14,.5,inc.sp),M('#dfe5e8'));
    pl.add(body,w);pl.rotation.order='YZX';g.add(pl);g.userData.pl=pl;
    const sc=new TH.Mesh(new TH.CircleGeometry(L*.35,16),M('#1c1a18'));sc.rotation.x=-Math.PI/2;sc.position.y=.6;g.add(sc);g.userData.scar=sc;
  }
  return g;
}
function incAnim(inc,g,T){
  const d=g.userData,k=U(),f=inc.phase==='fall',air=d.air,sz=d.sz;
  const t=f?clamp((performance.now()/1000-inc.fall.t0)/inc.fall.dur,0,1):1,hy=f?(1-t)*260*k+3:0;
  g.position.set(inc.x,0,inc.y);
  if(air){d.pl.visible=f;d.pl.position.y=hy;d.pl.rotation.set(0,-inc.fall.an,-t*1.2);d.scar.visible=!f}
  const smoke=air||inc.sev>1||inc.burn;
  d.sm.forEach((s,i)=>{s.visible=smoke;const p=(T*.25+i/5)%1;s.position.set(Math.sin(T+i)*sz*.25-(f?i*sz*.12:0),hy+p*sz*(air?2:2.4)+1,Math.cos(T*.7+i)*sz*.2);s.scale.setScalar(sz*(.15+p*.4))});
  d.fr.forEach((s,i)=>{s.visible=!!inc.burn;const fl=.7+.5*Math.abs(Math.sin(T*9+i*2.1));s.position.set((i-1)*sz*.2,hy+sz*.1*fl,(i%2?1:-1)*sz*.1);s.scale.set(sz*.12*fl,sz*.14*fl,sz*.12*fl)});
}
function unitMesh(un){
  const k=U(),L=(un.t==='fire'?9:un.t==='amb'?6:5.2)*k,W=(un.t==='fire'?2.6:2.1)*k,g=new TH.Group();
  const b=new TH.Mesh(new TH.BoxGeometry(L,1.7*k,W),new TH.MeshLambertMaterial({color:un.t==='fire'?'#d7263d':'#f4f6f8'}));b.position.y=.3+.85*k;g.add(b);
  const s=new TH.Mesh(new TH.BoxGeometry(L*.9,.3*k,W*1.02),M(un.t==='police'?'#2a6bff':un.t==='amb'?'#d7263d':'#fff'));s.position.y=.3+.9*k;g.add(s);
  g.userData.l=[0,1].map(i=>{const l=new TH.Mesh(new TH.BoxGeometry(.5*k,.4*k,W*.4),M('#f00'));l.position.set(L*.2,.3+1.9*k,(i?1:-1)*W*.22);g.add(l);return l});
  return g;
}
function tick(){
  const T=performance.now()/1000,k=U();
  /* машины игрока */
  gr.forEach((g,it)=>{g.position.set(it.x,.1,it.y);g.rotation.y=-it.a});
  near=null;
  if(!drv){const p=API.get();let bd=7*k;gr.forEach((g,it)=>{const d=Math.hypot(it.x-p.x,it.y-p.z);if(d<bd){bd=d;near=it}})}
  else API.cam.position.y=1.35*k;
  if(btn){btn.hidden=!drv&&!near;btn.textContent=drv?'Выйти (C) · '+Math.round(Math.abs(drv.v)/k*3.6)+' км/ч':'🚗 Сесть в машину (C)'}
  /* аварии */
  const I=City.incs||[],sn=new Set(I);
  I.forEach(inc=>{let g=ig.get(inc);if(!g){g=incGroup(inc);ig.set(inc,g);API.scene.add(g)}incAnim(inc,g,T)});
  ig.forEach((g,key)=>{if(!sn.has(key)){API.scene.remove(g);ig.delete(key)}});
  const Un=City.units||[],su=new Set(Un);
  Un.forEach(un=>{let g=ug.get(un);if(!g){g=unitMesh(un);ug.set(un,g);API.scene.add(g)}
    g.position.set(un.x,0,un.y);g.rotation.y=-un.an;const ph=Math.floor(T*6)%2;g.userData.l[0].material.color.set(ph?'#f22':'#26f');g.userData.l[1].material.color.set(ph?'#26f':'#f22')});
  ug.forEach((g,key)=>{if(!su.has(key)){API.scene.remove(g);ug.delete(key)}});
}
})();

const _add=add;
add=function(k,o){
  const S=City.S;if(typeof S.money!=='number')S.money=0;
  let want=0,bump=0,fixed=false;
  if(k==='blds'){
    if(ART[o.t]&&!o.pts&&Math.abs(o.w-o.h)<1)o.h=Math.round(o.w*9/16);
    if(o.t==='park'){const a=(o.pts?area(o.pts):o.w*o.h)*mpu()*mpu();want=Math.round(a*PARK_M2);bump=Math.max(INNER.parkMin,Math.round(a*INNER.m2))-want}
    else if(PRICE[o.t]){want=PRICE[o.t];fixed=true}
  }else if(k==='lms'){want=SVED;bump=INNER.lms-want}
  else if(k==='dists'&&City.tool==='dist'&&(tt==='park'||tt==='aqua')){
    o.kind=tt;o.c=tt==='park'?'#58b868':'#3b8fd1';o.n=(tt==='park'?'Парковая зона ':'Аквапарковая зона ')+((S.dists||[]).filter(d=>d.kind===tt).length+1)}
  if(want&&S.money<want){say('Недостаточно денег: нужно '+n0(want));dirty=true;return}
  if(bump>0)S.money+=bump;
  _add(k,o);
  if(fixed)S.money-=want;
  if(want){say('Построено: −'+n0(want));try{save()}catch(e){}}
};

const PT={};
const pat=k=>{if(PT[k])return PT[k];const t=document.createElement('canvas');t.width=t.height=24;const g=t.getContext('2d');
  if(k==='park'){rc(g,'#6fae5a',0,0,24,24);[[5,6,3],[16,5,2.5],[10,17,3.2],[20,19,2.4]].forEach(a=>circ(g,a[0],a[1],a[2],'#3f7d3a'))}
  else{rc(g,'#7cc4ec',0,0,24,24);g.strokeStyle='#e9f6fd';g.lineWidth=1.2;for(let y=5;y<24;y+=9){g.beginPath();g.moveTo(0,y);for(let x=0;x<=24;x+=6)g.quadraticCurveTo(x+1.5,y-3,x+3,y);g.stroke()}}
  return PT[k]=ctx.createPattern(t,'repeat')};
City.layers.under.push(c=>{(City.S.dists||[]).forEach(D=>{if(!D.kind)return;poly(D.pts);c.globalAlpha=.5;c.fillStyle=pat(D.kind);c.fill();c.globalAlpha=1})});

/* ================= ЖИЛЫЕ ЗОНЫ: НОВЫЕ ДОМА ================= */
let ver=0,RB=null,ZB=[],zs=new Map(),lastS=null,lastVer=-1,Oc=null;
City.on('change',()=>{ver++;Oc=null});
const bldCells=()=>{const s=new Set();City.S.blds.forEach(b=>{for(let j=Math.floor(b.y/TC);j<Math.ceil((b.y+b.h)/TC);j++)for(let i=Math.floor(b.x/TC);i<Math.ceil((b.x+b.w)/TC);i++)s.add(i+','+j)});return s};
function layout(){
  if(City.ownZone){ZB=[];return}
  const Z=City.S.zones||{},cells=new Map(),occ=bldCells();ZB=[];  for(const key in Z){const z=Z[key],p=key.split(','),i0=+p[0]*32,j0=+p[1]*32;for(let n=0;n<1024;n++)if(z.t.charCodeAt(n)===114)cells.set((i0+(n&31))+','+(j0+(n>>5)),z.d.charCodeAt(n)-256)}
  const ks=[...cells.keys()].map(k=>k.split(',').map(Number)).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
  const fit=(i,j)=>{
    const h=Math.floor(hv(i,j,5)*4),r0=hv(i,j,7)<.5?0:1;
    for(let q=0;q<4;q++){const m=MD[(h+q)%4];
      for(let o=0;o<2;o++){const rot=(r0+o)%2,w=rot?m.d:m.w,d=rot?m.w:m.d;let ok=true,day=0;
        for(let a=0;a<w&&ok;a++)for(let b=0;b<d;b++){const k=(i+a)+','+(j+b);if(!cells.has(k)||occ.has(k)){ok=false;break}day=Math.max(day,cells.get(k))}
        if(ok){for(let a=0;a<w;a++)for(let b=0;b<d;b++)occ.add((i+a)+','+(j+b));return{i,j,m,rot,day}}}}
    return null};
  ks.forEach(([i,j])=>{if(occ.has(i+','+j))return;const z=fit(i,j);if(z)ZB.push(z)});
}
setInterval(()=>{try{
  const S=City.S,Z=S.zones||{};let ch=lastS!==S||lastVer!==ver;
  if(!ch){let n=0;for(const k in Z){n++;if(zs.get(k)!==Z[k].t){ch=true;break}}if(n!==zs.size)ch=true}
  if(ch){zs=new Map();for(const k in Z)zs.set(k,Z[k].t);lastS=S;lastVer=ver;layout();City.redraw()}
}catch(e){console.error(e)}},500);

/* старые кубики жилой зоны скрываем, в 3D скрываем стандартные коробки зданий (рисуем свои) */
const BIG=String.fromCharCode(256+54000);let FZ=null,FZs=new Map();
function fakeZ(Z){
  if(!Z)return Z;let ch=!FZ||FZ.__r!==Z;
  if(!ch){let n=0;for(const k in Z){n++;const c=FZs.get(k);if(!c||c!==Z[k].t){ch=true;break}}if(n!==FZs.size)ch=true}
  if(ch){const o={};FZs=new Map();for(const k in Z){const z=Z[k],d=z.d.split('');for(let n=0;n<1024;n++)if(z.t.charCodeAt(n)===114)d[n]=BIG;o[k]={t:z.t,d:d.join('')};FZs.set(k,z.t)}Object.defineProperty(o,'__r',{value:Z});FZ=o}
  return FZ;
}
const _dw=draw;
draw=function(){
  const S=City.S,rz=S.zones,rb=S.blds;RB=rb;S.zones=fakeZ(rz);
  if(is3())S.blds=rb.filter(b=>FLAT.has(b.t));
  try{_dw()}finally{S.zones=rz;S.blds=rb}
};

/* ================= ОТДЕЛЬНЫЙ ДОМ: инструмент, подсветка ================= */
let rotH=false,M=[0,0];
cv.addEventListener('pointermove',e=>{M=[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k]});
const isW=(i,j)=>{const s=City.S.terr&&City.S.terr[(i>>5)+','+(j>>5)];if(!s)return false;const c=s.charAt(((j&31)<<5)|(i&31));return c==='w'||c==='s'};
function OCC(){
  if(Oc&&Oc.S===City.S)return Oc.s;
  const S=City.S,s=bldCells();
  S.roads.forEach(R=>{const r=RW[R.t]/2+2;for(let q=1;q<R.pts.length;q++){const a=R.pts[q-1],b=R.pts[q],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/4));
    for(let k=0;k<=n;k++){const x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;
      for(let j=Math.floor((y-r)/TC);j<=Math.floor((y+r)/TC);j++)for(let i=Math.floor((x-r)/TC);i<=Math.floor((x+r)/TC);i++)if(Math.hypot((i+.5)*TC-x,(j+.5)*TC-y)<r+TC*.5)s.add(i+','+j)}}});
  Oc={S,s};return s;
}
const blocked=(i,j)=>OCC().has(i+','+j)||isW(i,j);
const freeAt=(i,j,w,d)=>{for(let a=0;a<w;a++)for(let b=0;b<d;b++)if(blocked(i+a,j+b))return false;return true};
const curM=()=>MD[+tt];
const dims=m=>rotH?[m.d,m.w]:[m.w,m.d];
City.HINT.home='Нажмите на карту, чтобы поставить дом. Зелёным подсвечено, где можно строить. R — повернуть.';
City.tools.home=(p,r)=>{
  const m=curM();if(!m)return;const[w,d]=dims(m),i=Math.round(r[0]/TC-w/2),j=Math.round(r[1]/TC-d/2);
  if(!freeAt(i,j,w,d)){say('Здесь нельзя: место занято, вода или дорога');return}
  City.add('blds',{x:i*TC,y:j*TC,w:w*TC,h:d*TC,t:'house',n:'',home:m.id,rot:rotH?1:0,pop:resOf(m)});
};
addEventListener('keydown',e=>{if(City.tool==='home'&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)&&(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К')){rotH=!rotH;City.redraw()}});
const vis=()=>{const r=cv.getBoundingClientRect(),cx=(r.width/2-V.x)/V.k,cy=(r.height/2-V.y)/V.k,R=Math.hypot(r.width,r.height)/2/V.k;return[(x,y,s)=>Math.hypot(x-cx,y-cy)<R+s,cx,cy,R]};
function placeUI(c){
  const m=curM();if(!m)return;const[vf,cx,cy,R]=vis(),n=Math.ceil(R*2/TC);
  if(n<=80){c.beginPath();for(let j=Math.floor((cy-R)/TC);j<=Math.ceil((cy+R)/TC);j++)for(let i=Math.floor((cx-R)/TC);i<=Math.ceil((cx+R)/TC);i++)if(!blocked(i,j))c.rect(i*TC+.5,j*TC+.5,TC-1,TC-1);
    c.fillStyle='rgba(57,255,120,.14)';c.fill();c.strokeStyle='rgba(57,255,120,.5)';c.lineWidth=1/V.k;c.stroke()}
  const[w,d]=dims(m),i=Math.round(M[0]/TC-w/2),j=Math.round(M[1]/TC-d/2),ok=freeAt(i,j,w,d);
  top(c,mp(m,i*TC,j*TC,rotH,1),.6);
  c.save();c.shadowColor=ok?'#39ff78':'#ff3c3c';c.shadowBlur=16;c.lineWidth=2.5/V.k;c.strokeStyle=ok?'#39ff78':'#ff3c3c';c.fillStyle=ok?'rgba(57,255,120,.25)':'rgba(255,60,60,.3)';
  c.fillRect(i*TC,j*TC,w*TC,d*TC);c.strokeRect(i*TC,j*TC,w*TC,d*TC);c.restore();
}

/* ================= ОБЩИЙ СЛОЙ ================= */
City.layers.over.push((c,P)=>{
  const gt=City.game?City.game.day:0,[vf]=vis(),B=RB||City.S.blds,t3=is3(),its=[];
  ZB.forEach(z=>{
    const f=clamp((gt-z.day)/GROW,0,1);if(f<=0)return;
    const rw=z.rot?z.m.d:z.m.w,rd=z.rot?z.m.w:z.m.d,x=z.i*TC,y=z.j*TC;if(!vf(x,y,(rw+rd)*TC+300))return;
    const ps=mp(z.m,x,y,z.rot,f);if(t3)its.push({key:y+rd*TC,parts:ps});else top(c,ps,1)});
  if(t3){B.forEach(b=>{if(FLAT.has(b.t)||!vf(b.x,b.y,b.w+b.h+300))return;its.push({key:b.y+b.h,parts:b.home&&MDX[b.home]?mp(MDX[b.home],b.x,b.y,b.rot,1):gp(b)})});d3(c,its)}
  if(City.tool==='home')placeUI(c);
});

/* ================= КАРТОЧКА ЗДАНИЯ ================= */
const pb=City.insp.blds;
City.insp.blds=o=>{
  let h=pb?pb(o):'';
  if(o.t==='parking'){const a=(o.pts?area(o.pts):o.w*o.h)*mpu()*mpu();return h+'<div class="mu">Вместимость: <b style="color:var(--ink)">≈'+n0(a/28)+'</b> машин</div>'}
  if(FLAT.has(o.t))return h;
  if(o.home){const m=MDX[o.home];if(!m)return h;
    return h+'<div class="mu">'+E(m.n)+'<br>Этажей: <b style="color:var(--ink)">'+m.fl+'</b> · Квартир: <b style="color:var(--ink)">'+m.fl*m.apf+'</b></div><label>Жителей в квартире<input type="number" step=".1" min="0" data-f="ppf" value="'+(+o.ppf||m.ppf)+'"></label>'}
  const fl=o.fl>0?o.fl:(DEF[o.t]||5);
  h+='<label>Этажей<input type="number" min="1" max="200" data-bf="fl" value="'+fl+'"></label>';
  (o.tiers||[]).forEach((t,i)=>{h+='<div class="fr"><small>Надстройка '+(i+1)+': с этажа / этажей / X% / Y% / ширина% / глубина%</small><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">'+['f0','n','x','y','w','h'].map(k=>'<input type="number" data-ti="'+i+'" data-tk="'+k+'" value="'+t[k]+'">').join('')+'</div><button class="b danger" data-tdel="'+i+'">Убрать</button></div>'});
  return h+'<button class="b" data-tadd="roof">+ Надстройка на крыше</button><button class="b" data-tadd="side">+ Пристройка сбоку</button>';
};
const I=$('#insp');
I.addEventListener('change',e=>{
  const t=e.target,s=City.sel;if(!s||s.k!=='blds')return;const o=s.o;
  if(t.dataset.bf==='fl'){o.fl=clamp(Math.round(+t.value)||1,1,200);City.changed();City.updateUI()}
  else if(t.dataset.ti!==undefined&&o.tiers){const q=o.tiers[+t.dataset.ti];if(q){q[t.dataset.tk]=+t.value||0;City.changed();City.updateUI()}}
  else if(t.dataset.f==='ppf'&&o.home&&MDX[o.home]){const m=MDX[o.home];o.pop=resOf(m,+t.value||0);City.changed();City.updateUI()}
});
I.addEventListener('click',e=>{
  const b=e.target.closest('button'),s=City.sel;if(!b||!s||s.k!=='blds')return;const o=s.o;
  if(b.dataset.tadd){City.push();const fl=o.fl>0?+o.fl:(DEF[o.t]||5);o.tiers=o.tiers||[];o.tiers.push(b.dataset.tadd==='roof'?{f0:fl,n:3,x:20,y:20,w:60,h:60}:{f0:0,n:fl,x:100,y:0,w:50,h:100});City.changed();City.updateUI()}
  else if(b.dataset.tdel!==undefined&&o.tiers){City.push();o.tiers.splice(+b.dataset.tdel,1);City.changed();City.updateUI()}
});

/* ================= «ВЫБРАТЬ ОТДЕЛЬНО» ================= */
document.head.insertAdjacentHTML('beforeend','<style>#hz{left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 118px);padding:5px;display:flex;gap:4px;z-index:7}#hdl{width:min(94vw,460px)}#hdl ul{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto}#hdl li{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}#hdl img{width:100%;max-height:150px;object-fit:contain;border-radius:8px;background:var(--bg)}#hdl small{color:var(--mut)}</style>');
$('#wrap').insertAdjacentHTML('beforeend','<div id="hz" class="fl" hidden><button class="b" id="hz-s">Выбрать дом отдельно</button><button class="b" id="hz-r" hidden>↻ Повернуть (R)</button><button class="b" id="hz-n" hidden>Отмена</button></div>');
document.body.insertAdjacentHTML('beforeend','<dialog id="hdl"><h2>Жилые дома</h2><ul id="hdl-l"></ul><div class="row"><button class="b" id="hdl-x">Закрыть</button></div></dialog>');
function thumb(m){
  const c=document.createElement('canvas');c.width=240;c.height=150;const g=c.getContext('2d');g.fillStyle='#bfe0f5';g.fillRect(0,0,240,150);g.fillStyle='#8fae7a';g.fillRect(0,138,240,12);
  const pf=Math.min(5,120/Math.max(...m.parts.map(p=>p[5]))),sx=Math.min(30,220/m.w),ox=(240-sx*m.w)/2;
  m.parts.forEach(p=>{const N=Math.max(1,p[5]-p[4]),wc=p[2]-p[0];g.drawImage(tex(p[7]+':'+wc+':'+N+':'+p[6],wc*24,N*12,N,wc,PF[p[7]]||PF.gen,p[6]),ox+p[0]*sx,138-p[5]*pf,wc*sx,N*pf)});
  return c.toDataURL();
}
$('#hz-s').onclick=()=>{
  $('#hdl-l').innerHTML=MD.map((m,i)=>{const th=thumb(m);return '<li><img src="'+E(m.img)+'" alt="" onerror="this.onerror=null;this.src=\''+th+'\'"><b>'+E(m.n)+'</b><small>'+E(m.desc)+'</small><small>Этажей: '+m.fl+' · Размер: '+m.w+'×'+m.d+' · Квартир: '+m.fl*m.apf+'<br>Жителей: '+n0(resOf(m))+' (≈'+m.ppf+' в квартире)</small><button class="b p" data-hm="'+i+'">Выбрать</button></li>'}).join('');
  $('#hdl').showModal();
};
$('#hdl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='hdl-x')$('#hdl').close();else if(b.dataset.hm!==undefined){$('#hdl').close();setTool('home',b.dataset.hm)}});
$('#hz-r').onclick=()=>{rotH=!rotH;City.redraw()};
$('#hz-n').onclick=()=>setTool('zone','r');
setInterval(()=>{const h=City.tool==='home',on=(City.tool==='zone'&&String(tt)==='r')||h;$('#hz').hidden=!on;if(on){$('#hz-r').hidden=!h;$('#hz-n').hidden=!h}},200);
City.redraw();
})();
</script>
<!-- ===== Плагин: дома в жилых зонах вдоль дорог (без поворотов), пристройки контуром/прямоугольником,
     «Переместить» / 👉, парки по фото (Калининский, Сквер Идеальности, Парк с озером) + деревья в 3D и «Путешествии»,
     актуальные здания (этажи, надстройки, пристройки, свои дома, зоны) в «Путешествии».
     Вставить В САМЫЙ КОНЕЦ, перед </body>. Нужны 2 маленькие правки в старом коде (см. сообщение). ===== -->
<style id="pb-css">
#bpb{left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:5px 8px;display:flex;gap:4px;align-items:center;z-index:7;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
#nav .nr:first-child{max-width:calc(100vw - 188px)}
@media (min-width:761px){#nav .nr:first-child{max-width:calc(100vw - 568px)}}
</style>
<script>
(function(){
'use strict';
const TC=10,GROW=6,F='Manrope,system-ui,sans-serif',PW=160,PH=90,K=6;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mpu=()=>((City.S.scale||50)/50);
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const hv=(i,j,s)=>((i*374761393+j*668265263+s*2147483)>>>0)%1000/1000;
const rng=s=>{s=s>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}};
const is3=()=>{const b=$('#d3');return !!b&&b.classList.contains('on')};
const FH=()=>3/mpu(),FJ=()=>Math.max(3/mpu(),3.4);
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
const say=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>e.hidden=true,3000)};
const vis=()=>{const r=cv.getBoundingClientRect(),cx=(r.width/2-V.x)/V.k,cy=(r.height/2-V.y)/V.k,R=Math.hypot(r.width,r.height)/2/V.k;return(x,y,s)=>Math.hypot(x-cx,y-cy)<R+s};
const PARKS=new Set(['park','kal','sqi','lake']),ARTT=new Set(['kal','sqi','lake']);
const FLATP=new Set(['park','water','parking','kal','sqi','lake','amuse','aqua']);
const DEF={house:5,shop:3,office:18,industry:6,terminal:6,hangar:4,tower:20,kinder:2,school:3,college:4,univ:5,dealer:2,museum:3,gallery:3,church:4,mosque:4,temple:3,mall:3,mallx:4,trk:4};
let ver=0;City.on('change',()=>ver++);

/* ================= ФАСАДЫ И МОДЕЛИ ДОМОВ ================= */
const MD=[
 {id:'h13',w:7,d:4,parts:[[0,0,7,4,0,13,'#9c4b38','h13']]},
 {id:'h87',w:6,d:4,parts:[[0,0,3,4,0,8,'#d8cdb9','h87a'],[3,0,6,4,0,7,'#b5522f','h87b']]},
 {id:'h10',w:6,d:5,parts:[[0,0,6,5,0,10,'#b4bac2','h10'],[3,1.5,5,3.5,10,11,'#8f98a2','h10']]},
 {id:'h35',w:5,d:5,parts:[[0,0,5,5,0,32,'#bca880','h35'],[.5,.5,4.5,4.5,32,35,'#a89468','h35']]}];
const MDX={};MD.forEach(m=>MDX[m.id]=m);
const rc=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const gr=(g,x,y,W,H,N,cols,c)=>{const fh=H/N,cw=W/cols;g.fillStyle=c||'#46566a';for(let r=0;r<N;r++)for(let k=0;k<cols;k++)g.fillRect(x+k*cw+cw*.2,y+r*fh+fh*.22,cw*.6,fh*.56)};
const PF={
 gen:(g,W,H,N,wc,col)=>{rc(g,col||'#ccc',0,0,W,H);gr(g,0,0,W,H,N,Math.max(2,Math.round(wc*1.5)),'#5b7388')},
 h13:(g,W,H,N)=>{rc(g,'#e9e8e3',0,0,W,H);const c=Math.round(W/11);gr(g,0,0,W,H,N,c);rc(g,'#8f4837',0,0,W,H*3/N);gr(g,0,0,W,H*3/N,3,c,'#d9b8a4');rc(g,'#454b52',W*.4,0,W*.18,H);rc(g,'#8f4837',W*.93,0,W*.07,H)},
 h87a:(g,W,H,N)=>{rc(g,'#efe9dc',0,0,W,H);gr(g,W*.22,0,W*.78,H,N,Math.max(3,Math.round(W/12)));rc(g,'#6a4a3c',0,0,W*.2,H);gr(g,0,0,W*.2,H,N,1,'#2f2622');rc(g,'#5a5f66',W*.55,0,W*.05,H)},

function ext3(c,poly,h0,h1,col,fac,N){
  const k=V.k,ht=h1-h0;if(ht<=0)return;c.lineJoin='round';
  if(h0===0){c.beginPath();poly.forEach((p,i)=>{const x=p[0]+h1*.5,y=p[1]+h1*.2;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.fillStyle='#00000030';c.fill()}
  let mx=0,my=0;poly.forEach(p=>{mx+=p[0];my+=p[1]});mx/=poly.length;my/=poly.length;
  const n=poly.length;
  for(let i=0;i<n;i++){
    let a=poly[i],b=poly[(i+1)%n];
    const ex=b[0]-a[0],ey=b[1]-a[1],len=Math.hypot(ex,ey);if(len<.5)continue;
    let nx=ey/len,ny=-ex/len;if(nx*((a[0]+b[0])/2-mx)+ny*((a[1]+b[1])/2-my)<0){nx=-nx;ny=-ny}
    if(ny<.03)continue;

    const ax=a[0],ay=a[1]-h0,bx=b[0],by=b[1]-h0,wc=Math.max(1,Math.round(len/TC*2)/2),im=facCan(fac||'gen',wc,N,col),W=im.width,H=im.height;
    c.save();c.transform((bx-ax)/W,(by-ay)/W,0,ht/H,ax,ay-ht);c.drawImage(im,0,0);c.restore();
    c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.lineTo(bx,by-ht);c.lineTo(ax,ay-ht);c.closePath();
    c.fillStyle='rgba(0,0,0,'+(.34*(1-ny)).toFixed(3)+')';c.fill();c.lineWidth=.7/k;c.strokeStyle='#0007';c.stroke();
  }
  c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p[0],p[1]-h1):c.moveTo(p[0],p[1]-h1));c.closePath();
  c.fillStyle=col;c.fill();c.lineWidth=.8/k;c.strokeStyle='#00000088';c.stroke();
  c.strokeStyle='#ffffff44';c.beginPath();poly.forEach((p,i)=>{const x=mx+(p[0]-mx)*.86,y=my+(p[1]-my)*.86-h1;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.stroke();
}

const adiff=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
function layoutZ(){
  const S=City.S,Z=S.zones||{},cells=new Map(),SET=2.5,GAP=5;
  for(const key in Z){const z=Z[key],p=key.split(','),i0=+p[0]*32,j0=+p[1]*32;
    for(let n=0;n<1024;n++)if(z.t.charCodeAt(n)===114)cells.set((i0+(n&31))+','+(j0+(n>>5)),z.d.charCodeAt(n)-256)}

  const tget=(i,j)=>{const s=S.terr&&S.terr[(i>>5)+','+(j>>5)];return s?s.charAt(((j&31)<<5)|(i&31)):' '};
  const wat=(x,y)=>{const c=tget(Math.floor(x/TC),Math.floor(y/TC));return c==='w'||c==='s'||c==='m'};
  const seg=[];
  S.roads.forEach(R=>{const w=RW[R.t]/2;for(let i=1;i<R.pts.length;i++){const a=R.pts[i-1],b=R.pts[i];
    seg.push({a,b,w,x0:Math.min(a[0],b[0])-w-6,x1:Math.max(a[0],b[0])+w+6,y0:Math.min(a[1],b[1])-w-6,y1:Math.max(a[1],b[1])+w+6})}});
  const clr=(x,y)=>{let m=99;for(const s of seg){if(x<s.x0||x>s.x1||y<s.y0||y>s.y1)continue;const d=dseg([x,y],s.a,s.b)-s.w;if(d<m)m=d}return m};
  const rb=S.blds.map(b=>obb(b.x+b.w/2,b.y+b.h/2,0,b.w/2,b.h/2));
  const hash=new Map(),HS=60;
  const each=(o,f)=>{for(let gx=Math.floor((o.cx-o.r)/HS);gx<=Math.floor((o.cx+o.r)/HS);gx++)for(let gy=Math.floor((o.cy-o.r)/HS);gy<=Math.floor((o.cy+o.r)/HS);gy++)if(f(gx+','+gy))return true;return false};
  const put=o=>each(o,k=>{(hash.get(k)||hash.set(k,[]).get(k)).push(o)});

    c.strokeStyle='#5a4333';c.lineWidth=Math.max(.8,r*.28);c.lineCap='butt';c.beginPath();c.moveTo(x,y);c.lineTo(x,y-H*.8);c.stroke();

  });

/* ================= ОБЩИЙ СЛОЙ 2D / 3D ================= */
City.layers.over.push((c,P)=>{

/* ================= ПУТЕШЕСТВИЕ ================= */
const prevT=City.trip||{};
City.trip={
  start(api){if(prevT.start)prevT.start(api);try{jBuild(api)}catch(e){console.error(e)}},
  stop(){if(prevT.stop)prevT.stop()},
  move(...a){return prevT.move?prevT.move(...a):false},

function jBuild(API){
  const TH=THREE,sc=API.scene,S=City.S,fh=FJ(),gt=City.game?City.game.day:0,B=City.blocks,me=API.get();
  /* убираем старые «коробки» зданий и жилые кубики зон */
  const kill=[];sc.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.type==='ExtrudeGeometry')kill.push(o)});
  kill.forEach(o=>{sc.remove(o);o.geometry.dispose()});
  sc.traverse(o=>{
    if(!(o.isInstancedMesh&&o.geometry&&o.geometry.type==='BoxGeometry'&&o.instanceColor))return;

    for(let i=0;i<o.count;i++){const r=cl[i*3],g=cl[i*3+1],b=cl[i*3+2];if(r>.5&&Math.abs(g/r-.7165)<.03&&Math.abs(b/r-.532)<.03){m[i*16]=m[i*16+5]=m[i*16+10]=0}}
    o.instanceMatrix.needsUpdate=true;

const ZCOL={r:'#e9a77c',c:'#f2cf54',o:'#7aa6e8',i:'#9a958e'};
const ASF=['#585e63','#51575c','#4a5055','#43494e'];
const DIRS=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
const hh=(i,j,s)=>((i*374761393+j*668265263+s*2147483)>>>0)%1000/1000;
const UI='<div id="tv" style="position:fixed;inset:0;z-index:60;background:#000;touch-action:none;user-select:none"><canvas id="tvc" style="width:100%;height:100%;display:block"></canvas>'
+'<div id="tvh" class="fl" style="left:10px;top:calc(10px + env(safe-area-inset-top,0px));padding:8px 12px;font-weight:700"></div>'
+'<button id="tvx" class="b fl" style="right:10px;top:calc(10px + env(safe-area-inset-top,0px))">Выйти</button>'
+'<button id="tvr" class="b fl" style="right:10px;bottom:calc(20px + env(safe-area-inset-bottom,0px))">Бег</button>'
+'<div id="tvj" style="position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid #fff8;display:none"><div id="tvk" style="position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fff9"></div></div></div>';
$('#p2').insertAdjacentHTML('beforeend','<button id="trv" class="b">Путешествие</button>');
let T=null;
$('#trv').onclick=()=>{if(T)return;(window.THREE?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})).then(go).catch(()=>alert('Не удалось загрузить 3D-движок. Нужен интернет.'))};

function go(){
if(T)return;T={raf:0};
const TH=THREE,S=City.S,V=City.view,u=City.bu();
let px=(cv.clientWidth/2-V.x)/V.k,pz=(cv.clientHeight/2-V.y)/V.k;const X0=px,Z0=pz,RNG=1600;
document.body.insertAdjacentHTML('beforeend',UI);
const tv=$('#tv'),hud=$('#tvh'),jb=$('#tvj'),jk=$('#tvk');
const renderer=new TH.WebGLRenderer({canvas:$('#tvc'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new TH.Scene(),cam=new TH.PerspectiveCamera(70,1,.5,8000);cam.rotation.order='YXZ';
const hemi=new TH.HemisphereLight('#ffffff','#556655',1),sun=new TH.DirectionalLight('#fff4dd',1);scene.add(hemi,sun);
scene.background=new TH.Color('#8ec5f0');scene.fog=new TH.Fog('#8ec5f0',200,3000);
const L=(c,o)=>new TH.MeshLambertMaterial(Object.assign({color:c},o||{}));
const dimc=(c,f)=>new TH.Color(c).multiplyScalar(f);
const rs=()=>{renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};rs();addEventListener('resize',rs);

/* текстура окон */
const wc=document.createElement('canvas');wc.width=wc.height=64;const g=wc.getContext('2d');
g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='#6d8497';[[8,10],[36,10],[8,38],[36,38]].forEach(a=>g.fillRect(a[0],a[1],20,16));
const wt=new TH.CanvasTexture(wc);wt.wrapS=wt.wrapT=TH.RepeatWrapping;wt.repeat.set(1/12,1/12);

/* плоский слой: земля, дороги, тротуары */
const fp=[],fc=[],cc=new TH.Color();
const tri=(a,b,c,k)=>{fp.push(...a,...b,...c);cc.set(k);for(let i=0;i<3;i++)fc.push(cc.r,cc.g,cc.b)};
const quad=(x,z,s,y,k)=>{tri([x,y,z],[x,y,z+s],[x+s,y,z],k);tri([x+s,y,z],[x,y,z+s],[x+s,y,z+s],k)};
function rib(pts,w,y,k){for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz);if(!l)continue;dx/=l;dz/=l;
 const e=w*.35,ax=a[0]-dx*e,az=a[1]-dz*e,bx=b[0]+dx*e,bz=b[1]+dz*e,nx=-dz*w/2,nz=dx*w/2;
 const A=[ax+nx,y,az+nz],B=[ax-nx,y,az-nz],C=[bx+nx,y,bz+nz],D=[bx-nx,y,bz-nz];tri(A,B,C,k);tri(B,D,C,k)}}

const ground=new TH.Mesh(new TH.PlaneGeometry(40000,40000),L('#9db38a'));ground.rotation.x=-Math.PI/2;ground.position.set(X0,-.3,Z0);scene.add(ground);

/* ландшафт */
const trees=[],mts=[],TT=S.terr||{};
for(const key in TT){const p=key.split(','),s=TT[key];for(let n=0;n<1024;n++){const ch=s[n];if(ch===' ')continue;
 const i=+p[0]*32+(n&31),j=+p[1]*32+(n>>5),x=i*TC,z=j*TC;if(Math.abs(x-X0)>RNG||Math.abs(z-Z0)>RNG)continue;
 quad(x,z,TC,ch==='w'?0:ch==='s'?.01:.02,TCOL[ch]||'#b0cb86');
 if(ch==='f')trees.push([x+TC*(.2+.6*hh(i,j,3)),z+TC*(.2+.6*hh(i,j,4)),.8+.6*hh(i,j,5)]);
 else if(ch==='m')mts.push([x+TC/2,z+TC/2,hh(i,j,6)])}}
(S.trees||[]).forEach(t=>trees.push([t.x,t.y,1]));

/* дороги */
S.roads.forEach(R=>rib(R.pts,RW[R.t]+6,.05,'#b9b9b1'));
S.roads.forEach(R=>rib(R.pts,RW[R.t],.2+R.t*.02,ASF[R.t]));
S.roads.forEach(R=>{if(!R.ow)rib(R.pts,.6,.4,'#d2a800')});
(S.rwys||[]).forEach(R=>rib(R.pts,+R.w||30,.25,'#4a5258'));
(S.taxis||[]).forEach(R=>rib(R.pts,+R.w||14,.25,'#6b747a'));
{const gm=new TH.BufferGeometry();gm.setAttribute('position',new TH.Float32BufferAttribute(fp,3));gm.setAttribute('color',new TH.Float32BufferAttribute(fc,3));gm.computeVertexNormals();
 scene.add(new TH.Mesh(gm,L('#fff',{vertexColors:true,side:TH.DoubleSide})))}

/* здания */
const blocks=[];
function ext(pts,h,col){
 if(pts.length<3)return;
 const geo=new TH.ExtrudeGeometry(new TH.Shape(pts.map(p=>new TH.Vector2(p[0],-p[1]))),{depth:h,bevelEnabled:false});geo.rotateX(-Math.PI/2);
 scene.add(new TH.Mesh(geo,[L(dimc(col,.75)),L(col,{map:wt})]));
 const xs=pts.map(p=>p[0]),zs=pts.map(p=>p[1]);blocks.push({pts,bb:[Math.min(...xs)-2,Math.min(...zs)-2,Math.max(...xs)+2,Math.max(...zs)+2]});
}
function flat(pts,col){
 if(pts.length<3)return;
 const geo=new TH.ShapeGeometry(new TH.Shape(pts.map(p=>new TH.Vector2(p[0],-p[1]))));geo.rotateX(-Math.PI/2);
 const m=new TH.Mesh(geo,L(col,{side:TH.DoubleSide}));m.position.y=.03;scene.add(m);
}
const rp=b=>b.pts||[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]];
S.blds.forEach(b=>{
 const p=rp(b),col=(BLD[b.t]||BLD.house)[1];
 if(b.t==='park'||b.t==='water'){flat(p,col);
  if(b.t==='park'){const xs=p.map(q=>q[0]),zs=p.map(q=>q[1]);let c=0;
   for(let x=Math.min(...xs);x<Math.max(...xs)&&c<200;x+=24)for(let z=Math.min(...zs);z<Math.max(...zs)&&c<200;z+=24){const q=[x+hh(x|0,z|0,1)*16,z+hh(x|0,z|0,2)*16];if(inPoly(q,p)){trees.push([q[0],q[1],.9+.5*hh(x|0,z|0,3)]);c++}}}
  return}
 ext(p,(HT[b.t]||20)*(.85+.3*hh(Math.round(b.x),Math.round(b.y),7)),col);
});
[['depots','#0c8a86',12],['svc','#9aa3a8',12],['ports','#1f6f9f',10]].forEach(a=>(S[a[0]]||[]).forEach(o=>{if(o.pts)ext(o.pts,a[2],a[1])}));
(S.lms||[]).forEach(l=>ext([[l.x-29,l.y-20],[l.x+29,l.y-20],[l.x+29,l.y+20],[l.x-29,l.y+20]],150,'#5f93d6'));

/* зоны */
const Z=S.zones,gt=City.game?City.game.day:0,zb=[];
if(Z)for(const key in Z){const p=key.split(','),z=Z[key];for(let n=0;n<1024;n++){const t=z.t[n];if(t===' ')continue;
 const f=clamp((gt-(z.d.charCodeAt(n)-256))/6,0,1);if(f<=0)continue;
 const i=+p[0]*32+(n&31),j=+p[1]*32+(n>>5),x=i*TC,y=j*TC;if(Math.abs(x-X0)>RNG||Math.abs(y-Z0)>RNG)continue;
 zb.push({x:x+TC/2,z:y+TC/2,w:TC*(.35+.5*f),d:TC*(.3+.45*f),H:HB[t]*(.4+.6*f)*(.75+.5*hh(i,j,2)),c:ZCOL[t],v:.8+.3*hh(i,j,9)})}}
function inst(geo,mat,list,fn){if(!list.length)return;const im=new TH.InstancedMesh(geo,mat,list.length),d=new TH.Object3D(),c=new TH.Color();
 list.forEach((o,i)=>{fn(o,d,c);d.updateMatrix();im.setMatrixAt(i,d.matrix);im.setColorAt(i,c)});scene.add(im)}
const box=new TH.BoxGeometry(1,1,1);box.translate(0,.5,0);
const cone=new TH.ConeGeometry(1,1,6);cone.translate(0,.5,0);
const cyl=new TH.CylinderGeometry(1,1,1,5);cyl.translate(0,.5,0);
inst(box,L('#fff'),zb.slice(0,25000),(o,d,c)=>{d.position.set(o.x,0,o.z);d.scale.set(o.w,o.H,o.d);d.rotation.set(0,0,0);c.set(o.c).multiplyScalar(o.v)});
inst(cyl,L('#6b4f3a'),trees.slice(0,12000),(o,d,c)=>{d.position.set(o[0],0,o[1]);d.scale.set(.6*o[2],5*o[2],.6*o[2]);d.rotation.set(0,0,0);c.set('#fff')});
inst(cone,L('#fff'),trees.slice(0,12000),(o,d,c)=>{d.position.set(o[0],4*o[2],o[1]);d.scale.set(5*o[2],11*o[2],5*o[2]);d.rotation.set(0,0,0);c.set('#4c8a47').multiplyScalar(.85+.3*hh(o[0]|0,o[1]|0,1))});
inst(cone,L('#fff'),mts.slice(0,6000),(o,d,c)=>{d.position.set(o[0],0,o[1]);d.scale.set(10,25+o[2]*35,10);d.rotation.set(0,0,0);c.set('#8f9088')});

/* остановки и светофоры */
S.stops.forEach(s=>{const p=new TH.Mesh(cyl,L('#555'));p.scale.set(.3,7,.3);p.position.set(s.x+6,0,s.y);scene.add(p);
 const q=new TH.Mesh(box,L('#0c8a86'));q.scale.set(.4,1.8,2.4);q.position.set(s.x+6,5,s.y);scene.add(q)});
const lights=[];
(S.lights||[]).forEach(l=>{const p=new TH.Mesh(cyl,L('#333'));p.scale.set(.4,9,.4);p.position.set(l.x+7,0,l.y-7);scene.add(p);
 const h=new TH.Mesh(box,L('#1c2226'));h.scale.set(1.6,4.2,1.6);h.position.set(l.x+7,8.5,l.y-7);scene.add(h);
 const ms=[0,1,2].map(i=>{const m=new TH.MeshBasicMaterial({color:'#333'}),s=new TH.Mesh(new TH.SphereGeometry(.55,8,8),m);s.position.set(l.x+7,12-i*1.3,l.y-6.1);scene.add(s);return m});lights.push(ms)});

/* столкновения */
const near=(x,z,pad)=>S.roads.some(R=>R.pts.some((q,i)=>i&&dseg([x,z],R.pts[i-1],q)<RW[R.t]/2+pad));
const isW=(x,z)=>{const i=Math.floor(x/TC),j=Math.floor(z/TC),s=S.terr&&S.terr[(i>>5)+','+(j>>5)];if(!s)return false;const c=s.charAt(((j&31)<<5)|(i&31));return c==='w'||c==='s'};
function blk(x,z){
 for(const b of blocks){if(x<b.bb[0]||x>b.bb[2]||z<b.bb[1]||z>b.bb[3])continue;
  if(inPoly([x,z],b.pts))return true;
  for(let i=0;i<b.pts.length;i++)if(dseg([x,z],b.pts[i],b.pts[(i+1)%b.pts.length])<1.5)return true}
 return isW(x,z)&&!near(x,z,3);
}
if(blk(px,pz)){search:for(let r=10;r<400;r+=10)for(let a=0;a<12;a++){const x=X0+Math.cos(a*.52)*r,z=Z0+Math.sin(a*.52)*r;if(!blk(x,z)){px=x;pz=z;break search}}}

/* ввод */
let yaw=0,pit=0,jid=null,lid=null,jo=null,lp=null,jx=0,jy=0,run=false,bob=0;const keys=new Set();
const kd=e=>{if(e.code==='Escape'){exit();return}keys.add(e.code);e.stopPropagation();if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()};
const ku=e=>{keys.delete(e.code);e.stopPropagation()};
addEventListener('keydown',kd,true);addEventListener('keyup',ku,true);
tv.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;tv.setPointerCapture(e.pointerId);
 if(e.pointerType==='touch'&&e.clientX<innerWidth*.45&&jid===null){jid=e.pointerId;jo=[e.clientX,e.clientY];jb.style.display='block';jb.style.left=(jo[0]-50)+'px';jb.style.top=(jo[1]-50)+'px';jk.style.transform='none'}
 else if(lid===null){lid=e.pointerId;lp=[e.clientX,e.clientY]}});
tv.addEventListener('pointermove',e=>{
 if(e.pointerId===jid){let dx=e.clientX-jo[0],dy=e.clientY-jo[1];const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;jk.style.transform='translate('+dx+'px,'+dy+'px)'}
 else if(e.pointerId===lid){yaw-=(e.clientX-lp[0])*.005;pit=clamp(pit-(e.clientY-lp[1])*.005,-1.3,1.3);lp=[e.clientX,e.clientY]}});
const up=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;jb.style.display='none'}if(e.pointerId===lid)lid=null};
tv.addEventListener('pointerup',up);tv.addEventListener('pointercancel',up);
$('#tvx').onclick=()=>exit();
$('#tvr').onclick=e=>{run=!run;e.currentTarget.classList.toggle('on',run)};

/* транспорт из 2D-симуляции */
const veh=new Map(),eye=1.7*u,skyN=new TH.Color('#0b1226'),skyD=new TH.Color('#8ec5f0'),skyB=new TH.Color('#8a949c'),sk=new TH.Color();
let last=Date.now(),hAt=0;
const API={cam,scene,veh,u,tv,blk,pos:(x,z)=>{px=x;pz=z},get:()=>({x:px,z:pz,yaw,pit}),setYaw:v=>{yaw=v},setPit:v=>{pit=v}};
if(City.trip&&City.trip.start)City.trip.start(API);
function frame(){
 T.raf=requestAnimationFrame(frame);
 const n=Date.now(),dt=Math.min(.1,(n-last)/1000);last=n;
 const k=c=>keys.has(c);
 yaw+=((k('ArrowLeft')?1:0)-(k('ArrowRight')?1:0))*1.8*dt;
 let f=(k('KeyW')||k('ArrowUp')?1:0)-(k('KeyS')||k('ArrowDown')?1:0)-jy,r=(k('KeyD')?1:0)-(k('KeyA')?1:0)+jx;
 const l=Math.hypot(f,r);if(l>1){f/=l;r/=l}
 const sp=(run||k('ShiftLeft')||k('ShiftRight')?15:5)*u*dt,s=Math.sin(yaw),c=Math.cos(yaw),mx=(-s*f+c*r)*sp,mz=(-c*f-s*r)*sp;
 if(!(City.trip&&City.trip.move&&City.trip.move(f,r,dt,run||k('ShiftLeft')||k('ShiftRight')))){if(!blk(px+mx,pz))px+=mx;if(!blk(px,pz+mz))pz+=mz}
 if(l>.05)bob+=dt*9*(run?1.6:1);
 cam.position.set(px,eye+Math.sin(bob)*.06*u,pz);cam.rotation.set(pit,yaw,0);
 /* небо, свет, погода */
 const gm=City.gm?City.gm():720,h=(((gm%1440)+1440)%1440)/60,day=clamp(Math.sin((h-6)/12*Math.PI)*1.6,0,1),w=(S.wx&&S.wx.t)||'clear',bad=w!=='clear';
 sk.copy(skyN).lerp(skyD,Math.max(day,.04));if(bad)sk.lerp(skyB,.5*Math.max(day,.2));
 scene.background.copy(sk);scene.fog.color.copy(sk);scene.fog.far=w==='fog'?450:bad?1400:3000;
 hemi.intensity=.3+.65*day*(bad?.75:1);sun.intensity=.05+.95*day*(bad?.5:1);
 const a=((h-6)/12)*Math.PI;sun.position.set(px+Math.cos(a)*500,Math.max(80,Math.sin(a)*500),pz+200);
 /* светофоры */
 const ph=City.lightPhase?City.lightPhase(0):'g';
 lights.forEach(m=>{m[0].color.set(ph==='r'?'#ff3030':'#401010');m[1].color.set(ph==='y'?'#ffd030':'#403810');m[2].color.set(ph==='g'?'#30e060':'#104020')});
 /* машины и автобусы */
 const seen=new Set();
 (City.vis()||[]).forEach(q=>{if(q.k!=='car'&&q.k!=='bus')return;
  const bus=q.k==='bus',len=q.r*2;let v=veh.get(q.ref);
  const B3=bus&&City.bus3d&&City.bus3d.has(q.ref.m);
  if(!v){v={m:B3?City.bus3d.make(TH):new TH.Mesh(box,L(bus?q.ref.c:q.ref.col)),px:q.x,py:q.y,an:0,b3:B3};scene.add(v.m);veh.set(q.ref,v)}
  const dx=q.x-v.px,dy=q.y-v.py;if(dx*dx+dy*dy>.01){v.an=Math.atan2(dy,dx);v.px=q.x;v.py=q.y}
  v.m.position.set(q.x,.3,q.y);v.m.rotation.y=-v.an;if(v.b3){v.m.scale.setScalar(u);City.bus3d.tick(v.m,q.ref,q.R)}else v.m.scale.set(len,bus?3.2*u:len*.3,bus?2.55*u:len*.4);v.m.visible=true;seen.add(q.ref)});
 veh.forEach((v,key)=>{if(!seen.has(key))v.m.visible=false});
 /* подсказка */
 if(n-hAt>300){hAt=n;let st='';
  for(const R of S.roads){let ok=false;for(let i=1;i<R.pts.length;i++)if(dseg([px,pz],R.pts[i-1],R.pts[i])<RW[R.t]/2+4){ok=true;break}if(ok){st=R.n||'';break}}
  const hd=((-yaw*180/Math.PI)%360+360)%360,mm=Math.floor(h*60)%60;
  hud.textContent=DIRS[Math.round(hd/45)%8]+' · '+(st||'—')+' · '+String(Math.floor(h)).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
 if(City.bus3d)City.bus3d.frame();
if(City.trip&&City.trip.tick)City.trip.tick(dt);
renderer.render(scene,cam);
}
function exit(){
 if(!T)return;if(City.trip&&City.trip.stop)City.trip.stop();cancelAnimationFrame(T.raf);removeEventListener('keydown',kd,true);removeEventListener('keyup',ku,true);removeEventListener('resize',rs);
 scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(m=>m.dispose())});
 renderer.dispose();tv.remove();T=null;City.redraw();
}
frame();
}
})();

<script>
/* ===== Плагин: 3D-автобус YUTONG ZK6890HGQ (снаружи) =====
   Вставить отдельным <script> СРАЗУ ПОСЛЕ плагина «3D-автобус ПАЗ-320415-04».
   Рядом с index.html положить: yutong_front.webp, yutong_side_doors.webp, yutong_side.webp, yutong_rear.webp
   Плагин расширяет City.bus3d: ПАЗ продолжает работать как раньше. */
(function(){
const MODEL='Yutong ZK6890HGQ';
const PHOTO={front:'yutong_front.webp',doors:'yutong_side_doors.webp',left:'yutong_side.webp',rear:'yutong_rear.webp'};
const prev=City.bus3d;
let TH=null,M=null,GEO=null,lastModel=null;
const B=new Map();

/* ---------- материалы и геометрия (метры; ось x — вперёд, z>0 — правый борт с дверями) ---------- */
function mats(){
  if(M)return M;
  const L=c=>new TH.MeshLambertMaterial({color:c});
  const ph=(k,fb)=>{const m=L(fb);
    new TH.TextureLoader().load(PHOTO[k],t=>{m.map=t;m.color.set('#fff');m.needsUpdate=true},undefined,()=>{});return m};
  /* порядок граней BoxGeometry: +x перед, -x зад, +y крыша, -y низ, +z правый борт (двери), -z левый борт */
  return M={body:[ph('front','#f2f4f5'),ph('rear','#f2f4f5'),L('#eef0f1'),L('#222'),ph('doors','#f2f4f5'),ph('left','#f2f4f5')],
    wheel:L('#17191b'),hub:L('#9aa0a4'),cng:L('#f1f3f4'),ac:L('#f7f8f9'),seam:L('#8d979e'),dark:L('#1c2226')};
}
function geo(){
  if(GEO)return GEO;
  const w=new TH.CylinderGeometry(.46,.46,.3,18);w.rotateX(Math.PI/2);
  const h=new TH.CylinderGeometry(.26,.26,.32,12);h.rotateX(Math.PI/2);
  return GEO={body:new TH.BoxGeometry(8.9,2.69,2.5),w,h};
}
function make(T){
  TH=T;const g=new TH.Group(),m=mats(),G=geo();
  const add=(w,h,d,x,y,z,mt)=>{const o=new TH.Mesh(new TH.BoxGeometry(w,h,d),mt);o.position.set(x,y,z);g.add(o);return o};
  /* кузов: низ 0,24 м, крыша 2,93 м */
  const body=new TH.Mesh(G.body,m.body);body.position.y=.24+1.345;g.add(body);
  /* КРЫША. Большой блок спереди — метановые баллоны (CNG), меньший за ним — кондиционер */

/* ---------- номер и текст из названия маршрута: «60 Придонской — Боровое» ---------- */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){
    const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);
    if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n;
  }
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
/* бегущая строка (перед и бок): номер слева, текст едет слева направо */
function board(num,txt,w,h,kind){
  const key=kind+'|'+num+'|'+txt;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
    o={c,t:new TH.CanvasTexture(c),num,txt,used:0};B.set(key,o)}
  return o;
}
/* зад: только номер */
function rearBoard(num){
  const key='r|'+num;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=320;c.height=66;const g=c.getContext('2d');
    g.fillStyle='#24272a';g.fillRect(0,0,320,66);g.fillStyle='#ffb21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(num.length>2?46:56)+'px Manrope,Arial,sans-serif';g.fillText(num,160,36);
    o={c,t:new TH.CanvasTexture(c),static:1};B.set(key,o)}
  return o;
}
function paint(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.fillStyle='#1d2023';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H*.9;g.fillStyle='#ffb21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+Math.round(H*(o.num.length>2?.62:.8))+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+2);
    g.fillStyle='#ffb21a55';g.fillRect(nw+10,H*.18,2,H*.64);rx=nw+20}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 '+Math.round(H*.62)+'px Manrope,Arial,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#ffb21a';
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;
  g.fillText(o.txt,x,H/2+2);g.restore();
  g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<W;i+=3)g.fillRect(i,0,1,H);   /* зерно светодиодов */
  o.t.needsUpdate=true;
}
function tick(g,b,R){
  const p=parse(R,City.busLeg?City.busLeg(b):0),bm=g.userData.yt;
  const f=board(p.num,p.txt,1.4,.22,'f'),s=board(p.num,p.txt,1.4,.3,'s'),r=rearBoard(p.num);
  f.used=s.used=1;
  [['front',f],['side',s],['rear',r]].forEach(([k,o])=>{if(bm[k].map!==o.t){bm[k].map=o.t;bm[k].color.set('#fff');bm[k].needsUpdate=true}});
}
function frame(){B.forEach(o=>{if(o.used&&!o.static)paint(o);o.used=0})}

/* ---------- подключение: City.bus3d теперь знает ПАЗ и Yutong ---------- */
City.bus3d={
  has:m=>{lastModel=m;return m===MODEL||(prev?prev.has(m):false)},
  /* «Путешествие» вызывает has(модель), а сразу следом make(TH) — запоминаем модель из has */
  make:(T,m)=>{m=m||lastModel;return m===MODEL?make(T):prev.make(T)},
  tick:(g,b,R)=>{if(g.userData.yt)tick(g,b,R);else if(prev)prev.tick(g,b,R)},
  frame:()=>{if(prev)prev.frame();frame()}
};
})();

let API=null,root=null,btn=null,open=false,app='home',G=null,B=null,mvG=null,mvB=null,keyH=null,pdown=false,acc=0,acc2=0,sugArr=[],RG=null;

const isLoop=tr=>tr.stops.length>2&&tr.stops[0].id===tr.stops[tr.stops.length-1].id;
const revTr=tr=>({L:tr.L,stops:tr.stops.slice().reverse().map(x=>({id:x.id,s:tr.L-x.s}))});
/* через сколько игровых минут автобус b придёт на остановку id (null — не придёт) */
function etaBus(b,id){
  const st=bst(b);if(!st||!st.run||!st.tr)return null;
  const tr=st.tr,v=(tr.kmh*.85/3.6*4/mpu())||1,loop=isLoop(tr),sch=st.sch;
  if(!st.park&&st.dw>0){const s=tr.stops[st.si-1];if(s&&s.id===id)return 0}
  let t=0;const d=st.park?0:st.d;
  if(st.park&&sch&&!((st.due||0)>0)){
    const ds=parseDep(b.dep).map(x=>{let m=x-tod();if(m<=0)m+=1440;return m});
    if(!ds.length)return null;t=Math.min(...ds);
  }
  const seq=[tr];if(!sch){seq.push(loop?tr:revTr(tr),tr)}
  for(let k=0;k<seq.length;k++){
    const T=seq[k],d0=k?0:d,incl=k>0||st.park;
    for(const s of T.stops){
      if(s.id!==id)continue;

      const n=T.stops.filter(x=>x.s>d0+.5&&x.s<s.s-.5).length;

    t+=((T.L-d0)/v+T.stops.filter(x=>x.s>d0+.5).length*DW)/25;

}

/* ---------- куча для Дейкстры ---------- */
class Heap{
  constructor(){this.a=[];this.n=0}
  push(k,v){const a=this.a;let i=this.n++;a[i]=[k,v];while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p}}
  pop(){const a=this.a,r=a[0],l=a[--this.n];
    if(this.n>0){a[0]=l;let i=0;for(;;){let m=i;const x=2*i+1,y=x+1;if(x<this.n&&a[x][0]<a[m][0])m=x;if(y<this.n&&a[y][0]<a[m][0])m=y;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m}}
    return r}
}

/* ---------- дорожный граф (авто и пешком) ---------- */
function graph(){
  if(RG&&RG.S===City.S)return RG;
  const S=City.S,segs=[];
  S.roads.forEach(R=>{for(let i=1;i<R.pts.length;i++){const a=R.pts[i-1],b=R.pts[i];
    segs.push({a,b,R,sp:[[0,a],[1,b]],x0:Math.min(a[0],b[0])-1,x1:Math.max(a[0],b[0])+1,y0:Math.min(a[1],b[1])-1,y1:Math.max(a[1],b[1])+1})}});
  for(let i=0;i<segs.length;i++){const s=segs[i];
    for(let j=i+1;j<segs.length;j++){const u=segs[j];
      if(s.R===u.R||s.x1<u.x0||u.x1<s.x0||s.y1<u.y0||u.y1<s.y0)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],w=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*w[1]-r[1]*w[0];
      if(Math.abs(den)<1e-9)continue;
      const d=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(d[0]*w[1]-d[1]*w[0])/den,v=(d[0]*r[1]-d[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=lp(s.a,s.b,clamp(t,0,1));s.sp.push([t,p]);u.sp.push([v,p]);
    }}
  const links=[];
  S.roads.forEach(R=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
    let best=null;
    segs.forEach(s=>{if(s.R===R)return;const r=proj(e,s.a,s.b);if(r.d<8&&(!best||r.d<best.r.d))best={s,r}});
    if(best&&best.r.d>.05){best.s.sp.push([best.r.t,best.r.q]);links.push([e,best.r.q,R])}
  }));
  const idx=new Map(),pts=[],adj=[];
  const node=p=>{const k=Math.round(p[0]*10)+','+Math.round(p[1]*10);let i=idx.get(k);if(i===undefined){i=pts.length;idx.set(k,i);pts.push(p);adj.push([])}return i};

/* ---------- маршрут на автобусах ---------- */
const hopC=new Map();
function hop(a,b){
  const k=a+'>'+b;let h=hopC.get(k);
  if(!h){const pts=stopPts({s:[a,b],loop:false}),m=lenPts(pts)*mpu();h={pts,m,min:m/SPD(35*.85)+DW/25};hopC.set(k,h)}
  return h;
}
function lines(all){
  const out=[];
  City.S.routes.forEach(R=>{
    const bs=R.buses||[];
    [{vi:-1,s:R.s,loop:R.loop}].concat((R.vars||[]).map((v,i)=>({vi:i,s:v.s,loop:v.loop}))).forEach(v=>{
      const served=bs.some(b=>bvi(R,b)===v.vi);
      if(!served&&!all)return;
      const ids=v.s.filter(id=>sb(id));
      if(ids.length>1)out.push({R,vi:v.vi,ids,loop:!!v.loop,served});
    });
  });
  return out;
}
function waitFor(R,vi,id){
  let best=null;
  (R.buses||[]).forEach(b=>{if(bvi(R,b)!==vi)return;const e=etaBus(b,id);if(e!==null&&(best===null||e<best))best=e});
  return best;
}
function transit(a,b){
  for(const all of [false,true]){
    const L=lines(all);if(!L.length)continue;
    const r=tdij(a,b,L);
    if(r){if(r.noBus)r.warn='На части линий маршрута сейчас нет автобусов.';return r}
  }
  return null;
}
function tdij(a,b,L){
  const WR=900/mpu(),TR=260/mpu(),byStop=new Map();
  L.forEach((l,li)=>l.ids.forEach((id,idx)=>{if(!byStop.has(id))byStop.set(id,[]);byStop.get(id).push({li,idx})}));
  if(!byStop.size)return null;
  const xy=id=>{const s=sb(id);return[s.x,s.y]},wk=(p,r)=>dst(p,r)*1.25*mpu()/WALK;
  const pointOf=k=>k==='S'?a:k==='T'?b:xy(+k.split(':').pop());
  const D=new Map([['S',0]]),P=new Map(),h=new Heap();h.push(0,'S');
  const rel=(k,c,f,m)=>{if(c<(D.has(k)?D.get(k):Infinity)){D.set(k,c);P.set(k,[f,m]);h.push(c,k)}};
  while(h.n){
    const[c,k]=h.pop();if(c>D.get(k)+1e-9)continue;if(k==='T')break;
    if(k==='S'){
      byStop.forEach((_,id)=>{const p=xy(id);if(dst(a,p)<=WR)rel('f:'+id,c+wk(a,p),k,{t:'walk'})});
      if(dst(a,b)<=WR)rel('T',c+wk(a,b),k,{t:'walk'});
      continue;
    }
    const w=k.split(':');
    if(w[0]==='f'){
      const id=+w[1],p=xy(id);
      byStop.get(id).forEach(x=>rel('b:'+x.li+':'+id,c+WAIT,k,{t:'board',li:x.li}));
      byStop.forEach((_,j)=>{if(j===id)return;const p3=xy(j);if(dst(p,p3)<=TR)rel('f:'+j,c+wk(p,p3)+1,k,{t:'walk'})});
      if(dst(p,b)<=WR)rel('T',c+wk(p,b),k,{t:'walk'});
    }else{
      const li=+w[1],id=+w[2],l=L[li];
      rel('f:'+id,c+.1,k,{t:'alight'});
      byStop.get(id).filter(x=>x.li===li).forEach(x=>{
        const n=l.ids.length,nb=[];
        if(l.loop)nb.push((x.idx+1)%n);else{if(x.idx+1<n)nb.push(x.idx+1);if(x.idx>0)nb.push(x.idx-1)}
        nb.forEach(j=>{const nid=l.ids[j];rel('b:'+li+':'+nid,c+hop(id,nid).min,k,{t:'ride',li,a:id,b:nid})});

  for(let i=0;i<ed.length;i++){
    const e=ed[i];
    if(e.m.t==='walk'){
      const p0=pointOf(e.f),p1=pointOf(e.k),m=dst(p0,p1)*1.25*mpu(),mn=m/WALK,z=e.k.startsWith('f:')?sb(+e.k.slice(2)):null;
      dist+=m;el+=mn;
      steps.push({t:'walk',text:'Идите '+fd(m)+(z?' до остановки «'+z.n+'»':e.k==='T'?' до места назначения':''),min:mn});
      segs.push({pts:[p0,p1],col:'#6b7780',dash:1});
    }else if(e.m.t==='board'){
      const l=L[e.m.li],id0=+e.k.split(':')[2];
      let j=i+1,ride=0,mm=0,pts=[],last=id0,n=0;
      while(j<ed.length&&ed[j].m.t==='ride'){
        const hp=hop(ed[j].m.a,ed[j].m.b);ride+=hp.min;mm+=hp.m;pts=pts.concat(pts.length?hp.pts.slice(1):hp.pts);last=ed[j].m.b;n++;j++;
      }
      const eta=waitFor(l.R,l.vi,id0);
      if(eta===null&&!l.served)noBus=true;
      const wait=eta===null?WAIT:Math.max(0,eta-el);
      el+=wait+ride;dist+=mm;xf++;
      steps.push({t:'ride',text:'Автобус '+l.R.n,sub:'«'+sb(id0).n+'» → «'+sb(last).n+'» · остановок: '+n,min:wait+ride,eta:eta===null?null:Math.max(0,eta-(el-wait-ride))});

      i=j-1;
    }
  }
  return{steps,segs,min:el,m:dist,xfer:Math.max(0,xf-1),noBus};
}

function mapName(w){
  let best=null;
  City.S.roads.forEach(R=>{if(!R.n)return;for(let i=1;i<R.pts.length;i++){const d=dseg(w,R.pts[i-1],R.pts[i]);if(d<RW[R.t]/2+12&&(!best||d<best.d))best={d,R}}});
  return best?'Точка у «'+best.R.n+'»':'Точка на карте';
}
function render(){
  gRows();gSug();gRes();
  root.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===G.mode));
  q('#g-sh').classList.toggle('min',G.min);mvG.dirty=1;
}
function gRows(){
  const n=G.pts.length;
  q('#g-rows').innerHTML=G.pts.map((p,i)=>{
    const L=i===0?'A':i===n-1?'B':String(i),col=i===0?'#2e7cf6':i===n-1?'#d7263d':'#e9a400';
    return `<div class="pr${i===G.act?' on':''}"><span class="pd" style="background:${col}">${L}</span><input data-i="${i}" placeholder="${i===0?'Откуда':i===n-1?'Куда':'Остановка по пути'}" value="${E(p?p.n:'')}" autocomplete="off"><button class="b" data-clr="${i}" aria-label="Очистить">✕</button></div>`;
  }).join('');
}
function gSug(){
  const el=q('#g-sug');
  if(!G.sugOn||G.res){el.innerHTML='';sugArr=[];return}
  const qq=G.q.trim().toLowerCase(),p=me(),L=[];
  if(!qq||'моё положение'.includes(qq))L.push({me:1,n:'Моё положение',ic:'📍',sub:'по геолокации'});
  const pls=places();pls.forEach(x=>x.d=dst(p,[x.x,x.y]));
  pls.filter(x=>!qq||String(x.n).toLowerCase().includes(qq)).sort((a,b)=>a.d-b.d).slice(0,7).forEach(x=>L.push(Object.assign({sub:fd(x.d*mpu())},x)));
  sugArr=L;
  el.innerHTML=L.length?L.map((s,i)=>`<button class="sg" data-k="${i}"><span>${s.ic}</span><div><b>${E(s.n)}</b><small>${E(s.sub)}</small></div></button>`).join(''):'<div class="hn">Ничего не найдено. Нажмите на карту.</div>';
}
function gRes(){
  const el=q('#g-res');
  if(G.err){el.innerHTML=`<div class="er">${E(G.err)}</div>`;return}
  const r=G.res;
  if(!r){el.innerHTML=G.sugOn?'':'<div class="hn">Выберите точки маршрута.</div>';return}
  const ic={walk:'🚶',ride:'🚌',car:'🚗',via:'📍',road:'↳'};
  el.innerHTML=`<div class="sm"><div><b>${fm(r.min)}</b><span>${fd(r.m)}${G.mode==='bus'?' · пересадок: '+r.xfer:''}</span></div><button class="b" data-rf="1" aria-label="Обновить">↻</button></div>`
  +(r.warn?`<div class="er">${E(r.warn)}</div>`:'')
  +r.steps.map(s=>`<div class="stp ${s.t}"><i>${ic[s.t]||''}</i><div><b>${E(s.text)}</b>${s.sub?`<small>${E(s.sub)}</small>`:''}${s.t==='ride'?`<small>${s.eta!==null&&s.eta!==undefined?'Ближайший автобус: '+(s.eta<=.05?'сейчас':'через '+fm(s.eta)):'Автобусов на линии сейчас нет'}</small>`:''}${s.min&&s.t!=='road'?`<small>${s.t==='ride'?'Всего на этом участке: ':''}${fm(s.min)}</small>`:''}</div></div>`).join('');
}
function solve(){
  G.res=null;G.err='';
  if(G.pts.some(p=>!p))return;
  const pos=G.pts.map(p=>p.me?me():[p.x,p.y]),res={steps:[],segs:[],min:0,m:0,xfer:0,warn:''};
  for(let i=0;i<pos.length-1;i++){
    if(i>0)res.steps.push({t:'via',text:'Остановка по пути: '+G.pts[i].n});
    const r=G.mode==='bus'?transit(pos[i],pos[i+1]):gleg(pos[i],pos[i+1],G.mode==='car');
    if(!r){G.err='Маршрут не найден. '+(G.mode==='car'?'Проверьте, что дороги соединены и не перекрыты односторонним движением.':G.mode==='bus'?'Рядом с этими точками нет подходящих автобусных линий.':'');return}
    res.steps.push(...r.steps);res.segs.push(...r.segs);res.min+=r.min;res.m+=r.m;res.xfer+=r.xfer||0;if(r.warn)res.warn=r.warn;
  }
  G.res=res;
  const all=[];res.segs.forEach(s=>s.pts.forEach(p=>all.push(p)));
  mvG.fit(all,50);
}
function after(){
  const e=G.pts.findIndex(p=>!p);
  if(e>=0){G.act=e;G.res=null;G.err='';G.sugOn=true;G.q=''}else solve();
  render();
}
function pickSug(s){
  if(!s)return;
  G.pts[G.act]=s.me?{me:1,n:'Моё положение'}:{n:s.n,x:s.x,y:s.y,stop:s.stop};
  G.sugOn=false;G.q='';after();
}

/* ---------- Где автобус ---------- */
const setH=(el,h)=>{if(el._h!==h&&!pdown){el.innerHTML=h;el._h=h}};
function fillSel(sel,ids,geoLabel){
  const sig=ids.join(',');
  if(sel.dataset.sig!==sig){
    const v=sel.value;
    sel.innerHTML='<option value="geo"></option>'+ids.map(id=>`<option value="${id}">${E((sb(id)||{}).n||'?')}</option>`).join('');
    sel.dataset.sig=sig;
    sel.value=[...sel.options].some(o=>o.value===v)?v:'geo';
  }
  sel.options[0].textContent=geoLabel;
}
function setTab(){
  ['list','stop','det'].forEach(t=>q('#b-'+t).classList.toggle('on',B.tab===t));
  root.querySelectorAll('[data-bt]').forEach(b=>b.classList.toggle('on',b.dataset.bt===B.tab));
  q('#b-tabs').hidden=B.tab==='det';
}
function bList(){
  const bs=allBuses(),el=q('#b-list'),S=City.S;
  if(!bs.length){setH(el,'<div class="hn">В городе пока нет автобусов. Добавьте их в карточке маршрута.</div>');return}
  const g=new Map();bs.forEach(x=>{if(!g.has(x.R))g.set(x.R,[]);g.get(x.R).push(x)});
  let h='';
  g.forEach((a,R)=>{
    h+=`<div class="gh"><i style="background:${E(R.c)}"></i>${E(R.n)}</div>`
    +a.map(x=>`<button class="bi" data-r="${S.routes.indexOf(R)}" data-b="${x.i}"><span class="bc" style="background:${E(x.b.c)}"></span><div><b>${E(x.b.m)} · №${x.i+1}</b><small>${E(bstatus(x.b))}</small></div></button>`).join('');
  });
  setH(el,h);
}
function bArr(){
  const S=City.S,sel=q('#b-ssel'),near=nearestStop();
  if(!S.stops.length){setH(q('#b-arr'),'<div class="hn">В городе нет остановок.</div>');return}
  fillSel(sel,S.stops.map(s=>s.id),near?'📍 Ближайшая к вам: «'+near.s.n+'» · '+fd(near.d*mpu()):'📍 Геопозиция недоступна');
  const id=sel.value==='geo'?(near?near.s.id:null):+sel.value;
  if(id===null)return;
  const rows=[];
  allBuses().forEach(x=>{const e=etaBus(x.b,id);if(e!==null)rows.push(Object.assign({e},x))});
  rows.sort((a,b)=>a.e-b.e);
  let h=rows.map(x=>`<button class="bi" data-r="${S.routes.indexOf(x.R)}" data-b="${x.i}" data-s="${id}"><span class="bc" style="background:${E(x.b.c)}"></span><div><b>${E(x.R.n)}</b><small>${E(x.b.m)} · №${x.i+1}</small></div><em>${x.e<=.05?'сейчас':fm(x.e)}</em></button>`).join('');
  const idle=S.routes.filter(R=>([R.s].concat((R.vars||[]).map(v=>v.s))).some(a=>a.includes(id))&&!rows.some(x=>x.R===R));
  h+=idle.map(R=>`<div class="bi off"><span class="bc" style="background:${E(R.c)}"></span><div><b>${E(R.n)}</b><small>автобусов сейчас нет</small></div></div>`).join('');
  if(!h)h='<div class="hn">Через эту остановку маршрутов нет.</div>';
  setH(q('#b-arr'),h);
}
function bDet(){
  const s=B.sel;if(!s)return;const{R,b}=s,st=bst(b),info=q('#b-info');
  if(!st||!st.tr){setH(info,'<div class="hn">Нет данных об автобусе. Включите кнопку «Автобусы» на панели карты.</div>');return}
  const tr=st.tr,ids=detIds(tr),near=nearestStop(ids),sel=q('#b-dsel');
  fillSel(sel,ids,near?'📍 Ближайшая к вам: «'+near.s.n+'» · '+fd(near.d*mpu()):'📍 Геопозиция недоступна');
  if(B.pre!==null){sel.value=String(B.pre);B.pre=null}
  const id=sel.value==='geo'?(near?near.s.id:null):+sel.value,last=sb(tr.stops[tr.stops.length-1].id);
  q('#b-title').textContent=R.n;
  setH(info,`<b>${E(b.m)}</b><br><small>${E(bstatus(b))}${last?' · конечная «'+E(last.n)+'»':''}</small>`);
  const e=id!==null?etaBus(b,id):null,z=id!==null?sb(id):null;
  setH(q('#b-eta'),z?`<div class="eta"><small>До остановки «${E(z.n)}»</small><b>${e===null?'Автобус сюда не идёт':e<=.05?'Автобус на остановке':'Приедет через '+fm(e)}</b>${e!==null&&e>.05?`<small>≈ в ${hm((tod()+e)%1440)}</small>`:''}</div>`:'');
  const cur=(!st.park&&st.dw>0)?st.si-1:-1,next=(!st.park&&st.dw<=0)?st.si:-1;
  setH(q('#b-stops'),tr.stops.map((x,i)=>{
    const zz=sb(x.id);if(!zz)return'';
    const passed=!st.park&&x.s<=st.d+.5&&i!==cur,ee=passed?null:(i===cur?0:etaBus(b,x.id));
    return `<div class="si${x.id===id?' sel':''}${i===next?' nx':''}${passed?' ps':''}" data-s="${x.id}"><span>${E(zz.n)}</span><b>${passed?'проехал':i===cur?'на остановке':ee===null?'—':fm(ee)}</b></div>`;
  }).join(''));
}
function bUpdate(){
  if(!root)return;
  if(B.tab==='list')bList();else if(B.tab==='stop')bArr();else bDet();
}
function openBus(R,b,pre){
  B.sel={R,b};B.tab='det';B.fol=false;B.pre=pre===undefined?null:pre;
  q('#b-dsel').dataset.sig='';q('#b-dsel')._h=null;
  setTab();
  const st=bst(b);if(st&&st.tr)mvB.fit(st.tr.pts,60);
  bUpdate();
}

function goApp(a){
  app=a;
  ['home','gis','bus'].forEach(n=>q('#ph-'+n).classList.toggle('on',n===a));
  if(a==='gis'){
    if(!mvG.init){const p=me();mvG.v={x:p[0],y:p[1],k:.8};mvG.init=1}
    render();
  }else if(a==='bus'){setTab();bUpdate()}
}
function setOpen(v){
  open=v;root.hidden=!v;btn.classList.toggle('on',v);
  if(v)goApp(app);
  else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
function upd(dt){
  if(!root||!open||!API)return;
  acc+=dt;if(acc<.1)return;const d=acc;acc=0;
  q('#ph-t').textContent=hm(tod());
  if(app==='home'){
    q('#ph-hc').textContent=hm(tod());
    q('#ph-hd').textContent=new Date(Date.UTC(2025,0,1)+(City.gm?City.gm():0)*60000).toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}).replace(' г.','');
  }else if(app==='gis'){
    mvG.draw();
  }else if(app==='bus'){
    acc2+=d;if(acc2>.4){acc2=0;bUpdate()}
    if(B.tab==='det'){
      const st=B.sel&&bst(B.sel.b);
      if(B.fol&&st){mvB.v.x=st.x+(st.ox||0);mvB.v.y=st.y+(st.oy||0)}
      mvB.draw();
    }
  }
}

function mount(tv){
  if(!document.getElementById('ph-css'))document.head.insertAdjacentHTML('beforeend','<style id="ph-css">'+CSS+'</style>');
  tv.insertAdjacentHTML('beforeend',HTML);
  root=tv;btn=tv.querySelector('#ph-btn');
  const ph=tv.querySelector('#ph');
  /* q() ищет внутри root — делаем root самим телефоном для остального, а кнопку держим отдельно */
  root=ph;
  G={pts:[{me:1,n:'Моё положение'},null],act:1,mode:'bus',res:null,err:'',sugOn:true,q:'',min:false};
  B={tab:'list',sel:null,fol:false,pre:null};
  mvG=new MV(q('#g-cv'),gOver);mvB=new MV(q('#b-cv'),bOver);
  ph.addEventListener('pointerdown',e=>{e.stopPropagation();pdown=true});
  ph.addEventListener('pointerup',()=>{pdown=false});
  ph.addEventListener('pointercancel',()=>{pdown=false});
  btn.addEventListener('pointerdown',e=>e.stopPropagation());
  btn.onclick=()=>setOpen(!open);
  q('#ph-x').onclick=()=>setOpen(false);
  q('#ph-hm').onclick=()=>goApp('home');
  ph.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>goApp(b.dataset.app));

  /* --- 3ГИЗ --- */
  const rows=q('#g-rows');
  rows.addEventListener('focusin',e=>{
    const i=e.target.dataset.i;if(i===undefined)return;
    G.act=+i;G.sugOn=true;G.q='';
    rows.querySelectorAll('.pr').forEach((r,j)=>r.classList.toggle('on',j===+i));
    if(e.target.select)e.target.select();
    G.res=null;gSug();gRes();mvG.dirty=1;
  });
  rows.addEventListener('input',e=>{
    const i=+e.target.dataset.i;if(isNaN(i))return;
    G.act=i;G.pts[i]=null;G.res=null;G.err='';G.q=e.target.value;G.sugOn=true;gSug();gRes();mvG.dirty=1;
  });
  rows.addEventListener('keydown',e=>{if(e.key==='Enter'&&sugArr.length){e.preventDefault();pickSug(sugArr[0])}});
  rows.addEventListener('click',e=>{
    const b=e.target.closest('[data-clr]');if(!b)return;
    const i=+b.dataset.clr,n=G.pts.length;
    if(n>2&&i>0&&i<n-1)G.pts.splice(i,1);else G.pts[i]=null;
    G.act=clamp(i,0,G.pts.length-1);G.res=null;G.err='';G.sugOn=true;G.q='';render();
  });
  q('#g-sug').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pickSug(sugArr[+b.dataset.k])});
  q('#g-res').addEventListener('click',e=>{if(e.target.closest('[data-rf]')){solve();render()}});
  ph.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{G.mode=b.dataset.m;if(!G.pts.some(p=>!p))solve();render()});
  q('#g-via').onclick=()=>{G.pts.splice(G.pts.length-1,0,null);G.act=G.pts.length-2;G.res=null;G.err='';G.sugOn=true;G.q='';render()};
  q('#g-sw').onclick=()=>{G.pts.reverse();G.act=0;if(!G.pts.some(p=>!p))solve();else{G.res=null}render()};
  q('#g-grip').onclick=()=>{G.min=!G.min;render()};
  ph.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=+b.dataset.z;
    if(z===0){const p=me();mvG.v.x=p[0];mvG.v.y=p[1];mvG.dirty=1}else mvG.zoom(z>0?1.4:1/1.4);
  });
  mvG.onTap=w=>{
    const k=mvG.v.k;let best=null;
    City.S.stops.forEach(s=>{const d=Math.hypot(s.x-w[0],s.y-w[1]);if(d<16/k&&(!best||d<best.d))best={d,s}});
    G.pts[G.act]=best?{n:best.s.n,x:best.s.x,y:best.s.y,stop:best.s.id}:{n:mapName(w),x:w[0],y:w[1]};
    G.sugOn=false;G.q='';after();
  };

  /* --- Где автобус --- */
  ph.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{B.tab=b.dataset.bt;setTab();bUpdate()});
  const openFrom=e=>{
    const b=e.target.closest('[data-r]');if(!b)return;
    const R=City.S.routes[+b.dataset.r],bus=R&&(R.buses||[])[+b.dataset.b];
    if(R&&bus)openBus(R,bus,b.dataset.s!==undefined?+b.dataset.s:undefined);
  };
  q('#b-list').addEventListener('click',openFrom);
  q('#b-arr').addEventListener('click',openFrom);
  q('#b-ssel').addEventListener('change',()=>{q('#b-arr')._h=null;bUpdate()});
  q('#b-dsel').addEventListener('change',()=>{q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate();mvB.dirty=1});
  q('#b-back').onclick=()=>{B.tab='list';B.sel=null;setTab();bUpdate()};
  q('#b-c').onclick=()=>{B.fol=true;mvB.v.k=Math.max(mvB.v.k,.9);mvB.dirty=1};
  mvB.onPan=()=>{B.fol=false};
  mvB.onTap=w=>{
    const st=B.sel&&bst(B.sel.b);if(!st||!st.tr)return;
    const k=mvB.v.k;let best=null;
    st.tr.stops.forEach(x=>{const s=sb(x.id);if(!s)return;const d=Math.hypot(s.x-w[0],s.y-w[1]);if(d<18/k&&(!best||d<best.d))best={d,id:x.id}});
    if(best){q('#b-dsel').value=String(best.id);q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate()}
  };
  q('#b-stops').addEventListener('click',e=>{
    const r=e.target.closest('[data-s]');if(!r)return;
    q('#b-dsel').value=r.dataset.s;q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate();
  });

  /* клавиши: P — телефон; пробел в полях ввода (базовый плагин его блокирует) */
  keyH=e=>{
    if(!root)return;
    const tag=e.target.tagName;
    if(e.code==='Space'&&tag==='INPUT'&&root.contains(e.target)&&e.defaultPrevented){
      const t=e.target;t.setRangeText(' ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}));return;
    }
    if(e.code==='KeyP'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test(tag)){e.preventDefault();setOpen(!open)}
  };
  addEventListener('keydown',keyH,true);
}

/* ---------- подключение к «Путешествию» ---------- */
const prev=City.trip||{};
City.trip={
  start(api){
    if(prev.start)prev.start(api);
    API=api;open=false;app='home';mount(api.tv);
  },
  stop(){
    if(keyH)removeEventListener('keydown',keyH,true);keyH=null;
    root=null;btn=null;open=false;pdown=false;mvG=mvB=null;API=null;
    if(prev.stop)prev.stop();
  },
  move(...a){return open?true:(prev.move?prev.move(...a):false)},
  tick(dt){if(prev.tick)prev.tick(dt);try{upd(dt)}catch(x){console.error(x)}}
};
})();
</script>
<script>
/* ===== Плагин: 3D-автобус MAZ 206.948 (снаружи + салон) =====
   Вставить отдельным <script> ПОСЛЕ плагина «салон автобусов» (и после Yutong).
   Рядом с index.html положить фото (имена можно поменять в PHOTO ниже):
     maz206_front.webp      — перед
     maz206_rear.webp       — зад
     maz206_side_doors.webp — борт с дверьми (правый)
     maz206_side.webp       — борт без дверей (левый)
   Кроп фото — в CROP (доли снимка: [x0,x1,y0,y1]).
   Нужны две правки в плагине «салон автобусов» — см. сообщение. */
(function(){
const MODEL='MAZ 206.948';
const PHOTO={front:'maz206_front.webp',doors:'maz206_side_doors.webp',left:'maz206_side.webp',rear:'maz206_rear.webp'};
const CROP={front:[.25,.767,.208,.889],doors:[.049,.934,.391,.777],left:[.064,.953,.314,.769],rear:[.2246,.778,.049,.872]};
/* габариты кузова, м: длина 12, ширина 2.55, низ 0.36, высота 2.75 */
const LEN=12,BW=2.55,BOT=.36,BH=2.75,TOP=BOT+BH;
const prev=City.bus3d;
let TH=null,M=null,GEO=null,lastModel=null;
const B=new Map();

/* ---------- материалы и геометрия (ось x — вперёд, z>0 — правый борт с дверьми) ---------- */
function mats(){
  if(M)return M;
  const L=c=>new TH.MeshLambertMaterial({color:c});
  const ph=k=>{const m=L('#f2f4f5');
    new TH.TextureLoader().load(PHOTO[k],t=>{const c=CROP[k];t.repeat.set(c[1]-c[0],c[3]-c[2]);t.offset.set(c[0],1-c[3]);m.map=t;m.color.set('#fff');m.needsUpdate=true},undefined,()=>{});
    return m};
  /* порядок граней BoxGeometry: +x перед, -x зад, +y крыша, -y низ, +z правый борт (двери), -z левый борт */
  return M={body:[ph('front'),ph('rear'),L('#eef0f1'),L('#222'),ph('doors'),ph('left')],
    wheel:L('#17191b'),hub:L('#9aa0a4'),roof:L('#f4f6f7'),seam:L('#98a1a8'),dark:L('#1c2226')};
}
function geo(){
  if(GEO)return GEO;
  const w=new TH.CylinderGeometry(.5,.5,.3,20);w.rotateX(Math.PI/2);
  const h=new TH.CylinderGeometry(.28,.28,.32,12);h.rotateX(Math.PI/2);
  return GEO={body:new TH.BoxGeometry(LEN,BH,BW),w,h};
}
function make(T){
  TH=T;const g=new TH.Group(),m=mats(),G=geo();
  const add=(w,h,d,x,y,z,mt)=>{const o=new TH.Mesh(new TH.BoxGeometry(w,h,d),mt);o.position.set(x,y,z);g.add(o);return o};
  const body=new TH.Mesh(G.body,m.body);body.position.y=BOT+BH/2;g.add(body);
  /* крыша: сзади кондиционер (x −4.2…−1.2), дальше блок баллонов CNG (x −1.0…4.1), 4 секции */
  add(3.0,.32,1.9,-2.7,TOP+.16,0,m.roof);
  [-3.6,-2.7,-1.8].forEach(x=>add(.5,.01,1.2,x,TOP+.325,0,m.dark));
  add(5.1,.42,2.1,1.55,TOP+.21,0,m.roof);
  add(4.9,.24,1.8,1.55,TOP+.42+.12,0,m.roof);
  [.53,1.91,3.28].forEach(x=>add(.03,.5,2.12,x,TOP+.25,0,m.seam));
  /* колёса: база ≈ 5,9 м */
  [[3.27,1.1],[3.27,-1.1],[-2.62,1.1],[-2.62,-1.1]].forEach(([x,z])=>{
    const a=new TH.Mesh(G.w,m.wheel);a.position.set(x,.5,z);g.add(a);
    const b=new TH.Mesh(G.h,m.hub);b.position.set(x,.5,z+(z>0?.02:-.02));g.add(b)});
  /* зеркала */
  [1,-1].forEach(s=>{add(.05,.05,.3,5.9,2.8,s*1.36,m.dark);add(.1,.63,.24,5.9,2.47,s*1.52,m.dark)});
  /* табло: перед, правый борт, зад (закрывают текст, нарисованный на фото) */
  const pl=(w,h,x,y,z,ry)=>{const mt=new TH.MeshBasicMaterial({color:'#2b2e31'});
    const p=new TH.Mesh(new TH.PlaneGeometry(w,h),mt);p.position.set(x,y,z);p.rotation.y=ry;g.add(p);return mt};
  g.userData.maz={
    front:pl(1.96,.36,LEN/2+.006,2.75,0,Math.PI/2),
    side:pl(1.72,.28,1.67,2.88,BW/2+.006,0),
    rear:pl(.66,.33,-LEN/2-.006,2.875,0,-Math.PI/2)
  };
  return g;
}

/* ---------- номер и текст из названия маршрута: «60 Придонской — Боровое» ---------- */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){
    const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);
    if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n;
  }
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
function board(num,txt,w,h,kind){
  const key=kind+'|'+num+'|'+txt;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
    o={c,t:new TH.CanvasTexture(c),num,txt,used:0};B.set(key,o)}
  return o;
}
function rearBoard(num){
  const key='r|'+num;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=320;c.height=150;const g=c.getContext('2d');
    g.fillStyle='#15181b';g.fillRect(0,0,320,150);g.fillStyle='#e9f1f6';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(num.length>2?92:112)+'px Manrope,Arial,sans-serif';g.fillText(num,160,80);
    g.fillStyle='rgba(0,0,0,.5)';for(let i=0;i<320;i+=4)g.fillRect(i,0,1.3,150);for(let j=0;j<150;j+=4)g.fillRect(0,j,320,1.3);
    o={c,t:new TH.CanvasTexture(c),static:1};B.set(key,o)}
  return o;
}
function paint(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.fillStyle='#14171a';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H*.9;g.fillStyle='#ffc21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+Math.round(H*(o.num.length>2?.6:.78))+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+2);
    g.fillStyle='#ffc21a55';g.fillRect(nw+10,H*.18,2,H*.64);rx=nw+20}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 '+Math.round(H*.6)+'px Manrope,Arial,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#ffc21a';
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;   /* бежит слева направо */
  g.fillText(o.txt,x,H/2+2);g.restore();
  g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<W;i+=3)g.fillRect(i,0,1,H);
  o.t.needsUpdate=true;
}
function tick(g,b,R){
  const p=parse(R,City.busLeg?City.busLeg(b):0),bm=g.userData.maz;
  const f=board(p.num,p.txt,1.96,.36,'f'),s=board(p.num,p.txt,1.72,.28,'s'),r=rearBoard(p.num);
  f.used=s.used=1;
  [['front',f],['side',s],['rear',r]].forEach(([k,o])=>{if(bm[k].map!==o.t){bm[k].map=o.t;bm[k].color.set('#fff');bm[k].needsUpdate=true}});
}
function frame(){B.forEach(o=>{if(o.used&&!o.static)paint(o);o.used=0})}

/* ---------- подключение: City.bus3d знает ПАЗ, Yutong и MAZ ---------- */
City.bus3d={
  has:m=>{lastModel=m;return m===MODEL||(prev?prev.has(m):false)},
  make:(T,m)=>{m=m||lastModel;return m===MODEL?make(T):prev.make(T,m)},
  tick:(g,b,R)=>{if(g.userData.maz)tick(g,b,R);else if(prev)prev.tick(g,b,R)},
  frame:()=>{if(prev)prev.frame();frame()}
};

/* =====================================================================
   САЛОН: низкий пол спереди и до середины, площадка на 2 ступени сзади,
   средняя двустворчатая и передняя двери справа, кабина водителя слева,
   синие сиденья с «зигзагами», жёлтые поручни, серые петли, табло спереди
   ===================================================================== */
const FL_LOW=.40,FL_HI=.80,CEIL=2.86;
const flAt=x=>x>=-3.0?FL_LOW:x>=-3.25?.53:x>=-3.5?.67:FL_HI;
const DRV={x:4.95,z:-.72};
const SEATS=[];
const S=(x,z,p)=>SEATS.push({x,z,c:'b',p:p||0});
/* площадка сзади: диван на пятерых + два ряда 2+2 */
[-.96,-.48,0,.48,.96].forEach(z=>S(-5.5,z));
[-4.7,-3.9].forEach(x=>[-.95,-.51,.51,.95].forEach(z=>S(x,z)));
/* левый борт; над арками — на подиумах */
[-2.5,-1.7,-.9,-.1,.7,1.5,2.3,3.3].forEach(x=>{const p=(x===-2.5||x===3.3)?.17:0;[-.95,-.51].forEach(z=>S(x,z,p))});
/* правый борт: между дверьми */
S(-2.5,.51,.17);S(-2.5,.95,.17);
[1.25,2.05].forEach(x=>[.51,.95].forEach(z=>S(x,z)));
S(3.3,.51,.17);S(3.3,.95,.17);
function hit(x,z){
  const r=.17;
  if(x<-5.8||x>5.6||z<-1.02||z>1.02)return true;
  if(x>3.95&&z<-.2)return true;                       /* кабина водителя */
  return SEATS.some(s=>Math.abs(x-s.x)<.27+r&&Math.abs(z-s.z)<.21+r);
}
function build(){
  const T=THREE,I=new T.Group(),mats=[];
  const mt=(c,e)=>{const m=new T.MeshLambertMaterial({color:c,emissive:new T.Color(c).multiplyScalar(e===undefined?.4:e)});mats.push(m);return m};
  const box=(w,h,d,x,y,z,m,par)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(par||I).add(o);return o};
  const cylV=(r,y0,y1,x,z,m)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,y1-y0,8),m);o.position.set(x,(y0+y1)/2,z);I.add(o)};
  const cylX=(r,x0,x1,y,z,m)=>{const g=new T.CylinderGeometry(r,r,x1-x0,8);g.rotateZ(Math.PI/2);const o=new T.Mesh(g,m);o.position.set((x0+x1)/2,y,z);I.add(o)};
  const wall=mt('#c9ced2'),low=mt('#aeb4b9'),ceil=mt('#e4e7e9',.5),floor=mt('#4c5762',.35),floor2=mt('#58636e',.35),
    dark=mt('#2c3136',.2),blk=mt('#15171a',.1),plast=mt('#8d949a',.2),ped=mt('#454c52',.2),shell=mt('#4d5359',.25),
    yel=mt('#f0b400',.55),gray=mt('#9aa0a6',.3),val=mt('#2e7fd9',.4),door=mt('#b9bfc4'),skin=mt('#e0b896'),shirt=mt('#33506e');
  const glass=new T.MeshLambertMaterial({color:'#8fb4cc',transparent:true,opacity:.28,side:T.DoubleSide});mats.push(glass);
  const lamp=new T.MeshBasicMaterial({color:'#f4f6f8'});mats.push(lamp);
  const scr=new T.MeshBasicMaterial({color:'#10161c'});mats.push(scr);
  /* ткань сидений: синяя с оранжевыми и голубыми зигзагами */
  const fc=document.createElement('canvas');fc.width=fc.height=64;const fg=fc.getContext('2d');
  fg.fillStyle='#2347b5';fg.fillRect(0,0,64,64);fg.lineWidth=2.4;fg.lineCap='round';fg.lineJoin='round';
  [[8,4],[36,10],[20,30],[48,38],[4,44],[30,52],[52,8]].forEach((p,i)=>{
    fg.strokeStyle=i%2?'#f08a2a':'#6fb2f2';fg.beginPath();fg.moveTo(p[0],p[1]);
    for(let k=1;k<=6;k++)fg.lineTo(p[0]+(k%2?9:0),p[1]+k*3);fg.stroke()});
  const ft=new T.CanvasTexture(fc);ft.wrapS=ft.wrapT=T.RepeatWrapping;mats.push(ft);
  const fab=new T.MeshLambertMaterial({map:ft,color:'#fff',emissive:new T.Color('#777'),emissiveMap:ft});mats.push(fab);

  /* пол: низкий, площадка и две ступеньки */
  box(8.95,.04,2.5,1.425,FL_LOW-.02,0,floor);
  box(2.45,FL_HI-FL_LOW,2.5,-4.725,(FL_LOW+FL_HI)/2,0,floor2);
  box(.25,.67-FL_LOW,2.5,-3.375,(FL_LOW+.67)/2,0,floor2);
  box(.25,.53-FL_LOW,2.5,-3.125,(FL_LOW+.53)/2,0,floor2);
  [[-3.03,.53],[-3.28,.67],[-3.52,FL_HI]].forEach(([x,y])=>box(.06,.012,2.5,x,y+.006,0,yel));
  /* потолок, лампы, решётки климата */
  box(11.9,.04,2.5,0,CEIL+.02,0,ceil);
  [-.45,.45].forEach(z=>box(11,.02,.12,0,CEIL-.005,z,lamp));
  [-4.6,-3.6,-.4,2.2].forEach(x=>box(.7,.02,.5,x,CEIL-.005,0,dark));
  /* задняя стенка с окном */
  box(.05,1.2,2.5,-5.95,FL_HI+.6,0,wall);
  box(.02,.8,2.2,-5.95,2.3,0,glass);
  box(.05,.2,2.5,-5.95,2.76,0,ceil);
  /* борта: нижняя панель, остекление, стойки */
  const DOORS=[[-1.3,.53],[4.38,5.45]];
  const seg=(z,x0,x1,y0,y1,m)=>{if(x1-x0>.01)box(x1-x0,y1-y0,.05,(x0+x1)/2,(y0+y1)/2,z,m)};
  const ranges=s=>s<0?[[-5.95,5.95]]:[[-5.95,DOORS[0][0]],[DOORS[0][1],DOORS[1][0]],[DOORS[1][1],5.95]];
  [-1,1].forEach(s=>{
    const z=s*1.26;
    ranges(s).forEach(([x0,x1])=>{
      seg(z,x0,x1,FL_LOW,1.0,low);seg(z,x0,x1,1.0,2.45,glass);seg(z,x0,x1,2.45,CEIL+.04,ceil);
      for(let x=Math.ceil(x0);x<x1;x+=1)if(x>x0+.1&&x<x1-.1)box(.08,1.45,.07,x,1.725,z,wall);
    });
  });
  DOORS.forEach(([x0,x1])=>{box(x1-x0,.4,.05,(x0+x1)/2,2.65,1.26,ceil);[x0,x1].forEach(x=>box(.07,2.1,.07,x,FL_LOW+1.05,1.26,wall))});

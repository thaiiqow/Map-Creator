<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой город — редактор карты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f2;--pan:#fff;--ink:#14232b;--mut:#66767f;--line:#dbe2e5;--acc:#0c8a86;--accink:#fff;--soft:#e4f3f2;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#151a1d;--pan:#1d2428;--ink:#e6eef0;--mut:#8fa0a8;--line:#2e383d;--acc:#3cc3bd;--accink:#072120;--soft:#24383a;--red:#ff7b6b}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.4 Manrope,"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#app{display:flex;height:100%}
#side{width:268px;flex:none;background:var(--pan);border-right:1px solid var(--line);overflow:auto;padding:18px 12px;z-index:20}
.brand{font:600 17px Unbounded,Manrope,sans-serif;margin:0 6px 2px}
#cname{display:block;color:var(--mut);margin:0 6px 16px;font-size:13px}
details{margin:2px 0}
summary{cursor:pointer;font-weight:800;padding:7px 6px;border-radius:8px;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;margin:0 8px 0 3px}
details[open]>summary::before{transform:rotate(45deg)}
details details{margin-left:12px;padding-left:6px;border-left:2px solid var(--line)}
details details>summary{font-size:13px}
.leaf{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;color:var(--ink);font:inherit;cursor:pointer}
.leaf i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px #0003}
.leaf:hover{background:var(--soft)}.leaf.on{background:var(--acc);color:var(--accink)}
#wrap{position:relative;flex:1;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.fl{position:absolute;background:var(--pan);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0002}
button.b{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}
button.b:hover{background:var(--soft)}button.b.on,button.p{background:var(--acc);color:var(--accink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#top{left:10px;top:10px;display:flex;gap:2px;padding:4px}
#menu{display:none}
#bar{left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:2px;padding:4px}
#hint,#fbar{left:50%;transform:translateX(-50%);bottom:68px;padding:8px 14px;width:max-content;max-width:calc(100% - 20px);text-align:center}
#hint{color:var(--mut)}
#fbar{display:flex;gap:8px;align-items:center}
#insp{right:10px;top:10px;width:262px;padding:14px;display:flex;flex-direction:column;gap:10px}
#insp h3{margin:0;font-size:15px}
#insp label{display:block;font-size:12px;color:var(--mut);font-weight:700}
input,select{width:100%;margin-top:3px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sws{display:flex;gap:6px;margin-top:4px}.sws button{width:26px;height:26px;border-radius:50%;border:2px solid var(--pan);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sws button.on{box-shadow:0 0 0 2px var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.danger{color:var(--red)!important}
#legend{left:10px;bottom:12px;padding:10px 12px;max-width:230px}
#legend div{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
#legend i{width:20px;height:6px;border-radius:3px;flex:none}#legend small{color:var(--mut)}
dialog{background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(92vw,400px)}
dialog::backdrop{background:#0009}
dialog h2{font:600 16px Unbounded,Manrope,sans-serif;margin:0 0 4px}dialog p{margin:0 0 10px;color:var(--mut);font-size:13px}
#cities{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow:auto}
#cities li{display:flex;gap:4px}#cities li .b:first-child{flex:1;text-align:left;background:var(--bg)}
#cities li.cur .b:first-child{background:var(--acc);color:var(--accink)}
@media (max-width:760px){
 #side{position:absolute;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:80%;max-width:300px;transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 24px #0004}
 #side.open{transform:none}#menu{display:block}
 #insp{left:10px;right:10px;top:auto;bottom:68px;width:auto}#legend{display:none}
}
</style>
</head>
<body>
<div id="app">
<aside id="side"><div class="brand">Мой город</div><span id="cname"></span><nav id="tree"></nav></aside>
<main id="wrap">
  <canvas id="c"></canvas>
  <div id="top" class="fl"><button id="menu" class="b">Меню</button><button id="undo" class="b">Отмена</button><button id="snap" class="b on">Сетка</button><button id="set" class="b">Настройки</button></div>
  <div id="hint" class="fl"></div>
  <div id="fbar" class="fl"><span id="fcnt"></span><button id="fok" class="b p">Готово</button><button id="fno" class="b">Отмена</button></div>
  <div id="insp" class="fl" hidden></div>
  <div id="legend" class="fl" hidden></div>
  <!-- ===== ПЛАГИНЫ (HTML): новые блоки интерфейса добавляйте сюда, внутрь #wrap. Класс fl даёт вид плавающей панели. ===== -->
  <div id="bar" class="fl"><button class="b on" data-g="select">Выбрать</button><button class="b" data-g="erase">Ластик</button><button id="zo" class="b" aria-label="Отдалить">−</button><button id="zi" class="b" aria-label="Приблизить">+</button></div>
</main>
</div>
<dialog id="dlg">
  <h2>Настройки</h2><p>Мои города хранятся в этом браузере.</p>
  <ul id="cities"></ul>
  <div class="row"><button id="newc" class="b p">Новый город</button></div>
  <p style="margin-top:14px">Текущий город</p>
  <div class="row" style="justify-content:flex-start"><button id="expf" class="b">Сохранить файл</button><button id="impf" class="b">Открыть файл</button><button id="clr" class="b danger">Очистить</button></div>
  <div class="row" style="margin-top:12px"><button id="close" class="b">Закрыть</button></div>
  <input id="file" type="file" accept="application/json" hidden>
</dialog>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
/* ===== API для плагинов: window.City ===== */
const City={keys:[],tools:{},hits:[],layers:{under:[],over:[]},ev:{},insp:{},
  get S(){return S},get ctx(){return ctx},get tool(){return tool},get sel(){return sel},get view(){return V},
  P:()=>dk.matches?DARK:LIGHT,
  on(n,f){(this.ev[n]=this.ev[n]||[]).push(f)},emit(n,...a){(this.ev[n]||[]).forEach(f=>f(...a))}};
const EMPTY=()=>({roads:[],blds:[],stops:[],routes:[],depots:[],dists:[],id:1,lv:2});
const norm=d=>{d.depots=d.depots||[];d.dists=d.dists||[];
  /* старые карты: Улица/Проспект/Шоссе -> 2/4/6 полос, двустороннее движение */
  if(!d.lv){(d.roads||[]).forEach(r=>{r.t=Math.min(3,(r.t||0)+1)});d.lv=2}City.keys.forEach(k=>d[k]=d[k]||[]);return d};
function rd(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let idx=rd('citymap:index');
if(!idx){const old=rd('citymap');idx={cur:'c1',list:[{id:'c1',name:'Мой город'}]};wr('citymap:c1',old||EMPTY());wr('citymap:index',idx)}
let S=norm(rd('citymap:'+idx.cur)||EMPTY()),hist=[],V={x:60,y:60,k:1};
let tool='select',tt=0,cur=null,drag=null,mouse=[0,0],snapOn=true,dirty=true,pan=null,sel=null,extR=null;
const ROAD=['Дорога · 1 полоса','Улица · 2 полосы','Проспект · 4 полосы','Шоссе · 6 полос'],RN=['Дорога','Улица','Проспект','Шоссе'],RW=[8,12,20,28],LN=[1,2,4,6];
const BLD={house:['Жилой дом','#f0c3a8',30],shop:['Магазин','#f5d76e',44],office:['Офис','#9fc0ea',56],industry:['Завод','#c4bfb8',90],park:['Парк','#a8d89a',130],water:['Водоём','#86c5ea',150]};
const RC=['#d7263d','#1b998b','#f46036','#2e86ab','#8e44ad','#c79a00'],DC=['#e76f51','#2a9d8f','#e9c46a','#6c8ead','#9b5de5','#43aa8b'];
const KN={roads:'Дорога',blds:'Здание',stops:'Остановка',depots:'АТП',routes:'Маршрут',dists:'Район'};
const LIGHT={bg:'#eef0ea',grid:'#0000000c',cas:['#c9c4b8','#c9c4b8','#d2ad4a','#cf7f22'],fil:['#fff','#fff','#fff1c2','#ffd48f'],lab:'#4c545b',ink:'#14232b',wh:'#fff'};
const DARK={bg:'#20262a',grid:'#ffffff0d',cas:['#11161a','#11161a','#5e4f26','#6e4414'],fil:['#394147','#394147','#574b2c','#68451f'],lab:'#cfd6da',ink:'#e6eef0',wh:'#0d1214'};
const dk=matchMedia('(prefers-color-scheme: dark)');dk.onchange=()=>dirty=true;
const HINT={select:'Нажмите на объект, чтобы изменить. Тяните карту, чтобы двигать.',erase:'Нажмите на объект, чтобы удалить.',road:'Ставьте точки дороги. Двойной клик или «Готово» — закончить.',ext:'Нажмите рядом с концом улицы, которую продлеваете, и ставьте точки. Двойной клик или «Готово» — закончить.',bld:'Нажмите, чтобы поставить, или протяните для размера.',stop:'Нажмите на карту, чтобы поставить остановку.',depot:'Нажмите на карту, чтобы поставить АТП.',route:'Нажимайте остановки по порядку. Первая остановка ещё раз — замкнуть кольцо.',dist:'Обведите район точками. Двойной клик или «Готово» — закончить.'};
const TREE=[['Дороги',[[ROAD[0],'road',0],[ROAD[1],'road',1],[ROAD[2],'road',2],[ROAD[3],'road',3]]],['Здания',[['Жилой дом','bld','house'],['Магазин','bld','shop'],['Офис','bld','office'],['Завод','bld','industry']]],['Природа',[['Парк','bld','park'],['Водоём','bld','water']]],['Районы',[['Район','dist']]],['Транспорт',[['Автобусный транспорт',[['АТП','depot'],['Остановка','stop'],['Маршрут','route']]]]]];
const chip0=n=>n[1]==='road'?['#9aa3a8','#9aa3a8','#e0c36a','#e59a3a'][n[2]]:n[1]==='bld'?BLD[n[2]][1]:n[1]==='dist'?DC[1]:n[1]==='route'?RC[0]:'#0c8a86';
const chip=n=>n[3]||chip0(n);
const tree=(g)=>g.map(n=>Array.isArray(n[1])?`<details open><summary>${n[0]}</summary>${tree(n[1])}</details>`:`<button class="leaf" data-tool="${n[1]}" data-tt="${n[2]??''}"><i style="background:${chip(n)}"></i>${n[0]}</button>`).join('');
const renderTree=()=>{$('#tree').innerHTML=tree(TREE)};renderTree();

function save(){wr('citymap:'+idx.cur,S)}
function push(){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift()}
function changed(){save();legend();dirty=true;City.emit('change')}
function undo(){if(hist.length){S=norm(JSON.parse(hist.pop()));sel=cur=null;changed();updateUI()}}
function setTool(t,ty){
  tool=t;tt=t==='road'?+ty:ty;cur=drag=null;if(t!=='select'&&t!=='erase'||t==='erase')sel=null;
  document.querySelectorAll('.leaf').forEach(b=>b.classList.toggle('on',b.dataset.tool===t&&b.dataset.tt===String(ty??'')));
  document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===t));
  $('#side').classList.remove('open');updateUI();dirty=true;
}
$('#tree').onclick=e=>{const b=e.target.closest('.leaf');if(b)setTool(b.dataset.tool,b.dataset.tt)};
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>setTool(b.dataset.g));
$('#menu').onclick=()=>$('#side').classList.toggle('open');

function add(k,o){push();S[k].push(o);sel={k,o};changed();updateUI();if(matchMedia('(pointer:fine)').matches){const f=$('#f-n');if(f){f.focus();f.select()}}}
function del(k,o){
  push();S[k]=S[k].filter(x=>x!==o);
  if(k==='stops'){S.routes.forEach(R=>R.s=R.s.filter(i=>i!==o.id));S.routes=S.routes.filter(R=>R.s.length>1)}
  if(k==='depots')S.routes.forEach(R=>{if(R.d===o.id)R.d=null});
  if(sel&&sel.o===o)sel=null;changed();updateUI();
}
function finish(){
  const c=cur;cur=null;if(!c){return}
  if(tool==='ext'){
    if(extR&&c.pts&&c.pts.length>1){
      push();const q=c.pts.slice(1);
      extR.pts=c.st?q.reverse().concat(extR.pts):extR.pts.concat(q);
      const R=extR;extR=null;changed();setTool('select');sel={k:'roads',o:R};
    }
    updateUI();dirty=true;return;
  }
  if(tool==='road'&&c.pts.length>1)add('roads',{pts:c.pts,t:tt,n:RN[tt]+' '+(S.roads.length+1),ow:tt===0});
  else if(tool==='dist'&&c.pts.length>2)add('dists',{pts:c.pts,c:DC[S.dists.length%6],n:'Район '+(S.dists.length+1)});
  else if(tool==='route'&&c.s.length>1)add('routes',{n:(S.routes.length+1)+' '+((stopById(c.s[0])||{}).n||'')+(c.loop?' (кольцо)':' — '+((stopById(c.s[c.s.length-1])||{}).n||'')),c:RC[S.routes.length%6],s:c.s,loop:!!c.loop,d:S.depots[0]?S.depots[0].id:null});
  updateUI();dirty=true;
}
$('#fok').onclick=finish;$('#fno').onclick=()=>{cur=null;updateUI();dirty=true};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter')finish();if(e.key==='Escape'){cur=sel=null;updateUI();dirty=true}if((e.ctrlKey||e.metaKey)&&e.key==='z')undo()});

const raw=e=>[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k];
const snp0=p=>snapOn?[Math.round(p[0]/10)*10,Math.round(p[1]/10)*10]:p;
const snp=p=>City.snap?City.snap(snp0(p),p):snp0(p);
const stopById=id=>S.stops.find(s=>s.id===id);
const stopPts0=R=>{const a=R.s.map(stopById).filter(Boolean).map(s=>[s.x,s.y]);if(R.loop&&a.length)a.push(a[0]);return a};
const stopPts=R=>City.path?City.path(R,stopPts0):stopPts0(R);
const segs=a=>a.slice(1).map((q,i)=>[a[i],q]);
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
const inPoly=(p,a)=>{let c=false;for(let i=0,j=a.length-1;i<a.length;j=i++){const A=a[i],B=a[j];if((A[1]>p[1])!==(B[1]>p[1])&&p[0]<(B[0]-A[0])*(p[1]-A[1])/(B[1]-A[1])+A[0])c=!c}return c};
function pick(p,edge){
  const r=8/V.k;let o;
  if(o=S.stops.find(s=>Math.hypot(s.x-p[0],s.y-p[1])<r+4))return{k:'stops',o};
  if(o=S.depots.find(d=>Math.abs(d.x-p[0])<13&&Math.abs(d.y-p[1])<13))return{k:'depots',o};
  for(const h of City.hits){const q=h.fn(p,r,edge);if(q)return{k:h.key,o:q}}
  if(o=S.routes.find(R=>segs(stopPts(R)).some(s=>dseg(p,s[0],s[1])<r)))return{k:'routes',o};
  if(o=[...S.roads].reverse().find(R=>segs(R.pts).some(s=>dseg(p,s[0],s[1])<RW[R.t]/2+r/2)))return{k:'roads',o};
  if(o=[...S.blds].reverse().find(b=>p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h))return{k:'blds',o};
  if(o=[...S.dists].reverse().find(d=>edge?segs(d.pts.concat([d.pts[0]])).some(s=>dseg(p,s[0],s[1])<r):inPoly(p,d.pts)))return{k:'dists',o};
  return null;
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);$('#side').classList.remove('open');
  const r=raw(e),p=snp(r);
  if(tool==='select'){pan={sx:e.clientX,sy:e.clientY,x:V.x,y:V.y,m:false};return}
  if(tool==='erase'){const h=pick(r,true);if(h)del(h.k,h.o);return}
  if(tool==='ext'){
    if(!extR||!S.roads.includes(extR))return;
    const a=extR.pts[0],b=extR.pts[extR.pts.length-1];
    if(!cur){
      const st=Math.hypot(a[0]-r[0],a[1]-r[1])<Math.hypot(b[0]-r[0],b[1]-r[1]),e0=st?a:b;
      cur={pts:[e0.slice()],st};
      if(Math.hypot(e0[0]-p[0],e0[1]-p[1])>=6/V.k)cur.pts.push(p);
    }else{
      const l=cur.pts[cur.pts.length-1];
      if(Math.hypot(l[0]-p[0],l[1]-p[1])<6/V.k)finish();else cur.pts.push(p);
    }
    updateUI();dirty=true;return;
  }
  if(City.tools[tool]){City.tools[tool](p,r,e);updateUI();dirty=true;return}
  if(tool==='road'||tool==='dist'){
    if(!cur)cur={pts:[p]};
    else{const l=cur.pts[cur.pts.length-1],f=cur.pts[0];
      if(Math.hypot(l[0]-p[0],l[1]-p[1])<6/V.k||(tool==='dist'&&cur.pts.length>2&&Math.hypot(f[0]-p[0],f[1]-p[1])<12/V.k))finish();else cur.pts.push(p)}
  }else if(tool==='bld')drag={a:p,b:p};
  else if(tool==='stop')add('stops',{id:S.id++,x:p[0],y:p[1],n:'Остановка '+(S.stops.length+1)});
  else if(tool==='depot')add('depots',{id:S.id++,x:p[0],y:p[1],n:'АТП '+(S.depots.length+1)});
  else if(tool==='route'){
    const s=S.stops.find(s=>Math.hypot(s.x-r[0],s.y-r[1])<16/V.k);
    if(s){if(!cur)cur={s:[s.id]};else if(s.id===cur.s[0]&&cur.s.length>2){cur.loop=true;finish()}else if(s.id!==cur.s[cur.s.length-1])cur.s.push(s.id)}
  }
  updateUI();dirty=true;
});
cv.addEventListener('pointermove',e=>{
  mouse=snp(raw(e));
  if(pan){const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;if(Math.hypot(dx,dy)>4)pan.m=true;if(pan.m){V.x=pan.x+dx;V.y=pan.y+dy}}
  if(drag)drag.b=mouse;dirty=true;
});
cv.addEventListener('pointerup',e=>{
  if(pan&&!pan.m){sel=pick(raw(e));updateUI()}pan=null;
  if(drag){
    const a=drag.a,b=drag.b;let w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]),x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]);
    if(w<8&&h<8){w=h=BLD[tt][2];x=a[0]-w/2;y=a[1]-h/2}
    drag=null;add('blds',{x,y,w,h,t:tt,n:''});
  }
  dirty=true;
});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15)},{passive:false});
function zoomAt(x,y,f){const k=Math.max(.2,Math.min(5,V.k*f));f=k/V.k;V.x=x-(x-V.x)*f;V.y=y-(y-V.y)*f;V.k=k;dirty=true}
$('#zi').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.3);

/* Рисование */
function line(pts,w,c,dash){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineWidth=w;ctx.strokeStyle=c;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([])}
function poly(a){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
function rect(b,ghost){const c=BLD[b.t]||BLD.house,z=b.t==='water'||b.t==='park';
  ctx.globalAlpha=ghost?.6:1;
  if(!z){ctx.fillStyle='#0000002a';ctx.fillRect(b.x+2,b.y+3,b.w,b.h)}
  ctx.fillStyle=c[1];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.lineWidth=z?1.5:1.5;ctx.strokeStyle=z?(b.t==='water'?'#5aa6d3':'#7fb872'):'#00000066';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1}
function roadLabel(R,P){
  if(!R.n)return;const w=RW[R.t],fs=w*.62;if(fs*V.k<5)return;
  ctx.font=`700 ${fs}px Manrope,system-ui,sans-serif`;ctx.fillStyle=P.lab;ctx.textAlign='center';ctx.textBaseline='middle';
  const tw=ctx.measureText(R.n).width;
  segs(R.pts).forEach(([a,b])=>{
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<tw+w)return;
    let an=Math.atan2(b[1]-a[1],b[0]-a[0]);if(an>Math.PI/2||an<-Math.PI/2)an+=Math.PI;
    ctx.save();ctx.translate((a[0]+b[0])/2,(a[1]+b[1])/2);ctx.rotate(an);ctx.fillText(R.n,0,.5);ctx.restore();
  });
}
/* смещённая параллельная линия (для полос) */
function offs(pts,d){
  const nm=(a,b)=>{const x=b[0]-a[0],y=b[1]-a[1],l=Math.hypot(x,y)||1;return[-y/l,x/l]};
  return pts.map((p,i)=>{
    const n1=i?nm(pts[i-1],p):null,n2=i<pts.length-1?nm(p,pts[i+1]):null;
    if(!n1)return[p[0]+n2[0]*d,p[1]+n2[1]*d];
    if(!n2)return[p[0]+n1[0]*d,p[1]+n1[1]*d];
    let mx=n1[0]+n2[0],my=n1[1]+n2[1];const ml=Math.hypot(mx,my)||1;mx/=ml;my/=ml;
    const c=Math.max(.5,mx*n1[0]+my*n1[1]);return[p[0]+mx*d/c,p[1]+my*d/c];
  });
}
/* разметка: двустороннее — жёлтая осевая, между полосами пунктир */
function marks(R,P){
  const n=LN[R.t],w=RW[R.t],lw=w/n;
  for(let k=1;k<n;k++){
    const d=-w/2+k*lw;
    if(!R.ow&&k===n/2)line(offs(R.pts,d),1.4,'#d2a800');
    else line(offs(R.pts,d),1,P.lab+'88',[6,7]);
  }
}
/* стрелки направления на односторонних дорогах (по каждой полосе) */
function arrows(R,P){
  if(!R.ow)return;
  const n=LN[R.t],w=RW[R.t],lw=w/n,s=Math.max(2.4,lw*.38);
  for(let j=0;j<n;j++){
    const q=offs(R.pts,-w/2+(j+.5)*lw);
    segs(q).forEach(([a,b])=>{
      const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<36)return;
      let an=Math.atan2(b[1]-a[1],b[0]-a[0]);if(R.rev)an+=Math.PI;
      const cnt=Math.floor(L/70)+1;
      for(let i=1;i<=cnt;i++){
        const t=i/(cnt+1);
        ctx.save();ctx.translate(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);ctx.rotate(an);
        ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s,-s*.8);ctx.lineTo(-s*.35,0);ctx.lineTo(-s,s*.8);ctx.closePath();
        ctx.fillStyle=P.lab;ctx.globalAlpha=.8;ctx.fill();ctx.restore();
      }
    });
  }
}
function draw(){
  const P=dk.matches?DARK:LIGHT,d=devicePixelRatio||1,W=cv.width/d,H=cv.height/d;
  ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(V.x,V.y);ctx.scale(V.k,V.k);ctx.lineCap=ctx.lineJoin='round';
  const x0=-V.x/V.k,y0=-V.y/V.k,x1=x0+W/V.k,y1=y0+H/V.k;
  ctx.strokeStyle=P.grid;ctx.lineWidth=1/V.k;ctx.beginPath();
  for(let x=Math.floor(x0/50)*50;x<x1;x+=50){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}
  for(let y=Math.floor(y0/50)*50;y<y1;y+=50){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}
  ctx.stroke();
  S.dists.forEach(D=>{poly(D.pts);ctx.fillStyle=D.c+'2e';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=D.c+'bb';ctx.setLineDash([10,7]);ctx.stroke();ctx.setLineDash([])});
  S.dists.forEach(D=>{if(!D.n)return;const cx=D.pts.reduce((s,p)=>s+p[0],0)/D.pts.length,cy=D.pts.reduce((s,p)=>s+p[1],0)/D.pts.length;
    ctx.font='800 26px Manrope,system-ui,sans-serif';if('letterSpacing' in ctx)ctx.letterSpacing='4px';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=D.c+'cc';ctx.fillText(D.n,cx,cy);if('letterSpacing' in ctx)ctx.letterSpacing='0px'});
  City.layers.under.forEach(f=>f(ctx,P));
  S.blds.filter(b=>b.t==='water'||b.t==='park').forEach(b=>rect(b));
  S.roads.forEach(R=>line(R.pts,RW[R.t]+4,P.cas[R.t]));
  S.roads.forEach(R=>{line(R.pts,RW[R.t],P.fil[R.t]);marks(R,P)});
  S.roads.forEach(R=>arrows(R,P));
  S.roads.forEach(R=>roadLabel(R,P));
  S.blds.filter(b=>b.t!=='water'&&b.t!=='park').forEach(b=>rect(b));
  S.blds.forEach(b=>{if(b.n&&Math.min(b.w,b.h)*V.k>30){ctx.font='700 10px Manrope,system-ui,sans-serif';ctx.fillStyle='#14232b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.n,b.x+b.w/2,b.y+b.h/2,b.w-4)}});
  if(sel){const{k,o}=sel,A='#0c8a8670';
    if(k==='roads')line(o.pts,RW[o.t]+12,A);
    else if(k==='routes')line(stopPts(o),14,A);
    else if(k==='stops'||k==='depots'){ctx.beginPath();ctx.arc(o.x,o.y,18,0,7);ctx.fillStyle=A;ctx.fill()}
    else if(k==='blds'){ctx.strokeStyle='#0c8a86';ctx.lineWidth=4;if(o.pts){poly(o.pts);ctx.stroke()}else{ctx.lineWidth=3;ctx.strokeRect(o.x-3,o.y-3,o.w+6,o.h+6)}}
    else if(k==='dists'){poly(o.pts);ctx.strokeStyle='#0c8a86';ctx.lineWidth=4;ctx.stroke()}}
  if(tool==='ext'&&extR&&!cur)line(extR.pts,RW[extR.t]+12,'#0c8a8670');
  S.routes.forEach(R=>{const pts=stopPts(R),dp=S.depots.find(x=>x.id===R.d);
    if(dp&&pts.length)line([[dp.x,dp.y],pts[0]],2.5,R.c,[3,6]);
    line(pts,9,P.wh);line(pts,5.5,R.c)});
  if(cur&&cur.pts&&(tool==='road'||(tool==='ext'&&extR))){const T=tool==='ext'?extR.t:tt,p=cur.pts.concat([mouse]);ctx.globalAlpha=.7;line(p,RW[T]+4,P.cas[T]);line(p,RW[T],P.fil[T]);ctx.globalAlpha=1}
  if(cur&&cur.pts&&tool==='dist'){const p=cur.pts.concat([mouse]);line(p,2.5,'#0c8a86',[8,6])}
  if(cur&&cur.s)line(stopPts(cur).concat([mouse]),4,'#0c8a86',[8,6]);
  if(drag)rect({x:Math.min(drag.a[0],drag.b[0]),y:Math.min(drag.a[1],drag.b[1]),w:Math.abs(drag.b[0]-drag.a[0]),h:Math.abs(drag.b[1]-drag.a[1]),t:tt},true);
  ctx.textAlign='center';ctx.textBaseline='middle';
  S.stops.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,6.5,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#14232b';ctx.stroke();
    if(V.k>.55&&s.n){ctx.font='700 11px Manrope,system-ui,sans-serif';ctx.textAlign='left';ctx.lineWidth=3.5;ctx.strokeStyle=P.bg;ctx.strokeText(s.n,s.x+10,s.y+1);ctx.fillStyle=P.ink;ctx.fillText(s.n,s.x+10,s.y+1);ctx.textAlign='center'}});
  S.depots.forEach(o=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,o.x-13,o.y-10,26,20,5);ctx.fillStyle='#0c8a86';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='800 9px Manrope,system-ui,sans-serif';ctx.fillText('АТП',o.x,o.y+.5);
    if(V.k>.55&&o.n){ctx.font='700 11px Manrope,system-ui,sans-serif';ctx.lineWidth=3.5;ctx.strokeStyle=P.bg;ctx.strokeText(o.n,o.x,o.y+20);ctx.fillStyle=P.ink;ctx.fillText(o.n,o.x,o.y+20)}});
  City.layers.over.forEach(f=>f(ctx,P));
  ctx.restore();
}
function addLeaf(path,leaf){let L=TREE;for(const t of path.split('/')){let g=L.find(x=>x[0]===t&&Array.isArray(x[1]));if(!g){g=[t,[]];L.push(g)}L=g[1]}L.push(leaf);renderTree();setTool(tool,tt)}
function register(d){
  if(!City.keys.includes(d.key)){City.keys.push(d.key);S[d.key]=S[d.key]||[]}
  KN[d.key]=d.label;
  if(d.tool){City.tools[d.tool]=d.click;HINT[d.tool]=d.hint||''}
  if(d.leaf)addLeaf(d.group,[d.leaf,d.tool,d.type??'',d.color]);
  if(d.draw)City.layers[d.layer||'over'].push(d.draw);
  if(d.hit)City.hits.push({key:d.key,fn:d.hit});
  if(d.inspector)City.insp[d.key]=d.inspector;
  dirty=true;updateUI();
}
Object.assign(City,{KN,HINT,esc,push,add,del,changed,updateUI,addLeaf,register,redraw:()=>dirty=true,select:(k,o)=>{sel={k,o}}});
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;dirty=true}
new ResizeObserver(resize).observe($('#wrap'));
if(document.fonts)document.fonts.ready.then(()=>dirty=true);
(function loop(){if(dirty){dirty=false;draw()}requestAnimationFrame(loop)})();
resize();setTool('select');legend();renderCities();

<!-- Пример плагина «Дерево». Удалите блок, если не нужен. -->
<script>
City.register({
  key:'trees', label:'Дерево',            // имя коллекции в данных и подпись в карточке
  group:'Природа', leaf:'Дерево', color:'#4f9d4a',   // где в меню: раздел/подраздел и цвет значка
  tool:'tree', hint:'Нажмите на карту, чтобы посадить дерево.',
  click(p){ City.add('trees',{x:p[0],y:p[1],n:''}); },            // клик по карте при выбранном инструменте
  layer:'under',                                                 // 'under' — под дорогами, 'over' — поверх всего
  draw(ctx){ City.S.trees.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,7,0,7);ctx.fillStyle='#4f9d4a';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#2f6b2c';ctx.stroke()}); },
  hit(p,r){ return City.S.trees.find(t=>Math.hypot(t.x-p[0],t.y-p[1])<r+6); }   // нужен для «Выбрать» и «Ластика»
});
</script>
<script>
/* Плагин: маршруты идут по дорогам */
(function(){
  let G=null,Sref=null;const cache=new Map();
  City.on('change',()=>{G=null;cache.clear()});
  const K=p=>(Math.round(p[0]*10)/10)+','+(Math.round(p[1]*10)/10);
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  function proj(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=t<=0?a:t>=1?b:lerp(a,b,t);return{t,q,d:Math.hypot(p[0]-q[0],p[1]-q[1])}}
  function build(){
    const S=City.S,segs=[],links=[];
    S.roads.forEach((R,ri)=>{for(let i=1;i<R.pts.length;i++){const a=R.pts[i-1],b=R.pts[i];segs.push({a,b,ri,sp:[{t:0,p:a},{t:1,p:b}]})/* ri -> S.roads[ri] */}});
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=lerp(s.a,s.b,Math.max(0,Math.min(1,t)));
      s.sp.push({t,p});u.sp.push({t:v,p});
    }
    S.roads.forEach((R,ri)=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
      let best=null;
      segs.forEach(s=>{if(s.ri===ri)return;const r=proj(e,s.a,s.b);if(r.d<8&&(!best||r.d<best.r.d))best={s,r}});
      if(best&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});links.push([e,best.r.q])}
    }));
    const sn={};
    S.stops.forEach(st=>{
      let best=null;segs.forEach(s=>{const r=proj([st.x,st.y],s.a,s.b);if(!best||r.d<best.r.d)best={s,r}});
      if(best&&best.r.d<=50){best.s.sp.push({t:best.r.t,p:best.r.q});sn[st.id]=K(best.r.q)}
    });
    const idx=new Map(),pts=[],adj=[];
    const node=p=>{const k=K(p);if(!idx.has(k)){idx.set(k,pts.length);pts.push(p);adj.push([])}return idx.get(k)};
    const edge=(p,q,one)=>{const a=node(p),b=node(q);if(a===b)return;const w=Math.hypot(p[0]-q[0],p[1]-q[1]);adj[a].push([b,w]);if(!one)adj[b].push([a,w])};
    /* на односторонних дорогах рёбра графа направленные */
    segs.forEach(s=>{s.sp.sort((x,y)=>x.t-y.t);const R=S.roads[s.ri];for(let i=1;i<s.sp.length;i++){const A=s.sp[i-1].p,B=s.sp[i].p;if(R.ow)R.rev?edge(B,A,true):edge(A,B,true);else edge(A,B)}});
    links.forEach(l=>edge(l[0],l[1]));
    return{idx,pts,adj,sn};
  }
  function dij(g,s,t){
    const n=g.pts.length,d=new Array(n).fill(Infinity),pr=new Array(n).fill(-1),done=new Array(n).fill(false);d[s]=0;
    for(;;){
      let u=-1;for(let i=0;i<n;i++)if(!done[i]&&d[i]<Infinity&&(u<0||d[i]<d[u]))u=i;
      if(u<0||u===t)break;done[u]=true;
      g.adj[u].forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}});
    }
    if(d[t]===Infinity)return null;
    const out=[];for(let u=t;u>=0;u=pr[u])out.push(g.pts[u]);return out.reverse();
  }
  City.path=(R,base)=>{
    const S=City.S,ids=R.s;if(ids.length<2)return base(R);
    if(!G||Sref!==S){G=build();Sref=S;cache.clear()}
    const key=ids.join()+(R.loop?'L':'');if(cache.has(key))return cache.get(key);
    const list=R.loop?ids.concat(ids[0]):ids,out=[],st=id=>S.stops.find(s=>s.id===id);
    const put=p=>{const l=out[out.length-1];if(!l||Math.hypot(l[0]-p[0],l[1]-p[1])>.01)out.push(p)};
    list.forEach((id,i)=>{
      const B=st(id);if(!B)return;
      if(i===0){put([B.x,B.y]);return}
      const A=st(list[i-1]);if(!A)return;
      const a=G.idx.get(G.sn[A.id]),b=G.idx.get(G.sn[B.id]),p=(a!=null&&b!=null)?dij(G,a,b):null;
      if(p){p.forEach(put);if(i===list.length-1)put([B.x,B.y])}else put([B.x,B.y]);
    });
    cache.set(key,out);return out;
  };
})();

<script>
/* Плагин: точки на концах дорог, перекрёстки и притягивание дорог друг к другу */
(function(){
  let J=null,Sref=null,tgt=null;
  City.on('change',()=>{J=null});
  const K=p=>Math.round(p[0])+','+Math.round(p[1]);
  const proj=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=[a[0]+dx*t,a[1]+dy*t];return{q,d:Math.hypot(p[0]-q[0],p[1]-q[1])}};
  function calc(){
    const S=City.S,segs=[],jm=new Map(),ends=[];
    S.roads.forEach((R,ri)=>{R.pts.slice(1).forEach((b,i)=>segs.push({a:R.pts[i],b,ri}));if(R.pts.length>1)ends.push(R.pts[0],R.pts[R.pts.length-1])});
    /* где дороги пересекаются */
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];jm.set(K(p),p);
    }
    /* где точка одной дороги лежит на другой (примыкание, слияние) */
    S.roads.forEach((R,ri)=>R.pts.forEach(p=>{if(segs.some(s=>s.ri!==ri&&proj(p,s.a,s.b).d<4))jm.set(K(p),p)}));
    return{j:[...jm.values()],e:ends.filter(p=>!jm.has(K(p)))};
  }
  const get=()=>{if(!J||Sref!==City.S){J=calc();Sref=City.S}return J};

  /* притягивание точек новой дороги к существующим: сначала к точкам и концам, потом к линии */
  City.snap=(q,r)=>{
    tgt=null;if(City.tool!=='road'&&City.tool!=='ext')return q;
    const roads=City.S.roads,k=City.view.k;let best=null;
    roads.forEach(R=>R.pts.forEach(p=>{const d=Math.hypot(p[0]-r[0],p[1]-r[1]);if(d<16/k&&(!best||d<best.d))best={d,p}}));
    if(!best)roads.forEach(R=>R.pts.slice(1).forEach((b,i)=>{const x=proj(r,R.pts[i],b);if(x.d<10/k&&(!best||x.d<best.d))best={d:x.d,p:x.q}}));
    if(best){tgt=best.p;return best.p.slice()}
    return q;
  };

  City.layers.over.push((ctx,P)=>{
    const g=get();
    g.e.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fillStyle=P.wh;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.ink;ctx.stroke()});
    g.j.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,7);ctx.fillStyle='#0c8a86';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.wh;ctx.stroke()});
    if(tgt&&(City.tool==='road'||City.tool==='ext')){ctx.beginPath();ctx.arc(tgt[0],tgt[1],12,0,7);ctx.lineWidth=2.5;ctx.strokeStyle='#0c8a86';ctx.stroke()}
  });
})();
</script>

};
const BC=['#d7263d','#1b998b','#f46036','#2e86ab','#8e44ad','#c79a00'];
  const pathOf=R=>{const b=R=>{const a=R.s.map(i=>City.S.stops.find(s=>s.id===i)).filter(Boolean).map(s=>[s.x,s.y]);if(R.loop&&a.length)a.push(a[0]);return a};return City.path?City.path(R,b):b(R)};
  City.busKit={MODELS,drawBus:(...a)=>drawBus(...a)};const CI=new WeakMap();

    ctx.lineJoin='round';

    if(bd){pp(ctx,bd.concat([M]));ctx.lineWidth=2.5;ctx.strokeStyle='#c0392b';ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([])}
    /* население */

<script>
/* Плагин: одинаковые тип и название + общая конечная точка = одна улица (автопродление) */
(function(){
  const same=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<1;
  function merge(){
    const s=City.sel;if(!s||s.k!=='roads')return;
    const o=s.o,S=City.S;if(!o.n||!o.n.trim())return;
    for(const R of S.roads){
      if(R===o||R.t!==o.t||R.n!==o.n||!!R.ow!==!!o.ow)continue;
      const a=R.pts,b=o.pts,A0=a[0],A1=a[a.length-1],B0=b[0],B1=b[b.length-1];
      /* у односторонних направления должны совпадать */
      const eq=(!!R.rev===!!o.rev),ok=need=>!R.ow||eq===need;
      let pts=null;
      if(same(A1,B0)&&ok(true))pts=a.concat(b.slice(1));
      else if(same(A1,B1)&&ok(false))pts=a.concat(b.slice().reverse().slice(1));
      else if(same(A0,B1)&&ok(true))pts=b.concat(a.slice(1));
      else if(same(A0,B0)&&ok(false))pts=b.slice().reverse().concat(a.slice(1));
      if(!pts)continue;
      R.pts=pts;S.roads=S.roads.filter(x=>x!==o);
      City.select('roads',R);City.changed();City.updateUI();
      return;
    }
  }
  $('#insp').addEventListener('change',e=>{if(e.target.id==='f-n'||e.target.id==='f-t')merge()});
})();
</script>
<script>
/* Плагин: светофоры на перекрёстках (там, где сходятся 3 и более дорог) */
(function(){
  let J=null,Sref=null;
  City.on('change',()=>{J=null});
  const K=p=>Math.round(p[0]/2)+','+Math.round(p[1]/2);
  const dseg=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
  function calc(){
    const S=City.S,cand=new Map(),segs=[];
    S.roads.forEach((R,ri)=>R.pts.slice(1).forEach((b,i)=>segs.push({a:R.pts[i],b,ri})));
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
      const s=segs[i],u=segs[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];cand.set(K(p),p);
    }
    S.roads.forEach((R,ri)=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{if(segs.some(s=>s.ri!==ri&&dseg(e,s.a,s.b)<4))cand.set(K(e),e)}));
    const out=[];
    cand.forEach(p=>{
      let arms=0;
      S.roads.forEach((R,ri)=>{
        const n=R.pts.length;let v=-1;
        for(let i=0;i<n;i++)if(Math.hypot(R.pts[i][0]-p[0],R.pts[i][1]-p[1])<4){v=i;break}
        if(v>=0)arms+=(v===0||v===n-1)?1:2;
        else if(segs.some(s=>s.ri===ri&&dseg(p,s.a,s.b)<2))arms+=2;
      });
      if(arms>=3)out.push(p);
    });
    return out;
  }
  const jn=()=>{if(!J||Sref!==City.S){J=calc();Sref=City.S}return J};
  const live=()=>City.S.lights.filter(l=>jn().some(p=>Math.hypot(p[0]-l.x,p[1]-l.y)<6));
  City.register({
    key:'lights',label:'Светофор',
    group:'Дороги',leaf:'Светофор',color:'#e4572e',
    tool:'light',hint:'Нажмите на перекрёсток (где сходятся 3+ дороги), чтобы поставить светофор. Повторный клик или «Ластик» — убрать.',
    click(p,r){
      const k=City.view.k;let best=null;
      jn().forEach(j=>{const d=Math.hypot(j[0]-r[0],j[1]-r[1]);if(d<26/k&&(!best||d<best.d))best={d,j}});
      if(!best)return;
      const ex=City.S.lights.find(l=>Math.hypot(l.x-best.j[0],l.y-best.j[1])<6);
      if(ex)City.del('lights',ex);else City.add('lights',{x:best.j[0],y:best.j[1],n:'Светофор'});
    },
    layer:'over',
    draw(ctx,P){
      if(City.tool==='light'){jn().forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],14,0,7);ctx.lineWidth=2;ctx.strokeStyle='#0c8a86';ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([])})}
      live().forEach(l=>{
        const x=l.x+12,y=l.y-12;
        ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(x,y);ctx.lineWidth=1.5;ctx.strokeStyle='#14232b';ctx.stroke();
        ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x-4.5,y-11,9,22,3);ctx.fillStyle='#1c2226';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.stroke();
        const ph=City.lightPhase?City.lightPhase(0):'*';   /* сигнал для горизонтальных дорог */
        [['#e63946',-6.5,'r'],['#f4c430',0,'y'],['#2ecc71',6.5,'g']].forEach(([c,dy,k])=>{ctx.globalAlpha=(ph==='*'||ph===k)?1:.25;ctx.beginPath();ctx.arc(x,y+dy,2.4,0,7);ctx.fillStyle=c;ctx.fill()});
        ctx.globalAlpha=1;
      });
    },
    hit(p,r){return live().find(l=>Math.hypot(l.x+12-p[0],l.y-12-p[1])<r+10||Math.hypot(l.x-p[0],l.y-p[1])<r+6)}
  });
})();
</script>
<script>
/* Плагин: машины в трафике (правостороннее движение, повороты на перекрёстках, светофоры) */
(function(){
  const mpu=()=>((City.S.scale||50)/50);
  const KM=(window.KMX||(window.KMX=[25,35,45,55]));                                   /* скорость по типу дороги, км/ч */
  /* Модели: img — файл рядом с index.html, l — длина в метрах, ws/rw — лобовое и заднее стекло (доли длины) */
  const CARS=[
    {n:'Toyota Corolla Fielder',img:'tcf.WEBP',l:4.4,ws:[.08,.24],rw:[-.43,-.38]},
    {n:'Mercedes CLA AMG 45 AMG I (C117, X117)',img:'mercedes_claamg45.WEBP',l:4.7,ws:[.06,.2],rw:[-.3,-.14]},
    {n:'Lexus RX V 350',img:'lexusrxv350.WEPB',l:4.9,ws:[.1,.25],rw:[-.44,-.38]},
    {n:'Lexus LC500',img:'lexuslc500.WEPB',l:4.8,ws:[.04,.2],rw:[-.3,-.16]}
  ];
  const COL=['#ffffff','#1c1f24','#9aa3a8','#b5121b','#1e4fa8','#d9d9d9','#2c3e50','#6b4f3a'];
  let cars=[],nodes=null,Sref=null,T=0,on=true,last=performance.now(),dn=null,cpos=[];
  const E=City.esc;
  const rr=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};
  const cLen=c=>Math.max(c.m.l*1.8/mpu(),8);

  /* длины вдоль дороги */
  const IN=new WeakMap();
  function inf(R){let m=IN.get(R.pts);if(!m){const c=[0];for(let i=1;i<R.pts.length;i++)c.push(c[i-1]+Math.hypot(R.pts[i][0]-R.pts[i-1][0],R.pts[i][1]-R.pts[i-1][1]));m={c,L:c[c.length-1]};IN.set(R.pts,m)}return m}
  function loc(R,s){
    const m=inf(R),P=R.pts;s=Math.max(0,Math.min(m.L,s));
    let i=1;while(i<P.length-1&&m.c[i]<s)i++;
    const a=P[i-1],b=P[i],l=(m.c[i]-m.c[i-1])||1,t=(s-m.c[i-1])/l;
    return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,tx:(b[0]-a[0])/l,ty:(b[1]-a[1])/l};
  }
  const nl=R=>R.ow?LN[R.t]:Math.max(1,LN[R.t]/2);              /* полос в одну сторону */
  const dOf=(R,c)=>{const w=RW[R.t],lw=w/(R.ow?LN[R.t]:Math.max(2,LN[R.t]));
    if(R.ow)return -w/2+(c.li+.5)*lw;
    return (c.dir>0?1:-1)*(c.li+.5)*lw};                       /* вперёд — по правую руку */
  function pos(c){const h=loc(c.R,c.s),d=dOf(c.R,c);return[h.x-h.ty*d,h.y+h.tx*d,h]}
  const auto=R=>Math.min(40,Math.round(inf(R).L/90));
  const carsOf=R=>Math.min(90,Math.round(((R.cars===undefined||R.cars==='')?auto(R):Math.max(0,Math.min(60,Math.round(+R.cars)||0)))*(window.TRAF?window.TRAF.mult():1)));

  /* светофор: 20 с цикл, оси чередуются */
  const phase=axis=>{const t=(T+(axis?10:0))%20;return t<8?'g':t<10?'y':'r'};
  City.lightPhase=phase;

  /* узлы: места пересечения дорог */
  function buildNodes(){
    const S=City.S,rs=S.roads,out=new Map(),sg=[],lights=S.lights||[];
    rs.forEach(R=>out.set(R,[]));
    rs.forEach(R=>{const m=inf(R);R.pts.slice(1).forEach((b,i)=>sg.push({R,a:R.pts[i],b,c0:m.c[i],l:m.c[i+1]-m.c[i]}))});
    for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++){
      const s=sg[i],u=sg[j];if(s.R===u.R)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];

    const T=trips(en.R,en.b),st=getSt(en.b),sc=parseDep(en.b.dep);en.T=T;en.e=T.e;en.st=st;st.sch=sc.length>0;

    if(st.run){const kk=st.tr.key;if(kk!==T.F.key&&!(T.B&&kk===T.B.key))st.run=false;else{const nt=kk===T.F.key?T.F:T.B;if(nt!==st.tr){st.tr=nt;st.d=Math.min(st.d,nt.L)}}}
        if(st.sch){
      if(!st.run)parkAt(st,T);
      if(t0!==null){
        const c=sc.filter(t=>t0<=t1?(t>t0&&t<=t1):(t>t0||t<=t1)).length;
        if(c)st.due=Math.min(3,(st.due||0)+c);
      }
        }else if(st.park||!st.run)start(st,T,0,T.F.L*((en.i+.5)/en.n));
  });
  /* ожидающие выезда автобусы съезжают вправо, чтобы освободить остановку */
  const slots={};
  ents.forEach(en=>{
    const st=en.st;if(!st||!st.run||!en.e)return;
    let tx=0,ty=0;
    if(st.park&&!((st.due||0)>0)){
      const key=en.e.s[0],slot=slots[key]=(slots[key]===undefined?0:slots[key]+1);
      const Lb=((City.busKit.MODELS[en.b.m]||{l:12}).l)*City.bu(),a=st.an||0,SIDE=10,back=slot*(Lb+2);

  }
  requestAnimationFrame(frame);
})();

/* ---------- время прибытия на остановку ---------- */
function etaSec(R,b,id){
  const st=BS.get(b);if(!st)return null;const T=trips(R,b);if(!T.F)return null;
  let best=null;const take=v=>{if(best===null||v<best)best=v};
  const vc=tr=>(tr.kmh*.85/3.6*4/mpu())||1;
  const plan=(leg,d,off,incl)=>{
    let tr=leg?T.B:T.F,cur=d,k=0,l=leg;
    while(tr&&k<3){
      const v=vc(tr);
      tr.stops.forEach(s=>{if(s.id!==id)return;if(k>0||(incl?s.s>=cur-.5:s.s>cur+.5))take(off+(s.s-cur)/v)});
      off+=(tr.L-cur)/v+DW;cur=0;k++;
      if(T.e.loop)tr=st.sch?null:T.F;
      else if(l===0&&T.B){l=1;tr=T.B}else{tr=st.sch?null:T.F;l=0}
    }
  };
  if(st.run&&st.tr&&!st.park)plan(st.leg,st.d,0,false);
  if(st.sch){const t0=tod(),ds=parseDep(b.dep).map(t=>{let m=t-t0;if(m<=0)m+=1440;return m});plan(0,0,Math.min(...ds)*MIN,true)}
  return best;
}

    let best=null;(R.buses||[]).forEach(b=>{const v=etaSec(R,b,id);if(v!==null&&(best===null||v<best))best=v});
    rows.push([R,best]);
  });

  rows.sort((a,b)=>(a[1]===null)-(b[1]===null)||a[1]-b[1]);
  return '<b style="font-size:13px">Маршруты:</b>'+rows.map(([R,v])=>`<div class="eta"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${E(R.c)};margin-right:6px"></i>${E(R.n)}</span><b>${v===null?'—':fmtMin(v/MIN)}</b></div>`).join('');
};

<script>
/* ===== Плагин: поворот карты, дальний зум, население/дата/скорость, слежение за транспортом,

(function(){

const mpu=()=>((S.scale||50)/50);

const G0={l:LIGHT.grid,d:DARK.grid};LIGHT.grid=DARK.grid='#0000';   /* старую сетку гасим, рисуем свою */

/* ---------- стили и разметка ---------- */

const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';

<div id="bp" class="fl" hidden><label><span id="bpn"></span><input id="bpr" type="range" min="1" max="40" value="4"></label></div>
<div id="fol" class="fl" hidden>${EYE}<span id="fol-n"></span><button id="fol-x" class="b" aria-label="Перестать следить">✕</button></div>`);
City.HINT.select='Нажмите на объект, чтобы изменить. Тяните карту, чтобы двигать. Повернуть: правая кнопка / Q и E / два пальца.';

let rot=0,rotT=null,dn=null,painting=null,follow=null,lastPick=null,vis=[],lastVis=[],lastTerr,tv=0,mw=[0,0];
let szT=4,szZ=1,gt=0,gk=null,speed=1,prevSp=1,alw=null;

/* ---------- время игры: ускорение ведёт все плагины через performance.now ---------- */
let virt=realNow(),lastR=virt;
try{performance.now=function(){const r=realNow();virt+=(r-lastR)*speed;lastR=r;return virt}}catch(e){}
let lastV=performance.now();
function setSpeed(s){performance.now();if(s)prevSp=s;speed=s;document.querySelectorAll('#hsp [data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===s))}
$('#hsp').onclick=e=>{const b=e.target.closest('[data-sp]');if(b)setSpeed(+b.dataset.sp)};
const sT=()=>{if(gk)try{localStorage.setItem(gk,String(gt))}catch(e){}};
const fmtDate=g=>{const d=new Date(2025,0,1+Math.floor(g)),h=Math.floor((g%1)*24);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).replace(' г.','')+', '+String(h).padStart(2,'0')+':00'};
addEventListener('pagehide',sT);document.addEventListener('visibilitychange',()=>{if(document.hidden)sT()});

/* ---------- ландшафт и зоны: хранение кусками 32×32 клетки ---------- */
const tget=(i,j)=>{const s=S.terr&&S.terr[(i>>5)+','+(j>>5)];return s?s.charAt(((j&31)<<5)|(i&31)):' '};
const isW=(i,j)=>{const c=tget(i,j);return c==='w'||c==='s'};
const isLand=(i,j)=>{const c=tget(i,j);return c!=='w'&&c!=='s'&&c!=='m'};
const hasT=()=>{if(!S.terr)return false;for(const k in S.terr)return true;return false};
function setT(cells,code){
  const st=S.terr,g=new Map();
  for(let q=0;q<cells.length;q+=2){const i=cells[q],j=cells[q+1],key=(i>>5)+','+(j>>5);let a=g.get(key);
    if(!a){const s=st[key];a=s?s.split(''):new Array(1024).fill(' ');g.set(key,a)}a[((j&31)<<5)|(i&31)]=code}

}
function setZ(cells,code){
  const st=S.zones,g=new Map(),dch=String.fromCharCode(256+Math.min(54000,Math.floor(gt)));
  for(let q=0;q<cells.length;q+=2){const i=cells[q],j=cells[q+1],key=(i>>5)+','+(j>>5),n=((j&31)<<5)|(i&31);let a=g.get(key);
    if(!a){const z=st[key];a=z?{t:z.t.split(''),d:z.d.split('')}:{t:new Array(1024).fill(' '),d:new Array(1024).fill(' ')};g.set(key,a)}
    if(code===' '){a.t[n]=' ';a.d[n]=' '}else if(a.t[n]!==code){a.t[n]=code;a.d[n]=dch}}
  g.forEach((a,key)=>{const t=a.t.join('');if(/^ +$/.test(t))delete st[key];else st[key]={t,d:a.d.join('')}});
}
/* клетки микросетки: рядом с дорогой, но не под ней, и только на суше */
City.on('change',()=>{alw=null});
function allowed(){
  if(alw)return alw;
  const cand=new Set(),blk=new Set();
  S.roads.forEach(R=>{const lo=RW[R.t]/2+2,hi=lo+ZB;
    for(let s=1;s<R.pts.length;s++){const a=R.pts[s-1],b=R.pts[s],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5));
      for(let q=0;q<=n;q++){const px=a[0]+(b[0]-a[0])*q/n,py=a[1]+(b[1]-a[1])*q/n;
        const i0=Math.floor((px-hi)/TC),i1=Math.floor((px+hi)/TC),j0=Math.floor((py-hi)/TC),j1=Math.floor((py+hi)/TC);
        for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const d=Math.hypot((i+.5)*TC-px,(j+.5)*TC-py);if(d<lo)blk.add(KEY(i,j));else if(d<=hi)cand.add(KEY(i,j))}}}});
  const a=[],set=new Set();let n=0;
  cand.forEach(kk=>{if(blk.has(kk))return;const i=Math.floor(kk/65536)-32768,j=kk%65536-32768;if(isLand(i,j)){set.add(kk);a[n++]=i;a[n++]=j}});
  return alw={set,a,n:n/2};
}

/* ---------- кисть ---------- */
function stamp(kind,wx,wy){

    if(ptr.size>=2){if(ptr.size===2)startGest(r);ptr.forEach((_,q)=>gids.add(q));e.stopPropagation();return}
    ov(e,r,sx,sy);return;
  }
  if(t==='pointermove'){
    if(rdrag&&id===rdrag.id){rot=rdrag.r0+(Math.atan2(sy-cy,sx-cx)-rdrag.a0);dirty=true;e.stopPropagation();return}
    if(ptr.has(id)){ptr.set(id,{x:sx,y:sy});
      if(gest&&ptr.size>=2){moveGest(r);e.stopPropagation();return}
      if(gids.has(id)){e.stopPropagation();return}}
    ov(e,r,sx,sy);return;
  }
  if(rdrag&&id===rdrag.id){rdrag=null;e.stopPropagation();return}
  const was=gids.has(id);ptr.delete(id);gids.delete(id);if(ptr.size<2)gest=null;
  if(was){e.stopPropagation();return}
  ov(e,r,sx,sy);
}
const cap={capture:true,passive:false};
['pointerdown','pointermove','pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,onPtr,cap));
addEventListener('pointerup',e=>{ptr.delete(e.pointerId);gids.delete(e.pointerId)});
addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);gids.delete(e.pointerId)});
wrap.addEventListener('wheel',e=>{
  if(e.target!==cv)return;
  if(e.shiftKey){e.preventDefault();e.stopPropagation();rot+=(e.deltaY||e.deltaX)*.002;rotT=null;dirty=true;return}
  const r=cv.getBoundingClientRect();ov(e,r,e.clientX-r.left,e.clientY-r.top);
},cap);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointermove',e=>{
  mw=[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k];
  if(painting&&e.pointerId===painting.id)strokeTo(mw);
  if(follow&&pan&&pan.m)stopFollow();
});
cv.addEventListener('pointerup',e=>{
  endPaint(e);
  if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  lastPick=pickVeh((e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k);
  if(lastPick&&!$('#pop').hidden)addEye();
});
cv.addEventListener('pointercancel',endPaint);

/* ---------- кнопки, клавиши ---------- */
const rotBy=d=>{rotT=(rotT===null?rot:rotT)+d*Math.PI/12;dirty=true};
$('#rotL').onclick=()=>rotBy(-1);$('#rotR').onclick=()=>rotBy(1);
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='q'||k==='й')rotBy(-1);else if(k==='e'||k==='у')rotBy(1);
  else if(k==='1'||k==='2'||k==='3')setSpeed(+k);
  else if(k===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setSpeed(speed?0:prevSp)}

$('#bpr').oninput=e=>{const v=+e.target.value;if(City.tool==='zone')szZ=v;else szT=v;bpLabel()};
function bpLabel(){const z=City.tool==='zone',v=z?szZ:szT;$('#bpn').textContent=(z?'Кисть зоны: ':'Размер кисти: ')+v+' кл. (≈'+Math.round(v*TC*mpu())+' м)'}
function bpShow(){const t=City.tool,z=t==='zone',show=t==='brush'||z;$('#bp').hidden=!show;if(!show)return;const r=$('#bpr');r.max=z?10:40;r.value=z?szZ:szT;bpLabel()}

/* ---------- слой поверх: курсор кисти и компас ---------- */
City.layers.over.push((ctx,P)=>{
  const t=City.tool,k=V.k;
  if((t==='brush'||t==='zone')&&mw){
    const size=t==='zone'?szZ:szT,rad=Math.max(size/2*TC,TC*.5);
    ctx.beginPath();ctx.arc((Math.floor(mw[0]/TC)+.5)*TC,(Math.floor(mw[1]/TC)+.5)*TC,rad,0,7);
    ctx.lineWidth=2/k;ctx.strokeStyle='#0c8a86';ctx.setLineDash([6/k,4/k]);ctx.stroke();ctx.setLineDash([]);
  }
  const d=devicePixelRatio||1,r=cv.getBoundingClientRect(),cx=r.width-50,cy=r.height-64,c=Math.cos(rot),s=Math.sin(rot);
  ctx.save();ctx.setTransform(d,0,0,d,0,0);
  ctx.beginPath();ctx.arc(cx,cy,36,0,7);ctx.fillStyle=P.bg;ctx.fill();            /* закрываем старый компас */
  ctx.beginPath();ctx.arc(cx,cy,34,0,7);ctx.lineWidth=1.5;ctx.strokeStyle=P.lab;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.closePath();ctx.fillStyle='#d7263d';ctx.fill();
  ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.closePath();ctx.fillStyle=P.lab;ctx.fill();
  ctx.restore();
  ctx.fillStyle=P.ink;ctx.font='800 11px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
  [['С',0,-26],['Ю',0,26],['В',26,0],['З',-26,0]].forEach(([tx,x,y])=>ctx.fillText(tx,cx+c*x-s*y,cy+s*x+c*y));
  ctx.restore();
});

/* ---------- главный цикл плагина: время, поворот, панели ---------- */
let lastTool=null,hudAt=0,xyWas=false,saveAt=realNow();
function popTotal(){
  let n=0;(S.dists||[]).forEach(D=>{n+=+D.pop||0});
  const Z=S.zones;if(Z)for(const key in Z){const z=Z[key];for(let q=0;q<1024;q++)if(z.t.charAt(q)==='r')n+=4*clamp((gt-(z.d.charCodeAt(q)-256))/GROW,0,1)}
  return Math.round(n);
}
(function frame(){
  const v=performance.now();gt+=(v-lastV)/1000/DAYSEC;lastV=v;
  const key='citymap:t:'+idx.cur;
  if(key!==gk){sT();gk=key;try{const t=localStorage.getItem(key);gt=t?(+t||0):0}catch(e){gt=0}}
  const rn=realNow();
  if(rn-saveAt>5000){saveAt=rn;sT()}
  if(rotT!==null){const dl=rotT-rot;if(Math.abs(dl)<.002){rot=rotT;rotT=null;if(Math.abs(rot)<.003)rot=0}else rot+=dl*.25;dirty=true}
  const xy=$('#xy');
  if(Math.abs(rot)>.003){if(xy.classList.contains('on')){xyWas=true;xy.click()}}
  else if(xyWas){xyWas=false;if(!xy.classList.contains('on'))xy.click()}
  if(City.tool!==lastTool){lastTool=City.tool;bpShow()}
  if(rn-hudAt>250){hudAt=rn;$('#h-date').textContent=fmtDate(gt);$('#h-pop').textContent=popTotal().toLocaleString('ru-RU')}
  requestAnimationFrame(frame);
})();
City.game={get day(){return gt},get speed(){return speed},setSpeed};
City.vis=()=>lastVis;
City.pick=()=>lastPick;
City.follow=()=>follow;
dirty=true;
})();

<script>
/* ===== Плагин 2: жители домов и районов, пассажиры (остановки и автобусы),
   кнопка «Маршрут» при слежении, подтверждение удаления важных зданий.
   Вставлять ПОСЛЕ плагина city-plugin (поворот/слежение). ===== */
(function(){
const TC=10,GROW=6,F='Manrope,system-ui,sans-serif';
const CAP={'MAZ 206.948':68,'MAZ 206.063':40,'Yutong ZK6890HGQ':75,
 'МАЗ-203.065':100,'МАЗ-203.946':100,'МАЗ-206.945':68,'МАЗ-216.066':170,
 'ЛиАЗ-5292.65':112,'ЛиАЗ-6213.65':154,'НЕФАЗ-5299-40-52':111,
 'ПАЗ-320415-04 Вектор Next':50,'Yutong ZK6126HG':90,'Zhongtong LCK6126HQ':90};
const IMP=new Set(['terminal','hangar','tower','industry','office']);      /* «важные» здания: спросим «Вы уверены?» */
const PH={park:'Стоянка',taxiout:'Руление на взлёт',roll:'Разбег',fly:'Полёт',land:'Посадка',taxiin:'Руление на стоянку'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mpu=()=>((S.scale||50)/50);
const n0=v=>Math.round(v).toLocaleString('ru-RU');
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;

/* ---------- жители домов ---------- */
const auto=b=>Math.max(1,Math.round((b.pts?area(b.pts):b.w*b.h)*mpu()*mpu()/25));
const hp=b=>b.t!=='house'?0:(b.pop===undefined||b.pop===''?auto(b):Math.max(0,+b.pop||0));
City.insp.blds=o=>o.t==='house'?`<label>Жителей<input type="number" min="0" data-f="pop" placeholder="авто (${auto(o)})" value="${o.pop===undefined?'':City.esc(o.pop)}"></label>`:'';
function zcells(fn){
  const Z=S.zones,g=City.game?City.game.day:0;if(!Z)return;
  for(const key in Z){const z=Z[key],p=key.split(','),i0=+p[0]*32,j0=+p[1]*32;
    for(let n=0;n<1024;n++){if(z.t.charAt(n)!=='r')continue;
      fn((i0+(n&31)+.5)*TC,(j0+(n>>5)+.5)*TC,4*clamp((g-(z.d.charCodeAt(n)-256))/GROW,0,1))}}
}
let total=0;
function recalc(){
  const D=S.dists||[];let t=0;D.forEach(d=>{d.pop=0});
  S.blds.forEach(b=>{const v=hp(b);if(!v)return;t+=v;const c=[b.x+b.w/2,b.y+b.h/2];D.forEach(d=>{if(inPoly(c,d.pts))d.pop+=v})});
  zcells((x,y,p)=>{t+=p;if(D.length){const c=[x,y];D.forEach(d=>{if(inPoly(c,d.pts))d.pop+=p})}});
  D.forEach(d=>{d.pop=Math.round(d.pop)});total=Math.round(t);
}
City.totalPop=()=>total;
City.insp.dists=o=>`<div style="font-size:13px;color:var(--mut)">Население: <b style="color:var(--ink)">${n0(o.pop||0)} чел.</b><br>считается по жителям домов в районе</div><div style="font-size:13px;color:var(--mut)">Площадь: <b style="color:var(--ink)">${(area(o.pts)*mpu()*mpu()/1e6).toFixed(2).replace('.',',')} км²</b></div>`;

/* ---------- остановки и автобусы ---------- */
const bst=new WeakMap(),nearC=new WeakMap();let ver=0,lastDay=null;
City.on('change',()=>ver++);
function near(s){
  let c=nearC.get(s);if(c&&c.v===ver)return c.val;
  let v=0;S.blds.forEach(b=>{if(b.t==='house'&&Math.hypot(b.x+b.w/2-s.x,b.y+b.h/2-s.y)<160)v+=hp(b)});
  zcells((x,y,p)=>{if(Math.hypot(x-s.x,y-s.y)<160)v+=p});
  nearC.set(s,{v:ver,val:v});return v;
}
const capOf=b=>CAP[b.m]||40;
function nextIdx(st,R){
  const n=R.s.length;if(st.idx<0)return -1;
  if(R.loop)return (st.idx+1)%n;
  let ni=st.idx+st.dir;if(ni<0||ni>=n)ni=st.idx-st.dir;return ni;
}
function serve(q){
  const b=q.ref,R=q.R,ids=R.s,thr=26;let st=bst.get(b);
  if(!st){st={load:0,at:null,idx:-1,dir:1};bst.set(b,st)}
  if(st.at){if(Math.hypot(st.at.x-q.x,st.at.y-q.y)>thr+8)st.at=null;else return}
  let hit=null;
  for(const id of ids){const s=S.stops.find(x=>x.id===id);if(s&&Math.hypot(s.x-q.x,s.y-q.y)<thr){hit=s;break}}
  if(!hit)return;
  st.at=hit;
  const cand=[];ids.forEach((id,i)=>{if(id===hit.id)cand.push(i)});
  if(cand.length){
    let c=cand[0];
    if(st.idx>=0){const ex=R.loop?(st.idx+1)%ids.length:st.idx+st.dir;c=cand.reduce((a,x)=>Math.abs(x-ex)<Math.abs(a-ex)?x:a,cand[0]);
      if(!R.loop){if(c>st.idx)st.dir=1;else if(c<st.idx)st.dir=-1}}
    else st.dir=1;
    st.idx=c;
  }
  st.load-=Math.round(st.load*(.25+Math.random()*.3));
  const board=Math.min(Math.floor(hit.w||0),capOf(b)-st.load);
  if(board>0){hit.w-=board;st.load+=board}
}
function sim(){
  const day=City.game.day;if(lastDay===null)lastDay=day;
  const dm=Math.max(0,(day-lastDay)*1440);lastDay=day;
  if(City.stopTick)City.stopTick(S.stops);
  City.vis().forEach(q=>{if(q.k==='bus'&&q.R)serve(q)});
}
City.insp.stops=o=>`<div id="st-w" style="font-size:13px;color:var(--mut)">Ожидают: <b style="color:var(--ink)">${Math.floor(o.w||0)}</b> чел.</div><div style="font-size:12px;color:var(--mut)">Жителей рядом: ≈${n0(near(o))}</div>`;
cv.addEventListener('pointerup',()=>{
  const pk=City.pick&&City.pick(),pop=$('#pop');
  if(pk&&pk.k==='bus'&&!pop.hidden&&!$('#pp-load')){const r=pop.querySelector('.row');if(r)r.insertAdjacentHTML('beforebegin','<div id="pp-load" style="font-weight:700"></div>')}
});
function liveUI(){
  const pk=City.pick&&City.pick(),el=$('#pp-load');
  if(el&&pk&&pk.k==='bus'){const st=bst.get(pk.ref);el.textContent='В автобусе: '+(st?st.load:0)+' / '+capOf(pk.ref)}
  const s=City.sel;if(s&&s.k==='stops'){const b=$('#st-w b');if(b)b.textContent=Math.floor(s.o.w||0)}
}

/* ---------- кнопка «Маршрут» ---------- */
let showRoute=false;
$('#fol-x').insertAdjacentHTML('beforebegin','<button id="fol-r" class="b">Маршрут</button>');
$('#fol-r').onclick=e=>{showRoute=!showRoute;e.currentTarget.classList.toggle('on',showRoute);City.redraw()};
function chev(ctx,pts,sp,sz,col){
  ctx.fillStyle=col;let acc=0,nx=sp/2;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!L)continue;const an=Math.atan2(b[1]-a[1],b[0]-a[0]);
    while(nx-acc<=L){const t=(nx-acc)/L;ctx.save();ctx.translate(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);ctx.rotate(an);
      ctx.beginPath();ctx.moveTo(sz,0);ctx.lineTo(-sz,-sz*.8);ctx.lineTo(-sz*.3,0);ctx.lineTo(-sz,sz*.8);ctx.closePath();ctx.fill();ctx.restore();nx+=sp}
    acc+=L}
}
const cen=a=>[a.pts.reduce((s,p)=>s+p[0],0)/a.pts.length,a.pts.reduce((s,p)=>s+p[1],0)/a.pts.length];
function overlay(ctx,P,k){
  const f=City.follow();if(!f||!showRoute)return;
  const q=City.vis().find(v=>v.ref===f.ref);if(!q)return;const u=1/k;
  const txt=(t,x,y)=>{ctx.font='700 '+(12*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5*u;ctx.lineJoin='round';ctx.strokeStyle=P.bg;ctx.strokeText(t,x,y);ctx.fillStyle=P.ink;ctx.fillText(t,x,y)};
  if(f.k==='bus'&&q.R){
    const R=q.R,pts=stopPts(R),st=bst.get(q.ref),w=Math.max(16,10*u);
    if(pts.length>1){line(pts,w,R.c+'55');chev(ctx,pts,60*u,6*u,'#fff')}
    const ni=st?nextIdx(st,R):-1;
    R.s.forEach((id,i)=>{const s=S.stops.find(x=>x.id===id);if(!s)return;
      ctx.beginPath();ctx.arc(s.x,s.y,9*u,0,7);ctx.fillStyle=R.c;ctx.fill();ctx.lineWidth=2*u;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.font='800 '+(10*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(i+1,s.x,s.y+.5*u);
      if(i===ni){ctx.beginPath();ctx.arc(s.x,s.y,15*u,0,7);ctx.lineWidth=3*u;ctx.strokeStyle='#0c8a86';ctx.stroke()}});
    const nx=ni>=0?S.stops.find(x=>x.id===R.s[ni]):null;
    txt((q.ref.m)+' · '+(st?st.load:0)+'/'+capOf(q.ref)+' чел.'+(nx?' · дальше: '+nx.n:''),q.x,q.y-q.r-14*u);
  }else if(f.k==='car'){
    const c=f.ref,Rd=c.R;if(!Rd)return;
    line(Rd.pts,RW[Rd.t]+10,'#0c8a8666');chev(ctx,c.dir>0?Rd.pts:Rd.pts.slice().reverse(),60*u,6*u,'#0c8a86');
    txt('Едет по: '+(Rd.n||'дорога'),q.x,q.y-q.r-14*u);
  }else if(f.k==='air'){
    const a=f.ref,R=a.R;if(!R)return;
    const cs=R.s.map(id=>S.airports.find(x=>x.id===id)).filter(Boolean).map(cen);if(R.loop&&cs.length)cs.push(cs[0]);
    if(cs.length>1)line(cs,4*u,R.c,[12*u,9*u]);
    if(a.dest){poly(a.dest.pts);ctx.lineWidth=4*u;ctx.strokeStyle='#0c8a86';ctx.stroke();line([[q.x,q.y],cen(a.dest)],3*u,'#0c8a86',[8*u,6*u])}
    txt((PH[a.ph]||'')+(a.dest?' → '+a.dest.n:''),q.x,q.y-q.r-14*u);
  }
}
City.layers.over.push((ctx,P)=>{
  const k=City.view.k,u=1/k;
  if(k>.45)S.stops.forEach(s=>{
    const n=Math.floor(s.w||0);if(!n)return;
    ctx.font='700 '+(10*u)+'px '+F;const w=ctx.measureText(n).width+8*u,x=s.x+8*u,y=s.y-20*u;
    ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,14*u,7*u);ctx.fillStyle='#0c8a86';ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x+w/2,y+7.5*u);
  });
  if(k>1.2)City.vis().forEach(q=>{
    if(q.k!=='bus')return;const st=bst.get(q.ref);
    ctx.font='700 '+(10*u)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3*u;ctx.lineJoin='round';ctx.strokeStyle=P.bg;
    const t=(st?st.load:0)+'/'+capOf(q.ref);ctx.strokeText(t,q.x,q.y-q.r-4*u);ctx.fillStyle=P.ink;ctx.fillText(t,q.x,q.y-q.r-4*u);
  });
  overlay(ctx,P,k);
});

/* ---------- ластик: «Вы уверены?» для важных зданий ---------- */
$('#wrap').addEventListener('pointerdown',e=>{
  if(e.target!==cv||e.cancelBubble||e.button!==0||City.tool!=='erase')return;
  const h=pick([(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k],true);if(!h)return;
  const o=h.o,nm=o.n?' «'+o.n+'»':'';let name=null;
  if(h.k==='blds'&&IMP.has(o.t))name=(BLD[o.t]?BLD[o.t][0]:'Здание')+nm;
  else if(h.k==='depots')name='АТП'+nm;
  else if(h.k==='airports')name='Территория аэропорта'+nm;
  if(!name)return;
  e.stopPropagation();e.preventDefault();
  if(confirm('Удалить: '+name+'?\nВы уверены?'))del(h.k,h.o);
},{capture:true});

/* ---------- цикл ---------- */
let at=0;recalc();
(function frame(){
  const n=Date.now();if(n-at>500){at=n;recalc()}
  sim();liveUI();
  if(!City.follow()&&showRoute){showRoute=false;$('#fol-r').classList.remove('on')}
  requestAnimationFrame(frame);
})();
})();
</script>
<script>
/* Плагин: здания, парки, водоёмы, терминалы и т.д. — прямоугольником или контуром */
(function(){
  let poly_=false,pts=null;
  const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  City.HINT.bld='Прямоугольник: нажмите или протяните. Контур: ставьте точки по углам, первая точка или «Готово» — закончить.';
  $('#wrap').insertAdjacentHTML('beforeend','<div id="bm" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:4px;display:flex;gap:2px;align-items:center"><button id="bm-r" class="b on">Прямоугольник</button><button id="bm-p" class="b">Контур</button><span id="bm-n" hidden style="padding:0 8px"></span><button id="bm-ok" class="b p" hidden>Готово</button><button id="bm-no" class="b" hidden>Отмена</button></div>');
  const mode=m=>{poly_=m;pts=null;$('#bm-r').classList.toggle('on',!m);$('#bm-p').classList.toggle('on',m);City.redraw()};
  $('#bm-r').onclick=()=>mode(false);$('#bm-p').onclick=()=>mode(true);
  function done(){
    const a=pts;pts=null;
    if(a&&a.length>2){
      const xs=a.map(p=>p[0]),ys=a.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);
      City.add('blds',{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y,t:tt,n:'',pts:a});
    }
    City.redraw();
  }
  $('#bm-ok').onclick=done;$('#bm-no').onclick=()=>{pts=null;City.redraw()};
  addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||City.tool!=='bld')return;
    if(e.key==='Enter')done();if(e.key==='Escape')pts=null;City.redraw();
  });
  City.tools.bld=p=>{
    if(!poly_){drag={a:p,b:p};return}
    if(!pts){pts=[p];return}
    const k=City.view.k,l=pts[pts.length-1],f=pts[0];
    if(dst(l,p)<6/k||(pts.length>2&&dst(f,p)<12/k))done();else pts.push(p);
  };

  /* отрисовка контура */
  const _rect=rect;
  rect=function(b,ghost){
    if(!b.pts)return _rect(b,ghost);
    const c=BLD[b.t]||BLD.house,z=b.t==='water'||b.t==='park';
    ctx.globalAlpha=ghost?.6:1;
    if(!z){poly(b.pts.map(p=>[p[0]+2,p[1]+3]));ctx.fillStyle='#0000002a';ctx.fill()}
    poly(b.pts);ctx.fillStyle=c[1];ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle=z?(b.t==='water'?'#5aa6d3':'#7fb872'):'#00000066';ctx.stroke();
    ctx.globalAlpha=1;
  };

  /* выбор/ластик: контур ловится по своей форме, а не по прямоугольнику вокруг */
  const _pick=pick;
  pick=function(p,edge){
    const orig=S.blds;let h;
    try{for(;;){
      h=_pick(p,edge);
      if(h&&h.k==='blds'&&h.o.pts&&!inPoly(p,h.o.pts)){S.blds=S.blds.filter(b=>b!==h.o);continue}
      break;
    }}finally{S.blds=orig}
    return h;
  };

  /* панель и набросок */
  City.layers.over.push(()=>{
    const on=City.tool==='bld';if(!on)pts=null;
    $('#bm').hidden=!on;if(!on)return;
    $('#bm-n').hidden=$('#bm-ok').hidden=$('#bm-no').hidden=!pts;
    if(pts){
      $('#bm-n').textContent='Точек: '+pts.length;
      const q=pts.concat([mouse]);
      poly(q);ctx.globalAlpha=.45;ctx.fillStyle=(BLD[tt]||BLD.house)[1];ctx.fill();ctx.globalAlpha=1;
      line(q,2.5,'#0c8a86',[8,6]);
      ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],5,0,7);ctx.fillStyle='#0c8a86';ctx.fill();
    }
  });
})();
</script>
<script>
/* Плагин: метро и поезда — станции, линии, составы с вагонами.
   Вставлять ПОСЛЕДНИМ, перед </body>. Рядом с index.html: m81765.png, lastochka.png */
(function(){
const E=City.esc,F='Manrope,system-ui,sans-serif',GAP=1.2;
const mpu=()=>((City.S.scale||50)/50);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RS=()=>City.S.rstops||(City.S.rstops=[]),RL=()=>City.S.rlines||(City.S.rlines=[]);
const rrp=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};

/* ===== Модели. Добавляйте сюда: img — файл рядом с index.html, cap — человек в вагоне, l/w — длина и ширина вагона в метрах, kmh — скорость ===== */
const MODELS={
  metro:{n:'МЕТРО 81-765.2/766.2/767.2',img:'m81765.png',cap:50,l:19.2,w:2.7,kmh:60,def:6,max:12,col:'#c8102e',draw:drawMetro},
  train:{n:'Ласточка',img:'lastochka.png',cap:60,l:21,w:3.3,kmh:90,def:5,max:12,col:'#2e5aa8',draw:drawSwallow}
};
const KINDS={metro:[['station','Станция'],['end','Конечная']],train:[['vokzal','Вокзал'],['station','Станция'],['end','Конечная'],['halt','Остановка']]};
const NM={station:'Станция',end:'Конечная',vokzal:'Вокзал',halt:'Остановочный пункт'};
const nc=R=>{const m=MODELS[R.sys];return clamp(Math.round(+R.cars>0?+R.cars:m.def),1,m.max)};
const ntr=R=>(R.trains===undefined||R.trains==='')?2:clamp(Math.round(+R.trains)||0,0,12);
const Wb=()=>Math.max(4.2/mpu(),7);
const Lc=m=>Math.max(m.l/mpu(),16),Wc=m=>Math.max(m.w/mpu(),Wb()*.74);

/* ===== вид сверху ===== */
function drawMetro(ctx,L,W,head,tail){
  ctx.lineWidth=.8;ctx.strokeStyle='#0009';
  rrp(ctx,-L/2,-W/2,L,W,W*.2);ctx.fillStyle='#2a6fc0';ctx.fill();ctx.stroke();
  ctx.fillStyle='#d9ecf7';ctx.fillRect(-L*.47,-W*.5,L*.94,W*.05);ctx.fillRect(-L*.47,W*.45,L*.94,W*.05);
  ctx.fillStyle='#12181d';ctx.fillRect(-L*.42,-W*.36,L*.84,W*.72);
  [-.3,.16].forEach(f=>{
    rrp(ctx,L*f,-W*.3,L*.15,W*.6,W*.06);ctx.fillStyle='#c4cacf';ctx.fill();ctx.stroke();
    ctx.fillStyle='#1c2226';[-.14,.14].forEach(y=>{ctx.beginPath();ctx.arc(L*(f+.075),W*y,W*.07,0,7);ctx.fill()});
  });
  if(head){ctx.fillStyle='#0b0f12';ctx.fillRect(L*.42,-W*.42,L*.08,W*.84);ctx.fillStyle='#fff3b0';ctx.fillRect(L*.495,-W*.34,L*.012,W*.14);ctx.fillRect(L*.495,W*.2,L*.012,W*.14)}
  if(tail){ctx.fillStyle='#0b0f12';ctx.fillRect(-L*.5,-W*.42,L*.08,W*.84);ctx.fillStyle='#d33';ctx.fillRect(-L*.506,-W*.34,L*.012,W*.14);ctx.fillRect(-L*.506,W*.2,L*.012,W*.14)}
}
function drawSwallow(ctx,L,W,head,tail){
  ctx.lineWidth=.8;ctx.strokeStyle='#0009';
  rrp(ctx,-L/2,-W/2,L,W,W*.22);ctx.fillStyle='#b9bfc4';ctx.fill();ctx.stroke();
  ctx.fillStyle='#e1352b';ctx.fillRect(-L*.5,-W*.5,L,W*.07);ctx.fillRect(-L*.5,W*.43,L,W*.07);
  rrp(ctx,-L*.46,-W*.38,L*.92,W*.76,W*.1);ctx.fillStyle='#8e979e';ctx.fill();
  rrp(ctx,-L*.34,-W*.28,L*.2,W*.56,W*.05);ctx.fillStyle='#dde1e4';ctx.fill();
  rrp(ctx,L*.08,-W*.26,L*.22,W*.52,W*.05);ctx.fillStyle='#5d676e';ctx.fill();
  if(head){rrp(ctx,L*.32,-W*.5,L*.18,W,W*.3);ctx.fillStyle='#e1352b';ctx.fill();ctx.stroke();ctx.fillStyle='#16222b';ctx.fillRect(L*.44,-W*.3,L*.035,W*.6)}
  if(tail){rrp(ctx,-L*.5,-W*.5,L*.18,W,W*.3);ctx.fillStyle='#e1352b';ctx.fill();ctx.stroke();ctx.fillStyle='#16222b';ctx.fillRect(-L*.475,-W*.3,L*.035,W*.6)}
}

/* ===== пути линий ===== */
const PC=new WeakMap();let ver=0;City.on('change',()=>ver++);
function build(R){
  const out=[];
  (R.s||[]).forEach(e=>{
    if(Array.isArray(e))out.push({p:e});
    else{const s=RS().find(x=>x.id===e&&x.sys===R.sys);if(s)out.push({p:[s.x,s.y],st:1})}
  });
  while(out.length&&!out[0].st)out.shift();
  while(out.length&&!out[out.length-1].st)out.pop();
  if(out.filter(o=>o.st).length<2)return null;
  if(R.loop)out.push(out[0]);
  const pts=[],c=[],T=[];let tot=0;
  out.forEach(o=>{
    const l=pts[pts.length-1];
    if(l){const d=Math.hypot(o.p[0]-l[0],o.p[1]-l[1]);if(d<.01){if(o.st)T.push(tot);return}tot+=d}
    pts.push(o.p);c.push(tot);if(o.st)T.push(tot);
  });
  if(pts.length<2)return null;
  return{pts,c,T,L:tot,sig:pts.length+':'+T.length+':'+Math.round(tot)};
}
function pathOf(R){let c=PC.get(R);if(c&&c.v===ver)return c.pa;const pa=build(R);PC.set(R,{v:ver,pa});return pa}
function at(pa,d,loop){
  const c=pa.c,L=pa.L;d=loop?((d%L)+L)%L:clamp(d,0,L);
  let i=1;while(i<c.length-1&&c[i]<d)i++;
  const a=pa.pts[i-1],b=pa.pts[i],l=(c[i]-c[i-1])||1,t=clamp((d-c[i-1])/l,0,1);
  return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,an:Math.atan2(b[1]-a[1],b[0]-a[0])};
}
const near=(p,pts,r)=>pts.slice(1).some((q,i)=>dseg(p,pts[i],q)<r);

/* ===== движение составов ===== */
const tm=new WeakMap();let T0=performance.now();
const half=R=>{const m=MODELS[R.sys];return(nc(R)*(Lc(m)+GAP)-GAP)/2};
const targets=(pa,R,h)=>R.loop?pa.T:pa.T.map(x=>pa.L>2*h?clamp(x,h,pa.L-h):pa.L/2);
function sync(){
  RL().forEach(R=>{
    const pa=pathOf(R);if(!pa){tm.delete(R);return}
    const n=ntr(R),sig=pa.sig+'|'+n;let st=tm.get(R);if(st&&st.sig===sig)return;
    const T=targets(pa,R,half(R)),arr=[];
    for(let k=0;k<n;k++){
      const d=pa.L*(k+.5)/n;let dir=1,i;
      if(R.loop||k%2===0){i=T.findIndex(x=>x>d);if(i<0)i=T.length-1}
      else{dir=-1;i=0;for(let q=T.length-1;q>=0;q--)if(T[q]<d){i=q;break}}
      arr.push({d,i,dir,v:0,dw:Math.random()*3});
    }
    tm.set(R,{sig,arr});
  });
}
function step(t,R,pa,dt,all){
  const mo=MODELS[R.sys],h=half(R),len=h*2,vmax=mo.kmh/3.6*4/mpu(),a=vmax/5;
  if(t.dw>0){t.dw-=dt;t.v=0;return}
  const T=targets(pa,R,h);if(t.i<0||t.i>=T.length)t.i=0;
  const rem=(T[t.i]-t.d)*t.dir;
  if(rem<=.4){
    if(R.loop&&t.i>=T.length-1){t.d=0;t.i=0}else t.d=T[t.i];
    t.v=0;t.dw=5+Math.random()*3;
    if(R.loop)t.i++;
    else{t.i+=t.dir;if(t.i<0||t.i>=T.length){t.dir=-t.dir;t.i+=2*t.dir}}
    return;
  }
  let vt=Math.min(vmax,Math.sqrt(2*a*rem)+1);
  all.forEach(o=>{
    if(o===t||o.dir!==t.dir)return;
    let g=(o.d-t.d)*t.dir;if(R.loop)g=((g%pa.L)+pa.L)%pa.L;
    if(g>0&&g<len+120)vt=Math.min(vt,Math.sqrt(2*a*Math.max(0,g-len-10)));
  });
  t.v+=clamp(vt-t.v,-a*3*dt,a*dt);t.v=Math.max(0,t.v);
  t.d+=t.dir*Math.min(t.v*dt,rem);
}
(function loop(){
  const n=performance.now(),dt=Math.min(.1,Math.max(0,(n-T0)/1000));T0=n;
  sync();let any=false;
  RL().forEach(R=>{const pa=pathOf(R),st=tm.get(R);if(!pa||!st)return;st.arr.forEach(t=>{step(t,R,pa,dt,st.arr);any=true})});
  if(any)City.redraw();
  requestAnimationFrame(loop);
})();

/* ===== рисование линии ===== */
let rl=null,tpos=[];
$('#wrap').insertAdjacentHTML('beforeend','<div id="rlb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:8px 14px;display:flex;gap:8px;align-items:center"><span id="rln"></span><button id="rlok" class="b p">Готово</button><button id="rlno" class="b">Отмена</button></div>');
function endLine(){
  if(!rl)return;const a=rl;rl=null;
  while(a.s.length&&Array.isArray(a.s[a.s.length-1]))a.s.pop();
  if(a.s.filter(e=>!Array.isArray(e)).length<2){City.redraw();return}
  const mo=MODELS[a.sys],n=RL().filter(l=>l.sys===a.sys).length+1;
  City.add('rlines',{n:(a.sys==='metro'?'Линия метро ':'Маршрут поезда ')+n,c:RC[RL().length%6],sys:a.sys,s:a.s,loop:!!a.loop,cars:mo.def,trains:2});
}
$('#rlok').onclick=()=>{endLine();City.redraw()};
$('#rlno').onclick=()=>{rl=null;City.redraw()};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='Enter'&&City.tool==='rline')endLine();
  if(e.key==='Escape'){rl=null;City.redraw()}
});

/* ===== регистрация ===== */
City.register({key:'rstops',label:'Станция',tool:'rstop',
  hint:'Нажмите на карту, чтобы поставить станцию. Тип можно сменить в карточке.',
  click(p){
    const a=String(tt).split(':'),sys=a[0],kind=a[1];if(!MODELS[sys]||!NM[kind])return;
    const n=RS().filter(x=>x.sys===sys).length+1;
    City.add('rstops',{id:City.S.id++,x:p[0],y:p[1],sys,k:kind,n:NM[kind]+' '+n});
  },
  hit:(p,r)=>RS().find(s=>Math.hypot(s.x-p[0],s.y-p[1])<r+12),
  inspector:o=>{
    const ks=KINDS[o.sys]||[],ln=RL().filter(l=>l.s.includes(o.id)).map(l=>E(l.n)).join(', ');
    return `<label>Тип<select data-f="k">${ks.map(([v,t])=>`<option value="${v}" ${o.k===v?'selected':''}>${t}</option>`).join('')}</select></label><div style="font-size:13px;color:var(--mut)">${o.sys==='metro'?'Метро':'Железная дорога'}${ln?'<br>Линии: <b style="color:var(--ink)">'+ln+'</b>':''}</div>`;
  }});
City.register({key:'rlines',label:'Линия',tool:'rline',
  hint:'Нажимайте станции по порядку. Пустое место — точка изгиба. Первая станция ещё раз — замкнуть кольцо. «Готово» — закончить.',
  click(p,r){
    const k=City.view.k,sys=String(tt);if(!MODELS[sys])return;
    if(rl&&rl.sys!==sys)rl=null;
    let best=null;
    RS().forEach(s=>{if(s.sys!==sys)return;const d=Math.hypot(s.x-r[0],s.y-r[1]);if(d<20/k&&(!best||d<best.d))best={d,s}});
    if(best){
      const id=best.s.id;
      if(!rl)rl={sys,s:[id],loop:false};
      else{
        const ids=rl.s.filter(e=>!Array.isArray(e)),lastStop=!Array.isArray(rl.s[rl.s.length-1]);
        if(id===ids[0]&&ids.length>2){rl.loop=true;endLine();return}
        if(!(lastStop&&id===ids[ids.length-1]))rl.s.push(id);
      }
    }else if(rl)rl.s.push(p.slice());
  },
  hit:(p,r)=>RL().find(R=>{const pa=pathOf(R);return pa&&near(p,pa.pts,Wb()/2+r+1)}),
  inspector:o=>{
    const mo=MODELS[o.sys],pa=pathOf(o),m=pa?pa.L*mpu():0,len=m<1000?Math.round(m)+' м':(m/1000).toFixed(2).replace('.',',')+' км';
    return `<div style="font-size:13px;color:var(--mut)">Модель: <b style="color:var(--ink)">${E(mo.n)}</b><br>Длина: <b style="color:var(--ink)">${len}</b>${o.loop?', кольцо':''}</div>`
    +`<label>Вагонов в составе<input type="number" min="1" max="${mo.max}" data-f="cars" value="${nc(o)}"></label>`
    +`<label>Поездов на линии<input type="number" min="0" max="12" data-f="trains" value="${ntr(o)}"></label>`
    +`<label>Цвет<input type="color" data-f="c" value="${E(o.c)}" style="height:34px;padding:2px"></label>`
    +`<div style="font-size:13px;color:var(--mut)">Вместимость состава: <b style="color:var(--ink)">${nc(o)*mo.cap} чел.</b> (${mo.cap} в вагоне)</div>`;
  }});
$('#insp').addEventListener('change',e=>{const s=City.sel;if(s&&s.k==='rlines'&&e.target.dataset.f)City.updateUI()});

City.addLeaf('Транспорт/Метро',['Станция метро','rstop','metro:station','#c8102e']);
City.addLeaf('Транспорт/Метро',['Конечная метро','rstop','metro:end','#c8102e']);
City.addLeaf('Транспорт/Метро',['Линия метро','rline','metro','#c8102e']);
City.addLeaf('Транспорт/Поезд',['Вокзал','rstop','train:vokzal','#2e5aa8']);
City.addLeaf('Транспорт/Поезд',['Станция','rstop','train:station','#2e5aa8']);
City.addLeaf('Транспорт/Поезд',['Конечная','rstop','train:end','#2e5aa8']);
City.addLeaf('Транспорт/Поезд',['Остановка (о.п.)','rstop','train:halt','#2e5aa8']);
City.addLeaf('Транспорт/Поезд',['Маршрут поезда','rline','train','#2e5aa8']);

/* ===== отрисовка ===== */
function badge(ctx,s,P,k){
  const sc=Math.max(1,.55/k),m=s.sys==='metro',col=MODELS[s.sys].col,sel=City.sel&&City.sel.o===s;
  let gl='М',fs=11,hh=13;
  ctx.save();ctx.translate(s.x,s.y);ctx.scale(sc,sc);
  if(sel){ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fillStyle='#0c8a8670';ctx.fill()}
  ctx.lineJoin='round';ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.fillStyle=col;
  if(m){
    const R=s.k==='end'?11:9;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.stroke();
    if(s.k==='end'){ctx.beginPath();ctx.arc(0,0,R+4,0,7);ctx.strokeStyle=col;ctx.stroke()}
    hh=R+4;
  }else{
    const D={vokzal:[42,22,'ВОКЗАЛ',9],station:[22,16,'Ст',10],end:[26,18,'К',11],halt:[15,14,'ОП',8]}[s.k]||[22,16,'Ст',10];
    rrp(ctx,-D[0]/2,-D[1]/2,D[0],D[1],4);ctx.fill();ctx.stroke();
    if(s.k==='end'){rrp(ctx,-D[0]/2-3,-D[1]/2-3,D[0]+6,D[1]+6,6);ctx.strokeStyle=col;ctx.stroke()}
    gl=D[2];fs=D[3];hh=D[1]/2+(s.k==='end'?3:0);
  }
  ctx.fillStyle='#fff';ctx.font='800 '+fs+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gl,0,.5);
  ctx.restore();
  if(k>.4&&s.n){
    const y=s.y+(hh+9)*sc;ctx.font='700 11px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.lineWidth=3.5;ctx.strokeStyle=P.bg;ctx.strokeText(s.n,s.x,y);ctx.fillStyle=P.ink;ctx.fillText(s.n,s.x,y);
  }
}
/* метро — под дорогами (подземная линия) */
City.layers.under.push((ctx,P)=>{
  RL().forEach(R=>{
    if(R.sys!=='metro')return;const pa=pathOf(R);if(!pa)return;
    ctx.lineCap='butt';line(pa.pts,Wb()+3,R.c+'44');line(pa.pts,2.2,R.c,[9,6]);ctx.lineCap='round';
  });
});
/* пути, станции, составы — поверх */
City.layers.over.push((ctx,P)=>{
  const k=City.view.k,dark=dk.matches,s0=City.sel;
  if(rl&&(City.tool!=='rline'||String(tt)!==rl.sys))rl=null;
  $('#rlb').hidden=!rl;
  if(rl)$('#rln').textContent='Станций: '+rl.s.filter(e=>!Array.isArray(e)).length;
  /* железнодорожные пути */
  RL().forEach(R=>{
    if(R.sys!=='train')return;const pa=pathOf(R);if(!pa)return;const w=Wb(),g=w*.28;
    if(s0&&s0.o===R)line(pa.pts,w+12,'#0c8a8670');
    ctx.lineCap='butt';
    line(pa.pts,w+2.5,'#0000002e');line(pa.pts,w,dark?'#4d4a45':'#a39a8d');line(pa.pts,w,dark?'#2c261f':'#5b4a3a',[1.6,3.8]);
    line(offs(pa.pts,g),1.3,'#d9dde0');line(offs(pa.pts,-g),1.3,'#d9dde0');line(pa.pts,1.6,R.c,[8,8]);
    ctx.lineCap='round';
  });
  RL().forEach(R=>{if(R.sys==='metro'&&s0&&s0.o===R){const pa=pathOf(R);if(pa)line(pa.pts,Wb()+12,'#0c8a8670')}});
  if(City.tool==='rline')RS().forEach(s=>{
    if(s.sys!==String(tt))return;
    ctx.beginPath();ctx.arc(s.x,s.y,22*Math.max(1,.55/k),0,7);ctx.lineWidth=2/k;ctx.strokeStyle='#0c8a86';ctx.setLineDash([5/k,4/k]);ctx.stroke();ctx.setLineDash([]);
  });
  RS().forEach(s=>badge(ctx,s,P,k));
  /* составы */
  tpos=[];
  RL().forEach(R=>{
    const pa=pathOf(R),st=tm.get(R);if(!pa||!st)return;
    const mo=MODELS[R.sys],cars=nc(R),L=Lc(mo),W=Wc(mo),pitch=L+GAP;
    st.arr.forEach(t=>{
      const cs=[];
      for(let j=0;j<cars;j++){
        const q=at(pa,t.d+t.dir*((cars-1)/2-j)*pitch,R.loop);
        ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.an+(t.dir<0?Math.PI:0));
        mo.draw(ctx,L,W,j===0,j===cars-1);ctx.restore();
        cs.push([q.x,q.y]);
      }
      tpos.push({R,cs,r:L/2+2,m:mo});
    });
  });
  /* набросок новой линии */
  if(rl){
    const q=rl.s.map(e=>{if(Array.isArray(e))return e;const s=RS().find(x=>x.id===e);return s?[s.x,s.y]:null}).filter(Boolean);

<script>

  const cen=a=>[a.pts.reduce((s,p)=>s+p[0],0)/a.pts.length,a.pts.reduce((s,p)=>s+p[1],0)/a.pts.length];
  const aptOf=id=>D().airports.find(a=>a.id===id);
  const rwysOf=a=>D().rwys.filter(r=>inPoly(r.pts[0],a.pts)||inPoly(r.pts[r.pts.length-1],a.pts));

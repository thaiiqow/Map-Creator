  const plen=a=>a.slice(1).reduce((s,p,i)=>s+dst(p,a[i]),0);
  const near=(p,pts,r)=>pts.slice(1).some((q,i)=>dseg(p,pts[i],q)<r);
  let dr=null,ar=null,M=[0,0],G=null,fl=[],Sref=null,need=true,T0=performance.now(),dn=null,fpos=[];

  /* ---------- панель «Готово» для рисования ---------- */
  $('#wrap').insertAdjacentHTML('beforeend','<div id="apb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:8px 14px;display:flex;gap:8px;align-items:center"><span id="apn"></span><button id="apok" class="b p">Готово</button><button id="apno" class="b">Отмена</button></div>');
  const ui=()=>{
    if(dr&&dr.t!==City.tool)dr=null;if(ar&&City.tool!=='aroute')ar=null;

  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){endDraw();endRoute()}if(e.key==='Escape')dr=ar=null;City.redraw()});

  /* ---------- рисование линий и территорий ---------- */
  function stroke(kind,p){

  }
  function endDraw(){

  /* маршрут: s — id аэропортов, legs[i] — промежуточные точки между s[i] и следующим аэропортом (для кольца — и от последнего к первому) */
  function endRoute(){

    if(a.s.length>1)City.add('aroutes',{n:'Рейс '+(S.aroutes.length+1),c:RC[S.aroutes.length%6],s:a.s,loop:!!a.loop,legs:a.legs,planes:[{m:MK[0],al:Object.keys(PLANES[MK[0]].al)[0]}]});
  }

  /* ---------- регистрация инструментов ---------- */
  const G0='Транспорт/Аэропорт';
  const lenI=o=>`<div style="font-size:13px;color:var(--mut)">Длина: <b style="color:var(--ink)">${Math.round(plen(o.pts)*mpu()).toLocaleString('ru-RU')} м</b></div>`;
  const widI=d=>o=>`<label>Ширина<input type="number" min="4" data-f="w" value="${E(o.w||d)}"></label>`+lenI(o);
  City.register({key:'airports',label:'Аэропорт',group:G0,leaf:'Территория аэропорта',color:'#8ea1ad',tool:'apt',
    hint:'Обведите территорию аэропорта точками. Клик по первой точке, двойной клик или «Готово» — закончить. Выбрать территорию — нажать на её границу.',click:p=>stroke('apt',p)});
  City.register({key:'rwys',label:'Взлётная полоса',group:G0,leaf:'Взлётная полоса',color:'#4a5258',tool:'rwy',
    hint:'Ставьте точки полосы. Двойной клик или «Готово» — закончить.',click:p=>stroke('rwy',p),
    hit:(p,r)=>D().rwys.find(R=>near(p,R.pts,(+R.w||30)/2+r)),inspector:widI(30)});
  City.register({key:'taxis',label:'Рулёжная дорожка',group:G0,leaf:'Рулёжная дорожка',color:'#7a838a',tool:'taxi',
    hint:'Ставьте точки рулёжной дорожки. Двойной клик или «Готово» — закончить.',click:p=>stroke('taxi',p),
    hit:(p,r)=>D().taxis.find(R=>near(p,R.pts,(+R.w||14)/2+r)),inspector:widI(14)});
  City.register({key:'stands',label:'Стоянка самолёта',group:G0,leaf:'Стоянка самолётов',color:'#e0b400',tool:'stand',
    hint:'Нажмите на карту, чтобы поставить стоянку. Угол носа задаётся в карточке.',
    click:p=>City.add('stands',{x:p[0],y:p[1],a:0,n:'Стоянка '+(D().stands.length+1)}),
    hit:(p,r)=>D().stands.find(s=>dst([s.x,s.y],p)<r+18),
    inspector:o=>`<label>Угол носа, °<input type="number" data-f="a" value="${E(o.a||0)}"></label>`});
  City.addLeaf(G0,['Терминал','bld','terminal','#cdd6df']);
  City.addLeaf(G0,['Ангар','bld','hangar','#b9c0c7']);
  City.addLeaf(G0,['Диспетчерская вышка','bld','tower','#e3d9c6']);
  City.register({key:'fences',label:'Забор',group:G0,leaf:'Забор',color:'#59636b',tool:'fence',
    hint:'Ставьте точки забора. Двойной клик или «Готово» — закончить.',click:p=>stroke('fence',p),
    hit:(p,r)=>D().fences.find(F=>near(p,F.pts,r+3)),inspector:lenI});
  /* ломаная маршрута: центры аэропортов + промежуточные точки */
  const rpts=R=>{
    const q=[],n=R.s.length,L=R.legs||[];
    for(let i=0;i<n;i++){
      const a=aptOf(R.s[i]);if(a)q.push(cen(a));
      if(i<n-1||R.loop)(L[i]||[]).forEach(p=>q.push(p));
    }
    if(R.loop&&q.length)q.push(q[0]);

  };

  City.register({key:'aroutes',label:'Маршрут самолётов',group:G0,leaf:'Маршрут самолётов',color:'#2e86ab',tool:'aroute',

    click(p,r){
      const a=D().airports.find(a=>inPoly(r,a.pts));
      if(!a){if(ar)ar.cur.push(p.slice());return}
      if(!ar){ar={s:[a.id],loop:false,legs:[],cur:[]};return}
      if(a.id===ar.s[0]&&ar.s.length>2){ar.legs.push(ar.cur);ar.cur=[];ar.loop=true;endRoute()}
      else if(a.id!==ar.s[ar.s.length-1]){ar.legs.push(ar.cur);ar.cur=[];ar.s.push(a.id)}
    },
    hit:(p,r)=>D().aroutes.find(R=>near(p,rpts(R),r+2)),
    inspector:o=>{
      const ps=o.planes||[];
      return `<div style="font-size:13px;color:var(--mut)">Аэропортов: <b style="color:var(--ink)">${o.s.length}</b>${o.loop?', кольцо':''}${wpN(o)?', точек пути: <b style="color:var(--ink)">'+wpN(o)+'</b>':''}</div><label>Самолёты на маршруте</label>`
      +ps.map((p,i)=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="justify-content:flex-start;flex-wrap:nowrap"><select data-pi="${i}" data-pf="m" style="margin:0;flex:1">${MK.map(k=>`<option ${k===p.m?'selected':''}>${k}</option>`).join('')}</select><button class="b danger" data-pdel="${i}" aria-label="Убрать">✕</button></div><select data-pi="${i}" data-pf="al" style="margin:0">${Object.keys((PLANES[p.m]||PLANES[MK[0]]).al).map(k=>`<option ${k===p.al?'selected':''}>${k}</option>`).join('')}</select></div>`).join('')
      +'<button class="b" data-padd="1">+ Добавить самолёт</button>';
    }});
  /* территорию выбираем по границе и проверяем последней, чтобы она не перекрывала остальное */
  City.hits.push({key:'airports',fn:(p,r)=>D().airports.find(a=>near(p,a.pts.concat([a.pts[0]]),r+3)||false)});

  $('#insp').addEventListener('click',e=>{
    const b=e.target.closest('button'),s=City.sel;if(!b||!s||s.k!=='aroutes')return;const o=s.o;
    if(b.dataset.padd){City.push();o.planes=o.planes||[];o.planes.push({m:MK[0],al:Object.keys(PLANES[MK[0]].al)[0]});City.changed();City.updateUI()}

  });

    const p=s.o.planes[+t.dataset.pi];if(!p)return;p[t.dataset.pf]=t.value;
    if(t.dataset.pf==='m'){p.al=Object.keys(PLANES[p.m].al)[0];City.updateUI()}
    City.changed();
  });

  /* ---------- граф рулёжных дорожек ---------- */
  function proj(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=[a[0]+dx*t,a[1]+dy*t];return{t,q,d:dst(p,q)}}
  function buildG(){
    const S=D(),P=S.rwys.concat(S.taxis),sg=[],lk=[];
    P.forEach((R,ri)=>{for(let i=1;i<R.pts.length;i++)sg.push({a:R.pts[i-1],b:R.pts[i],ri,sp:[{t:0,p:R.pts[i-1]},{t:1,p:R.pts[i]}]})});
    for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++){
      const s=sg[i],u=sg[j];if(s.ri===u.ri)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
      if(Math.abs(den)<1e-9)continue;
      const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=[s.a[0]+r[0]*t,s.a[1]+r[1]*t];s.sp.push({t,p});u.sp.push({t:v,p});
    }
    const attach=(e,maxD)=>{let best=null;sg.forEach(s=>{const r=proj(e,s.a,s.b);if(!best||r.d<best.r.d)best={s,r}});
      if(best&&best.r.d<maxD&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});lk.push([e,best.r.q])}};
    P.forEach(R=>{[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
      let best=null;sg.forEach(s=>{if(P[s.ri]===R)return;const r=proj(e,s.a,s.b);if(r.d<12&&(!best||r.d<best.r.d))best={s,r}});
      if(best&&best.r.d>.05){best.s.sp.push({t:best.r.t,p:best.r.q});lk.push([e,best.r.q])}})});
    S.stands.forEach(st=>attach([st.x,st.y],500));
    const idx=new Map(),pts=[],adj=[];
    const node=p=>{const k=K(p);if(!idx.has(k)){idx.set(k,pts.length);pts.push(p);adj.push([])}return idx.get(k)};
    const edge=(p,q)=>{const a=node(p),b=node(q);if(a===b)return;const w=dst(p,q);adj[a].push([b,w]);adj[b].push([a,w])};
    sg.forEach(s=>{s.sp.sort((x,y)=>x.t-y.t);for(let i=1;i<s.sp.length;i++)edge(s.sp[i-1].p,s.sp[i].p)});
    lk.forEach(l=>edge(l[0],l[1]));
    return{idx,pts,adj};
  }
  function gpath(a,b){
    if(!G)G=buildG();
    const s=G.idx.get(K(a)),t=G.idx.get(K(b));if(s==null||t==null)return null;
    const n=G.pts.length,d=new Array(n).fill(Infinity),pr=new Array(n).fill(-1),done=new Array(n).fill(false);d[s]=0;
    for(;;){
      let u=-1;for(let i=0;i<n;i++)if(!done[i]&&d[i]<Infinity&&(u<0||d[i]<d[u]))u=i;
      if(u<0||u===t)break;done[u]=true;
      G.adj[u].forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}});
    }
    if(d[t]===Infinity)return null;
    const out=[];for(let u=t;u>=0;u=pr[u])out.push(G.pts[u]);return out.reverse();
  }

  /* ---------- самолёты: стоянка -> рулёжка -> разбег -> полёт (через точки пути) -> посадка -> рулёжка -> стоянка ---------- */
  const peek=f=>{const n=f.R.s.length;if(f.R.loop)return{i:(f.i+1)%n,dir:1};let d=f.dir;if(f.i+d>=n||f.i+d<0)d=-d;return{i:f.i+d,dir:d}};
  function pickStand(a,me){
    const ss=standsOf(a),free=ss.filter(s=>!fl.some(o=>o!==me&&o.st===s)),arr=free.length?free:ss;
    return arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
  }
  function mk(f,pts){
    const q=[];pts.forEach(p=>{const l=q[q.length-1];if(!l||dst(l,p)>.05)q.push(p)});
    if(q.length<2)q.push([q[0][0]+.1,q[0][1]]);
    const c=[0];for(let i=1;i<q.length;i++)c.push(c[i-1]+dst(q[i],q[i-1]));
    f.path=q;f.cum=c;f.PL=c[c.length-1];f.d=0;
  }
  function at(f){
    const c=f.cum,d=Math.max(0,Math.min(f.PL,f.d));let i=1;while(i<c.length-1&&c[i]<d)i++;
    const a=f.path[i-1],b=f.path[i],l=(c[i]-c[i-1])||1,t=(d-c[i-1])/l;
    return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2(b[1]-a[1],b[0]-a[0])];
  }
  /* положение на пути полёта (через точки) */
  function flyAt(f){
    const c=f.fcum,d=Math.max(0,Math.min(f.FL,f.d));let i=1;while(i<c.length-1&&c[i]<d)i++;
    const a=f.fpts[i-1],b=f.fpts[i],l=(c[i]-c[i-1])||1,t=(d-c[i-1])/l;
    return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2(b[1]-a[1],b[0]-a[0])];
  }
  const orient=(pts,dir)=>{const a=pts[0],b=pts[pts.length-1];return(b[0]-a[0])*dir[0]+(b[1]-a[1])*dir[1]<0?pts.slice().reverse():pts};
  function arrive(f){
    f.i=f.nx.i;f.dir=f.nx.dir;f.ph='park';f.t=5+Math.random()*4;f.alt=0;f.v=0;f.path=null;
    if(f.st){f.x=f.st.x;f.y=f.st.y;f.ta=(+f.st.a||0)*Math.PI/180}
  }
  function depart(f){
    const R=f.R,cur=aptOf(R.s[f.i]),nx=peek(f),dest=aptOf(R.s[nx.i]);
    if(!cur||!dest||dest===cur){f.t=3;return}
    f.nx=nx;f.dest=dest;
    /* промежуточные точки этого перегона (в обратную сторону — в обратном порядке) */
    const LG=R.legs||[];
    f.wp=(R.loop||nx.dir>0)?(LG[f.i]||[]).slice():(LG[f.i-1]||[]).slice().reverse();
    const rws=rwysOf(cur),cc=cen(cur),dc=f.wp.length?f.wp[0]:cen(dest);
    if(!rws.length){f.st=null;startFly(f);return}
    f.roll=orient(rws[0].pts,[dc[0]-cc[0],dc[1]-cc[1]]);
    if(f.st){
      const sp=[f.st.x,f.st.y],tp=gpath(sp,f.roll[0]);
      mk(f,[sp].concat(tp||[]).concat([f.roll[0]]));f.ph='taxiout';
    }else{mk(f,f.roll);f.ph='roll';f.v=0}
  }
  function startFly(f){
    const dest=f.dest,p0=[f.x,f.y],dc=cen(dest),rws=rwysOf(dest),wp=f.wp||[],last=wp.length?wp[wp.length-1]:p0;
    f.st=null;
    if(rws.length){f.land=orient(rws[0].pts,[dc[0]-last[0],dc[1]-last[1]]);f.T=f.land[0]}else{f.land=null;f.T=dc}
    const q=[p0].concat(wp,[f.T]),c=[0];
    for(let i=1;i<q.length;i++)c.push(c[i-1]+dst(q[i],q[i-1]));
    f.fpts=q;f.fcum=c;f.FL=Math.max(1,c[c.length-1]);f.d=0;f.ph='fly';f.v=Math.max(f.v,80);
  }
  function step(f,dt){
    switch(f.ph){
      case 'park':f.t-=dt;if(f.t<=0)depart(f);break;
      case 'taxiout':f.d+=14*dt;if(f.d>=f.PL){mk(f,f.roll);f.ph='roll';f.v=0}break;
      case 'roll':{
        f.v+=22*dt;f.d+=f.v*dt;f.alt=Math.max(0,Math.min(.4,(f.v-60)/40));
        if(f.v>=80||f.d>=f.PL){f.d=Math.min(f.d,f.PL);const a=at(f);f.x=a[0];f.y=a[1];startFly(f)}
        break}
      case 'fly':{
        const rem=f.FL-f.d;f.v+=((rem<250?70:115)-f.v)*Math.min(1,dt);f.d+=f.v*dt;
        f.alt=Math.max(0,Math.min(1,.4+f.d/150,rem/150));
        if(f.d>=f.FL){
          if(f.land){mk(f,f.land);f.ph='land';f.v=Math.max(f.v*.6,55);f.alt=0}
          else{f.st=pickStand(f.dest,f);arrive(f)}
        }
        break}
      case 'land':{
        f.v=Math.max(12,f.v-16*dt);f.d+=f.v*dt;f.alt=0;
        if(f.d>=f.PL){
          const end=f.path[f.path.length-1],st=pickStand(f.dest,f);f.st=st;
          if(st){const tp=gpath(end,[st.x,st.y]);mk(f,[end].concat(tp||[]).concat([[st.x,st.y]]));f.ph='taxiin'}
          else arrive(f);
        }
        break}
      case 'taxiin':f.d+=14*dt;if(f.d>=f.PL)arrive(f);break;
    }
    if(f.ph==='fly'){const a=flyAt(f);f.x=a[0];f.y=a[1];f.ta=a[2]}
    else if(f.ph!=='park'&&f.path){const a=at(f);f.x=a[0];f.y=a[1];f.ta=a[2]}
    if(f.an===undefined)f.an=f.ta;
    let da=f.ta-f.an;da=Math.atan2(Math.sin(da),Math.cos(da));f.an+=da*Math.min(1,dt*(f.ph==='park'?2:5));
  }
  function syncF(){
    const S=D();
    fl=fl.filter(f=>S.aroutes.includes(f.R)&&(f.R.planes||[]).includes(f.pl)&&f.R.s.every(aptOf));
    S.aroutes.forEach(R=>{
      if(R.s.length<2||!R.s.every(aptOf))return;
      (R.planes||[]).forEach((pl,k)=>{
        if(fl.some(f=>f.pl===pl))return;
        const a=aptOf(R.s[k%R.s.length]),f={pl,R,i:k%R.s.length,dir:1,ph:'park',t:Math.random()*8+k*3,alt:0,v:0};
        f.st=pickStand(a,f);const c=f.st?[f.st.x,f.st.y]:cen(a);
        f.x=c[0];f.y=c[1];f.ta=f.an=f.st?(+f.st.a||0)*Math.PI/180:0;fl.push(f);
      });
    });
  }
  function ensure(){
    if(Sref!==City.S){Sref=City.S;fl=[];need=true;G=null}
    if(need){syncF();need=false}
  }

  /* ---------- рисование ---------- */
  const ln=(ctx,pts,w,c,dash)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineWidth=w;ctx.strokeStyle=c;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([])};
  const rrect=(ctx,x,y,w,h,r)=>{ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)};
  function drawPlane(ctx,L,sp,a,sh){
    const W=L*.095,HS=sp/2,c=x=>sh?'#0000003d':x;
    ctx.lineJoin='round';ctx.lineWidth=.6;ctx.strokeStyle='#0007';
    const poly=(pts,fill)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=c(fill);ctx.fill();if(!sh)ctx.stroke()};
    [1,-1].forEach(s=>{
      poly([[.1*L,s*W*.4],[-.09*L,s*HS],[-.16*L,s*HS],[-.1*L,s*W*.4]],a.wing);
      poly([[-.4*L,s*W*.3],[-.46*L,s*L*.16],[-.49*L,s*L*.16],[-.47*L,s*W*.3]],a.wing);
      if(a.tip)poly([[-.1*L,s*HS],[-.14*L,s*(HS+W*.45)],[-.17*L,s*(HS+W*.45)],[-.16*L,s*HS]],a.tipc||a.tail);
      rrect(ctx,.03*L,s*HS*.33-W*.25,.09*L,W*.5,W*.2);ctx.fillStyle=c(a.eng);ctx.fill();if(!sh)ctx.stroke();
    });
    const fus=()=>{ctx.beginPath();ctx.moveTo(.5*L,0);ctx.bezierCurveTo(.5*L,W*.35,.44*L,W/2,.36*L,W/2);ctx.lineTo(-.3*L,W/2);ctx.lineTo(-.5*L,W*.12);ctx.lineTo(-.5*L,-W*.12);ctx.lineTo(-.3*L,-W/2);ctx.lineTo(.36*L,-W/2);ctx.bezierCurveTo(.44*L,-W/2,.5*L,-W*.35,.5*L,0);ctx.closePath()};
    fus();ctx.fillStyle=c(a.fus);ctx.fill();
    if(a.rear&&!sh){ctx.save();fus();ctx.clip();ctx.fillStyle=a.rear;ctx.fillRect(-L,-W,L*.9,2*W);ctx.restore()}
    fus();if(!sh)ctx.stroke();
    if(!sh){ctx.fillStyle=a.tail;ctx.fillRect(-.5*L,-W*.07,.18*L,W*.14);ctx.fillStyle='#16222b';ctx.fillRect(.4*L,-W*.3,.03*L,W*.6)}
  }

  /* под дорогами: территория, рулёжки, полосы, стоянки */
  City.layers.under.push((ctx,P)=>{
    const S=D();
    S.airports.forEach(a=>{
      ctx.beginPath();a.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
      ctx.fillStyle='#8ea1ad30';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#5b6b77';ctx.setLineDash([12,8]);ctx.stroke();ctx.setLineDash([]);
    });
    S.airports.forEach(a=>{
      if(!a.n)return;const c=cen(a);
      ctx.font='800 24px Manrope,system-ui,sans-serif';if('letterSpacing' in ctx)ctx.letterSpacing='3px';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#5b6b77cc';ctx.fillText(a.n,c[0],c[1]);if('letterSpacing' in ctx)ctx.letterSpacing='0px';
    });
    S.taxis.forEach(R=>{const w=+R.w||14;ln(ctx,R.pts,w+3,'#2f373c');ln(ctx,R.pts,w,'#6b747a');ln(ctx,R.pts,1.4,'#e0b400',[10,8])});
    S.rwys.forEach(R=>{
      const w=+R.w||30;ln(ctx,R.pts,w+4,'#2b3338');ln(ctx,R.pts,w,'#4a5258');ln(ctx,R.pts,2,'#fff',[18,14]);
      [[R.pts[0],R.pts[1]],[R.pts[R.pts.length-1],R.pts[R.pts.length-2]]].forEach(([e,n])=>{
        const l=dst(e,n)||1,ux=(n[0]-e[0])/l,uy=(n[1]-e[1])/l,bx=e[0]+ux*8,by=e[1]+uy*8;
        ctx.beginPath();ctx.moveTo(bx-uy*w*.36,by+ux*w*.36);ctx.lineTo(bx+uy*w*.36,by-ux*w*.36);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
      });
    });
    S.stands.forEach(s=>{
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate((+s.a||0)*Math.PI/180);
      rrect(ctx,-28,-23,56,46,6);ctx.lineWidth=1.5;ctx.strokeStyle='#e0b400';ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.lineTo(15,-5);ctx.moveTo(22,0);ctx.lineTo(15,5);ctx.stroke();
      ctx.restore();
      if(City.view.k>.5&&s.n){ctx.font='700 10px Manrope,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=P.lab;ctx.fillText(s.n,s.x,s.y+30)}
    });
  });

  /* набросок нового маршрута: аэропорты + точки пути + курсор */
  const draftPts=()=>{
    const q=[];
    ar.s.forEach((id,i)=>{const a=aptOf(id);if(a)q.push(cen(a));(ar.legs[i]||[]).forEach(p=>q.push(p))});
    ar.cur.forEach(p=>q.push(p));
    return q;
  };

  /* поверх: забор, маршруты, выделение, самолёты */
  City.layers.over.push((ctx,P)=>{
    ensure();ui();
    const S=D(),k=City.view.k;
    ctx.beginPath();
    S.fences.forEach(F=>{
      F.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      F.pts.slice(1).forEach((b,i)=>{const a=F.pts[i],l=dst(a,b),n=Math.floor(l/12);if(!l)return;const ux=(b[0]-a[0])/l,uy=(b[1]-a[1])/l;
        for(let j=0;j<=n;j++){const x=a[0]+ux*j*12,y=a[1]+uy*j*12;ctx.moveTo(x-uy*4,y+ux*4);ctx.lineTo(x+uy*4,y-ux*4)}});
    });
    ctx.lineWidth=1.6;ctx.strokeStyle='#59636b';ctx.stroke();
    S.aroutes.forEach(R=>{
      const q=rpts(R);if(q.length<2)return;ln(ctx,q,2.5,R.c,[12,9]);
      R.s.map(aptOf).filter(Boolean).forEach(a=>{const p=cen(a);ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.fillStyle=R.c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.wh;ctx.stroke()});
      (R.legs||[]).forEach(l=>l.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fillStyle=R.c;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=P.wh;ctx.stroke()}));
    });
    const s=City.sel;
    if(s&&['rwys','taxis','fences'].includes(s.k))ln(ctx,s.o.pts,(+s.o.w||6)+10,'#0c8a8670');
    else if(s&&s.k==='aroutes')ln(ctx,rpts(s.o),10,'#0c8a8670');
    else if(s&&s.k==='stands'){ctx.beginPath();ctx.arc(s.o.x,s.o.y,34,0,7);ctx.fillStyle='#0c8a8670';ctx.fill()}
    else if(s&&s.k==='airports'){ctx.beginPath();s.o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.lineWidth=4;ctx.strokeStyle='#0c8a86';ctx.stroke()}
    if(dr&&dr.t===City.tool){const q=dr.pts.concat([M]);ln(ctx,dr.t==='apt'?q.concat([dr.pts[0]]):q,2.5,'#0c8a86',[8,6])}
    if(ar&&City.tool==='aroute'){
      const q=draftPts();ln(ctx,q.concat([M]),3,'#0c8a86',[8,6]);
      ar.legs.concat([ar.cur]).forEach(l=>l.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fillStyle='#0c8a86';ctx.fill()}));
    }
    fpos=[];
    fl.slice().sort((a,b)=>a.alt-b.alt).forEach(f=>{
      const m=PLANES[f.pl.m]||PLANES[MK[0]],sp=specOf(f.pl),L=m.l/mpu(),sc=1+(f.alt||0)*.22;
      if(f.alt>.02){ctx.save();ctx.translate(f.x+f.alt*14,f.y+f.alt*20);ctx.rotate(f.an);ctx.scale(sc,sc);drawPlane(ctx,L,m.sp*L/m.l,sp,true);ctx.restore()}
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.an);ctx.scale(sc,sc);drawPlane(ctx,L,m.sp*L/m.l,sp,false);ctx.restore();
      fpos.push({x:f.x,y:f.y,r:Math.max(L/2,12),f});
    });
  });

  /* окно с фото самолёта */
  cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
  cv.addEventListener('pointerup',e=>{
    if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
    const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,h=[...fpos].reverse().find(q=>Math.hypot(q.x-x,q.y-y)<q.r);
    if(!h)return;
    const pl=h.f.pl,sp=specOf(pl),name=pl.m+' ('+pl.al+')',seats=(PLANES[pl.m]||PLANES[MK[0]]).seats;
   $('#pop').innerHTML=`<b>${E(name)}</b><div style="color:var(--mut)">${E(h.f.R.n)}</div>`+(sp.img?`<img src="${E(sp.img)}" alt="${E(name)}" onerror="this.outerHTML='<small>Нет файла ${E(sp.img)} рядом с index.html</small>'">`:'')+'<div class="row"><button id="pc3" class="b">Закрыть</button></div>';
    $('#pop').hidden=false;$('#pc3').onclick=()=>$('#pop').hidden=true;
  });
  (function loop(){
    const n=performance.now(),dt=Math.min(.1,(n-T0)/1000);T0=n;
    ensure();fl.forEach(f=>step(f,dt));if(fl.length)City.redraw();
    requestAnimationFrame(loop);
  })();
})();
</script>

<!-- ===== Плагин: страны, армии и войны, 3D, достопримечательности, парки, службы.
     Вставить В САМЫЙ КОНЕЦ, перед </body>. Рядом с index.html положить sved.png (фото ТРК «Сведенский»). ===== -->
<script>
(function(){
const D=()=>City.S,E=City.esc,F='Manrope,system-ui,sans-serif',R=260;
const mpu=()=>((D().scale||50)/50);
const arr=k=>D()[k]||(D()[k]=[]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cen=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
const n0=v=>Math.round(v).toLocaleString('ru-RU');
const km2=a=>area(a)*mpu()*mpu()/1e6;
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const CC=['#7a5cd6','#d9534f','#2a9d8f','#e9a400','#2e86ab','#c2185b'];
const cs=()=>arr('countries'),wars=()=>arr('wars'),cb=id=>cs().find(c=>c.id===id);
let M=[0,0],cd=null,d3=false;
cv.addEventListener('pointermove',e=>{const V=City.view;M=[(e.offsetX-V.x)/V.k,(e.offsetY-V.y)/V.k]});

/* ---------- интерфейс ---------- */
document.head.insertAdjacentHTML('beforeend','<style>#gp{margin:0 6px 14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px}#gp b{display:block;margin:8px 0 2px}#gp b:first-child{margin-top:0}#gp .gl{display:flex;gap:6px;align-items:center;padding:3px 0;cursor:pointer}#gp .gl i{width:10px;height:10px;border-radius:50%;flex:none}#gp .gl span,#gp .gm{color:var(--mut)}#gp .gl span{margin-left:auto}</style>');
($('#hud')||$('#cname')).insertAdjacentHTML('afterend','<div id="gp"></div>');
$('#wrap').insertAdjacentHTML('beforeend','<div id="cb" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:8px 14px;display:flex;gap:8px;align-items:center"><span id="cbn"></span><button id="cbok" class="b p">Готово</button><button id="cbno" class="b">Отмена</button></div>');
$('#p2').insertAdjacentHTML('beforeend','<button id="d3" class="b">3D</button>');
$('#d3').onclick=e=>{d3=!d3;e.currentTarget.classList.toggle('on',d3);City.redraw()};

/* ---------- страны ---------- */
const own=p=>{for(const c of cs())if((c.parts||[]).some(q=>inPoly(p,q)))return c;return cs().find(c=>inPoly(p,c.pts))};
function info(c){
  const S=D(),ds=(S.dists||[]).filter(d=>own(cen(d.pts))===c),bs=(S.bounds||[]).filter(b=>own(cen(b.pts))===c),used=new Set();
  const cities=bs.map(b=>{const dd=ds.filter(d=>inPoly(cen(d.pts),b.pts));dd.forEach(d=>used.add(d));return{n:b.n,ds:dd,pop:dd.reduce((s,d)=>s+(d.pop||0),0)}});
  return{ds,cities,free:ds.filter(d=>!used.has(d)),pop:Math.max(0,ds.reduce((s,d)=>s+(d.pop||0),0)-(c.loss||0)),km:Math.max(0,km2(c.pts)+(c.parts||[]).reduce((s,q)=>s+km2(q),0)-(c.lostA||0))};
}
const armyOf=c=>(c.army===undefined||c.army==='')?Math.max(100,Math.round(info(c).pop*.01)):Math.max(0,Math.round(+c.army));
function endC(){
  const a=cd;cd=null;
  if(a&&a.length>2){const n=cs().length;City.add('countries',{id:D().id++,pts:a,n:'Страна '+(n+1),c:CC[n%6],war:'0'})}
  City.redraw();
}
$('#cbok').onclick=endC;$('#cbno').onclick=()=>{cd=null;City.redraw()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||City.tool!=='country')return;if(e.key==='Enter')endC();if(e.key==='Escape'){cd=null;City.redraw()}});
const cIns=o=>{
  const I=info(o),w=wars().filter(x=>x.a===o.id||x.b===o.id);
  return `<label>Цвет<input type="color" data-f="c" value="${E(o.c)}" style="height:34px;padding:2px"></label>`
  +`<label>Участие в войнах<select data-f="war"><option value="0" ${o.war==='1'?'':'selected'}>Не воюет</option><option value="1" ${o.war==='1'?'selected':''}>Может воевать</option></select></label>`
  +`<label>Армия, чел.<input type="number" min="0" data-f="army" placeholder="авто (${n0(armyOf(o))})" value="${o.army===undefined?'':E(o.army)}"></label>`
  +`<div style="font-size:13px;color:var(--mut)">Население: <b style="color:var(--ink)">${n0(I.pop)}</b> чел.<br>Площадь: <b style="color:var(--ink)">${I.km.toFixed(2).replace('.',',')} км²</b><br>Городов: <b style="color:var(--ink)">${I.cities.length}</b>, районов: <b style="color:var(--ink)">${I.ds.length}</b></div>`
  +(I.cities.length?'<div style="font-size:13px"><b>Города</b>'+I.cities.map(c=>`<div style="color:var(--mut)">${E(c.n)} — ${n0(c.pop)} чел., районов: ${c.ds.length}</div>`).join('')+'</div>':'')
  +(I.free.length?'<div style="font-size:13px;color:var(--mut)">Районы вне городов: '+I.free.map(d=>E(d.n)).join(', ')+'</div>':'')
  +(w.length?'<div style="font-size:13px;color:var(--red)"><b>Идут войны: '+w.length+'</b></div>':'')
  +'<button class="b" data-cw="war">Объявить войну…</button><button class="b" data-cw="civ">Гражданская война</button>';
};
City.register({key:'countries',label:'Страна',group:'Районы',leaf:'Страна',color:'#7a5cd6',tool:'country',
  hint:'Обведите страну точками. Первая точка, двойной клик или «Готово» — закончить. Выбрать страну — нажать на её границу или на список слева.',
  click(p){const k=City.view.k;if(!cd){cd=[p];return}const l=cd[cd.length-1],f=cd[0];if(dst(l,p)<6/k||(cd.length>2&&dst(f,p)<14/k))endC();else cd.push(p)},
  hit:(p,r)=>cs().find(c=>c.pts.some((q,i)=>dseg(p,q,c.pts[(i+1)%c.pts.length])<r+3)),
  inspector:cIns});

/* ---------- войны ---------- */
const log=[];
function startWar(a,b,civil){
  if(civil?wars().some(w=>w.civil&&w.a===a.id):wars().some(w=>!w.civil&&((w.a===a.id&&w.b===b.id)||(w.a===b.id&&w.b===a.id))))return false;
  const A=armyOf(a);a.army=A;let fa,fb;
  if(civil){fa=Math.round(A*.55);fb=A-fa}else{const B=armyOf(b);b.army=B;fa=Math.round(A*.6);fb=Math.round(B*.6)}
  wars().push({id:D().id++,a:a.id,b:civil?a.id:b.id,civil,fa,fb});
  log.unshift(civil?'Гражданская война в «'+a.n+'»':'«'+a.n+'» воюет с «'+b.n+'»');
  City.changed();return true;
}
function endWar(w,msg){D().wars=wars().filter(x=>x!==w);if(msg)log.unshift(msg);City.changed();if(City.sel)City.updateUI()}
$('#insp').addEventListener('click',e=>{
  const b=e.target.closest('[data-cw]'),s=City.sel;if(!b||!s||s.k!=='countries')return;const o=s.o;
  if(b.dataset.cw==='civ'){if(!startWar(o,o,true))alert('Гражданская война уже идёт.')}
  else{
    const L=cs().filter(c=>c!==o);if(!L.length){alert('Нужна ещё хотя бы одна страна.');return}
    const t=prompt('Против кого? Номера через запятую (можно несколько):\n'+L.map((c,i)=>(i+1)+' — '+c.n+(c.war==='1'?'':' (не воюет)')).join('\n'));if(!t)return;
    const bad=[];t.split(/[,;\s]+/).forEach(x=>{const c=L[+x-1];if(!c)return;if(c.war!=='1'){bad.push(c.n);return}startWar(o,c,false)});
    if(bad.length)alert('Напасть нельзя — у страны выключена настройка «Воюет»: '+bad.join(', '));
  }
  City.updateUI();
});
/* захват территории: победитель забирает ~35% страны проигравшего со своей стороны */
function clip(P,d,t0){const out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],fa=a[0]*d[0]+a[1]*d[1]-t0,fb=b[0]*d[0]+b[1]*d[1]-t0;if(fa>=0)out.push(a);if((fa>=0)!==(fb>=0)){const t=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}
function annex(W,L){
  const a=cen(W.pts),b=cen(L.pts);let d=[a[0]-b[0],a[1]-b[1]];const l=Math.hypot(d[0],d[1])||1;d=[d[0]/l,d[1]/l];
  const ts=L.pts.map(p=>p[0]*d[0]+p[1]*d[1]),mx=Math.max(...ts),mn=Math.min(...ts),q=clip(L.pts,d,mx-.35*(mx-mn));
  if(q.length<3)return;
  (W.parts=W.parts||[]).push(q);L.lostA=(L.lostA||0)+km2(q);
  log.unshift('«'+W.n+'» присоединила часть территории «'+L.n+'»');
}
let lastDay=null,acc=0,tk=0;
function warTick(){
  const day=City.game?City.game.day:0;if(lastDay===null)lastDay=day;const dd=Math.max(0,day-lastDay);lastDay=day;if(!dd)return;
  wars().slice().forEach(w=>{
    const A=cb(w.a),B=cb(w.b);if(!A||!B){endWar(w);return}
    const la=Math.min(w.fa,w.fb*.1*dd*(.6+Math.random()*.8)),lb=Math.min(w.fb,w.fa*.1*dd*(.6+Math.random()*.8));
    w.fa-=la;w.fb-=lb;
    if(w.civil){A.army=Math.max(0,(+A.army||0)-la-lb);A.loss=(A.loss||0)+(la+lb)*.25}
    else{A.army=Math.max(0,(+A.army||0)-la);B.army=Math.max(0,(+B.army||0)-lb);A.loss=(A.loss||0)+la*.12;B.loss=(B.loss||0)+lb*.12+la*.12}
    if(w.fa<1||w.fb<1){
      if(w.civil)endWar(w,'Гражданская война в «'+A.n+'» окончена: победили '+(w.fa>=w.fb?'правительственные силы':'повстанцы'));
      else{const aw=w.fa>=w.fb;annex(aw?A:B,aw?B:A);endWar(w,'Война окончена: победила «'+(aw?A.n:B.n)+'»')}
    }
  });
  acc+=dd;
  if(acc>=4){acc=0;
    const live=cs().filter(c=>c.war==='1');
    if(live.length>1&&Math.random()<.4){const a=live[Math.floor(Math.random()*live.length)],o=live.filter(c=>c!==a);startWar(a,o[Math.floor(Math.random()*o.length)],false)}
    else if(cs().length&&Math.random()<.12)startWar(cs()[Math.floor(Math.random()*cs().length)],null,true);
  }
  if(++tk%10===0)save();
}

const HT={house:14,shop:18,office:60,industry:26,terminal:30,hangar:20,tower:70};
const rp=b=>b.pts||[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]];
function ext(ctx,pts,h,fill){
  const up=p=>[p[0],p[1]-h];
  poly(pts.map(p=>[p[0]+h*.5,p[1]+h*.2]));ctx.fillStyle='#00000030';ctx.fill();
  ctx.lineWidth=.8;ctx.strokeStyle='#00000066';
  pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(b[0],b[1]-h);ctx.lineTo(a[0],a[1]-h);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.fillStyle='#00000055';ctx.fill();ctx.stroke()});
  poly(pts.map(up));ctx.fillStyle=fill;ctx.fill();ctx.stroke();
}
function d3draw(ctx,P){

  list.sort((a,b)=>a.y-b.y).forEach(o=>{

      ctx.font='800 11px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5;ctx.strokeStyle=P.bg;ctx.strokeText(o.l.n,x,y-56);ctx.fillStyle=P.ink;ctx.fillText(o.l.n,x,y-56)}
  });

/* ---------- слежение за поездами и метро ---------- */
const origPush=Array.prototype.push;let vt=[],tf=null,dn3=null,miss=0;
Array.prototype.push=function(){const o=arguments[0];if(arguments.length===1&&o&&typeof o==='object'&&Array.isArray(o.cs)&&o.R&&o.R.sys&&o.m&&o.r)origPush.call(vt,o);return origPush.apply(this,arguments)};
City.layers.under.push(()=>{vt=[]});
const trPos=f=>{let i=0;for(const o of vt)if(o.R===f.R){if(i===f.i)return o.cs[o.cs.length>>1];i++}return null};
function startTF(f){
  $('#fol-x').click();tf=f;miss=0;if(City.view.k<1.2)City.view.k=1.2;
  $('#fol').hidden=false;$('#fol-n').textContent=f.name;
}
$('#fol-x').addEventListener('click',()=>{tf=null});
cv.addEventListener('pointerdown',e=>{dn3=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{
  if(!dn3||City.tool!=='select'||Math.hypot(e.clientX-dn3[0],e.clientY-dn3[1])>5)return;
  const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,cnt=new Map();
  for(const o of vt){const i=cnt.get(o.R)||0;cnt.set(o.R,i+1);
    if(o.cs.some(c=>Math.hypot(c[0]-x,c[1]-y)<o.r)){
      const f={R:o.R,i,name:o.m.n+' · '+o.R.n},row=$('#pop .row');
      if(row&&!$('#pop .eye2')){const b=document.createElement('button');b.className='b eye2';b.textContent='👁 Следить';row.prepend(b);b.onclick=()=>startTF(f)}
      break}}
});
(function lp(){
  if(tf){
    if(City.follow())tf=null;
    else{const p=trPos(tf);
      if(pan&&pan.m){tf=null;$('#fol').hidden=true}
      else if(!p){if(++miss>40){tf=null;$('#fol').hidden=true}}
      else{miss=0;const r=cv.getBoundingClientRect(),V=City.view;V.x+=(r.width/2-V.k*p[0]-V.x)*.4;V.y+=(r.height/2-V.k*p[1]-V.y)*.4;City.redraw()}}
  }
  requestAnimationFrame(lp);
})();
City.redraw();
})();

<script>
/* ===== Плагин: образование (детсады, школы, колледжи, вузы) + разные формы зданий в зонах (2D и 3D).
   Вставить В САМЫЙ КОНЕЦ, перед </body> (после плагина «страны, армии…»). ===== */
(function(){

const D=()=>City.S,E=City.esc,mpu=()=>((D().scale||50)/50);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const n0=v=>Math.round(v).toLocaleString('ru-RU');
const area=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
const cen=b=>b.pts?[b.pts.reduce((s,p)=>s+p[0],0)/b.pts.length,b.pts.reduce((s,p)=>s+p[1],0)/b.pts.length]:[b.x+b.w/2,b.y+b.h/2];

/* ---------- образование ---------- */
/* sh — доля жителей этого возраста, k — мест на 100 м² территории здания, r — радиус охвата, м */
const ED={
 kinder:{n:'Детский сад',who:'Детей',ic:'🧸',col:'#ffd9a0',sh:.05,k:15,r:500,sz:60},
 school:{n:'Школа',who:'Учеников',ic:'🏫',col:'#f4b6c2',sh:.11,k:30,r:800,sz:90},
 college:{n:'Колледж',who:'Студентов',ic:'📚',col:'#c3b1e1',sh:.03,k:40,r:3000,sz:100},

};
Object.entries(ED).forEach(([t,e])=>{BLD[t]=[e.n,e.col,e.sz];City.addLeaf('Образование',[e.n,'bld',t,e.col])});
const capOf=b=>Math.max(1,Math.round((b.pts?area(b.pts):b.w*b.h)*mpu()*mpu()/100*ED[b.t].k));
let RES=new Map(),TOT={};
function residents(){
  const out=[];
  D().blds.forEach(b=>{if(b.t!=='house')return;
    const w=(b.pop===undefined||b.pop==='')?Math.max(1,Math.round((b.pts?area(b.pts):b.w*b.h)*mpu()*mpu()/25)):Math.max(0,+b.pop||0);
    if(w){const c=cen(b);out.push([c[0],c[1],w])}});

  if(Z)for(const key in Z){const z=Z[key],p=key.split(','),i0=+p[0]*CS,j0=+p[1]*CS;
    for(let n=0;n<1024;n++){if(z.t.charAt(n)!=='r')continue;

      if(w>0)out.push([(i0+(n&31)+.5)*TC,(j0+(n>>5)+.5)*TC,w])}}

    L.forEach(b=>{dem.set(b,0);res.set(b,0);cs.set(b,cen(b))});
    let all=0;
    R.forEach(([x,y,w])=>{all+=w;let best=null,bd=rr;
      L.forEach(b=>{const c=cs.get(b),d=Math.hypot(c[0]-x,c[1]-y);if(d<bd){bd=d;best=b}});
      if(best){dem.set(best,dem.get(best)+w*e.sh);res.set(best,res.get(best)+w)}});
    let cap=0,st=0;
    L.forEach(b=>{const c=capOf(b),d=dem.get(b),
      s=(b.stu===undefined||b.stu==='')?Math.min(c,Math.round(d)):Math.max(0,Math.round(+b.stu)||0);
      RES.set(b,{cap:c,dem:Math.round(d),res:Math.round(res.get(b)),st:s});cap+=c;st+=s});

const prevB=City.insp.blds;
City.insp.blds=o=>{

  return `<label>${e.who}<input type="number" min="0" data-f="stu" placeholder="авто (${n0(Math.min(r.cap,r.dem))})" value="${o.stu===undefined?'':E(o.stu)}"></label>`
  +`<div style="font-size:13px;color:var(--mut)">Сейчас: <b ${k}>${n0(r.st)}</b> из ${n0(r.cap)} мест<br>Жителей в радиусе ${n0(e.r)} м: <b ${k}>${n0(r.res)}</b><br>Потребность: <b ${k}>${n0(r.dem)}</b>`

/* ---------- формы зданий в зонах ---------- */
const ZT={'#e9a77c':'r','#f2cf54':'c','#7aa6e8':'o','#9a958e':'i'},ZC={r:'#e9a77c',c:'#f2cf54',o:'#7aa6e8',i:'#9a958e'},HB={r:12,c:16,o:55,i:22};
const sq=(a,b,c,d)=>[[a,b],[c,b],[c,d],[a,d]];
const circ=(x,y,r)=>Array.from({length:10},(_,i)=>[x+r*Math.cos(i*Math.PI/5),y+r*Math.sin(i*Math.PI/5)]);
/* вариант = список частей [контур в долях 0..1, тон ('l' светлее, 'd' темнее), множитель высоты] */
const SH={
 r:[[[sq(0,0,1,1)]],
    [[[[0,0],[1,0],[1,.45],[.45,.45],[.45,1],[0,1]]]],
    [[sq(0,0,.45,1)],[sq(.55,.25,1,1),'l',.8]],
    [[[[0,0],[1,0],[1,1],[.7,1],[.7,.4],[.3,.4],[.3,1],[0,1]]]]],
 c:[[[sq(0,.15,1,.85)]],
    [[[[0,0],[1,0],[1,.4],[.65,.4],[.65,1],[.35,1],[.35,.4],[0,.4]]]],
    [[sq(0,0,.6,.55)],[sq(.4,.45,1,1),'l',.8]],
    [[[[.2,0],[.8,0],[1,.2],[1,.8],[.8,1],[.2,1],[0,.8],[0,.2]]]]],
 o:[[[sq(.1,.1,.9,.9)]],
    [[sq(0,0,1,1),null,.5],[sq(.25,.25,.75,.75),'l',1.2]],
    [[sq(.3,0,.7,1)]],
    [[[[.5,0],[1,.35],[.82,1],[.18,1],[0,.35]]]]],
 i:[[[sq(0,.25,1,1)],[sq(.72,0,.88,.25),'d',2]],
    [[[[0,.3],[.25,0],[.25,.3],[.5,0],[.5,.3],[.75,0],[.75,.3],[1,0],[1,1],[0,1]]]],
    [[sq(0,0,.55,1)],[circ(.78,.5,.2),'l',.8]],
    [[[[0,0],[.5,0],[.5,.55],[1,.55],[1,1],[0,1]]]]]

const hh=(i,j,s)=>((i*374761393+j*668265263+s*2147483)>>>0)%1000/1000;

function shape(c,t,x,y,w,h){
  const i=Math.floor((x+w/2)/TC),j=Math.floor((y+h/2)/TC);
  c.lineJoin='round';c.lineWidth=.8/City.view.k;c.strokeStyle='#00000066';
  variant(t,i,j).forEach(([p,tn])=>{
    poly(p.map(q=>[x+q[0]*w,y+q[1]*h]));c.fillStyle=ZC[t];c.fill();

draw=function(){
  inZ=false;pend=null;
  ctx.fillRect=function(x,y,w,h){

    if(inZ&&(fs==='rgba(255, 255, 255, 0.6)'||fs==='#5b5f63'))return;   /* окна и труба старого вида */

    return oS.call(this,x,y,w,h);
  };
  try{_d0()}finally{delete ctx.fillRect;delete ctx.strokeRect}

City.layers.under.push(()=>{inZ=false});

/* ---------- 3D для зон ---------- */
const boxOf=(t,f)=>t==='r'?[TC*(.25+.5*f),TC*(.25+.5*f)]:t==='c'?[TC*(.3+.6*f),TC*(.25+.35*f)]:t==='o'?[TC*(.3+.5*f),TC*(.3+.5*f)]:[TC*(.35+.55*f),TC*(.3+.4*f)];
const dim=(hex,f)=>{const n=parseInt(hex.slice(1),16);return 'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.min(255,Math.round(v*f))).join(',')+')'};

  poly(pts.map(p=>[p[0]+h*.5,p[1]+h*.2]));c.fillStyle='#00000028';c.fill();

  pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length];c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(b[0],b[1]-h);c.lineTo(a[0],a[1]-h);c.closePath()});

}
const d3on=()=>{const b=$('#d3');return !!b&&b.classList.contains('on')};

/* ---------- слой поверх: метки образования, радиус охвата, 3D зон ---------- */
City.layers.over.push((c,P)=>{
  const k=City.view.k,u=1/k,sc=Math.max(1,.55/k),sel=City.sel;
  if(sel&&sel.k==='blds'&&ED[sel.o.t]){
    const p=cen(sel.o),r=ED[sel.o.t].r/mpu();
    c.beginPath();c.arc(p[0],p[1],r,0,7);c.fillStyle='#0c8a8616';c.fill();c.lineWidth=2*u;c.strokeStyle='#0c8a86';c.setLineDash([10*u,8*u]);c.stroke();c.setLineDash([]);
  }
  if(k>.25)D().blds.forEach(b=>{
    const e=ED[b.t],r=RES.get(b);if(!e||!r)return;const p=cen(b),t=e.ic+' '+n0(r.st);
    c.font='700 '+(11*sc)+'px '+F;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=3.5*sc;c.strokeStyle=P.bg;
    c.strokeText(t,p[0],p[1]);c.fillStyle=r.dem>r.cap?'#d7263d':P.ink;c.fillText(t,p[0],p[1]);
  });
  const Z=D().zones;if(!Z||!d3on()||TC*k<4)return;
  const m=c.getTransform().invertSelf(),g=City.game?City.game.day:0,cs=[[0,0],[cv.width,0],[cv.width,cv.height],[0,cv.height]].map(([a,b])=>{const q=m.transformPoint({x:a,y:b});return[q.x,q.y]});
  const x0=Math.min(...cs.map(q=>q[0]))-40,x1=Math.max(...cs.map(q=>q[0]))+40,y0=Math.min(...cs.map(q=>q[1]))-40,y1=Math.max(...cs.map(q=>q[1]))+140,L=[];
  for(const key in Z){
    const p=key.split(','),cx=+p[0]*CW,cy=+p[1]*CW;if(cx>x1||cx+CW<x0||cy>y1||cy+CW<y0)continue;
    const z=Z[key],i0=+p[0]*CS,j0=+p[1]*CS;
    for(let n=0;n<1024;n++){
      const t=z.t.charAt(n);if(t===' ')continue;
      const f=clamp((g-(z.d.charCodeAt(n)-256))/GROW,0,1);if(f<=0)continue;
      const i=i0+(n&31),j=j0+(n>>5),x=i*TC,y=j*TC;if(x>x1||x+TC<x0||y>y1||y+TC<y0)continue;
      const [w,h]=boxOf(t,f),bx=x+(TC-w)/2,by=y+(TC-h)/2;
      L.push({t,bx,by,w,h,f,i,j,y:by+h});
    }
  }
  L.sort((a,b)=>a.y-b.y).forEach(o=>{
    const H=HB[o.t]*(.4+.6*o.f)*(.75+.5*hh(o.i,o.j,2));
    variant(o.t,o.i,o.j).forEach(([p,tn,hf])=>ext(c,p.map(q=>[o.bx+q[0]*o.w,o.by+q[1]*o.h]),H*(hf||1),ZC[o.t],tn,k));
  });
});
calc();ui();City.redraw();
})();

<script>
/* ===== Плагин: порт и корабли, погода, катаклизмы, боевые действия (танки, самолёты, взрывы).
   Вставить В САМЫЙ КОНЕЦ, перед </body> (после плагина «образование»). ===== */
(function(){
const D=()=>City.S,E=City.esc,F='Manrope,system-ui,sans-serif',TC=10;
const mpu=()=>((D().scale||50)/50),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);

$('#wrap').insertAdjacentHTML('beforeend','<div id="toast" class="fl" hidden style="left:50%;top:10px;transform:translateX(-50%);padding:8px 16px;font-weight:700;pointer-events:none;z-index:5"></div><div id="sbp" class="fl" hidden style="left:50%;transform:translateX(-50%);bottom:112px;padding:8px 14px;display:flex;gap:8px;align-items:center"><span id="sbn"></span><button id="sbok" class="b p">Готово</button><button id="sbno" class="b">Отмена</button></div>');

/* ================= ПОРТ И КОРАБЛИ ================= */

City.register({key:'ports',label:'Порт',group:'Транспорт/Порт',leaf:'Порт',color:'#1f6f9f',tool:'port',
  hint:'Нажмите на карту (лучше у воды), чтобы поставить порт.',

City.register({key:'sroutes',label:'Морской маршрут',group:'Транспорт/Порт',leaf:'Морской маршрут',color:'#2e86ab',tool:'sroute',
  hint:'Нажимайте порты по порядку. Клик по пустому месту (на воде) — маршрутная точка. Первый порт ещё раз — замкнуть кольцо. «Готово» — закончить.',
  click(p,r){

  inspector:o=>{const pa=pathS(o),m=pa?pa.L*mpu():0;
    return `<div style="font-size:13px;color:var(--mut)">Портов: <b style="color:var(--ink)">${o.s.length}</b>${o.loop?', кольцо':''}<br>Длина: <b style="color:var(--ink)">${m<1000?Math.round(m)+' м':(m/1000).toFixed(1).replace('.',',')+' км'}</b></div>`

<script>

(function(){

function begin(k,p,extra){

City.tools.svc=p=>{const t=String(tt);if(!SV[t])return;begin('svc',p,{t})};

cv.addEventListener('pointermove',()=>{if(fs&&fs.mode==='r'&&fs.down){fs.b=mouse.slice();City.redraw()}});

const pth=a=>{ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()};

    }else{

      c.beginPath();c.arc(fs.pts[0][0],fs.pts[0][1],5,0,7);c.fillStyle='#0c8a86';c.fill();

<script>
/* Плагин: 3D-автобус ПАЗ-320415-04 с табло (номер слева, бегущий текст слева направо) */
(function(){
const MODEL='ПАЗ-320415-04 Вектор Next';
const PHOTO={front:'paz_front.webp',doors:'paz_side_doors.webp',left:'paz_side.webp',rear:'paz_rear.webp'};
/* кроп фото: [x0,x1,y0,y1] в долях снимка */
const CROP={front:[.417,.683,.40,.8625],doors:[.09,.915,.419,.792],left:[.09,.933,.40,.806],rear:[.4875,.733,.4475,.875]};
let TH=null,M=null,GEO=null;const B=new Map();

function mats(){
  if(M)return M;
  const ph=k=>{const m=new TH.MeshLambertMaterial({color:'#f2f4f5'});
    new TH.TextureLoader().load(PHOTO[k],t=>{const c=CROP[k];t.repeat.set(c[1]-c[0],c[3]-c[2]);t.offset.set(c[0],1-c[3]);m.map=t;m.color.set('#fff');m.needsUpdate=true},undefined,()=>{});return m};
  /* порядок граней BoxGeometry: +x перед, -x зад, +y крыша, -y низ, +z правый (двери), -z левый */
  return M={body:[ph('front'),ph('rear'),new TH.MeshLambertMaterial({color:'#e9edef'}),new TH.MeshLambertMaterial({color:'#222'}),ph('doors'),ph('left')],
    wheel:new TH.MeshLambertMaterial({color:'#17191b'}),hub:new TH.MeshLambertMaterial({color:'#9aa0a4'}),ac:new TH.MeshLambertMaterial({color:'#f6f7f8'})};
}
function geo(){
  if(GEO)return GEO;
  const w=new TH.CylinderGeometry(.46,.46,.32,18);w.rotateX(Math.PI/2);
  const h=new TH.CylinderGeometry(.25,.25,.34,12);h.rotateX(Math.PI/2);
  return GEO={body:new TH.BoxGeometry(8.8,2.65,2.5),w,h,ac:new TH.BoxGeometry(2.07,.28,1.6)};
}
/* единицы модели — метры; группу масштабируют на City.bu() */
function make(T){
  TH=T;const g=new TH.Group(),m=mats(),G=geo();
  const body=new TH.Mesh(G.body,m.body);body.position.y=.3+1.325;g.add(body);
  const ac=new TH.Mesh(G.ac,m.ac);ac.position.set(-.2,2.95+.14,0);g.add(ac);
  [[3.23,1.1],[3.23,-1.1],[-1.73,1.1],[-1.73,-1.1]].forEach(([x,z])=>{
    const a=new TH.Mesh(G.w,m.wheel);a.position.set(x,.46,z);g.add(a);
    const b=new TH.Mesh(G.h,m.hub);b.position.set(x,.46,z+(z>0?.02:-.02));g.add(b)});
  const pl=(w,h,x,y,z,ry)=>{const mt=new TH.MeshBasicMaterial({color:'#2b2e31'});
    const p=new TH.Mesh(new TH.PlaneGeometry(w,h),mt);p.position.set(x,y,z);p.rotation.y=ry;g.add(p);return mt};
  g.userData.bm={front:pl(1.5,.32,4.41,2.6,0,Math.PI/2),side:pl(.95,.205,-.23,2.6,1.26,0),rear:pl(.5,.32,-4.41,2.5,.75,-Math.PI/2)};
  return g;
}

/* ---- номер и текст из названия маршрута: «60 Придонской — Боровое» ---- */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){
    const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);
    if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n;
  }
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
function board(num,txt){
  const key='b|'+num+'|'+txt;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=512;c.height=110;o={c,t:new TH.CanvasTexture(c),num,txt,used:0};B.set(key,o)}
  return o;
}
function rear(num){
  const key='r|'+num;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=160;c.height=104;const g=c.getContext('2d');
    g.fillStyle='#ffd21a';g.fillRect(0,0,160,104);g.fillStyle='#111';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(num.length>2?56:76)+'px Manrope,Arial,sans-serif';g.fillText(num,80,54);
    o={c,t:new TH.CanvasTexture(c),static:1};B.set(key,o)}
  return o;
}
function paint(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.fillStyle='#24272a';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H+14;g.fillStyle='#ffd21a';g.fillRect(6,6,nw,H-12);g.fillStyle='#111';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(o.num.length>2?58:80)+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+3);rx=nw+16}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 64px Manrope,Arial,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#ffb21a';
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;   /* едет слева направо */
  g.fillText(o.txt,x,H/2+3);g.restore();
  o.t.needsUpdate=true;
}
function tick(g,b,R){
  const p=parse(R,City.busLeg?City.busLeg(b):0),bm=g.userData.bm,o=board(p.num,p.txt),r=rear(p.num);
  o.used=1;
  [['front',o],['side',o],['rear',r]].forEach(([k,s])=>{if(bm[k].map!==s.t){bm[k].map=s.t;bm[k].color.set('#fff');bm[k].needsUpdate=true}});
}
function frame(){B.forEach(o=>{if(o.used&&!o.static)paint(o);o.used=0})}
City.bus3d={has:m=>m===MODEL,make,tick,frame};
})();

<script>

   Управление: WASD / стрелки вверх-вниз — ходьба, стрелки влево-вправо — поворот, Shift — бег, мышь (зажать) — осмотр, Esc — выйти.
   На телефоне: левая половина экрана — джойстик, правая — осмотр. */
(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TC=10;
const HT={house:14,shop:18,office:60,industry:26,terminal:30,hangar:20,tower:70,kinder:10,school:14,college:18,univ:24};

const ZCOL={r:'#e9a77c',c:'#f2cf54',o:'#7aa6e8',i:'#9a958e'};

 const i=+p[0]*32+(n&31),j=+p[1]*32+(n>>5),x=i*TC,z=j*TC;if(Math.abs(x-X0)>RNG||Math.abs(z-Z0)>RNG)continue;

{const gm=new TH.BufferGeometry();gm.setAttribute('position',new TH.Float32BufferAttribute(fp,3));gm.setAttribute('color',new TH.Float32BufferAttribute(fc,3));gm.computeVertexNormals();

}#

   for(let x=Math.min(...xs);x<Math.max(...xs)&&c<200;x+=24)for(let z=Math.min(...zs);z<Math.max(...zs)&&c<200;z+=24){const q=[x+hh(x|0,z|0,1)*16,z+hh(x|0,z|0,2)*16];if(inPoly(q,p)){trees.push([q[0],q[1],.9+.5*hh(x|0,z|0,3)]);c++}}}
  return}
 ext(p,(HT[b.t]||20)*(.85+.3*hh(Math.round(b.x),Math.round(b.y),7)),col);

 const i=+p[0]*32+(n&31),j=+p[1]*32+(n>>5),x=i*TC,y=j*TC;if(Math.abs(x-X0)>RNG||Math.abs(y-Z0)>RNG)continue;
 zb.push({x:x+TC/2,z:y+TC/2,w:TC*(.35+.5*f),d:TC*(.3+.45*f),H:HB[t]*(.4+.6*f)*(.75+.5*hh(i,j,2)),c:ZCOL[t],v:.8+.3*hh(i,j,9)})}}
function inst(geo,mat,list,fn){if(!list.length)return;const im=new TH.InstancedMesh(geo,mat,list.length),d=new TH.Object3D(),c=new TH.Color();
 list.forEach((o,i)=>{fn(o,d,c);d.updateMatrix();im.setMatrixAt(i,d.matrix);im.setColorAt(i,c)});scene.add(im)}

(S.lights||[]).forEach(l=>{const p=new TH.Mesh(cyl,L('#333'));p.scale.set(.4,9,.4);p.position.set(l.x+7,0,l.y-7);scene.add(p);
 const h=new TH.Mesh(box,L('#1c2226'));h.scale.set(1.6,4.2,1.6);h.position.set(l.x+7,8.5,l.y-7);scene.add(h);
 const ms=[0,1,2].map(i=>{const m=new TH.MeshBasicMaterial({color:'#333'}),s=new TH.Mesh(new TH.SphereGeometry(.55,8,8),m);s.position.set(l.x+7,12-i*1.3,l.y-6.1);scene.add(s);return m});lights.push(ms)});

/* столкновения */

const isW=(x,z)=>{const i=Math.floor(x/TC),j=Math.floor(z/TC),s=S.terr&&S.terr[(i>>5)+','+(j>>5)];if(!s)return false;const c=s.charAt(((j&31)<<5)|(i&31));return c==='w'||c==='s'};

 for(const b of blocks){if(x<b.bb[0]||x>b.bb[2]||z<b.bb[1]||z>b.bb[3])continue;

}
if(blk(px,pz)){search:for(let r=10;r<400;r+=10)for(let a=0;a<12;a++){const x=X0+Math.cos(a*.52)*r,z=Z0+Math.sin(a*.52)*r;if(!blk(x,z)){px=x;pz=z;break search}}}

/* ввод */
let yaw=0,pit=0,jid=null,lid=null,jo=null,lp=null,jx=0,jy=0,run=false,bob=0;const keys=new Set();

 else if(lid===null){lid=e.pointerId;lp=[e.clientX,e.clientY]}});

 if(e.pointerId===jid){let dx=e.clientX-jo[0],dy=e.clientY-jo[1];const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;jk.style.transform='translate('+dx+'px,'+dy+'px)'}
 else if(e.pointerId===lid){yaw-=(e.clientX-lp[0])*.005;pit=clamp(pit-(e.clientY-lp[1])*.005,-1.3,1.3);lp=[e.clientX,e.clientY]}});
const up=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;jb.style.display='none'}if(e.pointerId===lid)lid=null};
tv.addEventListener('pointerup',up);tv.addEventListener('pointercancel',up);
$('#tvx').onclick=()=>exit();
$('#tvr').onclick=e=>{run=!run;e.currentTarget.classList.toggle('on',run)};

/* транспорт из 2D-симуляции */
const veh=new Map(),eye=1.7*u,skyN=new TH.Color('#0b1226'),skyD=new TH.Color('#8ec5f0'),skyB=new TH.Color('#8a949c'),sk=new TH.Color();
let last=Date.now(),hAt=0;
const API={cam,scene,veh,u,tv,blk,pos:(x,z)=>{px=x;pz=z},get:()=>({x:px,z:pz,yaw,pit}),setYaw:v=>{yaw=v},setPit:v=>{pit=v}};
if(City.trip&&City.trip.start)City.trip.start(API);
function frame(){
 T.raf=requestAnimationFrame(frame);
 const n=Date.now(),dt=Math.min(.1,(n-last)/1000);last=n;
 const k=c=>keys.has(c);
 yaw+=((k('ArrowLeft')?1:0)-(k('ArrowRight')?1:0))*1.8*dt;
 let f=(k('KeyW')||k('ArrowUp')?1:0)-(k('KeyS')||k('ArrowDown')?1:0)-jy,r=(k('KeyD')?1:0)-(k('KeyA')?1:0)+jx;
 const l=Math.hypot(f,r);if(l>1){f/=l;r/=l}
 const sp=(run||k('ShiftLeft')||k('ShiftRight')?15:5)*u*dt,s=Math.sin(yaw),c=Math.cos(yaw),mx=(-s*f+c*r)*sp,mz=(-c*f-s*r)*sp;
 if(!(City.trip&&City.trip.move&&City.trip.move(f,r,dt,run||k('ShiftLeft')||k('ShiftRight')))){if(!blk(px+mx,pz))px+=mx;if(!blk(px,pz+mz))pz+=mz}
 if(l>.05)bob+=dt*9*(run?1.6:1);
 cam.position.set(px,eye+Math.sin(bob)*.06*u,pz);cam.rotation.set(pit,yaw,0);
 /* небо, свет, погода */
 const gm=City.gm?City.gm():720,h=(((gm%1440)+1440)%1440)/60,day=clamp(Math.sin((h-6)/12*Math.PI)*1.6,0,1),w=(S.wx&&S.wx.t)||'clear',bad=w!=='clear';
 sk.copy(skyN).lerp(skyD,Math.max(day,.04));if(bad)sk.lerp(skyB,.5*Math.max(day,.2));
 scene.background.copy(sk);scene.fog.color.copy(sk);scene.fog.far=w==='fog'?450:bad?1400:3000;

 lights.forEach(m=>{m[0].color.set(ph==='r'?'#ff3030':'#401010');m[1].color.set(ph==='y'?'#ffd030':'#403810');m[2].color.set(ph==='g'?'#30e060':'#104020')});
 /* машины и автобусы */
 const seen=new Set();
 (City.vis()||[]).forEach(q=>{if(q.k!=='car'&&q.k!=='bus')return;
  const bus=q.k==='bus',len=q.r*2;let v=veh.get(q.ref);

  const dx=q.x-v.px,dy=q.y-v.py;if(dx*dx+dy*dy>.01){v.an=Math.atan2(dy,dx);v.px=q.x;v.py=q.y}
  v.m.position.set(q.x,.3,q.y);v.m.rotation.y=-v.an;if(v.b3){v.m.scale.setScalar(u);City.bus3d.tick(v.m,q.ref,q.R)}else v.m.scale.set(len,bus?3.2*u:len*.3,bus?2.55*u:len*.4);v.m.visible=true;seen.add(q.ref)});
 veh.forEach((v,key)=>{if(!seen.has(key))v.m.visible=false});

 if(n-hAt>300){hAt=n;let st='';
  for(const R of S.roads){let ok=false;for(let i=1;i<R.pts.length;i++)if(dseg([px,pz],R.pts[i-1],R.pts[i])<RW[R.t]/2+4){ok=true;break}if(ok){st=R.n||'';break}}
  const hd=((-yaw*180/Math.PI)%360+360)%360,mm=Math.floor(h*60)%60;

 if(City.bus3d)City.bus3d.frame();

(function(){

const prev=City.bus3d;

function mats(){
  if(M)return M;
  const L=c=>new TH.MeshLambertMaterial({color:c});
  const ph=(k,fb)=>{const m=L(fb);
    new TH.TextureLoader().load(PHOTO[k],t=>{m.map=t;m.color.set('#fff');m.needsUpdate=true},undefined,()=>{});return m};
  /* порядок граней BoxGeometry: +x перед, -x зад, +y крыша, -y низ, +z правый борт (двери), -z левый борт */
  return M={body:[ph('front','#f2f4f5'),ph('rear','#f2f4f5'),L('#eef0f1'),L('#222'),ph('doors','#f2f4f5'),ph('left','#f2f4f5')],
    wheel:L('#17191b'),hub:L('#9aa0a4'),cng:L('#f1f3f4'),ac:L('#f7f8f9'),seam:L('#8d979e'),dark:L('#1c2226')};
}
function geo(){
  if(GEO)return GEO;
  const w=new TH.CylinderGeometry(.46,.46,.3,18);w.rotateX(Math.PI/2);
  const h=new TH.CylinderGeometry(.26,.26,.32,12);h.rotateX(Math.PI/2);
  return GEO={body:new TH.BoxGeometry(8.9,2.69,2.5),w,h};
}
function make(T){
  TH=T;const g=new TH.Group(),m=mats(),G=geo();
  const add=(w,h,d,x,y,z,mt)=>{const o=new TH.Mesh(new TH.BoxGeometry(w,h,d),mt);o.position.set(x,y,z);g.add(o);return o};
  /* кузов: низ 0,24 м, крыша 2,93 м */

/* ---------- номер и текст из названия маршрута: «60 Придонской — Боровое» ---------- */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){
    const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);
    if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n;
  }
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
/* бегущая строка (перед и бок): номер слева, текст едет слева направо */
function board(num,txt,w,h,kind){
  const key=kind+'|'+num+'|'+txt;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
    o={c,t:new TH.CanvasTexture(c),num,txt,used:0};B.set(key,o)}
  return o;
}
/* зад: только номер */
function rearBoard(num){
  const key='r|'+num;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=320;c.height=66;const g=c.getContext('2d');
    g.fillStyle='#24272a';g.fillRect(0,0,320,66);g.fillStyle='#ffb21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(num.length>2?46:56)+'px Manrope,Arial,sans-serif';g.fillText(num,160,36);
    o={c,t:new TH.CanvasTexture(c),static:1};B.set(key,o)}
  return o;
}
function paint(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.fillStyle='#1d2023';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H*.9;g.fillStyle='#ffb21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+Math.round(H*(o.num.length>2?.62:.8))+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+2);
    g.fillStyle='#ffb21a55';g.fillRect(nw+10,H*.18,2,H*.64);rx=nw+20}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 '+Math.round(H*.62)+'px Manrope,Arial,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#ffb21a';
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;
  g.fillText(o.txt,x,H/2+2);g.restore();
  g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<W;i+=3)g.fillRect(i,0,1,H);   /* зерно светодиодов */
  o.t.needsUpdate=true;
}
function tick(g,b,R){
  const p=parse(R,City.busLeg?City.busLeg(b):0),bm=g.userData.yt;
  const f=board(p.num,p.txt,1.4,.22,'f'),s=board(p.num,p.txt,1.4,.3,'s'),r=rearBoard(p.num);
  f.used=s.used=1;
  [['front',f],['side',s],['rear',r]].forEach(([k,o])=>{if(bm[k].map!==o.t){bm[k].map=o.t;bm[k].color.set('#fff');bm[k].needsUpdate=true}});
}
function frame(){B.forEach(o=>{if(o.used&&!o.static)paint(o);o.used=0})}

/* ---------- подключение: City.bus3d теперь знает ПАЗ и Yutong ---------- */
City.bus3d={
  has:m=>{lastModel=m;return m===MODEL||(prev?prev.has(m):false)},
  /* «Путешествие» вызывает has(модель), а сразу следом make(TH) — запоминаем модель из has */
  make:(T,m)=>{m=m||lastModel;return m===MODEL?make(T):prev.make(T)},
  tick:(g,b,R)=>{if(g.userData.yt)tick(g,b,R);else if(prev)prev.tick(g,b,R)},
  frame:()=>{if(prev)prev.frame();frame()}
};
})();

let API=null,root=null,btn=null,open=false,app='home',G=null,B=null,mvG=null,mvB=null,keyH=null,pdown=false,acc=0,acc2=0,sugArr=[],RG=null;

const isLoop=tr=>tr.stops.length>2&&tr.stops[0].id===tr.stops[tr.stops.length-1].id;

/* через сколько игровых минут автобус b придёт на остановку id (null — не придёт) */
function etaBus(b,id){
  const st=bst(b);if(!st||!st.run||!st.tr)return null;
  const tr=st.tr,v=(tr.kmh*.85/3.6*4/mpu())||1,loop=isLoop(tr),sch=st.sch;
  if(!st.park&&st.dw>0){const s=tr.stops[st.si-1];if(s&&s.id===id)return 0}

  if(st.park&&sch&&!((st.due||0)>0)){
    const ds=parseDep(b.dep).map(x=>{let m=x-tod();if(m<=0)m+=1440;return m});
    if(!ds.length)return null;t=Math.min(...ds);
  }
  const seq=[tr];if(!sch){seq.push(loop?tr:revTr(tr),tr)}
  for(let k=0;k<seq.length;k++){
    const T=seq[k],d0=k?0:d,incl=k>0||st.park;

/* ---------- куча для Дейкстры ---------- */
class Heap{
  constructor(){this.a=[];this.n=0}
  push(k,v){const a=this.a;let i=this.n++;a[i]=[k,v];while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p}}
  pop(){const a=this.a,r=a[0],l=a[--this.n];
    if(this.n>0){a[0]=l;let i=0;for(;;){let m=i;const x=2*i+1,y=x+1;if(x<this.n&&a[x][0]<a[m][0])m=x;if(y<this.n&&a[y][0]<a[m][0])m=y;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m}}
    return r}
}

/* ---------- дорожный граф (авто и пешком) ---------- */
function graph(){
  if(RG&&RG.S===City.S)return RG;
  const S=City.S,segs=[];
  S.roads.forEach(R=>{for(let i=1;i<R.pts.length;i++){const a=R.pts[i-1],b=R.pts[i];
    segs.push({a,b,R,sp:[[0,a],[1,b]],x0:Math.min(a[0],b[0])-1,x1:Math.max(a[0],b[0])+1,y0:Math.min(a[1],b[1])-1,y1:Math.max(a[1],b[1])+1})}});
  for(let i=0;i<segs.length;i++){const s=segs[i];
    for(let j=i+1;j<segs.length;j++){const u=segs[j];
      if(s.R===u.R||s.x1<u.x0||u.x1<s.x0||s.y1<u.y0||u.y1<s.y0)continue;
      const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],w=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*w[1]-r[1]*w[0];
      if(Math.abs(den)<1e-9)continue;
      const d=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(d[0]*w[1]-d[1]*w[0])/den,v=(d[0]*r[1]-d[1]*r[0])/den,e=1e-6;
      if(t<-e||t>1+e||v<-e||v>1+e)continue;
      const p=lp(s.a,s.b,clamp(t,0,1));s.sp.push([t,p]);u.sp.push([v,p]);
    }}
  const links=[];
  S.roads.forEach(R=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
    let best=null;
    segs.forEach(s=>{if(s.R===R)return;const r=proj(e,s.a,s.b);if(r.d<8&&(!best||r.d<best.r.d))best={s,r}});
    if(best&&best.r.d>.05){best.s.sp.push([best.r.t,best.r.q]);links.push([e,best.r.q,R])}
  }));
  const idx=new Map(),pts=[],adj=[];
  const node=p=>{const k=Math.round(p[0]*10)+','+Math.round(p[1]*10);let i=idx.get(k);if(i===undefined){i=pts.length;idx.set(k,i);pts.push(p);adj.push([])}return i};

/* ---------- маршрут на автобусах ---------- */
const hopC=new Map();
function hop(a,b){
  const k=a+'>'+b;let h=hopC.get(k);
  if(!h){const pts=stopPts({s:[a,b],loop:false}),m=lenPts(pts)*mpu();h={pts,m,min:m/SPD(35*.85)+DW/25};hopC.set(k,h)}
  return h;
}
function lines(all){
  const out=[];
  City.S.routes.forEach(R=>{
    const bs=R.buses||[];
    [{vi:-1,s:R.s,loop:R.loop}].concat((R.vars||[]).map((v,i)=>({vi:i,s:v.s,loop:v.loop}))).forEach(v=>{
      const served=bs.some(b=>bvi(R,b)===v.vi);
      if(!served&&!all)return;
      const ids=v.s.filter(id=>sb(id));
      if(ids.length>1)out.push({R,vi:v.vi,ids,loop:!!v.loop,served});
    });
  });
  return out;
}
function waitFor(R,vi,id){
  let best=null;
  (R.buses||[]).forEach(b=>{if(bvi(R,b)!==vi)return;const e=etaBus(b,id);if(e!==null&&(best===null||e<best))best=e});
  return best;
}
function transit(a,b){
  for(const all of [false,true]){
    const L=lines(all);if(!L.length)continue;
    const r=tdij(a,b,L);
    if(r){if(r.noBus)r.warn='На части линий маршрута сейчас нет автобусов.';return r}
  }
  return null;
}
function tdij(a,b,L){
  const WR=900/mpu(),TR=260/mpu(),byStop=new Map();
  L.forEach((l,li)=>l.ids.forEach((id,idx)=>{if(!byStop.has(id))byStop.set(id,[]);byStop.get(id).push({li,idx})}));
  if(!byStop.size)return null;
  const xy=id=>{const s=sb(id);return[s.x,s.y]},wk=(p,r)=>dst(p,r)*1.25*mpu()/WALK;
  const pointOf=k=>k==='S'?a:k==='T'?b:xy(+k.split(':').pop());
  const D=new Map([['S',0]]),P=new Map(),h=new Heap();h.push(0,'S');
  const rel=(k,c,f,m)=>{if(c<(D.has(k)?D.get(k):Infinity)){D.set(k,c);P.set(k,[f,m]);h.push(c,k)}};
  while(h.n){
    const[c,k]=h.pop();if(c>D.get(k)+1e-9)continue;if(k==='T')break;
    if(k==='S'){
      byStop.forEach((_,id)=>{const p=xy(id);if(dst(a,p)<=WR)rel('f:'+id,c+wk(a,p),k,{t:'walk'})});
      if(dst(a,b)<=WR)rel('T',c+wk(a,b),k,{t:'walk'});
      continue;
    }
    const w=k.split(':');
    if(w[0]==='f'){
      const id=+w[1],p=xy(id);
      byStop.get(id).forEach(x=>rel('b:'+x.li+':'+id,c+WAIT,k,{t:'board',li:x.li}));
      byStop.forEach((_,j)=>{if(j===id)return;const p3=xy(j);if(dst(p,p3)<=TR)rel('f:'+j,c+wk(p,p3)+1,k,{t:'walk'})});
      if(dst(p,b)<=WR)rel('T',c+wk(p,b),k,{t:'walk'});
    }else{
      const li=+w[1],id=+w[2],l=L[li];
      rel('f:'+id,c+.1,k,{t:'alight'});
      byStop.get(id).filter(x=>x.li===li).forEach(x=>{
        const n=l.ids.length,nb=[];
        if(l.loop)nb.push((x.idx+1)%n);else{if(x.idx+1<n)nb.push(x.idx+1);if(x.idx>0)nb.push(x.idx-1)}
        nb.forEach(j=>{const nid=l.ids[j];rel('b:'+li+':'+nid,c+hop(id,nid).min,k,{t:'ride',li,a:id,b:nid})});

  for(let i=0;i<ed.length;i++){
    const e=ed[i];
    if(e.m.t==='walk'){
      const p0=pointOf(e.f),p1=pointOf(e.k),m=dst(p0,p1)*1.25*mpu(),mn=m/WALK,z=e.k.startsWith('f:')?sb(+e.k.slice(2)):null;
      dist+=m;el+=mn;
      steps.push({t:'walk',text:'Идите '+fd(m)+(z?' до остановки «'+z.n+'»':e.k==='T'?' до места назначения':''),min:mn});
      segs.push({pts:[p0,p1],col:'#6b7780',dash:1});
    }else if(e.m.t==='board'){
      const l=L[e.m.li],id0=+e.k.split(':')[2];
      let j=i+1,ride=0,mm=0,pts=[],last=id0,n=0;
      while(j<ed.length&&ed[j].m.t==='ride'){
        const hp=hop(ed[j].m.a,ed[j].m.b);ride+=hp.min;mm+=hp.m;pts=pts.concat(pts.length?hp.pts.slice(1):hp.pts);last=ed[j].m.b;n++;j++;
      }
      const eta=waitFor(l.R,l.vi,id0);
      if(eta===null&&!l.served)noBus=true;
      const wait=eta===null?WAIT:Math.max(0,eta-el);
      el+=wait+ride;dist+=mm;xf++;
      steps.push({t:'ride',text:'Автобус '+l.R.n,sub:'«'+sb(id0).n+'» → «'+sb(last).n+'» · остановок: '+n,min:wait+ride,eta:eta===null?null:Math.max(0,eta-(el-wait-ride))});

      i=j-1;
    }
  }
  return{steps,segs,min:el,m:dist,xfer:Math.max(0,xf-1),noBus};
}

function mapName(w){
  let best=null;
  City.S.roads.forEach(R=>{if(!R.n)return;for(let i=1;i<R.pts.length;i++){const d=dseg(w,R.pts[i-1],R.pts[i]);if(d<RW[R.t]/2+12&&(!best||d<best.d))best={d,R}}});
  return best?'Точка у «'+best.R.n+'»':'Точка на карте';
}
function render(){
  gRows();gSug();gRes();
  root.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===G.mode));
  q('#g-sh').classList.toggle('min',G.min);mvG.dirty=1;
}
function gRows(){
  const n=G.pts.length;
  q('#g-rows').innerHTML=G.pts.map((p,i)=>{
    const L=i===0?'A':i===n-1?'B':String(i),col=i===0?'#2e7cf6':i===n-1?'#d7263d':'#e9a400';
    return `<div class="pr${i===G.act?' on':''}"><span class="pd" style="background:${col}">${L}</span><input data-i="${i}" placeholder="${i===0?'Откуда':i===n-1?'Куда':'Остановка по пути'}" value="${E(p?p.n:'')}" autocomplete="off"><button class="b" data-clr="${i}" aria-label="Очистить">✕</button></div>`;
  }).join('');
}
function gSug(){
  const el=q('#g-sug');
  if(!G.sugOn||G.res){el.innerHTML='';sugArr=[];return}
  const qq=G.q.trim().toLowerCase(),p=me(),L=[];
  if(!qq||'моё положение'.includes(qq))L.push({me:1,n:'Моё положение',ic:'📍',sub:'по геолокации'});
  const pls=places();pls.forEach(x=>x.d=dst(p,[x.x,x.y]));
  pls.filter(x=>!qq||String(x.n).toLowerCase().includes(qq)).sort((a,b)=>a.d-b.d).slice(0,7).forEach(x=>L.push(Object.assign({sub:fd(x.d*mpu())},x)));
  sugArr=L;
  el.innerHTML=L.length?L.map((s,i)=>`<button class="sg" data-k="${i}"><span>${s.ic}</span><div><b>${E(s.n)}</b><small>${E(s.sub)}</small></div></button>`).join(''):'<div class="hn">Ничего не найдено. Нажмите на карту.</div>';
}
function gRes(){
  const el=q('#g-res');
  if(G.err){el.innerHTML=`<div class="er">${E(G.err)}</div>`;return}
  const r=G.res;
  if(!r){el.innerHTML=G.sugOn?'':'<div class="hn">Выберите точки маршрута.</div>';return}
  const ic={walk:'🚶',ride:'🚌',car:'🚗',via:'📍',road:'↳'};
  el.innerHTML=`<div class="sm"><div><b>${fm(r.min)}</b><span>${fd(r.m)}${G.mode==='bus'?' · пересадок: '+r.xfer:''}</span></div><button class="b" data-rf="1" aria-label="Обновить">↻</button></div>`
  +(r.warn?`<div class="er">${E(r.warn)}</div>`:'')
  +r.steps.map(s=>`<div class="stp ${s.t}"><i>${ic[s.t]||''}</i><div><b>${E(s.text)}</b>${s.sub?`<small>${E(s.sub)}</small>`:''}${s.t==='ride'?`<small>${s.eta!==null&&s.eta!==undefined?'Ближайший автобус: '+(s.eta<=.05?'сейчас':'через '+fm(s.eta)):'Автобусов на линии сейчас нет'}</small>`:''}${s.min&&s.t!=='road'?`<small>${s.t==='ride'?'Всего на этом участке: ':''}${fm(s.min)}</small>`:''}</div></div>`).join('');
}
function solve(){
  G.res=null;G.err='';
  if(G.pts.some(p=>!p))return;
  const pos=G.pts.map(p=>p.me?me():[p.x,p.y]),res={steps:[],segs:[],min:0,m:0,xfer:0,warn:''};
  for(let i=0;i<pos.length-1;i++){
    if(i>0)res.steps.push({t:'via',text:'Остановка по пути: '+G.pts[i].n});
    const r=G.mode==='bus'?transit(pos[i],pos[i+1]):gleg(pos[i],pos[i+1],G.mode==='car');
    if(!r){G.err='Маршрут не найден. '+(G.mode==='car'?'Проверьте, что дороги соединены и не перекрыты односторонним движением.':G.mode==='bus'?'Рядом с этими точками нет подходящих автобусных линий.':'');return}
    res.steps.push(...r.steps);res.segs.push(...r.segs);res.min+=r.min;res.m+=r.m;res.xfer+=r.xfer||0;if(r.warn)res.warn=r.warn;
  }
  G.res=res;
  const all=[];res.segs.forEach(s=>s.pts.forEach(p=>all.push(p)));
  mvG.fit(all,50);
}
function after(){
  const e=G.pts.findIndex(p=>!p);
  if(e>=0){G.act=e;G.res=null;G.err='';G.sugOn=true;G.q=''}else solve();
  render();
}
function pickSug(s){
  if(!s)return;
  G.pts[G.act]=s.me?{me:1,n:'Моё положение'}:{n:s.n,x:s.x,y:s.y,stop:s.stop};
  G.sugOn=false;G.q='';after();
}

/* ---------- Где автобус ---------- */
const setH=(el,h)=>{if(el._h!==h&&!pdown){el.innerHTML=h;el._h=h}};
function fillSel(sel,ids,geoLabel){
  const sig=ids.join(',');
  if(sel.dataset.sig!==sig){
    const v=sel.value;
    sel.innerHTML='<option value="geo"></option>'+ids.map(id=>`<option value="${id}">${E((sb(id)||{}).n||'?')}</option>`).join('');
    sel.dataset.sig=sig;
    sel.value=[...sel.options].some(o=>o.value===v)?v:'geo';
  }
  sel.options[0].textContent=geoLabel;
}
function setTab(){
  ['list','stop','det'].forEach(t=>q('#b-'+t).classList.toggle('on',B.tab===t));
  root.querySelectorAll('[data-bt]').forEach(b=>b.classList.toggle('on',b.dataset.bt===B.tab));
  q('#b-tabs').hidden=B.tab==='det';
}
function bList(){
  const bs=allBuses(),el=q('#b-list'),S=City.S;
  if(!bs.length){setH(el,'<div class="hn">В городе пока нет автобусов. Добавьте их в карточке маршрута.</div>');return}
  const g=new Map();bs.forEach(x=>{if(!g.has(x.R))g.set(x.R,[]);g.get(x.R).push(x)});
  let h='';
  g.forEach((a,R)=>{
    h+=`<div class="gh"><i style="background:${E(R.c)}"></i>${E(R.n)}</div>`
    +a.map(x=>`<button class="bi" data-r="${S.routes.indexOf(R)}" data-b="${x.i}"><span class="bc" style="background:${E(x.b.c)}"></span><div><b>${E(x.b.m)} · №${x.i+1}</b><small>${E(bstatus(x.b))}</small></div></button>`).join('');
  });
  setH(el,h);
}
function bArr(){
  const S=City.S,sel=q('#b-ssel'),near=nearestStop();
  if(!S.stops.length){setH(q('#b-arr'),'<div class="hn">В городе нет остановок.</div>');return}
  fillSel(sel,S.stops.map(s=>s.id),near?'📍 Ближайшая к вам: «'+near.s.n+'» · '+fd(near.d*mpu()):'📍 Геопозиция недоступна');
  const id=sel.value==='geo'?(near?near.s.id:null):+sel.value;
  if(id===null)return;
  const rows=[];
  allBuses().forEach(x=>{const e=etaBus(x.b,id);if(e!==null)rows.push(Object.assign({e},x))});
  rows.sort((a,b)=>a.e-b.e);
  let h=rows.map(x=>`<button class="bi" data-r="${S.routes.indexOf(x.R)}" data-b="${x.i}" data-s="${id}"><span class="bc" style="background:${E(x.b.c)}"></span><div><b>${E(x.R.n)}</b><small>${E(x.b.m)} · №${x.i+1}</small></div><em>${x.e<=.05?'сейчас':fm(x.e)}</em></button>`).join('');
  const idle=S.routes.filter(R=>([R.s].concat((R.vars||[]).map(v=>v.s))).some(a=>a.includes(id))&&!rows.some(x=>x.R===R));
  h+=idle.map(R=>`<div class="bi off"><span class="bc" style="background:${E(R.c)}"></span><div><b>${E(R.n)}</b><small>автобусов сейчас нет</small></div></div>`).join('');
  if(!h)h='<div class="hn">Через эту остановку маршрутов нет.</div>';
  setH(q('#b-arr'),h);
}
function bDet(){
  const s=B.sel;if(!s)return;const{R,b}=s,st=bst(b),info=q('#b-info');
  if(!st||!st.tr){setH(info,'<div class="hn">Нет данных об автобусе. Включите кнопку «Автобусы» на панели карты.</div>');return}
  const tr=st.tr,ids=detIds(tr),near=nearestStop(ids),sel=q('#b-dsel');
  fillSel(sel,ids,near?'📍 Ближайшая к вам: «'+near.s.n+'» · '+fd(near.d*mpu()):'📍 Геопозиция недоступна');
  if(B.pre!==null){sel.value=String(B.pre);B.pre=null}
  const id=sel.value==='geo'?(near?near.s.id:null):+sel.value,last=sb(tr.stops[tr.stops.length-1].id);
  q('#b-title').textContent=R.n;
  setH(info,`<b>${E(b.m)}</b><br><small>${E(bstatus(b))}${last?' · конечная «'+E(last.n)+'»':''}</small>`);
  const e=id!==null?etaBus(b,id):null,z=id!==null?sb(id):null;
  setH(q('#b-eta'),z?`<div class="eta"><small>До остановки «${E(z.n)}»</small><b>${e===null?'Автобус сюда не идёт':e<=.05?'Автобус на остановке':'Приедет через '+fm(e)}</b>${e!==null&&e>.05?`<small>≈ в ${hm((tod()+e)%1440)}</small>`:''}</div>`:'');
  const cur=(!st.park&&st.dw>0)?st.si-1:-1,next=(!st.park&&st.dw<=0)?st.si:-1;
  setH(q('#b-stops'),tr.stops.map((x,i)=>{
    const zz=sb(x.id);if(!zz)return'';
    const passed=!st.park&&x.s<=st.d+.5&&i!==cur,ee=passed?null:(i===cur?0:etaBus(b,x.id));
    return `<div class="si${x.id===id?' sel':''}${i===next?' nx':''}${passed?' ps':''}" data-s="${x.id}"><span>${E(zz.n)}</span><b>${passed?'проехал':i===cur?'на остановке':ee===null?'—':fm(ee)}</b></div>`;
  }).join(''));
}
function bUpdate(){
  if(!root)return;
  if(B.tab==='list')bList();else if(B.tab==='stop')bArr();else bDet();
}
function openBus(R,b,pre){
  B.sel={R,b};B.tab='det';B.fol=false;B.pre=pre===undefined?null:pre;
  q('#b-dsel').dataset.sig='';q('#b-dsel')._h=null;
  setTab();
  const st=bst(b);if(st&&st.tr)mvB.fit(st.tr.pts,60);
  bUpdate();
}

function goApp(a){
  app=a;
  ['home','gis','bus'].forEach(n=>q('#ph-'+n).classList.toggle('on',n===a));
  if(a==='gis'){
    if(!mvG.init){const p=me();mvG.v={x:p[0],y:p[1],k:.8};mvG.init=1}
    render();
  }else if(a==='bus'){setTab();bUpdate()}
}
function setOpen(v){
  open=v;root.hidden=!v;btn.classList.toggle('on',v);
  if(v)goApp(app);
  else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
function upd(dt){
  if(!root||!open||!API)return;
  acc+=dt;if(acc<.1)return;const d=acc;acc=0;
  q('#ph-t').textContent=hm(tod());
  if(app==='home'){
    q('#ph-hc').textContent=hm(tod());
    q('#ph-hd').textContent=new Date(Date.UTC(2025,0,1)+(City.gm?City.gm():0)*60000).toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'}).replace(' г.','');
  }else if(app==='gis'){
    mvG.draw();
  }else if(app==='bus'){
    acc2+=d;if(acc2>.4){acc2=0;bUpdate()}
    if(B.tab==='det'){
      const st=B.sel&&bst(B.sel.b);
      if(B.fol&&st){mvB.v.x=st.x+(st.ox||0);mvB.v.y=st.y+(st.oy||0)}
      mvB.draw();
    }
  }
}

function mount(tv){
  if(!document.getElementById('ph-css'))document.head.insertAdjacentHTML('beforeend','<style id="ph-css">'+CSS+'</style>');
  tv.insertAdjacentHTML('beforeend',HTML);
  root=tv;btn=tv.querySelector('#ph-btn');
  const ph=tv.querySelector('#ph');
  /* q() ищет внутри root — делаем root самим телефоном для остального, а кнопку держим отдельно */
  root=ph;
  G={pts:[{me:1,n:'Моё положение'},null],act:1,mode:'bus',res:null,err:'',sugOn:true,q:'',min:false};
  B={tab:'list',sel:null,fol:false,pre:null};
  mvG=new MV(q('#g-cv'),gOver);mvB=new MV(q('#b-cv'),bOver);
  ph.addEventListener('pointerdown',e=>{e.stopPropagation();pdown=true});
  ph.addEventListener('pointerup',()=>{pdown=false});
  ph.addEventListener('pointercancel',()=>{pdown=false});
  btn.addEventListener('pointerdown',e=>e.stopPropagation());
  btn.onclick=()=>setOpen(!open);
  q('#ph-x').onclick=()=>setOpen(false);
  q('#ph-hm').onclick=()=>goApp('home');
  ph.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>goApp(b.dataset.app));

  /* --- 3ГИЗ --- */
  const rows=q('#g-rows');
  rows.addEventListener('focusin',e=>{
    const i=e.target.dataset.i;if(i===undefined)return;
    G.act=+i;G.sugOn=true;G.q='';
    rows.querySelectorAll('.pr').forEach((r,j)=>r.classList.toggle('on',j===+i));
    if(e.target.select)e.target.select();
    G.res=null;gSug();gRes();mvG.dirty=1;
  });
  rows.addEventListener('input',e=>{
    const i=+e.target.dataset.i;if(isNaN(i))return;
    G.act=i;G.pts[i]=null;G.res=null;G.err='';G.q=e.target.value;G.sugOn=true;gSug();gRes();mvG.dirty=1;
  });
  rows.addEventListener('keydown',e=>{if(e.key==='Enter'&&sugArr.length){e.preventDefault();pickSug(sugArr[0])}});
  rows.addEventListener('click',e=>{
    const b=e.target.closest('[data-clr]');if(!b)return;
    const i=+b.dataset.clr,n=G.pts.length;
    if(n>2&&i>0&&i<n-1)G.pts.splice(i,1);else G.pts[i]=null;
    G.act=clamp(i,0,G.pts.length-1);G.res=null;G.err='';G.sugOn=true;G.q='';render();
  });
  q('#g-sug').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)pickSug(sugArr[+b.dataset.k])});
  q('#g-res').addEventListener('click',e=>{if(e.target.closest('[data-rf]')){solve();render()}});
  ph.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{G.mode=b.dataset.m;if(!G.pts.some(p=>!p))solve();render()});
  q('#g-via').onclick=()=>{G.pts.splice(G.pts.length-1,0,null);G.act=G.pts.length-2;G.res=null;G.err='';G.sugOn=true;G.q='';render()};
  q('#g-sw').onclick=()=>{G.pts.reverse();G.act=0;if(!G.pts.some(p=>!p))solve();else{G.res=null}render()};
  q('#g-grip').onclick=()=>{G.min=!G.min;render()};
  ph.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
    const z=+b.dataset.z;
    if(z===0){const p=me();mvG.v.x=p[0];mvG.v.y=p[1];mvG.dirty=1}else mvG.zoom(z>0?1.4:1/1.4);
  });
  mvG.onTap=w=>{
    const k=mvG.v.k;let best=null;
    City.S.stops.forEach(s=>{const d=Math.hypot(s.x-w[0],s.y-w[1]);if(d<16/k&&(!best||d<best.d))best={d,s}});
    G.pts[G.act]=best?{n:best.s.n,x:best.s.x,y:best.s.y,stop:best.s.id}:{n:mapName(w),x:w[0],y:w[1]};
    G.sugOn=false;G.q='';after();
  };

  /* --- Где автобус --- */
  ph.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{B.tab=b.dataset.bt;setTab();bUpdate()});
  const openFrom=e=>{
    const b=e.target.closest('[data-r]');if(!b)return;
    const R=City.S.routes[+b.dataset.r],bus=R&&(R.buses||[])[+b.dataset.b];
    if(R&&bus)openBus(R,bus,b.dataset.s!==undefined?+b.dataset.s:undefined);
  };
  q('#b-list').addEventListener('click',openFrom);
  q('#b-arr').addEventListener('click',openFrom);
  q('#b-ssel').addEventListener('change',()=>{q('#b-arr')._h=null;bUpdate()});
  q('#b-dsel').addEventListener('change',()=>{q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate();mvB.dirty=1});
  q('#b-back').onclick=()=>{B.tab='list';B.sel=null;setTab();bUpdate()};
  q('#b-c').onclick=()=>{B.fol=true;mvB.v.k=Math.max(mvB.v.k,.9);mvB.dirty=1};
  mvB.onPan=()=>{B.fol=false};
  mvB.onTap=w=>{
    const st=B.sel&&bst(B.sel.b);if(!st||!st.tr)return;
    const k=mvB.v.k;let best=null;
    st.tr.stops.forEach(x=>{const s=sb(x.id);if(!s)return;const d=Math.hypot(s.x-w[0],s.y-w[1]);if(d<18/k&&(!best||d<best.d))best={d,id:x.id}});
    if(best){q('#b-dsel').value=String(best.id);q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate()}
  };
  q('#b-stops').addEventListener('click',e=>{
    const r=e.target.closest('[data-s]');if(!r)return;
    q('#b-dsel').value=r.dataset.s;q('#b-eta')._h=null;q('#b-stops')._h=null;bUpdate();
  });

  /* клавиши: P — телефон; пробел в полях ввода (базовый плагин его блокирует) */
  keyH=e=>{
    if(!root)return;
    const tag=e.target.tagName;
    if(e.code==='Space'&&tag==='INPUT'&&root.contains(e.target)&&e.defaultPrevented){
      const t=e.target;t.setRangeText(' ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}));return;
    }
    if(e.code==='KeyP'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test(tag)){e.preventDefault();setOpen(!open)}
  };
  addEventListener('keydown',keyH,true);
}

/* ---------- подключение к «Путешествию» ---------- */
const prev=City.trip||{};
City.trip={
  start(api){
    if(prev.start)prev.start(api);
    API=api;open=false;app='home';mount(api.tv);
  },
  stop(){
    if(keyH)removeEventListener('keydown',keyH,true);keyH=null;
    root=null;btn=null;open=false;pdown=false;mvG=mvB=null;API=null;
    if(prev.stop)prev.stop();
  },
  move(...a){return open?true:(prev.move?prev.move(...a):false)},
  tick(dt){if(prev.tick)prev.tick(dt);try{upd(dt)}catch(x){console.error(x)}}
};
})();
</script>
<script>
/* ===== Плагин: 3D-автобус MAZ 206.948 (снаружи + салон) =====
   Вставить отдельным <script> ПОСЛЕ плагина «салон автобусов» (и после Yutong).
   Рядом с index.html положить фото (имена можно поменять в PHOTO ниже):
     maz206_front.webp      — перед
     maz206_rear.webp       — зад
     maz206_side_doors.webp — борт с дверьми (правый)
     maz206_side.webp       — борт без дверей (левый)
   Кроп фото — в CROP (доли снимка: [x0,x1,y0,y1]).
   Нужны две правки в плагине «салон автобусов» — см. сообщение. */
(function(){
const MODEL='MAZ 206.948';
const PHOTO={front:'maz206_front.webp',doors:'maz206_side_doors.webp',left:'maz206_side.webp',rear:'maz206_rear.webp'};
const CROP={front:[.25,.767,.208,.889],doors:[.049,.934,.391,.777],left:[.064,.953,.314,.769],rear:[.2246,.778,.049,.872]};
/* габариты кузова, м: длина 12, ширина 2.55, низ 0.36, высота 2.75 */
const LEN=12,BW=2.55,BOT=.36,BH=2.75,TOP=BOT+BH;
const prev=City.bus3d;
let TH=null,M=null,GEO=null,lastModel=null;
const B=new Map();

/* ---------- материалы и геометрия (ось x — вперёд, z>0 — правый борт с дверьми) ---------- */
function mats(){
  if(M)return M;
  const L=c=>new TH.MeshLambertMaterial({color:c});
  const ph=k=>{const m=L('#f2f4f5');
    new TH.TextureLoader().load(PHOTO[k],t=>{const c=CROP[k];t.repeat.set(c[1]-c[0],c[3]-c[2]);t.offset.set(c[0],1-c[3]);m.map=t;m.color.set('#fff');m.needsUpdate=true},undefined,()=>{});
    return m};
  /* порядок граней BoxGeometry: +x перед, -x зад, +y крыша, -y низ, +z правый борт (двери), -z левый борт */
  return M={body:[ph('front'),ph('rear'),L('#eef0f1'),L('#222'),ph('doors'),ph('left')],
    wheel:L('#17191b'),hub:L('#9aa0a4'),roof:L('#f4f6f7'),seam:L('#98a1a8'),dark:L('#1c2226')};
}
function geo(){
  if(GEO)return GEO;
  const w=new TH.CylinderGeometry(.5,.5,.3,20);w.rotateX(Math.PI/2);
  const h=new TH.CylinderGeometry(.28,.28,.32,12);h.rotateX(Math.PI/2);
  return GEO={body:new TH.BoxGeometry(LEN,BH,BW),w,h};
}
function make(T){
  TH=T;const g=new TH.Group(),m=mats(),G=geo();
  const add=(w,h,d,x,y,z,mt)=>{const o=new TH.Mesh(new TH.BoxGeometry(w,h,d),mt);o.position.set(x,y,z);g.add(o);return o};
  const body=new TH.Mesh(G.body,m.body);body.position.y=BOT+BH/2;g.add(body);
  /* крыша: сзади кондиционер (x −4.2…−1.2), дальше блок баллонов CNG (x −1.0…4.1), 4 секции */
  add(3.0,.32,1.9,-2.7,TOP+.16,0,m.roof);
  [-3.6,-2.7,-1.8].forEach(x=>add(.5,.01,1.2,x,TOP+.325,0,m.dark));
  add(5.1,.42,2.1,1.55,TOP+.21,0,m.roof);
  add(4.9,.24,1.8,1.55,TOP+.42+.12,0,m.roof);
  [.53,1.91,3.28].forEach(x=>add(.03,.5,2.12,x,TOP+.25,0,m.seam));
  /* колёса: база ≈ 5,9 м */
  [[3.27,1.1],[3.27,-1.1],[-2.62,1.1],[-2.62,-1.1]].forEach(([x,z])=>{
    const a=new TH.Mesh(G.w,m.wheel);a.position.set(x,.5,z);g.add(a);
    const b=new TH.Mesh(G.h,m.hub);b.position.set(x,.5,z+(z>0?.02:-.02));g.add(b)});
  /* зеркала */
  [1,-1].forEach(s=>{add(.05,.05,.3,5.9,2.8,s*1.36,m.dark);add(.1,.63,.24,5.9,2.47,s*1.52,m.dark)});
  /* табло: перед, правый борт, зад (закрывают текст, нарисованный на фото) */
  const pl=(w,h,x,y,z,ry)=>{const mt=new TH.MeshBasicMaterial({color:'#2b2e31'});
    const p=new TH.Mesh(new TH.PlaneGeometry(w,h),mt);p.position.set(x,y,z);p.rotation.y=ry;g.add(p);return mt};
  g.userData.maz={
    front:pl(1.96,.36,LEN/2+.006,2.75,0,Math.PI/2),
    side:pl(1.72,.28,1.67,2.88,BW/2+.006,0),
    rear:pl(.66,.33,-LEN/2-.006,2.875,0,-Math.PI/2)
  };
  return g;
}

/* ---------- номер и текст из названия маршрута: «60 Придонской — Боровое» ---------- */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){
    const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);
    if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n;
  }
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
function board(num,txt,w,h,kind){
  const key=kind+'|'+num+'|'+txt;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
    o={c,t:new TH.CanvasTexture(c),num,txt,used:0};B.set(key,o)}
  return o;
}
function rearBoard(num){
  const key='r|'+num;let o=B.get(key);
  if(!o){const c=document.createElement('canvas');c.width=320;c.height=150;const g=c.getContext('2d');
    g.fillStyle='#15181b';g.fillRect(0,0,320,150);g.fillStyle='#e9f1f6';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+(num.length>2?92:112)+'px Manrope,Arial,sans-serif';g.fillText(num,160,80);
    g.fillStyle='rgba(0,0,0,.5)';for(let i=0;i<320;i+=4)g.fillRect(i,0,1.3,150);for(let j=0;j<150;j+=4)g.fillRect(0,j,320,1.3);
    o={c,t:new TH.CanvasTexture(c),static:1};B.set(key,o)}
  return o;
}
function paint(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.fillStyle='#14171a';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H*.9;g.fillStyle='#ffc21a';g.textAlign='center';g.textBaseline='middle';
    g.font='800 '+Math.round(H*(o.num.length>2?.6:.78))+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+2);
    g.fillStyle='#ffc21a55';g.fillRect(nw+10,H*.18,2,H*.64);rx=nw+20}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 '+Math.round(H*.6)+'px Manrope,Arial,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#ffc21a';
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;   /* бежит слева направо */
  g.fillText(o.txt,x,H/2+2);g.restore();
  g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<W;i+=3)g.fillRect(i,0,1,H);
  o.t.needsUpdate=true;
}
function tick(g,b,R){
  const p=parse(R,City.busLeg?City.busLeg(b):0),bm=g.userData.maz;
  const f=board(p.num,p.txt,1.96,.36,'f'),s=board(p.num,p.txt,1.72,.28,'s'),r=rearBoard(p.num);
  f.used=s.used=1;
  [['front',f],['side',s],['rear',r]].forEach(([k,o])=>{if(bm[k].map!==o.t){bm[k].map=o.t;bm[k].color.set('#fff');bm[k].needsUpdate=true}});
}
function frame(){B.forEach(o=>{if(o.used&&!o.static)paint(o);o.used=0})}

/* ---------- подключение: City.bus3d знает ПАЗ, Yutong и MAZ ---------- */
City.bus3d={
  has:m=>{lastModel=m;return m===MODEL||(prev?prev.has(m):false)},
  make:(T,m)=>{m=m||lastModel;return m===MODEL?make(T):prev.make(T,m)},
  tick:(g,b,R)=>{if(g.userData.maz)tick(g,b,R);else if(prev)prev.tick(g,b,R)},
  frame:()=>{if(prev)prev.frame();frame()}
};

/* =====================================================================
   САЛОН: низкий пол спереди и до середины, площадка на 2 ступени сзади,
   средняя двустворчатая и передняя двери справа, кабина водителя слева,
   синие сиденья с «зигзагами», жёлтые поручни, серые петли, табло спереди
   ===================================================================== */
const FL_LOW=.40,FL_HI=.80,CEIL=2.86;
const flAt=x=>x>=-3.0?FL_LOW:x>=-3.25?.53:x>=-3.5?.67:FL_HI;
const DRV={x:4.95,z:-.72};
const SEATS=[];
const S=(x,z,p)=>SEATS.push({x,z,c:'b',p:p||0});
/* площадка сзади: диван на пятерых + два ряда 2+2 */
[-.96,-.48,0,.48,.96].forEach(z=>S(-5.5,z));
[-4.7,-3.9].forEach(x=>[-.95,-.51,.51,.95].forEach(z=>S(x,z)));
/* левый борт; над арками — на подиумах */
[-2.5,-1.7,-.9,-.1,.7,1.5,2.3,3.3].forEach(x=>{const p=(x===-2.5||x===3.3)?.17:0;[-.95,-.51].forEach(z=>S(x,z,p))});
/* правый борт: между дверьми */
S(-2.5,.51,.17);S(-2.5,.95,.17);
[1.25,2.05].forEach(x=>[.51,.95].forEach(z=>S(x,z)));
S(3.3,.51,.17);S(3.3,.95,.17);
function hit(x,z){
  const r=.17;
  if(x<-5.8||x>5.6||z<-1.02||z>1.02)return true;
  if(x>3.95&&z<-.2)return true;                       /* кабина водителя */
  return SEATS.some(s=>Math.abs(x-s.x)<.27+r&&Math.abs(z-s.z)<.21+r);
}
function build(){
  const T=THREE,I=new T.Group(),mats=[];
  const mt=(c,e)=>{const m=new T.MeshLambertMaterial({color:c,emissive:new T.Color(c).multiplyScalar(e===undefined?.4:e)});mats.push(m);return m};
  const box=(w,h,d,x,y,z,m,par)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(par||I).add(o);return o};
  const cylV=(r,y0,y1,x,z,m)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,y1-y0,8),m);o.position.set(x,(y0+y1)/2,z);I.add(o)};
  const cylX=(r,x0,x1,y,z,m)=>{const g=new T.CylinderGeometry(r,r,x1-x0,8);g.rotateZ(Math.PI/2);const o=new T.Mesh(g,m);o.position.set((x0+x1)/2,y,z);I.add(o)};
  const wall=mt('#c9ced2'),low=mt('#aeb4b9'),ceil=mt('#e4e7e9',.5),floor=mt('#4c5762',.35),floor2=mt('#58636e',.35),
    dark=mt('#2c3136',.2),blk=mt('#15171a',.1),plast=mt('#8d949a',.2),ped=mt('#454c52',.2),shell=mt('#4d5359',.25),
    yel=mt('#f0b400',.55),gray=mt('#9aa0a6',.3),val=mt('#2e7fd9',.4),door=mt('#b9bfc4'),skin=mt('#e0b896'),shirt=mt('#33506e');
  const glass=new T.MeshLambertMaterial({color:'#8fb4cc',transparent:true,opacity:.28,side:T.DoubleSide});mats.push(glass);
  const lamp=new T.MeshBasicMaterial({color:'#f4f6f8'});mats.push(lamp);
  const scr=new T.MeshBasicMaterial({color:'#10161c'});mats.push(scr);
  /* ткань сидений: синяя с оранжевыми и голубыми зигзагами */
  const fc=document.createElement('canvas');fc.width=fc.height=64;const fg=fc.getContext('2d');
  fg.fillStyle='#2347b5';fg.fillRect(0,0,64,64);fg.lineWidth=2.4;fg.lineCap='round';fg.lineJoin='round';
  [[8,4],[36,10],[20,30],[48,38],[4,44],[30,52],[52,8]].forEach((p,i)=>{
    fg.strokeStyle=i%2?'#f08a2a':'#6fb2f2';fg.beginPath();fg.moveTo(p[0],p[1]);
    for(let k=1;k<=6;k++)fg.lineTo(p[0]+(k%2?9:0),p[1]+k*3);fg.stroke()});
  const ft=new T.CanvasTexture(fc);ft.wrapS=ft.wrapT=T.RepeatWrapping;mats.push(ft);
  const fab=new T.MeshLambertMaterial({map:ft,color:'#fff',emissive:new T.Color('#777'),emissiveMap:ft});mats.push(fab);

  /* пол: низкий, площадка и две ступеньки */
  box(8.95,.04,2.5,1.425,FL_LOW-.02,0,floor);
  box(2.45,FL_HI-FL_LOW,2.5,-4.725,(FL_LOW+FL_HI)/2,0,floor2);
  box(.25,.67-FL_LOW,2.5,-3.375,(FL_LOW+.67)/2,0,floor2);
  box(.25,.53-FL_LOW,2.5,-3.125,(FL_LOW+.53)/2,0,floor2);
  [[-3.03,.53],[-3.28,.67],[-3.52,FL_HI]].forEach(([x,y])=>box(.06,.012,2.5,x,y+.006,0,yel));
  /* потолок, лампы, решётки климата */
  box(11.9,.04,2.5,0,CEIL+.02,0,ceil);
  [-.45,.45].forEach(z=>box(11,.02,.12,0,CEIL-.005,z,lamp));
  [-4.6,-3.6,-.4,2.2].forEach(x=>box(.7,.02,.5,x,CEIL-.005,0,dark));
  /* задняя стенка с окном */
  box(.05,1.2,2.5,-5.95,FL_HI+.6,0,wall);
  box(.02,.8,2.2,-5.95,2.3,0,glass);
  box(.05,.2,2.5,-5.95,2.76,0,ceil);
  /* борта: нижняя панель, остекление, стойки */
  const DOORS=[[-1.3,.53],[4.38,5.45]];
  const seg=(z,x0,x1,y0,y1,m)=>{if(x1-x0>.01)box(x1-x0,y1-y0,.05,(x0+x1)/2,(y0+y1)/2,z,m)};
  const ranges=s=>s<0?[[-5.95,5.95]]:[[-5.95,DOORS[0][0]],[DOORS[0][1],DOORS[1][0]],[DOORS[1][1],5.95]];
  [-1,1].forEach(s=>{
    const z=s*1.26;
    ranges(s).forEach(([x0,x1])=>{
      seg(z,x0,x1,FL_LOW,1.0,low);seg(z,x0,x1,1.0,2.45,glass);seg(z,x0,x1,2.45,CEIL+.04,ceil);
      for(let x=Math.ceil(x0);x<x1;x+=1)if(x>x0+.1&&x<x1-.1)box(.08,1.45,.07,x,1.725,z,wall);
    });
  });
  DOORS.forEach(([x0,x1])=>{box(x1-x0,.4,.05,(x0+x1)/2,2.65,1.26,ceil);[x0,x1].forEach(x=>box(.07,2.1,.07,x,FL_LOW+1.05,1.26,wall))});
  /* створки дверей */

/* ================= цвет табло автобусов (снаружи) ================= */
let tc=LS('ui:tablo')||'#ffb21a';City.tabloColor=tc;
sB.innerHTML='<label style="display:flex;justify-content:space-between;align-items:center;font-size:13px">Цвет номера и маршрута<input type="color" id="ui-tc" value="'+tc+'" style="width:48px;height:34px;padding:2px;margin:0"></label><div class="mu" style="margin-top:6px">Номера сзади обновятся при перезагрузке страницы.</div>';
$('#ui-tc').oninput=e=>{tc=e.target.value;City.tabloColor=tc;SS('ui:tablo',tc)};
const SRC=new Set(['#ffb21a','#ffc21a','#ffd21a']);
const P=CanvasRenderingContext2D.prototype,fd=Object.getOwnPropertyDescriptor(P,'fillStyle');
Object.defineProperty(P,'fillStyle',{configurable:true,get(){return fd.get.call(this)},set(v){
  if(typeof v==='string'&&(v.length===7||v.length===9)){
    const k=v.slice(0,7).toLowerCase(),c=this.canvas;
    if(c&&c.height!==64&&c.width>=320){
      if(SRC.has(k))v=tc+(v.length===9?v.slice(7):'');
      else if(k==='#e9f1f6'&&c.width===320&&c.height===150)v=tc;
    }
  }
  fd.set.call(this,v);
}});

/* ================= автобусы ждут 8 секунд и едут (игрок внутри или нет) ================= */

  try{(City.S.routes||[]).forEach(R=>(R.buses||[]).forEach(b=>{
    const st=City.busState&&City.busState(b);if(!st)return;
    const pv=lastDw.get(b)||0;

  }))}catch(e){}

<script>
/* ===== Плагин: меню («👆» и «✏️» кругами), новые дороги (аллея, проспект 2–8 полос, трамвай/троллейбус),
   трамвай «Витязь-М», троллейбус «MAZ 206T». Вставить В САМЫЙ КОНЕЦ, перед </body>.
   ТРЕБУЕТСЯ один раз «Найти и заменить всё»: [25,35,45,55]  →  (window.KMX||(window.KMX=[25,35,45,55]))  (4 места).
   Фото рядом с index.html: vityaz_m.png (трамвай), maz206t.png (троллейбус). ===== */
(function(){
const E=City.esc,F='Manrope,system-ui,sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const mpu=()=>((City.S.scale||50)/50);
const bu=()=>City.bu?City.bu():Math.max(1/mpu(),1.5);
const rrc=(c,x,y,w,h,r)=>{c.beginPath();(c.roundRect||c.rect).call(c,x,y,w,h,r)};
const KMX=window.KMX||(window.KMX=[25,35,45,55]);
const MW=4;                                   /* ширина земли между встречными полосами аллеи */
let ver=0;City.on('change',()=>{ver++});
const say=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>e.hidden=true,3000)};

/* ================= типы дорог ================= */
const KIND={road:'Дорога',street:'Улица',alley:'Аллея',pros:'Проспект',hwy:'Шоссе'};
const SPD={road:25,street:35,alley:35,pros:45,hwy:55};
const SPEC=[],IDX=new Map(),kf=(k,n,x)=>k+n+'|'+x;
const reg=(k,n,x)=>{IDX.set(kf(k,n,x),SPEC.length);SPEC.push({k,n,x})};
reg('road',1,0);reg('street',2,0);reg('pros',4,0);reg('hwy',6,0);      /* 0..3 как в старых картах */
const GEO=[['road',1],['street',2]];
for(let n=2;n<=8;n++)GEO.push(['pros',n]);
[2,4,6,8].forEach(n=>GEO.push(['alley',n]));GEO.push(['hwy',6]);
for(let x=0;x<3;x++)GEO.forEach(([k,n])=>{if(!IDX.has(kf(k,n,x)))reg(k,n,x)});
const idxOf=(k,n,x)=>IDX.get(kf(k,n,x));
const RAILN=['','с трамвайной линией','с троллейбусными путями'];
SPEC.forEach((s,i)=>{
  RW[i]=4*s.n+4+(s.k==='alley'?MW:0);LN[i]=s.n;RN[i]=KIND[s.k];KMX[i]=SPD[s.k];
  ROAD[i]=KIND[s.k]+((s.k==='pros'||s.k==='alley')?' · '+s.n+' пол.':'')+(s.x?' '+RAILN[s.x]:'');
  if(i>3){const big=s.k==='pros',hw=s.k==='hwy';
    LIGHT.cas[i]=hw?'#cf7f22':big?'#d2ad4a':'#c9c4b8';LIGHT.fil[i]=hw?'#ffd48f':big?'#fff1c2':'#fff';
    DARK.cas[i]=hw?'#6e4414':big?'#5e4f26':'#11161a';DARK.fil[i]=hw?'#68451f':big?'#574b2c':'#394147'}
});
const rail=R=>{const s=SPEC[R.t];return s?s.x:0};
const isAlley=R=>{const s=SPEC[R.t];return !!s&&s.k==='alley'};

/* новая дорога: направление и растения по умолчанию */
const _add=add;
add=function(k,o){if(k==='roads'){const s=SPEC[o.t];if(s){o.ow=(s.k==='road');if(s.k==='alley')o.pl='tree'}}return _add(k,o)};
City.add=add;
/* разметка аллеи: полосы считаются от разделителя */
const _marks=marks;
marks=function(R,P){
  const s=SPEC[R.t];if(!s||s.k!=='alley')return _marks(R,P);
  const lw=(RW[R.t]-MW)/s.n;
  for(let q=1;q<s.n/2;q++)[1,-1].forEach(g=>line(offs(R.pts,g*(MW/2+q*lw)),1,P.lab+'88',[6,7]));
};

/* ================= меню: раздел «Дороги» ================= */
const DEF={road:1,street:2,alley:4,pros:4,hwy:6},COL={road:'#9aa3a8',street:'#9aa3a8',alley:'#7cb86b',pros:'#e0c36a',hwy:'#e59a3a'};
const ORDER=['road','street','alley','pros','hwy'];
const leaf=(nm,k,x)=>[nm,'road',idxOf(k,DEF[k],x),COL[k]];
const grp=TREE.find(g=>g[0]==='Дороги'&&Array.isArray(g[1]));
if(grp){
  const keep=grp[1].filter(n=>n[1]!=='road'&&!Array.isArray(n[1]));
  grp[1]=ORDER.map(k=>leaf(KIND[k],k,0)).concat([
    ['С трамвайной линией',ORDER.map(k=>leaf(KIND[k]+' с трамвайной линией',k,1))],
    ['С троллейбусными путями',ORDER.map(k=>leaf(KIND[k]+' с троллейбусными путями',k,2))]
  ],keep);
  renderTree();
}

/* ================= «👆» и «✏️» кругами по краям нижнего меню ================= */
document.head.insertAdjacentHTML('beforeend',`<style id="pl-css">
.nc{position:fixed!important;width:48px;height:48px;padding:0!important;display:grid;place-items:center;border-radius:50%!important;z-index:15}
.nc .b{width:100%;height:100%;border-radius:50%!important;font-size:21px;padding:0;display:grid;place-items:center}
#nav .nr:first-child{max-width:calc(100vw - 132px)}
@media (min-width:761px){#nav .nr:first-child{max-width:calc(100vw - 512px)}}
#lnp{left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:6px 10px;display:flex;gap:6px;align-items:center;font-weight:700;z-index:6}
#lnp .chip{border:1px solid var(--gbd,var(--line));background:var(--gin,var(--bg));color:var(--ink);font:inherit;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
#lnp .chip.on{background:var(--acc);color:var(--accink)}
#prb{left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:6}
</style>`);
$('#wrap').insertAdjacentHTML('beforeend','<div id="nc1" class="fl nc"></div><div id="nc2" class="fl nc"></div><div id="lnp" class="fl" hidden></div><div id="prb" class="fl" hidden><span id="prn"></span><button id="prok" class="b p">Готово</button><button id="prno" class="b">Отмена</button></div>');
{
  const sb=document.querySelector('[data-g="select"]'),eb=document.querySelector('[data-g="erase"]');
  if(sb){sb.textContent='👆';sb.title='Выбрать';sb.setAttribute('aria-label','Выбрать');$('#nc1').appendChild(sb)}
  if(eb){eb.textContent='✏️';eb.title='Ластик';eb.setAttribute('aria-label','Ластик');$('#nc2').appendChild(eb)}
  const nav=$('#nav'),c1=$('#nc1'),c2=$('#nc2');
  let pk='';
  (function pos(){
    const r0=nav&&nav.firstElementChild;
    if(r0){const r=r0.getBoundingClientRect();
      if(r.width>0){const y=Math.round(r.top+r.height/2-24),a=Math.round(r.left-56),b=Math.round(r.right+8),key=a+','+b+','+y;
        if(key!==pk){pk=key;c1.style.left=a+'px';c2.style.left=b+'px';c1.style.top=c2.style.top=y+'px'}}}
    requestAnimationFrame(pos);
  })();
  /* убираем серые заглушки «Трамвай/Троллейбус — скоро» */
  const strip=()=>{if(!nav)return;nav.querySelectorAll('.nb[disabled]').forEach(b=>{if(/^(Трамвай|Троллейбус)/.test(b.textContent.trim()))b.remove()})};
  if(nav){new MutationObserver(strip).observe(nav,{childList:true,subtree:true});strip()}
}

/* ================= выбор числа полос (аллея, проспект) ================= */
const lnp=$('#lnp');let lsig='';
function lnSync(){
  const s=City.tool==='road'?SPEC[tt]:null,show=!!s&&(s.k==='alley'||s.k==='pros');
  lnp.hidden=!show;if(!show){lsig='';return}
  const sig=s.k+s.n+s.x;if(sig===lsig)return;lsig=sig;
  lnp.innerHTML='<span>Полос:</span>'+[2,4,6,8].map(n=>'<button class="chip'+(n===s.n?' on':'')+'" data-n="'+n+'">'+n+'</button>').join('');
}
setInterval(lnSync,200);
lnp.addEventListener('click',e=>{
  const b=e.target.closest('[data-n]'),s=SPEC[tt];if(!b||!s)return;
  const ni=idxOf(s.k,+b.dataset.n,s.x);if(ni===undefined)return;
  document.querySelectorAll('#nav .nb[data-tool="road"]').forEach(x=>{const q=SPEC[+x.dataset.tt];if(q&&q.k===s.k&&q.x===s.x)x.dataset.tt=String(ni)});
  setTool('road',ni);lsig='';lnSync();
});

/* ================= карточка дороги ================= */
const fixN=(k,n,ow)=>{if(k==='road')return 1;if(k==='street')return 2;if(k==='hwy')return 6;
  n=clamp(n,2,8);if((k==='alley'||!ow)&&n%2)n++;return clamp(n,2,8)};
const prevIns=City.insp.roads;
City.insp.roads=o=>{
  const s=SPEC[o.t]||SPEC[0];let h=prevIns?prevIns(o):'';
  h+='<style>#insp label:has(#f-t){display:none}'+(s.k==='alley'?'#insp label:has(#f-ow),#f-rev{display:none}':'')+'</style>';
  h+='<label>Вид<select id="rd-k">'+Object.keys(KIND).map(k=>'<option value="'+k+'"'+(k===s.k?' selected':'')+'>'+KIND[k]+'</option>').join('')+'</select></label>';
  if(s.k==='alley'||s.k==='pros'){
    const ns=(s.k==='pros'&&o.ow)?[2,3,4,5,6,7,8]:[2,4,6,8];
    h+='<label>Количество полос<select id="rd-n">'+ns.map(n=>'<option'+(n===s.n?' selected':'')+'>'+n+'</option>').join('')+'</select></label>';
  }
  h+='<label>Линия<select id="rd-x"><option value="0"'+(s.x===0?' selected':'')+'>Нет</option><option value="1"'+(s.x===1?' selected':'')+'>Трамвайная линия</option><option value="2"'+(s.x===2?' selected':'')+'>Троллейбусные пути</option></select></label>';
  if(s.x&&o.ow)h+='<label>Направление линии<select id="rd-w"><option value="with"'+(o.rw==='against'?'':' selected')+'>Вдоль движения</option><option value="against"'+(o.rw==='against'?' selected':'')+'>Против движения</option></select></label>';
  if(s.k==='alley')h+='<label>Растения на земле<select id="rd-p"><option value="tree"'+((o.pl||'tree')==='tree'?' selected':'')+'>Деревья</option><option value="palm"'+(o.pl==='palm'?' selected':'')+'>Пальмы</option><option value="sakura"'+(o.pl==='sakura'?' selected':'')+'>Сакура</option></select></label>';
  return h;
};
$('#insp').addEventListener('change',e=>{
  const id=e.target.id,sl=City.sel;
  if(!/^(rd-|f-ow)/.test(id)||!sl||sl.k!=='roads')return;
  const o=sl.o,s=SPEC[o.t];if(!s)return;
  let k=s.k,n=s.n,x=s.x;
  if(id==='rd-k'){k=e.target.value;n=fixN(k,(s.k==='alley'||s.k==='pros')?n:4,o.ow)}
  else if(id==='rd-n')n=+e.target.value;
  else if(id==='rd-x')x=+e.target.value;
  else if(id==='rd-w')o.rw=e.target.value;
  else if(id==='rd-p')o.pl=e.target.value;
  else if(id==='f-ow')n=fixN(k,n,o.ow);
  if(k==='alley'){o.ow=false;o.rev=false;o.pl=o.pl||'tree'}
  if(k==='road'&&id==='rd-k')o.ow=true;
  const ni=idxOf(k,n,x);if(ni!==undefined)o.t=ni;
  City.changed();City.updateUI();
});

/* ================= поверхность: земля и растения аллеи, трамвайные рельсы ================= */
const OC=new WeakMap();
function offc(R,e){let m=OC.get(R.pts);if(!m||m.v!==ver){m={v:ver,o:new Map()};OC.set(R.pts,m)}
  const k=e.toFixed(2);let a=m.o.get(k);if(!a){a=Math.abs(e)<.001?R.pts:offs(R.pts,e);m.o.set(k,a)}return a}
const tramEE=R=>isAlley(R)?MW/2+2.2:1.7;
const tramEs=R=>R.ow?[0]:[-tramEE(R),tramEE(R)];
const laneE=R=>{const s=SPEC[R.t],W=RW[R.t];return s.k==='alley'?W/2-(4+4/s.n)/2:(W-W/s.n)/2};
const tdir=R=>(R.rev?-1:1)*(R.rw==='against'?-1:1);
const trolEs=R=>{const e=laneE(R);return R.ow?[tdir(R)*e]:[e,-e]};
const MD=new WeakMap();
function medData(R){
  let m=MD.get(R.pts);if(m&&m.v===ver&&m.t===R.t)return m;
  const others=City.S.roads.filter(o=>o!==R&&o.pts.length>1);
  const near=p=>others.some(o=>{const r=RW[o.t]/2+3;for(let i=1;i<o.pts.length;i++)if(dseg(p,o.pts[i-1],o.pts[i])<r)return true;return false});
  const s=[],tr=[],P=R.pts;let acc=0,nx=8;
  for(let i=1;i<P.length;i++){
    const a=P[i-1],b=P[i],L=dst(a,b);if(!L)continue;const n=Math.max(1,Math.ceil(L/6));
    for(let q=0;q<n;q++){const p=[a[0]+(b[0]-a[0])*q/n,a[1]+(b[1]-a[1])*q/n];s.push({p,ok:!near(p)})}
    while(nx-acc<=L){const t=(nx-acc)/L,p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];tr.push({p,ok:!near(p),i:tr.length});nx+=16}
    acc+=L;
  }
  const e=P[P.length-1];s.push({p:e,ok:!near(e)});
  m={v:ver,t:R.t,s,tr};MD.set(R.pts,m);return m;
}
const hv=i=>((i*374761393+12345)>>>0)%1000/1000;
function plant(c,x,y,t,sd,dark){
  if(t==='palm'){
    const r=3.4;c.save();c.translate(x,y);c.rotate(sd*6.28);c.fillStyle=dark?'#2a7a36':'#2f9440';c.strokeStyle='#0004';c.lineWidth=.4;
    for(let i=0;i<9;i++){c.rotate(Math.PI*2/9);c.beginPath();c.ellipse(r*.55,0,r*.5,r*.16,0,0,7);c.fill();c.stroke()}
    c.beginPath();c.arc(0,0,r*.22,0,7);c.fillStyle='#7a5a3a';c.fill();c.restore();
  }else if(t==='sakura'){
    const r=2.9;c.fillStyle=dark?'#b85f83':'#f2a2c0';c.beginPath();c.arc(x,y,r,0,7);c.fill();
    c.fillStyle=dark?'#d27a9d':'#f9c6d9';
    for(let i=0;i<5;i++){const a=sd*6.28+i*1.2566;c.beginPath();c.arc(x+Math.cos(a)*r*.45,y+Math.sin(a)*r*.45,r*.5,0,7);c.fill()}
    c.fillStyle='#ffffffcc';for(let i=0;i<6;i++){const a=sd*9+i*1.047;c.beginPath();c.arc(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,.4,0,7);c.fill()}
    c.lineWidth=.5;c.strokeStyle='#0003';c.beginPath();c.arc(x,y,r,0,7);c.stroke();
  }else{
    const r=2.8;c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=dark?'#2f5a30':'#4c8a47';c.fill();c.lineWidth=.5;c.strokeStyle='#0004';c.stroke();
    c.beginPath();c.arc(x-r*.25,y-r*.25,r*.6,0,7);c.fillStyle=dark?'#3a6d3b':'#69a85f';c.fill();
  }
}
function surf(c,P){
  const S=City.S,k=City.view.k,dark=dk.matches;
  c.lineCap='butt';c.lineJoin='round';
  S.roads.forEach(R=>{
    const s=SPEC[R.t];if(!s)return;
    if(s.k==='alley'){
      const d=medData(R);let run=[];
      const fl=()=>{if(run.length>1){line(run,MW+2.4,dark?'#2a3236':'#b9b4a6');line(run,MW,dark?'#3f6a3f':'#8fbf73')}run=[]};
      d.s.forEach(q=>{if(q.ok)run.push(q.p);else fl()});fl();
      if(k>.12)d.tr.forEach(q=>{if(q.ok)plant(c,q.p[0],q.p[1],R.pl||'tree',hv(q.i),dark)});
    }
    if(s.x===1){
      tramEs(R).forEach(e=>{
        line(offc(R,e),3.4,dark?'#46423c':'#b3a998');
        line(offc(R,e),3.4,dark?'#6b5a48':'#6c5a46',[1,2.6]);
        line(offc(R,e+.75),.6,dark?'#9aa0a4':'#e3e6e8');line(offc(R,e-.75),.6,dark?'#9aa0a4':'#e3e6e8');
      });
    }
  });
  c.lineCap='round';
}
City.layers.over.unshift(surf);

/* ================= электротранспорт ================= */
const SYS={
  tram:{n:'Трамвай',x:1,kmh:40,col:'#d7263d',img:'vityaz_m.png',model:'Витязь-М',tl:'трамвайной линии'},
  trol:{n:'Троллейбус',x:2,kmh:40,col:'#1f78d1',img:'maz206t.png',model:'MAZ 206T',tl:'троллейбусных путей'}
};
const HEAD={l:9.6,cap:70},MID={l:8.4,cap:50},JG=.5,TROL={l:12,w:2.55,cap:68},TW=2.5;
const nSec=R=>clamp(Math.round(+R.cars>0?+R.cars:3),3,6);
const capOf=R=>R.sys==='tram'?2*HEAD.cap+(nSec(R)-2)*MID.cap:TROL.cap;
const lenOf=R=>(R.sys==='tram'?(2*HEAD.l+(nSec(R)-2)*MID.l+(nSec(R)-1)*JG):TROL.l)*bu();
const nVeh=R=>(R.cnt===undefined||R.cnt==='')?2:clamp(Math.round(+R.cnt)||0,0,12);
const okDir=(R,dir)=>!R.ow||dir===tdir(R);
const latE=(R,x)=>x===1?(R.ow?0:tramEE(R)):laneE(R);
const stops_=()=>City.S.pstops||[],routes_=()=>City.S.proutes||[];
const stopOf=id=>stops_().find(s=>s.id===id);
const hw=b=>(b.pop===undefined||b.pop==='')?Math.max(1,Math.round(b.w*b.h*mpu()*mpu()/25)):Math.max(0,+b.pop||0);
const NC=new WeakMap();
function nearPop(s){let c=NC.get(s);if(c&&c.v===ver)return c.n;let n=0;City.S.blds.forEach(b=>{if(b.t==='house'&&Math.hypot(b.x+b.w/2-s.x,b.y+b.h/2-s.y)<160)n+=hw(b)});NC.set(s,{v:ver,n});return n}
function nearRoad(sys,p,maxD){
  const x=SYS[sys].x;let best=null;
  City.S.roads.forEach(R=>{if(rail(R)!==x)return;for(let i=1;i<R.pts.length;i++){const d=dseg(p,R.pts[i-1],R.pts[i]);if(!best||d<best.d)best={d,R}}});
  return best&&best.d<=maxD?best:null;
}

/* --- граф путей --- */
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function proj(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=clamp(t,0,1);const q=[a[0]+dx*t,a[1]+dy*t];return{t,q,d:dst(p,q)}}
const K=p=>(Math.round(p[0]*10)/10)+','+(Math.round(p[1]*10)/10);
function buildG(sys){
  const S=City.S,x=SYS[sys].x,roads=S.roads.filter(R=>rail(R)===x&&R.pts.length>1),segs=[];
  roads.forEach(R=>{for(let i=1;i<R.pts.length;i++)segs.push({a:R.pts[i-1],b:R.pts[i],R,sp:[[0,R.pts[i-1]],[1,R.pts[i]]]})});
  for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
    const s=segs[i],u=segs[j];if(s.R===u.R)continue;
    const r=[s.b[0]-s.a[0],s.b[1]-s.a[1]],q=[u.b[0]-u.a[0],u.b[1]-u.a[1]],den=r[0]*q[1]-r[1]*q[0];
    if(Math.abs(den)<1e-9)continue;
    const w=[u.a[0]-s.a[0],u.a[1]-s.a[1]],t=(w[0]*q[1]-w[1]*q[0])/den,v=(w[0]*r[1]-w[1]*r[0])/den,e=1e-6;
    if(t<-e||t>1+e||v<-e||v>1+e)continue;
    const p=lerp(s.a,s.b,clamp(t,0,1));s.sp.push([t,p]);u.sp.push([v,p]);
  }
  const links=[];
  roads.forEach(R=>[R.pts[0],R.pts[R.pts.length-1]].forEach(e=>{
    let best=null;segs.forEach(s=>{if(s.R===R)return;const r=proj(e,s.a,s.b);if(r.d<8&&(!best||r.d<best.r.d))best={s,r}});
    if(best&&best.r.d>.05){best.s.sp.push([best.r.t,best.r.q]);links.push([e,best.r.q,R])}
  }));
  const sp_={};
  stops_().forEach(st=>{
    if(st.sys!==sys)return;let best=null;
    segs.forEach(s=>{const r=proj([st.x,st.y],s.a,s.b);if(!best||r.d<best.r.d)best={s,r}});
    if(best&&best.r.d<=70){best.s.sp.push([best.r.t,best.r.q]);sp_[st.id]=best.r.q}
  });
  const idx=new Map(),pts=[],adj=[];
  const node=p=>{const k=K(p);let i=idx.get(k);if(i===undefined){i=pts.length;idx.set(k,i);pts.push(p);adj.push([])}return i};
  segs.forEach(s=>{
    s.sp.sort((p,q)=>p[0]-q[0]);
    for(let i=1;i<s.sp.length;i++){
      const p=s.sp[i-1][1],q=s.sp[i][1],a=node(p),b=node(q);if(a===b)continue;
      const w=dst(p,q),e=latE(s.R,x);
      if(okDir(s.R,1))adj[a].push({v:b,w,e});
      if(okDir(s.R,-1))adj[b].push({v:a,w,e});
    }
  });
  links.forEach(([e,q])=>{const a=node(e),b=node(q),w=dst(e,q);adj[a].push({v:b,w,e:0});adj[b].push({v:a,w,e:0})});
  const sni={};for(const id in sp_)sni[id]=node(sp_[id]);
  return{S,v:ver,pts,adj,sni};
}
const Gc={};
const graph=sys=>{const g=Gc[sys];if(g&&g.S===City.S&&g.v===ver)return g;return Gc[sys]=buildG(sys)};
function dij(g,s,t){
  const n=g.pts.length,d=new Float64Array(n).fill(Infinity),pr=new Int32Array(n).fill(-1),pe=new Array(n),done=new Uint8Array(n);d[s]=0;
  for(;;){
    let u=-1;for(let i=0;i<n;i++)if(!done[i]&&d[i]<Infinity&&(u<0||d[i]<d[u]))u=i;
    if(u<0||u===t)break;done[u]=1;
    for(const e of g.adj[u])if(d[u]+e.w<d[e.v]){d[e.v]=d[u]+e.w;pr[e.v]=u;pe[e.v]=e}
  }
  if(d[t]===Infinity)return null;
  const nodes=[],edges=[];
  for(let u=t;u>=0;u=pr[u]){nodes.push(u);if(u!==s&&pe[u])edges.push(pe[u])}
  return{nodes:nodes.reverse(),edges:edges.reverse()};
}
function offv(p,d){
  const nm=(a,b)=>{const x=b[0]-a[0],y=b[1]-a[1],l=Math.hypot(x,y)||1;return[-y/l,x/l]};
  return p.map((q,i)=>{
    const n1=i?nm(p[i-1],q):null,n2=i<p.length-1?nm(q,p[i+1]):null,e=d[i];
    if(!n1)return[q[0]+n2[0]*e,q[1]+n2[1]*e];if(!n2)return[q[0]+n1[0]*e,q[1]+n1[1]*e];
    let mx=n1[0]+n2[0],my=n1[1]+n2[1];const ml=Math.hypot(mx,my)||1;mx/=ml;my/=ml;
    const cc=Math.max(.5,mx*n1[0]+my*n1[1]);return[q[0]+mx*e/cc,q[1]+my*e/cc];
  });
}
function buildTrip(g,ids,loop){
  if(!g||ids.length<2)return null;
  const list=loop?ids.concat(ids[0]):ids,pts=[],es=[],six=[];let prev=-1;
  for(let i=0;i<list.length;i++){
    const nd=g.sni[list[i]];if(nd===undefined)return null;
    if(i===0){pts.push(g.pts[nd]);six.push(0);prev=nd;continue}
    if(nd!==prev){const r=dij(g,prev,nd);if(!r)return null;r.nodes.slice(1).forEach((q,j)=>{pts.push(g.pts[q]);es.push(r.edges[j].e)})}
    six.push(pts.length-1);prev=nd;
  }
  if(pts.length<2)return null;
  const n=pts.length,ev=pts.map((_,i)=>i===0?es[0]:i===n-1?es[n-2]:(es[i-1]+es[i])/2),op=offv(pts,ev),c=[0];
  for(let i=1;i<n;i++)c.push(c[i-1]+dst(op[i],op[i-1]));
  const lt=[];
  (City.S.lights||[]).forEach(l=>{
    let b=null;for(let i=1;i<n;i++){const d=dseg([l.x,l.y],op[i-1],op[i]);if(!b||d<b.d)b={d,i}}
    if(b&&b.d<22){const a=op[b.i-1],z=op[b.i],dx=z[0]-a[0],dy=z[1]-a[1],q=dx*dx+dy*dy,t=q?clamp(((l.x-a[0])*dx+(l.y-a[1])*dy)/q,0,1):0;lt.push(c[b.i-1]+t*(c[b.i]-c[b.i-1]))}
  });
  return{pts:op,c,L:c[n-1],loop:!!loop,lt,stops:list.map((id,k)=>({id,s:c[six[k]]}))};
}
const TCa=new WeakMap();
function trips(R){
  const key=R.s.join(',')+'|'+(R.loop?1:0)+'|'+ver+'|'+R.sys;let c=TCa.get(R);
  if(c&&c.key===key&&c.S===City.S)return c.t;
  const g=graph(R.sys),F=buildTrip(g,R.s,!!R.loop),B=(R.loop||!F)?null:buildTrip(g,R.s.slice().reverse(),false),t={F,B};
  TCa.set(R,{key,S:City.S,t});return t;
}
function at(tr,d){
  const L=tr.L,cc=tr.c;d=tr.loop?((d%L)+L)%L:clamp(d,0,L);
  let a=1,b=cc.length-1;while(a<b){const m=(a+b)>>1;if(cc[m]<d)a=m+1;else b=m}
  const p=tr.pts[a-1],q=tr.pts[a],l=(cc[a]-cc[a-1])||1,t=clamp((d-cc[a-1])/l,0,1);
  return{x:p[0]+(q[0]-p[0])*t,y:p[1]+(q[1]-p[1])*t,an:Math.atan2(q[1]-p[1],q[0]-p[0])};
}
function targets(tr,hl,loop){
  if(tr.tg&&tr.tgh===hl)return tr.tg;
  tr.tgh=hl;return tr.tg=tr.stops.map(s=>loop?s.s:(tr.L>2*hl?clamp(s.s,hl,tr.L-hl):tr.L/2));
}

/* --- состояние составов --- */
const VS=new WeakMap();
function vehicles(R){
  const T=trips(R);if(!T||!T.F)return null;
  const n=nVeh(R),sig=(T.F.L|0)+'|'+n+'|'+(T.B?T.B.L|0:0)+'|'+nSec(R)+'|'+R.loop;let st=VS.get(R);
  if(!st||st.sig!==sig){
    const arr=[],tg=targets(T.F,lenOf(R)/2,R.loop);
    for(let k=0;k<n;k++){const d=T.F.L*(k+.5)/n;let i=tg.findIndex(x=>x>d);if(i<0)i=tg.length-1;
      arr.push({leg:0,d,i,v:0,dw:Math.random()*4,load:Math.round(Math.random()*capOf(R)*.3),fin:false,x:0,y:0,an:0,Lw:0})}
    st={sig,arr};VS.set(R,st);
  }
  return{T,st};
}
function exch(v,R,id){
  const s=stopOf(id);if(!s)return;
  v.load-=Math.round(v.load*(.25+Math.random()*.3));
  const b=Math.min(Math.floor(s.w||0),capOf(R)-v.load);if(b>0){s.w-=b;v.load+=b}
}
function step(v,R,T,dt,all){
  const tr=v.leg?T.B:T.F;if(!tr)return;
  const hl=lenOf(R)/2,loop=!!R.loop,tg=targets(tr,hl,loop);
  if(v.dw>0){
    v.dw-=dt;v.v=0;
    if(v.dw<=0&&v.fin){
      v.fin=false;
      if(loop){v.d=0;v.i=1}
      else{if(T.B)v.leg=1-v.leg;const t2=v.leg?T.B:T.F;v.d=targets(t2,hl,false)[0];v.i=1}
    }
    return;
  }
  if(v.i>=tg.length){v.i=tg.length-1}
  const vmax=SYS[R.sys].kmh*.85/3.6*4/mpu();let tv=vmax,lim=1e9;
  const rem=tg[v.i]-v.d;
  if(rem<=.6){
    v.d=tg[v.i];v.v=0;exch(v,R,tr.stops[v.i].id);
    v.dw=6*(.7+Math.random()*.6);v.i++;
    if(v.i>=tr.stops.length){v.fin=true;v.dw=loop?6:10}
    return;
  }
  tv=Math.min(tv,Math.sqrt(2*(vmax/3)*rem)+2);lim=rem;
  /* светофоры */
  const q=at(tr,v.d+hl*.9),axis=Math.abs(Math.cos(q.an))>Math.abs(Math.sin(q.an))?0:1;
  for(const s of tr.lt){
    let dd=s-(v.d+hl);if(loop&&dd<-tr.L/2)dd+=tr.L;if(dd<-1||dd>40)continue;
    const ph=City.lightPhase?City.lightPhase(axis):'g';if(ph==='g'||(ph==='y'&&dd<12))continue;
    tv=Math.min(tv,vmax*Math.min(1,(dd-4)/24));lim=Math.min(lim,Math.max(0,dd-4));
  }
  /* состав впереди */
  const ca=Math.cos(v.an),sa=Math.sin(v.an),W=3*bu();
  all.forEach(o=>{
    if(o===v)return;const dx=o.x-v.x,dy=o.y-v.y,f=ca*dx+sa*dy,la=Math.abs(-sa*dx+ca*dy),need=(v.Lw+o.Lw)/2;
    if(f>0&&f<need+40&&la<W&&Math.cos(o.an-v.an)>.3){const gap=f-need;tv=Math.min(tv,vmax*Math.max(0,gap/20));lim=Math.min(lim,Math.max(0,gap-2))}
  });

function place(v,T){const tr=v.leg?T.B:T.F;if(!tr)return;const q=at(tr,v.d);v.x=q.x;v.y=q.y;v.an=q.an}

/* пассажиры на остановках */
let gmL=null;
function waitTick(){
  const g=City.gm?City.gm():0;if(gmL===null)gmL=g;const dm=Math.max(0,g-gmL);gmL=g;
  if(City.stopTick)City.stopTick(stops_());
}
let last=performance.now();
(function loop(){
  const n=performance.now(),dt=Math.min(.1,Math.max(0,(n-last)/1000));last=n;
  try{
    waitTick();const all=[],list=[];
    routes_().forEach(R=>{const o=vehicles(R);if(!o)return;const L=lenOf(R);o.st.arr.forEach(v=>{v.Lw=L;all.push(v);list.push([v,R,o.T])})});
    list.forEach(([v,R,T])=>{step(v,R,T,dt,all);place(v,T)});
    if(list.length)City.redraw();
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
})();

/* ================= рисование техники ================= */
function tramSec(c,L,W,head){
  c.lineJoin='round';c.lineWidth=.8;c.strokeStyle='#000a';
  rrc(c,-L/2,-W/2,L,W,W*.14);c.fillStyle='#c9242c';c.fill();c.stroke();
  const x0=-L/2+W*.1,x1=head?L/2-L*.24:L/2-W*.1;
  rrc(c,x0,-W/2+W*.13,x1-x0,W*.74,W*.06);c.fillStyle='#8f969d';c.fill();c.lineWidth=.6;c.strokeStyle='#0006';c.stroke();
  c.fillStyle='#ffffffcc';c.fillRect(x0,-W/2+W*.07,x1-x0,W*.035);c.fillRect(x0,W/2-W*.105,x1-x0,W*.035);
  const box=(a,b,y0,y1)=>{rrc(c,L*a,W*y0,L*(b-a),W*(y1-y0),W*.05);c.fillStyle='#eef1f3';c.fill();c.lineWidth=.6;c.strokeStyle='#0007';c.stroke()};
  const fan=(x,y)=>{c.beginPath();c.arc(L*x,W*y,W*.07,0,7);c.fillStyle='#2a3035';c.fill()};
  if(head){
    box(-.44,-.14,-.3,.3);fan(-.36,-.12);fan(-.36,.12);fan(-.24,-.12);fan(-.24,.12);
    c.fillStyle='#2a2f33';c.fillRect(-L*.07,-W*.1,L*.07,W*.2);                    /* основание токоприёмника */
    c.lineWidth=Math.max(.8,W*.22);c.strokeStyle='#23282c';
    c.beginPath();c.moveTo(0,-W*.08);c.lineTo(L*.1,0);c.lineTo(0,W*.08);c.stroke();
    c.beginPath();c.moveTo(L*.1,-W*.32);c.lineTo(L*.1,W*.32);c.stroke();
    c.fillStyle='#1c2428';c.fillRect(L*.43,-W*.34,L*.035,W*.68);                    /* лобовое стекло */
    c.fillStyle='#fff6c8';c.fillRect(L*.495,-W*.42,L*.012,W*.12);c.fillRect(L*.495,W*.3,L*.012,W*.12);
  }else{
    box(-.38,-.12,-.3,.3);fan(-.28,-.12);fan(-.28,.12);
    box(.05,.3,-.3,.3);fan(.12,-.12);fan(.12,.12);fan(.23,-.12);fan(.23,.12);
  }
}
function trolBody(c,L,W){
  c.lineJoin='round';c.lineWidth=.9;c.strokeStyle='#000a';
  rrc(c,-L/2,-W/2,L,W,W*.16);c.fillStyle='#f4f6f7';c.fill();c.stroke();
  rrc(c,-L/2+W*.07,-W/2+W*.08,L-W*.14,W*.84,W*.08);c.fillStyle='#8c9298';c.fill();c.lineWidth=.6;c.strokeStyle='#0006';c.stroke();
  c.strokeStyle='#ffffff55';c.beginPath();c.moveTo(-L/2+W*.2,-W*.22);c.lineTo(L/2-W*.3,-W*.22);c.moveTo(-L/2+W*.2,W*.22);c.lineTo(L/2-W*.3,W*.22);c.stroke();
  [[.216,.345],[.608,.73]].forEach(([a,b])=>{rrc(c,(a-.5)*L,-W*.2,(b-a)*L,W*.4,W*.07);c.fillStyle='#d9dee0';c.fill();c.lineWidth=.6;c.strokeStyle='#0007';c.stroke();
    c.strokeStyle='#ffffff99';c.beginPath();c.moveTo((a-.5)*L+W*.15,W*.12);c.lineTo((a-.5)*L+W*.4,-W*.12);c.stroke()});
  c.fillStyle='#33383c';c.fillRect(.4*L,-W*.38,.035*L,W*.76);                        /* решётка у лобового */
  c.strokeStyle='#8c9298';c.lineWidth=.5;for(let i=1;i<4;i++){const y=-W*.38+W*.76*i/4;c.beginPath();c.moveTo(.4*L,y);c.lineTo(.435*L,y);c.stroke()}
  c.fillStyle='#bfe3f2';c.fillRect(L*.465,-W*.36,L*.03,W*.72);
  c.fillStyle='#14232b';c.fillRect(-L*.5+W*.1,-W/2+1,L*.08,W*.06);
}
const GW=b=>.55*b;
let hits=[],poles=[];
function drawVeh(c,R,T,v,b){
  const tr=v.leg?T.B:T.F;if(!tr)return;
  if(R.sys==='trol'){
    const L=TROL.l*b,W=TROL.w*b;
    c.save();c.translate(v.x,v.y);c.rotate(v.an);trolBody(c,L,W);c.restore();
    poles.push([v.x,v.y,v.an,L,b]);hits.push({x:v.x,y:v.y,r:Math.max(L/2,10),v,R});
    return;
  }
  const N=nSec(R),ls=[];for(let j=0;j<N;j++)ls.push((j===0||j===N-1?HEAD.l:MID.l)*b);
  const jg=JG*b,W=TW*b,Lt=ls.reduce((a,x)=>a+x,0)+(N-1)*jg;let s=v.d+Lt/2;
  for(let j=0;j<N;j++){
    const l=ls[j],q=at(tr,s-l/2);
    c.save();c.translate(q.x,q.y);c.rotate(q.an+(j===N-1?Math.PI:0));tramSec(c,l,W,j===0||j===N-1);c.restore();
    s-=l;
    if(j<N-1){const q2=at(tr,s-jg/2);c.save();c.translate(q2.x,q2.y);c.rotate(q2.an);c.fillStyle='#2a2f33';c.fillRect(-jg/2,-W*.42,jg,W*.84);c.restore();s-=jg}
  }
  hits.push({x:v.x,y:v.y,r:Math.max(Lt/2,12),v,R});
}
const MC=new WeakMap();
function masts(R){
  let m=MC.get(R.pts);if(m&&m.v===ver&&m.t===R.t)return m.a;
  const a=[],P=R.pts,off=RW[R.t]/2+2.5;let acc=0,nx=20;
  for(let i=1;i<P.length;i++){
    const A=P[i-1],B=P[i],L=dst(A,B);if(!L)continue;const tx=(B[0]-A[0])/L,ty=(B[1]-A[1])/L;
    while(nx-acc<=L){const t=nx-acc;a.push([A[0]+tx*t-ty*off,A[1]+ty*t+tx*off]);nx+=60}
    acc+=L;
  }
  m={v:ver,t:R.t,a};MC.set(R.pts,m);return a;
}
City.layers.over.push((c,P)=>{
  const S=City.S,k=City.view.k,u=1/k,sc=Math.max(1,.55/k),b=bu(),sl=City.sel;
  hits=[];poles=[];
  if(rl&&(City.tool!=='proute'||String(tt)!==rl.sys))rl=null;
  $('#prb').hidden=!rl;if(rl)$('#prn').textContent='Остановок: '+rl.s.length;
  /* остановки */
  stops_().forEach(s=>{
    const col=SYS[s.sys].col,on=sl&&sl.o===s;
    c.save();c.translate(s.x,s.y);c.scale(sc,sc);
    if(on){c.beginPath();c.arc(0,0,20,0,7);c.fillStyle='#0c8a8670';c.fill()}
    rrc(c,-8,-8,16,16,4);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#fff';c.font='800 9px '+F;c.textAlign='center';c.textBaseline='middle';c.fillText(s.sys==='tram'?'Т':'Тб',0,.5);c.restore();
    if(k>.5&&s.n){c.font='700 '+(11*sc)+'px '+F;c.textAlign='left';c.textBaseline='middle';c.lineWidth=3.5*sc;c.lineJoin='round';c.strokeStyle=P.bg;c.strokeText(s.n,s.x+12*sc,s.y+1);c.fillStyle=P.ink;c.fillText(s.n,s.x+12*sc,s.y+1)}
    const w=Math.floor(s.w||0);
    if(w&&k>.45){c.font='700 '+(10*sc)+'px '+F;const tw=c.measureText(w).width+8*sc,x=s.x+8*sc,y=s.y-24*sc;rrc(c,x,y,tw,14*sc,7*sc);c.fillStyle='#0c8a86';c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(w,x+tw/2,y+7.5*sc)}
    if(City.tool==='proute'&&String(tt)===s.sys){c.beginPath();c.arc(s.x,s.y,22*sc,0,7);c.lineWidth=2*u;c.strokeStyle='#0c8a86';c.setLineDash([5*u,4*u]);c.stroke();c.setLineDash([])}
  });
  /* линия маршрута: выделенного или рисуемого */
  routes_().forEach(R=>{if((sl&&sl.o===R)||City.tool==='proute'){const T=trips(R);if(T&&T.F){if(sl&&sl.o===R)line(T.F.pts,10,'#0c8a8670');line(T.F.pts,2,R.c+'cc',[8,6])}}});
  if(rl){const q=rl.s.map(stopOf).filter(Boolean).map(s=>[s.x,s.y]);if(q.length)line(q.concat([mouse]),3,'#0c8a86',[8,6])}
  /* техника */
  routes_().forEach(R=>{const o=vehicles(R);if(!o)return;o.st.arr.forEach(v=>{if(v.x||v.y)drawVeh(c,R,o.T,v,b)})});
  /* провода: троллейбусы (две линии над каждой полосой) и трамвайный контактный провод */
  c.lineCap='round';
  S.roads.forEach(R=>{
    const s=SPEC[R.t];if(!s||!s.x)return;
    if(s.x===2)trolEs(R).forEach(e=>[-GW(b),GW(b)].forEach(g=>line(offc(R,e+g),.7,'rgba(35,40,44,.7)')));
    else tramEs(R).forEach(e=>line(offc(R,e),.6,'rgba(35,40,44,.45)'));
    if(s.x===2&&k>.3)masts(R).forEach(p=>{c.beginPath();c.arc(p[0],p[1],1.3,0,7);c.fillStyle='#3a4147';c.fill();c.lineWidth=.6;c.strokeStyle='#fff';c.stroke()});
  });
  /* штанги троллейбусов */
  poles.forEach(([x,y,an,L,bb])=>{
    c.save();c.translate(x,y);c.rotate(an);c.strokeStyle='#2b3034';c.lineWidth=.9;
    const bx=-.15*L,ex=bx-7.2*bb,g=GW(bb);
    [-1,1].forEach(sg=>{c.beginPath();c.moveTo(bx,sg*.1*TROL.w*bb);c.lineTo(ex,sg*g);c.stroke();c.beginPath();c.arc(ex,sg*g,.9,0,7);c.fillStyle='#111';c.fill()});
    c.restore();
  });
  /* подпись заполненности */
  if(k>1.2)hits.forEach(h=>{const t=h.v.load+'/'+capOf(h.R);c.font='700 '+(10*u)+'px '+F;c.textAlign='center';c.textBaseline='middle';c.lineWidth=3*u;c.lineJoin='round';c.strokeStyle=P.bg;c.strokeText(t,h.x,h.y-h.r-4*u);c.fillStyle=P.ink;c.fillText(t,h.x,h.y-h.r-4*u)});
});

/* окно с фото при нажатии на состав */
let dn=null;
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{
  if(!dn||City.tool!=='select'||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  const V=City.view,x=(e.offsetX-V.x)/V.k,y=(e.offsetY-V.y)/V.k,h=[...hits].reverse().find(q=>Math.hypot(q.x-x,q.y-y)<q.r);
  if(!h)return;
  const S0=SYS[h.R.sys];sel=null;City.updateUI();
  $('#pop').innerHTML='<b>'+E(S0.model)+'</b><div style="color:var(--mut)">'+E(h.R.n)+'</div><div style="color:var(--mut)">В салоне: '+h.v.load+' / '+capOf(h.R)+'</div><img src="'+E(S0.img)+'" alt="'+E(S0.model)+'" onerror="this.outerHTML=\'<small>Нет файла '+E(S0.img)+' рядом с index.html</small>\'"><div class="row"><button id="pc7" class="b">Закрыть</button></div>';
  $('#pop').hidden=false;$('#pc7').onclick=()=>$('#pop').hidden=true;
});
City.redraw();
})();
</script>
<!-- ===== Плагин: режимы дорог (Ровно / Закруглено / Кольцо / Улучшение) + «Железная дорога» и «Пути метро» в разделе «Дороги».
     Вставить В САМЫЙ КОНЕЦ, перед </body> (после плагина с аллеями и трамваем). ===== -->
<style id="rm-css">
#rm{left:50%;transform:translateX(-50%);bottom:calc(var(--nh,70px) + 62px);padding:5px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:calc(100% - 20px);z-index:7}
@media (min-width:761px){#rm{left:calc(50% + 90px)}}
#lnp{bottom:calc(var(--nh,70px) + 118px)!important}
#rm .rr{display:flex;gap:4px;width:100%;justify-content:center;flex-wrap:wrap}
#rm .b{padding:8px 12px}
</style>
<script>
(function(){
const E=City.esc;
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mpu=()=>((City.S.scale||50)/50);
const say=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>e.hidden=true,2800)};

let mode='flat',cd=null,rg=null,dragH=null,upW='type',plant='tree';
const HINTS={
  flat:'Ставьте точки дороги. Двойной клик или «Готово» — закончить.',
  curve:'Нажмите начало и конец дороги, затем потяните или нажмите там, где дорога должна изогнуться. «Готово» — закончить.',
  ring:'Нажмите центр кольца, затем нажмите ещё раз — это радиус. Размер и форму можно менять в карточке.',
  up:'Выберите тип в меню ниже (или растения) и нажмите на дорогу.'
};

/* ---------- железная дорога и пути метро в разделе «Дороги» ---------- */
City.addLeaf('Дороги',['Железная дорога','rline','train','#2e5aa8']);
City.addLeaf('Дороги',['Пути метро','rline','metro','#c8102e']);

/* ---------- геометрия ---------- */
function bzPts(b){
  const p0=b[0],m=b[1],p2=b[2],c=[2*m[0]-(p0[0]+p2[0])/2,2*m[1]-(p0[1]+p2[1])/2];
  const n=clamp(Math.ceil((dst(p0,c)+dst(c,p2))/10),8,90),o=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*c[0]+t*t*p2[0],u*u*p0[1]+2*u*t*c[1]+t*t*p2[1]])}
  o[0]=p0.slice();o[n]=p2.slice();return o;
}
function ringPts(g){
  const per=2*Math.PI*Math.sqrt((g.rx*g.rx+g.ry*g.ry)/2),n=clamp(Math.ceil(per/10),24,120),ca=Math.cos(g.a||0),sa=Math.sin(g.a||0),o=[];
  for(let i=0;i<n;i++){const t=-2*Math.PI*i/n,x=g.rx*Math.cos(t),y=g.ry*Math.sin(t);o.push([g.cx+x*ca-y*sa,g.cy+x*sa+y*ca])}
  o.push(o[0].slice());return o;
}
const hasBz=o=>!!o&&!!o.bz&&o.pts&&o.pts.length>1&&dst(o.pts[0],o.bz[0])<.5&&dst(o.pts[o.pts.length-1],o.bz[2])<.5;

/* ---------- создание ---------- */
const rname=()=>RN[tt]+' '+(City.S.roads.length+1);
function commitCurve(){
  if(!cd||!cd.b)return;
  const bz=[cd.a.slice(),cd.m.slice(),cd.b.slice()];cd=null;
  City.add('roads',{pts:bzPts(bz),t:tt,n:rname(),ow:false,bz});
  City.redraw();
}
function commitRing(r){
  const g={cx:rg[0],cy:rg[1],rx:Math.max(r,12),ry:Math.max(r,12),a:0};rg=null;
  const o={pts:ringPts(g),t:tt,n:'Кольцо '+(City.S.roads.length+1),ow:true,ring:g};
  City.add('roads',o);
  if(RN[o.t]!=='Аллея'){o.ow=true;o.rev=false}
  City.changed();City.updateUI();
}
function upgrade(o){
  if(upW==='type'){
    if(o.t===tt){say('Эта дорога уже такого типа');return}
    const was=RN[o.t],k=RN[tt];City.push();o.t=tt;
    if(k==='Аллея'){o.ow=false;o.rev=false;o.pl=o.pl||plant}
    else if(k==='Дорога')o.ow=true;
    else if(was==='Дорога')o.ow=false;
    say('Тип дороги изменён');
  }else{
    if(RN[o.t]!=='Аллея'){say('Растения меняются только на аллее');return}
    City.push();o.pl=plant;say('Растения изменены');
  }
  City.select('roads',o);City.changed();City.updateUI();
}

/* ---------- ввод (перехват до основной логики) ---------- */
const wrap=$('#wrap');
wrap.addEventListener('pointerdown',e=>{
  if(e.target!==cv||e.button!==0||!e.isPrimary||e.defaultPrevented)return;
  const T=City.tool,k=V.k,w=raw(e);
  if((T==='select'||T==='road')&&sel&&sel.k==='roads'&&hasBz(sel.o)&&dst(w,sel.o.bz[1])<16/k){
    City.push();dragH={o:sel.o};try{cv.setPointerCapture(e.pointerId)}catch(x){}
    e.stopPropagation();e.preventDefault();return;
  }
  if(T!=='road'||mode==='flat')return;
  const p=snp(w);e.stopPropagation();e.preventDefault();
  if(mode==='curve'){
    if(!cd)cd={a:p};
    else if(!cd.b){if(dst(cd.a,p)>=6/k){cd.b=p;cd.m=[(cd.a[0]+p[0])/2,(cd.a[1]+p[1])/2]}}
    else{cd.m=w;dragH={draft:1};try{cv.setPointerCapture(e.pointerId)}catch(x){}}
  }else if(mode==='ring'){
    if(!rg)rg=p;else if(dst(rg,p)>=8/k)commitRing(dst(rg,p));
  }else if(mode==='up'){
    const h=pick(w,false);
    if(h&&h.k==='roads')upgrade(h.o);else say('Нажмите на дорогу');
  }
  City.redraw();
},{capture:true});
wrap.addEventListener('pointermove',e=>{
  if(!dragH||e.target!==cv)return;const w=raw(e);
  if(dragH.draft){if(cd&&cd.b)cd.m=w}
  else{dragH.o.bz[1]=w;dragH.o.pts=bzPts(dragH.o.bz)}
  City.redraw();
},{capture:true});
const endDrag=()=>{if(!dragH)return;const d=dragH;dragH=null;if(!d.draft)City.changed()};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||City.tool!=='road')return;
  if(e.key==='Enter')commitCurve();
  if(e.key==='Escape'){cd=rg=null;City.redraw()}
});

/* ---------- панель режимов (над нижним меню) ---------- */
wrap.insertAdjacentHTML('beforeend',
 '<div id="rm" class="fl" hidden>'
 +'<div class="rr"><button class="b on" data-rm="flat">Ровно</button><button class="b" data-rm="curve">Закруглено</button><button class="b" data-rm="ring">Кольцо</button><button class="b" data-rm="up">Улучшение</button></div>'
 +'<div class="rr" id="rm-x" hidden><button class="b p" id="rm-ok">Готово</button><button class="b" id="rm-no">Отмена</button></div>'
 +'<div class="rr" id="rm-u" hidden><button class="b on" data-u="type">Тип дороги</button><button class="b" data-u="plant">Растения аллеи</button></div>'
 +'<div class="rr" id="rm-p" hidden><button class="b on" data-p="tree">Деревья</button><button class="b" data-p="palm">Пальмы</button><button class="b" data-p="sakura">Сакура</button></div>'
 +'</div>');
const rm=$('#rm');
function setMode(m){mode=m;cd=rg=null;HINT.road=HINTS[m];sync();City.updateUI();City.redraw()}
function sync(){
  rm.querySelectorAll('[data-rm]').forEach(b=>b.classList.toggle('on',b.dataset.rm===mode));
  rm.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('on',b.dataset.u===upW));
  rm.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===plant));
  $('#rm-x').hidden=!(mode==='curve'&&cd&&cd.b);
  $('#rm-u').hidden=mode!=='up';
  $('#rm-p').hidden=!(mode==='up'&&upW==='plant');
}
rm.addEventListener('pointerdown',e=>e.stopPropagation());
rm.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rm)setMode(b.dataset.rm);
  else if(b.dataset.u){upW=b.dataset.u;sync()}
  else if(b.dataset.p){plant=b.dataset.p;sync()}
  else if(b.id==='rm-ok'){commitCurve();sync()}
  else if(b.id==='rm-no'){cd=null;sync();City.redraw()}
});
HINT.road=HINTS.flat;
setInterval(()=>{
  const on=City.tool==='road';rm.hidden=!on;
  if(!on){cd=rg=null;return}
  sync();
},150);

/* ---------- карточка дороги: изогнутая и кольцевая ---------- */
const prevIns=City.insp.roads;
City.insp.roads=o=>{
  let h=prevIns?prevIns(o):'';
  if(hasBz(o))h+='<div style="font-size:13px;color:var(--mut)">Закругление: потяните белую точку на дороге.</div>';
  if(o.ring){
    const g=o.ring,m=mpu();
    h+='<label>Ширина кольца, м<input id="rg-x" type="number" min="10" step="5" value="'+Math.round(g.rx*2*m)+'"></label>'
      +'<label>Высота кольца, м<input id="rg-y" type="number" min="10" step="5" value="'+Math.round(g.ry*2*m)+'"></label>'
      +'<label>Поворот, °<input id="rg-a" type="number" step="5" value="'+Math.round((g.a||0)*180/Math.PI)+'"></label>';
  }
  return h;
};
$('#insp').addEventListener('change',e=>{
  const id=e.target.id,s=City.sel;
  if(!/^rg-/.test(id)||!s||s.k!=='roads'||!s.o.ring)return;
  const o=s.o,g=o.ring,v=+e.target.value;if(isNaN(v))return;
  if(id==='rg-x')g.rx=Math.max(5,v/mpu()/2);
  else if(id==='rg-y')g.ry=Math.max(5,v/mpu()/2);
  else g.a=v*Math.PI/180;
  o.pts=ringPts(g);City.changed();City.updateUI();
});

/* ---------- отрисовка: набросок, ручка изгиба ---------- */
const handle=(c,p,k)=>{
  c.beginPath();c.arc(p[0],p[1],9/k,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=2.5/k;c.strokeStyle='#0c8a86';c.stroke();
  c.beginPath();c.arc(p[0],p[1],3/k,0,7);c.fillStyle='#0c8a86';c.fill();
};
City.layers.over.push((c,P)=>{
  const k=V.k;
  if(City.tool==='road'&&P.cas[tt]!==undefined){
    const T=tt,draw=pts=>{c.globalAlpha=.7;line(pts,RW[T]+4,P.cas[T]);line(pts,RW[T],P.fil[T]);c.globalAlpha=1};
    if(mode==='curve'&&cd){
      if(!cd.b)draw([cd.a,mouse]);
      else{draw(bzPts([cd.a,cd.m,cd.b]));handle(c,cd.m,k)}
    }
    if(mode==='ring'&&rg){
      const r=Math.max(dst(rg,mouse),12);draw(ringPts({cx:rg[0],cy:rg[1],rx:r,ry:r,a:0}));
      c.beginPath();c.arc(rg[0],rg[1],4/k,0,7);c.fillStyle='#0c8a86';c.fill();
    }
  }
  if((City.tool==='select'||City.tool==='road')&&sel&&sel.k==='roads'&&hasBz(sel.o))handle(c,sel.o.bz[1],k);
});
City.redraw();
})();
</script>
<!-- ===== Плагин: Казна и налоги, автосохранение (5 мин), закупка транспорта (АТП / ТТП / ТрТП),
     трамваи и троллейбусы с теми же параметрами, что у автобусов, ластик по частям дороги.
     Вставить В САМЫЙ КОНЕЦ, перед </body> (после плагина с режимами дорог).
     Цены строительства и доходы зон — в блоках COST и RATE в начале скрипта. ===== -->
<style id="mf-css">
#by{width:min(94vw,440px)}

#by li{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
#by li img,.fr img{width:100%;max-height:90px;object-fit:contain;border-radius:8px;background:var(--bg)}

.qb{display:flex;gap:6px;align-items:center}.qb input{width:70px;margin:0}
.wn{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--red);font-size:13px;font-weight:700}
.fr{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
#mz{padding:10px 12px;margin:6px 2px 10px}
#mz .mr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#mz-t{padding:0!important;border:0!important;background:none!important;accent-color:var(--acc);margin-top:6px}
</style>
<script>
(function(){
const E=City.esc,F='Manrope,system-ui,sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const mpu=()=>((City.S.scale||50)/50);
const bu=()=>City.bu?City.bu():Math.max(1/mpu(),1.5);
const n0=v=>Math.round(v).toLocaleString('ru-RU');
const say=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>e.hidden=true,3000)};
const polyA=a=>Math.abs(a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;
const BC=['#d7263d','#1b998b','#f46036','#2e86ab','#8e44ad','#c79a00'];

/* ================= НАСТРОЙКИ ЭКОНОМИКИ (меняйте здесь) ================= */
const START=300000000,TAX0=10;
const COST={shop:40000000,lms:250000000,m2:1000,parkMin:500000};   /* ТЦ, достопримечательность, парк: цена за м² */
const RATE={c:15000,o:20000,i:25000};                               /* доход с одной застроенной клетки зоны в день при налоге 10% */
const PRICE={'MAZ 206.948':16500000,'MAZ 206.063':7200000,'Yutong ZK6890HGQ':13500000,'МАЗ-203.065':13000000,'МАЗ-203.946':14100000,'МАЗ-206.945':10300000,'МАЗ-216.066':17000000,'ЛиАЗ-5292.65':16000000,'ЛиАЗ-6213.65':27000000,'НЕФАЗ-5299-40-52':15000000,'ПАЗ-320415-04 Вектор Next':8500000,'Yutong ZK6126HG':17000000,'Zhongtong LCK6126HQ':14000000};
const CAP={'MAZ 206.948':68,'MAZ 206.063':40,'Yutong ZK6890HGQ':75,'МАЗ-203.065':100,'МАЗ-203.946':100,'МАЗ-206.945':68,'МАЗ-216.066':170,'ЛиАЗ-5292.65':112,'ЛиАЗ-6213.65':154,'НЕФАЗ-5299-40-52':111,'ПАЗ-320415-04 Вектор Next':50,'Yutong ZK6126HG':90,'Zhongtong LCK6126HQ':90};
const KD={bus:{n:'АТП',col:'#0c8a86'},trol:{n:'ТТП',col:'#1f78d1'},tram:{n:'ТрТП',col:'#d7263d'}};
const SYS={tram:{n:'Трамвай',x:1,kmh:40,col:'#d7263d',tl:'трамвайной линии',tb:'Т',dc:'#c9242c'},trol:{n:'Троллейбус',x:2,kmh:40,col:'#1f78d1',tl:'троллейбусных путей',tb:'Тб',dc:'#f4f6f7'}};
function catalog(k){
  if(k==='tram')return[{m:'Витязь-М',img:'vityaz_m.png',price:120000000,l:28.6,cap:190}];
  if(k==='trol')return[{m:'MAZ 206T',img:'maz206t.png',price:25000000,l:12,cap:68}];
  const M=(City.busKit&&City.busKit.MODELS)||{};
  return Object.keys(M).map(m=>({m,img:M[m].img,price:PRICE[m]||10000000,l:M[m].l,cap:CAP[m]||40}));
}
const kindOf=d=>d.k||'bus';
const depots=()=>City.S.depots||[];
const dep=id=>depots().find(d=>d.id===id);
function vehsOf(d){
  const o=[];
  City.S.routes.forEach(R=>{if(R.d===d.id)(R.buses||[]).forEach(b=>o.push(b))});
  (City.S.vroutes||[]).forEach(R=>{if(R.d===d.id)(R.veh||[]).forEach(b=>o.push(b))});
  return o;
}
const owned=(d,m)=>(d.fleet&&d.fleet[m])||0;
const used=(d,m,skip)=>vehsOf(d).filter(b=>b!==skip&&b.m===m).length;
const free=(d,m,skip)=>owned(d,m)-used(d,m,skip);

/* ================= ДЕНЬГИ, НАЛОГИ, АВТОСОХРАНЕНИЕ ================= */
function mny(){const S=City.S;if(typeof S.money!=='number')S.money=START;if(typeof S.tax!=='number')S.tax=TAX0}
$('#cname').insertAdjacentHTML('afterend','<div id="mz" class="sec"><div class="mr"><b>Казна | <span id="mz-m"></span></b></div><label style="display:block;margin-top:8px;font-size:12px;color:var(--mut);font-weight:700">Налог: <span id="mz-tv"></span><input id="mz-t" type="range" min="0" max="30" step="1"></label><div class="mu" id="mz-i" style="margin-top:4px"></div></div>');
$('#mz-t').oninput=e=>{mny();City.S.tax=+e.target.value;uiMoney()};
$('#mz-t').onchange=()=>{try{save()}catch(e){}};
let incDay=0,Wz={c:0,o:0,i:0},wAt=-1e9,lastDay=null,lastCity=null;
function zoneW(){
  const Z=City.S.zones,g=City.game?City.game.day:0,w={c:0,o:0,i:0};
  if(Z)for(const key in Z){const z=Z[key];for(let n=0;n<1024;n++){const t=z.t.charAt(n);if(!RATE[t])continue;w[t]+=clamp((g-(z.d.charCodeAt(n)-256))/6,0,1)}}
  return w;
}
function uiMoney(){
  const S=City.S;mny();
  $('#mz-m').textContent=n0(S.money);$('#mz-tv').textContent=S.tax+'%';
  const t=$('#mz-t');if(document.activeElement!==t)t.value=S.tax;
  $('#mz-i').textContent='Доход: ≈ '+n0(incDay)+' в день';
}
setInterval(()=>{
  try{
    const S=City.S;mny();
    const day=City.game?City.game.day:0;
    if(idx.cur!==lastCity){lastCity=idx.cur;lastDay=day}
    const now=performance.now();if(now-wAt>1500){wAt=now;Wz=zoneW()}
    incDay=(Wz.c*RATE.c+Wz.o*RATE.o+Wz.i*RATE.i)*S.tax/10;
    const dd=day-lastDay;lastDay=day;
    if(dd>0&&dd<3)S.money+=incDay*dd;
    uiMoney();
  }catch(e){console.error(e)}
},400);
setInterval(()=>{try{save();say('Игра сохранена')}catch(e){}},300000);   /* автосохранение раз в 5 минут */
addEventListener('pagehide',()=>{try{save()}catch(e){}});

/* ===== платные постройки и тип АТП/ТТП/ТрТП ===== */
const _add=add;
add=function(k,o){
  const S=City.S;mny();let cost=0;
  if(k==='blds'){
    if(o.t==='shop')cost=COST.shop;
    else if(o.t==='park'){const a=o.pts?polyA(o.pts):o.w*o.h;cost=Math.max(COST.parkMin,Math.round(a*mpu()*mpu()*COST.m2))}
  }else if(k==='lms')cost=COST.lms;
  if(cost&&S.money<cost){say('Недостаточно денег: нужно '+n0(cost));dirty=true;return}
  if(k==='depots'){
    const kk=(tt==='trol'||tt==='tram')?tt:'bus';
    o.k=kk;o.fleet=o.fleet||{};o.n=KD[kk].n+' '+(S.depots.filter(x=>kindOf(x)===kk).length+1);
  }
  _add(k,o);
  if(cost){S.money-=cost;try{save()}catch(e){}say('Построено: −'+n0(cost))}
};
City.add=add;
City.addLeaf('Транспорт/Троллейбус',['ТТП','depot','trol',KD.trol.col]);
City.addLeaf('Транспорт/Трамвай',['ТрТП','depot','tram',KD.tram.col]);

/* ===== миграция старых городов ===== */
function migrate(){
  const S=City.S;
  if(!S.vroutes)S.vroutes=[];
  if(!S.pv){
    S.pv=1;
    (S.proutes||[]).forEach(o=>{
      const k=o.sys,n=clamp(Math.round(o.cnt===undefined||o.cnt===''?2:+o.cnt||0),0,12),cat=catalog(k)[0];
      S.vroutes.push({n:o.n,c:o.c,sys:k,s:o.s,loop:!!o.loop,d:null,cars:o.cars||3,vars:[],veh:Array.from({length:n},()=>({m:cat.m,c:SYS[k].dc,tc:'',dep:'',v:''}))});
    });
    S.proutes=[];
  }
  if(!S.fm){S.fm=1;depots().forEach(d=>{d.fleet=d.fleet||{};vehsOf(d).forEach(b=>{d.fleet[b.m]=(d.fleet[b.m]||0)+1})})}
}
setInterval(()=>{try{migrate()}catch(e){console.error(e)}},300);migrate();

/* ================= ЗАКУПКА ТРАНСПОРТА ================= */
document.body.insertAdjacentHTML('beforeend','<dialog id="by"></dialog>');
const by=$('#by');let byD=null;
function renderBuy(){
  const d=byD,L=catalog(kindOf(d)),sc=by.querySelector('ul'),top=sc?sc.scrollTop:0;
  by.innerHTML='<h2>Закупка · '+E(d.n)+'</h2><p>Казна: <b>'+n0(City.S.money)+'</b></p><ul>'
  +L.map(x=>'<li data-m="'+E(x.m)+'"><img src="'+E(x.img)+'" alt="" onerror="this.remove()"><div><b>'+E(x.m)+'</b><small>В парке: '+owned(d,x.m)+' · Длина: '+String(x.l).replace('.',',')+' м · Вместимость: '+x.cap+'</small><b>'+n0(x.price)+'</b></div><div class="qb"><input type="number" min="1" max="99" value="1"><button class="b p" data-by="1">Купить</button></div></li>').join('')
  +'</ul><div class="row"><button class="b" id="by-x">Закрыть</button></div>';
  const u=by.querySelector('ul');if(u)u.scrollTop=top;
}
function openBuy(d){byD=d;renderBuy();if(!by.open)by.showModal()}
by.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!byD)return;
  if(b.id==='by-x'){by.close();return}
  if(!b.dataset.by)return;
  const li=b.closest('li'),m=li.dataset.m,q=clamp(Math.floor(+li.querySelector('input').value)||1,1,99),it=catalog(kindOf(byD)).find(x=>x.m===m);if(!it)return;
  const cost=it.price*q;mny();
  if(City.S.money<cost){say('Недостаточно денег: нужно '+n0(cost));return}
  City.push();City.S.money-=cost;byD.fleet=byD.fleet||{};byD.fleet[m]=owned(byD,m)+q;
  City.changed();renderBuy();say('Куплено: '+m+' × '+q);
});
by.addEventListener('close',()=>City.updateUI());

City.insp.depots=o=>{
  const k=kindOf(o),cat=catalog(k);let tot=0;cat.forEach(x=>tot+=owned(o,x.m));
  const rows=cat.filter(x=>owned(o,x.m)>0);
  return '<div class="mu" style="margin-top:2px">Мой транспорт ('+tot+')</div>'
  +(rows.length?rows.map(x=>'<div class="fr"><img src="'+E(x.img)+'" alt="" onerror="this.remove()"><div><b>'+E(x.m)+'</b> — '+owned(o,x.m)+' шт.<small>На маршрутах: '+used(o,x.m)+' · Длина: '+String(x.l).replace('.',',')+' м · Вместимость: '+x.cap+'</small></div></div>').join(''):'<div class="mu">Транспорта пока нет</div>')
  +'<button class="b p" data-buy="'+o.id+'">Закупить транспорт</button>';
};
/* значок и контур ТТП/ТрТП поверх общего вида АТП */
City.layers.over.push((c,P)=>{
  const sc=Math.max(1,.55/City.view.k);
  depots().forEach(d=>{
    const k=kindOf(d);if(k==='bus'||!d.pts)return;const col=KD[k].col;
    poly(d.pts);c.lineWidth=2;c.lineJoin='round';c.strokeStyle=col;c.stroke();
    c.save();c.translate(d.x,d.y);c.scale(sc,sc);c.beginPath();c.arc(0,0,12,0,7);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#fff';c.font='800 7px '+F;c.textAlign='center';c.textBaseline='middle';c.fillText(KD[k].n,0,1);c.restore();
  });
});

/* ================= КАРТОЧКИ: автобусы (правка существующей) ================= */
const I=$('#insp');
new MutationObserver(patch).observe(I,{childList:true});
function patch(){
  const s=City.sel;if(!s)return;
  const h3=I.querySelector('h3');
  if(s.k==='depots'&&h3)h3.textContent=KD[kindOf(s.o)].n;
  if(s.k==='vroutes'){const l=I.querySelector('label');if(l&&l.firstChild)l.firstChild.textContent='Номер и конечные'}
  if(s.k==='routes')patchBus(s.o);
}
function patchBus(R){
  const d=dep(R.d),M=Object.keys((City.busKit&&City.busKit.MODELS)||{});
  const ds=I.querySelector('#f-dp');
  if(ds)[...ds.options].forEach(op=>{const x=dep(+op.value);if(x&&kindOf(x)!=='bus')op.remove()});
  I.querySelectorAll('select[data-bf="m"]').forEach(se=>{
    const b=(R.buses||[])[+se.dataset.bi];if(!b)return;
    const ms=M.filter(m=>m===b.m||(d&&owned(d,m)>0));
    se.innerHTML=ms.map(m=>'<option value="'+E(m)+'"'+(m===b.m?' selected':'')+'>'+E(m)+(d?' · свободно '+Math.max(0,free(d,m,b)):'')+'</option>').join('');
  });
  I.querySelectorAll('input[data-bf="c"]').forEach(inp=>{
    const i=+inp.dataset.bi,b=(R.buses||[])[i],row=inp.closest('.row');if(!b||!row)return;
    row.insertAdjacentHTML('afterend','<label style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)">Цвет табло<input type="color" data-bi="'+i+'" data-bf="tc" value="'+(b.tc||City.tabloColor||'#ffb21a')+'" style="width:44px;margin:0;padding:2px"></label>');
  });
  const add=I.querySelector('[data-badd]');
  if(add){
    let h='';
    if(!d)h='<div class="wn">Выберите АТП для маршрута</div>';
    else{
      M.forEach(m=>{if(used(d,m)>owned(d,m))h+='<div class="wn">У вас отсутствует транспорт в АТП: '+E(m)+'</div>'});
      if(!M.some(m=>free(d,m)>0))h+=(h?'':'<div class="wn">У вас отсутствует транспорт в АТП</div>')+'<button class="b p" data-buy="'+d.id+'">Закупить</button>';
    }
    if(h&&!M.some(m=>d&&free(d,m)>0))add.outerHTML=h;else if(h)add.insertAdjacentHTML('beforebegin',h);
  }
}
function addBus(R){
  const d=dep(R.d);if(!d){say('Выберите АТП для маршрута');return}
  const ms=Object.keys(City.busKit.MODELS).filter(m=>free(d,m)>0);
  if(!ms.length){say('У вас отсутствует транспорт в АТП');City.updateUI();return}
  City.push();R.buses=R.buses||[];R.buses.push({m:ms[0],c:BC[R.buses.length%6]});City.changed();City.updateUI();
}
I.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const s=City.sel;
  if(b.dataset.buy){e.stopImmediatePropagation();e.preventDefault();const d=dep(+b.dataset.buy);if(d)openBuy(d);return}
  if(b.dataset.badd&&s&&s.k==='routes'){e.stopImmediatePropagation();addBus(s.o);return}
  if(!s||s.k!=='vroutes')return;
  const o=s.o;
  if(b.dataset.vadd){e.stopImmediatePropagation();addVeh(o)}
  else if(b.dataset.vdel!==undefined){e.stopImmediatePropagation();City.push();o.veh.splice(+b.dataset.vdel,1);City.changed();City.updateUI()}
  else if(b.dataset.vopen){e.stopImmediatePropagation();pvR=o;vdRender();pvd.showModal()}
},true);
I.addEventListener('click',e=>{
  const g=e.target.closest('[data-pgs]');if(!g)return;
  const st=stopOf(+g.dataset.pgs);if(st){City.select('pstops',st);City.updateUI();City.redraw()}
});
I.addEventListener('change',e=>{
  const t=e.target,s=City.sel;if(!s)return;
  if(s.k==='routes'&&t.dataset.bf==='m'){
    const b=(s.o.buses||[])[+t.dataset.bi],d=dep(s.o.d);
    if(!d){e.stopImmediatePropagation();say('Выберите АТП для маршрута');City.updateUI();return}
    if(free(d,t.value,b)<1){e.stopImmediatePropagation();say('Нет свободной машины этой модели — закупите её');City.updateUI()}
    return;
  }
  if(s.k==='vroutes'&&t.dataset.vi!==undefined){
    e.stopImmediatePropagation();
    const o=s.o,b=o.veh[+t.dataset.vi];if(!b)return;
    const f=t.dataset.vf,val=t.value;
    if(f==='m'){
      const d=dep(o.d);
      if(!d){say('Выберите '+KD[o.sys].n+' для маршрута');City.updateUI();return}
      if(free(d,val,b)<1){say('Нет свободной машины этой модели — закупите её');City.updateUI();return}
    }
    City.push();b[f]=val;City.changed();City.updateUI();
  }
},true);

/* ================= ИНДИВИДУАЛЬНЫЙ ЦВЕТ ТАБЛО АВТОБУСА (3D) ================= */
function parse(R,leg){
  const base=R.R0||R,s=String(base.n||'').trim(),m=/^(\d+[A-Za-zА-Яа-я]?)\s*(.*)$/.exec(s);
  let num=m?m[1]:'',txt=m?m[2]:s;
  if(R.R0||!txt){const st=R.s.map(id=>City.S.stops.find(x=>x.id===id)).filter(Boolean);if(st.length)txt=R.loop?st[0].n+' (кольцо)':st[0].n+' — '+st[st.length-1].n}
  if(leg&&!R.loop){const p=txt.split(/\s*[—–]\s*/);if(p.length===2)txt=p[1]+' — '+p[0]}
  return{num,txt};
}
const tOv=new Map();
function paintO(o){
  const c=o.c,g=c.getContext('2d'),W=c.width,H=c.height;
  g.textBaseline='middle';
  if(o.rear){
    if(o.paz){g.fillStyle=o.col;g.fillRect(0,0,W,H);g.fillStyle='#111'}
    else{g.fillStyle='#15181b';g.fillRect(0,0,W,H);g.fillStyle=o.col}
    g.textAlign='center';g.font='800 '+Math.round(H*(o.num.length>2?.55:.72))+'px Manrope,Arial,sans-serif';g.fillText(o.num,W/2,H/2+2);
    o.t.needsUpdate=true;return;
  }
  g.fillStyle='#14171a';g.fillRect(0,0,W,H);
  let rx=6;
  if(o.num){const nw=H*.9;g.fillStyle=o.col;g.textAlign='center';g.font='800 '+Math.round(H*(o.num.length>2?.6:.78))+'px Manrope,Arial,sans-serif';g.fillText(o.num,6+nw/2,H/2+2);g.fillRect(nw+10,H*.18,2,H*.64);rx=nw+20}
  const rw=W-rx-6;
  g.save();g.beginPath();g.rect(rx,0,rw,H);g.clip();
  g.font='700 '+Math.round(H*.6)+'px Manrope,Arial,sans-serif';g.textAlign='left';g.fillStyle=o.col;
  const tw=g.measureText(o.txt).width,x=rx+((Date.now()/1000*80)%(rw+tw))-tw;
  g.fillText(o.txt,x,H/2+2);g.restore();
  g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<W;i+=3)g.fillRect(i,0,1,H);
  o.t.needsUpdate=true;
}
function ownTablo(g,b,R){
  const ud=g.userData,bm=ud.bm||ud.yt||ud.maz;if(!bm)return;
  const p=parse(R,City.busLeg?City.busLeg(b):0);
  ['front','side','rear'].forEach(k=>{
    const m=bm[k];if(!m)return;
    const img=m.map&&m.map.image,w=(img&&img.width)||(k==='rear'?320:512),h=(img&&img.height)||(k==='rear'?100:100);
    const key=[k,p.num,p.txt,b.tc,w,h].join('|');let o=tOv.get(key);
    if(!o){const c=document.createElement('canvas');c.width=w;c.height=h;o={c,t:new THREE.CanvasTexture(c),num:p.num,txt:p.txt,col:b.tc,rear:k==='rear',paz:k==='rear'&&w===160,dirty:1,used:0};tOv.set(key,o)}
    o.used=1;
    if(m.map!==o.t){m.map=o.t;m.color.set('#fff');m.needsUpdate=true}
  });
}
{
  const pb=City.bus3d;
  if(pb)City.bus3d={
    has:pb.has,make:pb.make,
    tick:(g,b,R)=>{if(b&&b.tc&&/^#[0-9a-f]{6}$/i.test(b.tc))ownTablo(g,b,R);else pb.tick(g,b,R)},
    frame:()=>{
      pb.frame();
      tOv.forEach((o,k)=>{if(o.used&&(!o.rear||o.dirty)){paintO(o);o.dirty=0}if(!o.used&&tOv.size>60)tOv.delete(k);o.used=0});
    }
  };
}

/* ================= ЛАСТИК: стирает небольшой кусок дороги ================= */
function projS(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=clamp(t,0,1);const q=[a[0]+dx*t,a[1]+dy*t];return{t,q,d:dst(p,q)}}
function cutRoad(R,r){
  const P=R.pts,cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+dst(P[i],P[i-1]));
